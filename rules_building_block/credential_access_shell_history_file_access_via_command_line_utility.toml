[metadata]
bypass_bbr_timing = true
creation_date = "2026/11/18"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/18"

[rule]
author = ["Elastic"]
building_block_type = "default"
description = """
Identifies a file read, search, copy or archive utility started with a shell or interpreter history file as an argument
on macOS. Command history often contains passwords, tokens and connection strings typed on the command line, and
adversaries read or search it to collect credentials. Users also inspect their own history, so each match produces a
building block signal for correlation.
"""
from = "now-9m"
index = ["logs-endpoint.events.process-*"]
language = "eql"
license = "Elastic License v2"
name = "Shell History File Access via Command-Line Utility"
references = [
    "https://attack.mitre.org/techniques/T1552/003/"
]
risk_score = 21
rule_id = "92c2df30-81ab-4590-8273-d67453ad5bf7"
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Rule Type: BBR",
    "Data Source: Elastic Defend",
    "Rule Type: Event Correlation (EQL)",
    "Platform: macOS",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "macos" and event.type == "start" and event.action == "exec" and
 process.name in ("cat", "grep", "egrep", "fgrep", "strings", "head", "tail", "less", "more", "awk", "sed", "cp",
                  "ditto", "rsync", "scp", "zip", "tar", "curl") and
 process.args like~ ("*/.bash_history", "*/.zsh_history", "*/.sh_history", "*/.python_history", "*/.mysql_history",
                     "*/.psql_history", "*/.node_repl_history", ".bash_history", ".zsh_history",
                     "*/fish/fish_history") and
 /* Terminal shell session save and restore copies the history file into the session directory */
 not process.args like~ ("*/.zsh_sessions/*", "*/.bash_sessions/*") and
 /* AI coding agents */
 not process.Ext.effective_parent.executable in ("/Applications/Cursor.app/Contents/MacOS/Cursor",
                                                 "/Applications/Claude.app/Contents/MacOS/Claude",
                                                 "/Applications/Codex.app/Contents/MacOS/Codex",
                                                 "/Applications/Codex.app/Contents/MacOS/ChatGPT",
                                                 "/Applications/ChatGPT.app/Contents/MacOS/ChatGPT",
                                                 "/Applications/OpenCode.app/Contents/MacOS/OpenCode")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.003"
name = "Shell History"
reference = "https://attack.mitre.org/techniques/T1552/003/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

