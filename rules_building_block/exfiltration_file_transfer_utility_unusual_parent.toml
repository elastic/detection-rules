[metadata]
bypass_bbr_timing = true
creation_date = "2026/11/23"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/23"

[rule]
author = ["Elastic"]
building_block_type = "default"
description = """
Detects file transfer utilities on macOS that are started with a remote target or from an unusual parent. Attackers
use scp, sftp, ftp, and rsync to pull tools from a remote host or push collected data out, including
`rsync -r user@host:remote local` and `rsync -r local user@host:remote`. The rule matches when one of these utilities
is given a `user@host` operand or a transfer URL, or when it is started by a script-like parent or by an untrusted or
unsigned parent running from a user-writable path. Each matching process start produces one signal with full process
context for correlation.
"""
from = "now-9m"
index = ["logs-endpoint.events.process-*"]
language = "eql"
license = "Elastic License v2"
name = "File Transfer Utility Launched with Remote Target or Unusual Parent on macOS"

references = [
    "https://attack.mitre.org/techniques/T1048/",
    "https://attack.mitre.org/techniques/T1059/004/",
    "https://attack.mitre.org/techniques/T1570/",
]
risk_score = 21
rule_id = "7c5fcbcf-764d-4f9d-aaed-d5cdce217a61"

severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Exfiltration",
    "Tactic: Command and Control",
    "Tactic: Lateral Movement",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: BBR",
    "Rule Type: Event Correlation (EQL)",
    "Platform: macOS",
]
timestamp_override = "event.ingested"
type = "eql"
query = '''
process where host.os.type == "macos" and event.type == "start" and event.action == "exec" and
  process.name in ("scp", "ftp", "sftp", "sftp-server", "rsync") and
  (
    /* remote operand: user@host:path on any utility, user@host on sftp or ftp, or a transfer URL */
    process.args like ("?*@?*:*", "rsync://*", "scp://*", "sftp://*", "ftp://*") or
    (process.name in ("sftp", "ftp") and process.args like "?*@?*") or
    /* script-like parent, or untrusted parent in a user-writable path */
    (
      (
        process.parent.name like (
          ".*", "*.sh", "*.command", "*.scpt", "*.py", "*.rb", "*.pl", "*.lua*", "*.php*", "*.js"
        ) or
        process.parent.executable like (
          "/tmp/*", "/private/tmp/*", "/var/tmp/*", "/private/var/tmp/*", "/var/folders/*",
          "/private/var/folders/*", "/Users/Shared/*", "/Users/*/Downloads/*", "/Users/*/Library/*",
          "/Users/*/.*", "/var/root/*", "/private/var/root/*", "/Library/WebServer/*"
        )
      ) and
      not (process.parent.code_signature.trusted == true and process.parent.code_signature.team_id != null)
    )
  )
'''

