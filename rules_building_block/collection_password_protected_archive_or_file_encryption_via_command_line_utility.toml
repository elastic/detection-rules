[metadata]
bypass_bbr_timing = true
creation_date = "2026/11/18"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/18"

[rule]
author = ["Elastic"]
building_block_type = "default"
description = """
Identifies zip, 7z, gpg or an openssl cipher command used with a password to create an encrypted archive or file on
macOS. Adversaries encrypt collected data before exfiltration and deliver payloads in password protected archives to
prevent content inspection. Password protected archives are also used for backups and for sharing files, so each match
produces a building block signal for correlation.
"""
from = "now-9m"
index = ["logs-endpoint.events.process-*"]
language = "eql"
license = "Elastic License v2"
name = "Password Protected Archive or File Encryption via Command-Line Utility"
references = [
    "https://attack.mitre.org/techniques/T1560/001/",
]
risk_score = 21
rule_id = "dd0e7795-a8ba-4b2e-a584-39d55a578592"
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Collection",
    "Tactic: Defense Evasion",
    "Rule Type: BBR",
    "Data Source: Elastic Defend",
    "Rule Type: Event Correlation (EQL)",
    "Platform: macOS",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "macos" and event.type == "start" and event.action == "exec" and
 (
  (process.name == "zip" and process.args like ("-P", "--password", "-e", "--encrypt", "-e?", "-?e", "-?e?")) or
  (process.name in ("7z", "7za", "7zz", "7zr") and process.args in ("a", "u") and process.args like "-p*") or
  (process.name in ("gpg", "gpg2") and process.args in ("-c", "--symmetric")) or
  (process.name == "openssl" and
   process.args like ("des3", "des-ede3*", "aes-???-*", "aes128", "aes192", "aes256", "camellia-*", "chacha20", "bf",
                      "bf-*", "rc4") and
   process.args in ("-pass", "-k", "-kfile", "-salt") and not process.args == "-d")
 )
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1560"
name = "Archive Collected Data"
reference = "https://attack.mitre.org/techniques/T1560/"
[[rule.threat.technique.subtechnique]]
id = "T1560.001"
name = "Archive via Utility"
reference = "https://attack.mitre.org/techniques/T1560/001/"



