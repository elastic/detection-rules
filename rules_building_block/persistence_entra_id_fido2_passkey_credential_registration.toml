[metadata]
bypass_bbr_timing = true
creation_date = "2026/10/21"
integration = ["azure"]
maturity = "production"
updated_date = "2026/10/21"

[rule]
author = ["Elastic"]
building_block_type = "default"
description = """
Identifies the registration of a FIDO2 or passkey authentication method for a Microsoft Entra ID user or admin. Passkey
enrollment is usually legitimate onboarding, but an adversary who has taken over an account can register their own
passkey for durable, phishing-resistant persistence that survives password resets and session revocation. This is a
building block rule that captures the registration population for correlation and baselining rather than standalone
alerting.
"""
false_positives = [
    """
    Legitimate FIDO2 and passkey onboarding commonly generates this event, especially for new users or during a
    passwordless rollout. This rule is informational only and is intended for correlation and baselining, not standalone
    alerting. When triaging a correlated signal, investigate registrations where the initiator differs from the target
    user, the registered authenticator's AAGUID is unknown to the organization, attestation is absent, or the
    registration was preceded by an anomalous sign-in.
    """,
]
from = "now-9m"
index = ["logs-azure.auditlogs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Entra ID FIDO2 Passkey Credential Registered"
note = """## Triage and analysis

### Investigating Entra ID FIDO2 Passkey Credential Registered

A FIDO2 or passkey authentication method was registered for an Entra ID user. Passkey enrollment is often legitimate onboarding, but adversaries abuse the same action for persistence. After taking over an account, an adversary can register their own passkey, which is phishing-resistant and survives password resets and ordinary session revocation; a privileged adversary can also provision a passkey for another user via the FIDO2 provisioning API. This is a building block rule intended for correlation with other signals rather than standalone alerting.

### Possible investigation steps

- Identify the target (`azure.auditlogs.properties.target_resources.0.user_principal_name`) and the initiator (`azure.auditlogs.properties.initiated_by.user.userPrincipalName`). If the initiator differs from the target, treat the event as high priority: self-service enrollment has the initiator equal to the target, while provisioning for another user does not.
- Inspect the registered authenticator in the event's `modifiedProperties`: `Fido2AuthenticationMethod.AaGuid` (the authenticator model/vendor; compare against the organization's known-good AAGUIDs and known offensive-tooling AAGUIDs), `Fido2AuthenticationMethod.AttestationLevel` (`NotAttested` is lower assurance), and `Fido2AuthenticationMethod.PasskeyType` (`Synced` keys are portable off-device, `Device-bound` are hardware).
- Review the registration client: legitimate self-service registration is initiated by the "Microsoft App Access Panel" application (`0000000c-0000-0000-c000-000000000000`). Registration initiated by Microsoft Graph, PowerShell, or an unexpected application can indicate scripted or tooling-based registration (for example DSInternals).
- Correlate `azure.signinlogs` shortly before the registration for the sign-in that authorized it: look for an adversary-in-the-middle session, a device-code flow, a token that satisfied fresh MFA by borrowing an existing passkey, or an attacker device registration/PRT issuance. Examine that sign-in's source IP, geo, ASN, and user agent for automation or hosting/VPS origins.
- Determine whether the target holds privileged roles; a passkey registered on a privileged account is higher impact.

### False positive analysis

- Passkey or FIDO2 enrollment during onboarding or a passwordless rollout is expected. As a building block rule this signal is informational and is intended to feed correlation and baselining rather than fire standalone.
- The registration-completion event's source address is frequently a Microsoft backend address rather than the user's network, so do not treat the source IP or ASN of this event alone as anomalous; pivot to the authorizing sign-in instead.

### Response and remediation

- If the registration is unauthorized, delete the attacker-registered passkey and any attacker-registered device via Microsoft Graph or the Entra portal. Delete devices first to break device-bound PRT persistence, then revoke sessions and refresh tokens and reset credentials.
- Review the sign-in that authorized the registration to determine the initial access vector, and enforce a phishing-resistant Conditional Access authentication strength to close weaker fallback methods.
"""
references = [
    "https://cybersecurity.bureauveritas.com/services/information-technology/pentesting-services/what-can-be-pentested/cloud-pentesting/abusing-fido2-passkeys",
    "https://dirkjanm.io/borrowing-windows-hello-keys/",
    "https://www.elastic.co/security-labs/entra-id-oauth-phishing-detection",
]
risk_score = 21
rule_id = "e7042e40-0910-4656-8391-0457ace4f13f"
setup = """#### Required Microsoft Entra ID Audit Logs
This rule requires the Azure integration with Microsoft Entra ID Audit logs enabled and collected via Azure Event Hub.
"""
severity = "low"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Platform: Entra ID",
    "Platform: Azure",
    "Data Source: Entra ID Audit Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Rule Type: BBR",
    "Rule Type: Custom Query (KQL)",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset:azure.auditlogs and
    (
        azure.auditlogs.operation_name:"User registered security info" and
        azure.auditlogs.properties.result_reason:"User registered Fido2 Authentication Method" or
        azure.auditlogs.operation_name:"Admin registered security info" and
        azure.auditlogs.properties.result_reason:"Admin registered Fido2 Authentication Method for user"
    ) and event.outcome:(Success or success)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.001"
name = "Additional Cloud Credentials"
reference = "https://attack.mitre.org/techniques/T1098/001/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

