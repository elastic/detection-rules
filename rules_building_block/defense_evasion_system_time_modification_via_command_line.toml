[metadata]
bypass_bbr_timing = true
creation_date = "2026/11/18"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/18"

[rule]
author = ["Elastic"]
building_block_type = "default"
description = """
Identifies the system clock being set manually on macOS with the date utility, or with systemsetup to set the date or
time or to turn off network time. Adversaries move the clock back before creating files so that they receive an old
creation timestamp, and to disrupt log correlation and time based controls. The clock is rarely set by hand on managed
hosts, so each match produces a building block signal for correlation.
"""
from = "now-9m"
index = ["logs-endpoint.events.process-*"]
language = "eql"
license = "Elastic License v2"
name = "System Time Modification via Command Line"
references = [
    "https://attack.mitre.org/techniques/T1070/006/"
]
risk_score = 21
rule_id = "1c2c5799-6d85-473f-9242-65b0a923aae0"
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Rule Type: BBR",
    "Data Source: Elastic Defend",
    "Rule Type: Event Correlation (EQL)",
    "Platform: macOS",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "macos" and event.type == "start" and event.action == "exec" and
 (
  (process.name == "date" and (process.args_count == 2 or or (process.args_count == 3 and process.args == "-u"))
   and process.args regex """[0-9]{4,12}(\.[0-9]{2})?""") or
  (process.name == "systemsetup" and process.args like~ ("-setdate", "-settime")) or
  (process.name == "systemsetup" and process.args like~ "-setusingnetworktime" and process.args like~ "off")
 )
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1070"
name = "Indicator Removal"
reference = "https://attack.mitre.org/techniques/T1070/"
[[rule.threat.technique.subtechnique]]
id = "T1070.006"
name = "Timestomp"
reference = "https://attack.mitre.org/techniques/T1070/006/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

