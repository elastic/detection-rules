[metadata]
bypass_bbr_timing = true
creation_date = "2026/11/23"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/23"

[rule]
author = ["Elastic"]
building_block_type = "default"
description = """
This rule detects a file write in a world-writable macOS directory by a remote file transfer utility. On macOS these
writes are recorded as file modification or rename events. Directories such as /tmp, /private/tmp, /var/tmp, and
/Users/Shared are accessible to every local user, and adversaries use them to stage tools copied with rsync, scp,
sftp, or ftp, either pulled by a local client or pushed in over SSH.
"""
from = "now-9m"
index = ["logs-endpoint.events.file*"]
language = "kuery"
license = "Elastic License v2"
name = "Remote File Creation in World Writeable Directory on macOS"

references = [
    "https://attack.mitre.org/techniques/T1570/",
    "https://attack.mitre.org/techniques/T1105/",
    "https://attack.mitre.org/techniques/T1021/004/",
]
risk_score = 21
rule_id = "d9961e55-21f5-4628-a263-41a119a81388"

severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Lateral Movement",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: BBR",
    "Rule Type: New Terms",
    "Platform: macOS",
]
timestamp_override = "event.ingested"
type = "new_terms"
query = '''
event.category:file and host.os.type:macos and event.action:(modification or rename) and
process.name:(ftp or rsync or scp or sftp or sftp-server) and
file.path:(
  /Users/Shared/* or /Users/*/Public/Drop*Box/* or
  /private/tmp/* or /private/var/tmp/* or /tmp/* or /var/tmp/*
) and 
not file.name:sh-thd-*
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1021"
name = "Remote Services"
reference = "https://attack.mitre.org/techniques/T1021/"

[[rule.threat.technique.subtechnique]]
id = "T1021.004"
name = "SSH"
reference = "https://attack.mitre.org/techniques/T1021/004/"

[[rule.threat.technique]]
id = "T1570"
name = "Lateral Tool Transfer"
reference = "https://attack.mitre.org/techniques/T1570/"

[rule.threat.tactic]
id = "TA0008"
name = "Lateral Movement"
reference = "https://attack.mitre.org/tactics/TA0008/"

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1105"
name = "Ingress Tool Transfer"
reference = "https://attack.mitre.org/techniques/T1105/"

[rule.threat.tactic]
id = "TA0011"
name = "Command and Control"
reference = "https://attack.mitre.org/tactics/TA0011/"

[rule.new_terms]
field = "new_terms_fields"
value = ["process.executable", "host.id"]

[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-5d"
