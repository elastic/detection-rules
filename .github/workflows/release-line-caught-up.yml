# Gate main merges (and the merge queue) until origin/main's latest merge is
# backported to every release target and tip Unit Tests (pythonpackage.yml) passed.
#
# Status contract (backport.yml):
#   - `post-pending` runs immediately on merge (parallel with cherry-picks) → pending
#   - `mark-caught-up` posts only terminal success/failure after cherry-picks + tip tests
# The gate takes the newest status by created_at for this context.
#
# Merge queue settings (required for safe serialization):
#   - Max entries to merge / merge group size: 1
#   - Concurrent merges: 1
# Without that, several queue entries can validate the same caught-up main tip
# and race their backports.
#
# Recovery when the line is red: land a fix on main (admin bypass if needed),
# let auto-backport finish, confirm tip Unit Tests are green, and wait for
# release-line-caught-up success on the new merge SHA. Sticky failures on an
# older SHA are not rewritten by tip re-runs alone.
#
name: Release Line Caught Up

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  get-branches:
    uses: ./.github/workflows/get-target-branches.yml

  release-line-caught-up:
    needs: get-branches
    # Required checks treat skipped jobs as success — always run and fail closed
    # when branch discovery did not succeed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait until origin/main is backported and tip Unit Tests passed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BRANCHES: ${{ needs.get-branches.outputs.branches }}
          GET_BRANCHES_RESULT: ${{ needs.get-branches.result }}
          STATUS_CONTEXT: release-line-caught-up
          WORKFLOW_FILE: pythonpackage.yml
          WAIT_SECONDS: "3900"
          POLL_SECONDS: "30"
        with:
          script: |
            const contextName = process.env.STATUS_CONTEXT;
            const workflowFile = process.env.WORKFLOW_FILE;
            const waitMs = Number(process.env.WAIT_SECONDS) * 1000;
            const pollMs = Number(process.env.POLL_SECONDS) * 1000;
            const deadline = Date.now() + waitMs;
            const { owner, repo } = context.repo;

            if (process.env.GET_BRANCHES_RESULT !== 'success') {
              core.setFailed(
                `Target-branch discovery ${process.env.GET_BRANCHES_RESULT}; cannot evaluate release-line-caught-up.`,
              );
              return;
            }

            let branches;
            try {
              branches = JSON.parse(process.env.BRANCHES || '[]');
            } catch (err) {
              core.setFailed(`Invalid target-branch list: ${err}`);
              return;
            }
            if (!Array.isArray(branches) || branches.length === 0) {
              core.setFailed('No release target branches returned; refusing to pass the gate.');
              return;
            }

            async function sleep() {
              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

            async function mainSha() {
              const { data } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: 'main',
              });
              return data.commit.sha;
            }

            // Newest status wins. Pending is only posted early; terminal only from the
            // finalizer — so a newer pending means "still in flight", and a newer
            // terminal replaces an older pending.
            async function latestStatus(sha) {
              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });
              const matches = data.filter((status) => status.context === contextName);
              if (!matches.length) {
                return null;
              }
              matches.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              return matches[0].state;
            }

            // After the first merge posts a status anywhere on main history, missing
            // status on the current tip means the finalizer did not run — fail closed.
            // Paginate until a producer status is found (or history is exhausted).
            async function statusProducerIsLive() {
              let page = 1;
              while (page <= 10) {
                const { data: commits } = await github.rest.repos.listCommits({
                  owner,
                  repo,
                  sha: 'main',
                  per_page: 100,
                  page,
                });
                if (!commits.length) {
                  return false;
                }
                for (const commit of commits) {
                  const { data } = await github.rest.repos.listCommitStatusesForRef({
                    owner,
                    repo,
                    ref: commit.sha,
                    per_page: 100,
                  });
                  if (data.some((status) => status.context === contextName)) {
                    return true;
                  }
                }
                if (commits.length < 100) {
                  return false;
                }
                page += 1;
              }
              return false;
            }

            async function unitTestRuns(sha) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                head_sha: sha,
                event: 'push',
                per_page: 10,
              });
              return data.workflow_runs || [];
            }

            // Newest run wins: if it is still queued/running, wait.
            function classifyRuns(runs) {
              if (!runs.length) {
                return 'missing';
              }
              const sorted = [...runs].sort(
                (a, b) => new Date(b.created_at || b.updated_at) - new Date(a.created_at || a.updated_at),
              );
              const newest = sorted[0];
              if (['in_progress', 'queued', 'waiting', 'pending'].includes(newest.status)) {
                return 'pending';
              }
              if (newest.status === 'completed') {
                if (newest.conclusion === 'success') {
                  return 'success';
                }
                return `failed:${newest.conclusion}`;
              }
              return 'missing';
            }

            async function classifyTips() {
              const results = [];
              for (const branch of branches) {
                const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
                const sha = data.commit.sha;
                const result = classifyRuns(await unitTestRuns(sha));
                results.push({ branch, sha, result });
              }
              if (results.every((item) => item.result === 'success')) {
                return { state: 'success', results };
              }
              const failed = results.find((item) => item.result.startsWith('failed:'));
              if (failed) {
                return { state: 'failure', results };
              }
              return { state: 'pending', results };
            }

            function formatTips(results) {
              return results
                .map((item) => `${item.branch} @ ${item.sha.slice(0, 7)}: ${item.result}`)
                .join('\n');
            }

            while (true) {
              const sha = await mainSha();
              const status = await latestStatus(sha);

              if (status === 'success') {
                core.info(`${contextName} succeeded on main @ ${sha.slice(0, 7)}`);
                return;
              }
              if (status === 'failure' || status === 'error') {
                core.setFailed(
                  `${contextName} is ${status} on main @ ${sha.slice(0, 7)}. Fix the backport or release-branch Unit Tests before merging.`,
                );
                return;
              }

              if (!status) {
                // Re-check each loop: producer may come online while we wait.
                const producerLive = await statusProducerIsLive();
                if (producerLive) {
                  // After cutover, missing usually means post-pending has not landed yet
                  // or the finalizer never started — wait until timeout rather than
                  // false-green via tip CI.
                  core.info(
                    `No ${contextName} status on main @ ${sha.slice(0, 7)} yet (producer is live); waiting for pending/terminal.`,
                  );
                } else {
                  // Cutover only: no status has ever been posted on main history.
                  const tips = await classifyTips();
                  if (tips.state === 'success') {
                    core.info(
                      `Cutover fallback: no ${contextName} status on main @ ${sha.slice(0, 7)}; all release tips have green Unit Tests.\n${formatTips(tips.results)}`,
                    );
                    return;
                  }
                  if (tips.state === 'failure') {
                    core.setFailed(
                      `Cutover fallback: no ${contextName} status on main @ ${sha.slice(0, 7)}, and a release tip failed Unit Tests:\n${formatTips(tips.results)}`,
                    );
                    return;
                  }
                  core.info(
                    `Cutover fallback: waiting on release tip Unit Tests (no ${contextName} status yet):\n${formatTips(tips.results)}`,
                  );
                }
              } else {
                core.info(`${contextName} is ${status} on main @ ${sha.slice(0, 7)}`);
              }

              if (Date.now() >= deadline) {
                core.setFailed(
                  `Timed out after ${process.env.WAIT_SECONDS}s waiting for ${contextName} on main @ ${sha.slice(0, 7)} (status=${status || 'missing'}).`,
                );
                return;
              }
              await sleep();
            }
