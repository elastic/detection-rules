name: ES|QL Validation
on:
    pull_request:
      branches: [ "*" ]
    merge_group:
      branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Detection Rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
            fetch-depth: 0
            path: detection-rules

      - name: Check if new or modified rule files are ESQL rules
        id: check-esql
        run: |
          cd detection-rules

          # Check if the event is a push
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Triggered by a push event. Setting run_esql=true."
            echo "run_esql=true" >> $GITHUB_ENV
            exit 0
          fi

          BASE_SHA="${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}"
          MODIFIED_FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD | grep '^rules/.*\.toml$' || true)
          if [ -z "$MODIFIED_FILES" ]; then
            echo "No modified or new .toml files found. Skipping workflow."
            echo "run_esql=false" >> $GITHUB_ENV
            exit 0
          fi

          if ! grep -q 'type = "esql"' $MODIFIED_FILES; then
            echo "No 'type = \"esql\"' found in the modified .toml files. Skipping workflow."
            echo "run_esql=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "run_esql=true" >> $GITHUB_ENV

      - name: Set up Python 3.13
        if: ${{ env.run_esql == 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: ${{ env.run_esql == 'true' }}
        run: |
          cd detection-rules
          python -m pip install --upgrade pip
          pip cache purge
          pip install .[dev]

      - name: Test ES|QL Rules
        if: ${{ env.run_esql == 'true' }}
        run: |
          cd detection-rules
          python -m detection_rules dev test esql-validation
