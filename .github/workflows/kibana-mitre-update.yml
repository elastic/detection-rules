name: Check MITRE ATT&CK Version Updates Are Synced

on:
  pull_request:
    types:
      - opened
    paths:
      - 'detection_rules/etc/attack-v*.json.gz'
      - 'detection_rules/etc/atlas-v*.json.gz'

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  create_issue:
    runs-on: ubuntu-latest
    # OIDC id-tokens are not issued for pull_request events from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: attack
            name: MITRE ATT&CK
            kibana_issue: 166152
          - framework: atlas
            name: MITRE ATLAS
            kibana_issue: 302607
    env:
      KIBANA_ISSUE_NUMBER: ${{ matrix.kibana_issue }}
    steps:
      - name: Fetch ephemeral GitHub token
        id: fetch-ephemeral-token
        uses: elastic/ci-gh-actions/fetch-github-token@f1837d5894f688eb909c1d777aaaf2f1df705cef # v1.5.4
        with:
          vault-instance: "ci-prod"
          vault-role: "token-policy-a213e9ca741c"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get MITRE changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: detection_rules/etc/${{ matrix.framework }}-v*.json.gz

      - name: Extract version from file name
        id: extract_version
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ADDED_FILES: ${{ steps.changed-files.outputs.added_files }}
        run: |
          # e.g. attack-v20.1.0.json.gz -> v20.1.0 ; atlas-v2026.08.json.gz -> v2026.08
          VERSION=$(echo "$ADDED_FILES" | tr ' ' '\n' \
            | sed -nE 's#.*-(v[0-9][0-9.]*[0-9])\.json\.gz$#\1#p' | tail -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Add Kibana Issue Comment
        if: steps.extract_version.outputs.version != ''
        run: |
            echo "Adding comment to Kibana issue #${KIBANA_ISSUE_NUMBER}"
            curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ steps.fetch-ephemeral-token.outputs.token }}" \
            https://api.github.com/repos/elastic/kibana/issues/${KIBANA_ISSUE_NUMBER}/comments \
            -d '{"body":"The detection rules ${{ matrix.name }} version has been updated to ${{ steps.extract_version.outputs.version }}. Please help in scheduling the ${{ matrix.name }} version upgrade in Kibana accordingly @elastic/security-detection-engineering"}'
            exit $?

      - name: Notify Slack (#security-detection-engineering-team)
        if: steps.extract_version.outputs.version != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.DEX_MITRE_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "<${{ github.event.pull_request.html_url }}|${{ matrix.name }} ${{ steps.extract_version.outputs.version }}> was added in detection-rules. Kibana needs to be updated to align (<https://github.com/elastic/kibana/issues/${{ matrix.kibana_issue }}|tracking issue>) <!subteam^S0B6WN0PAJE>"
