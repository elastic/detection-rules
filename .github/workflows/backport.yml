name: backport
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - unlabeled
      - labeled
      - closed
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: read

jobs:
  get-branches:
    uses: ./.github/workflows/get-target-branches.yml

  label:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.state == 'open' && !github.event.pull_request.draft
    steps:
      - name: 'Apply default "backport: auto" label'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: |
          !contains(github.event.pull_request.labels.*.name, 'backport: auto') &&
          !contains(github.event.pull_request.labels.*.name, 'backport: skip')
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['backport: auto']
            })
      - name: 'Remove "backport: auto" if "backport: skip" is set'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: |
          contains(github.event.pull_request.labels.*.name, 'backport: auto') &&
          contains(github.event.pull_request.labels.*.name, 'backport: skip')
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'backport: auto'
            })

  commit:
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: auto')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'backport: auto')
        || (github.event.action == 'closed')
      )
    needs: get-branches
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        # 7.17 was intentionally skipped because it was added late and was bug fix only
        target_branch: ${{ fromJSON(needs.get-branches.outputs.branches) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.WRITE_TRADEBOT_DETECTION_RULES_TOKEN }}
          ref: main
          fetch-depth: 100

      - name: Set github config
        run: |
          git config --global user.email "178941316+tradebot-elastic@users.noreply.github.com"
          git config --global user.name "tradebot-elastic"

      - name: Get branch histories
        run: |
          git fetch origin ${{matrix.target_branch}} --depth 1
          git status
          git log -1 --format='%H'

      - name: Checkout the commit into the staging area
        run: |
          # Checkout the merged commit
          git checkout ${{github.event.pull_request.merge_commit_sha}}

          # Move it to the staging area
          git reset --soft HEAD^

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          pip install .[dev]

      - name: Prune non-${{matrix.target_branch}} rules
        env:
          UNSTAGED_LIST_FILE: "../unstaged-rules.txt"
        run: |
          python -m detection_rules dev unstage-incompatible-rules --target-stack-version ${{matrix.target_branch}}

          # Track which rules were unstaged
          git diff --name-only > $UNSTAGED_LIST_FILE

          # Since they've been tracked, remove any untracked files
          git checkout -- .

      - name: Commit and push to ${{matrix.target_branch}}
        env:
          COMMIT_MSG_FILE: "../commit-message.txt"
          UNSTAGED_LIST_FILE: "../unstaged-rules.txt"
        run: |
          set -x

          echo "Switch to the target branch and keep the staged changes"
          git checkout ${{matrix.target_branch}}

          NEEDS_BACKPORT=$(git diff HEAD --quiet --exit-code && echo n || echo y)

          if [ "n" = "$NEEDS_BACKPORT" ]
          then
            echo "No changes to backport"
            exit 0
          fi

          echo "Create the new commit with the same author"
          git commit --reuse-message ${{github.event.pull_request.merge_commit_sha}}

          echo "Save the commit message"
          git log ${{github.event.pull_request.merge_commit_sha}} --format=%B -n1 > $COMMIT_MSG_FILE

          echo "Append to the commit message"
          if [ -s "$UNSTAGED_LIST_FILE" ]
          then
            echo "Track note for the removed files"

            echo "" >> $COMMIT_MSG_FILE
            echo "Removed changes from:" >> $COMMIT_MSG_FILE
            awk '{print "- " $0}' $UNSTAGED_LIST_FILE >> $COMMIT_MSG_FILE
            echo "" >> $COMMIT_MSG_FILE
            echo '(selectively cherry picked from commit ${{github.event.pull_request.merge_commit_sha}})' >> $COMMIT_MSG_FILE
          else
            echo "No removed files"

            echo "" >> $COMMIT_MSG_FILE
            echo '(cherry picked from commit ${{github.event.pull_request.merge_commit_sha}})' >> $COMMIT_MSG_FILE
          fi

          echo "Amend the commit message and push"
          git commit --amend -F $COMMIT_MSG_FILE
          git push

      - name: "Notify slack on failure"
        uses: craftech-io/slack-action@fb1d4e50375d7758efb90fa0564734bae931f84f # v1
        with:
          slack_webhook_url: ${{ secrets.EXTERNAL_SLACK_DETECTION_RULES_URL }}
          status: failure
        if: failure()

  post-pending:
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: auto')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'backport: auto')
        || (github.event.action == 'closed')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Mark release-line-caught-up pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_CONTEXT: release-line-caught-up
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.MERGE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Waiting for auto-backports and release-branch Unit Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  mark-caught-up-skip:
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: skip')
      && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Mark release-line-caught-up success (backport skipped)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_CONTEXT: release-line-caught-up
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.MERGE_SHA,
              state: 'success',
              context: process.env.STATUS_CONTEXT,
              description: 'backport: skip; no release-line wait required',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  mark-caught-up:
    needs: [get-branches, commit]
    if: |
      always()
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: auto')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'backport: auto')
        || (github.event.action == 'closed')
      )
      && needs.commit.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Wait for tip Unit Tests and mark release-line-caught-up
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BRANCHES: ${{ toJSON(fromJSON(needs.get-branches.outputs.branches)) }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_CONTEXT: release-line-caught-up
          WORKFLOW_FILE: pythonpackage.yml
          WAIT_SECONDS: "1320"
          POLL_SECONDS: "15"
        with:
          script: |
            const { owner, repo } = context.repo;
            const contextName = process.env.STATUS_CONTEXT;
            const mergeSha = process.env.MERGE_SHA;
            const targetUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            async function postStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: mergeSha,
                state,
                context: contextName,
                description: description.slice(0, 140),
                target_url: targetUrl,
              });
            }

            if (process.env.COMMIT_RESULT !== 'success') {
              const message = `Auto-backport commit job ${process.env.COMMIT_RESULT}`;
              await postStatus('failure', message);
              core.setFailed(message);
              return;
            }

            const branches = JSON.parse(process.env.BRANCHES);
            const workflowFile = process.env.WORKFLOW_FILE;
            const waitMs = Number(process.env.WAIT_SECONDS) * 1000;
            const pollMs = Number(process.env.POLL_SECONDS) * 1000;
            const deadline = Date.now() + waitMs;

            async function sleep() {
              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

            async function unitTestRuns(sha) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                head_sha: sha,
                per_page: 10,
              });
              return data.workflow_runs || [];
            }

            function classifyRuns(runs) {
              if (runs.some((run) => run.status === 'completed' && run.conclusion === 'success')) {
                return 'success';
              }
              if (runs.some((run) => run.status === 'in_progress' || run.status === 'queued' || run.status === 'waiting' || run.status === 'pending')) {
                return 'pending';
              }
              if (runs.some((run) => run.status === 'completed')) {
                const failed = runs.find((run) => run.status === 'completed');
                return `failed:${failed.conclusion}`;
              }
              return 'missing';
            }

            while (true) {
              const results = [];
              for (const branch of branches) {
                const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
                const sha = data.commit.sha;
                const result = classifyRuns(await unitTestRuns(sha));
                results.push({ branch, sha, result });
              }

              const summary = results
                .map((item) => `${item.branch} @ ${item.sha.slice(0, 7)}: ${item.result}`)
                .join('\n');
              core.info(summary);

              if (results.every((item) => item.result === 'success')) {
                await postStatus('success', 'All release targets backported; tip Unit Tests passed');
                return;
              }

              const failed = results.find((item) => item.result.startsWith('failed:'));
              if (failed) {
                const message = `${failed.branch} Unit Tests ${failed.result}`;
                await postStatus('failure', message);
                core.setFailed(`${message}\n${summary}`);
                return;
              }

              if (Date.now() >= deadline) {
                const message = `Timed out waiting for release-branch Unit Tests`;
                await postStatus('failure', message);
                core.setFailed(`${message}\n${summary}`);
                return;
              }
              await sleep();
            }
