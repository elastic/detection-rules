name: backport
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - unlabeled
      - labeled
      - closed
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: read

# Merged backport: auto producers share one group and queue (cancel-in-progress
# false). Merge queue only serializes main — without this, two PRs race on 8.19.
# Open-PR / non-producer events keep unique groups so they do not block producers.
# Double-quoted so YAML does not treat "backport: auto" as a mapping.
concurrency:
  group: "${{ github.event.pull_request.merged && (github.event.action == 'closed' || (github.event.action == 'labeled' && github.event.label.name == 'backport: auto')) && 'release-line-producer' || format('backport-event-{0}-{1}-{2}', github.event.pull_request.number, github.event.action, github.run_id) }}"
  cancel-in-progress: ${{ !(github.event.pull_request.merged && (github.event.action == 'closed' || (github.event.action == 'labeled' && github.event.label.name == 'backport: auto'))) }}

jobs:
  get-branches:
    uses: ./.github/workflows/get-target-branches.yml

  label:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.state == 'open' && !github.event.pull_request.draft
    steps:
      - name: 'Apply default "backport: auto" label'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: |
          !contains(github.event.pull_request.labels.*.name, 'backport: auto') &&
          !contains(github.event.pull_request.labels.*.name, 'backport: skip')
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['backport: auto']
            })
      - name: 'Remove "backport: auto" if "backport: skip" is set'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: |
          contains(github.event.pull_request.labels.*.name, 'backport: auto') &&
          contains(github.event.pull_request.labels.*.name, 'backport: skip')
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'backport: auto'
            })

  commit:
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: auto')
      && !contains(github.event.pull_request.labels.*.name, 'backport: skip')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'backport: auto')
        || (github.event.action == 'closed')
      )
    needs: get-branches
    runs-on: ubuntu-latest
    # Per matrix shard. With max-parallel: 1 and four targets, wall-clock ≤ 4× this.
    # release-line-caught-up gate WAIT must cover this plus mark-caught-up.
    timeout-minutes: 30
    # Belt-and-suspenders with workflow-level release-line-producer lock:
    # serialize pushes per release branch if anything else advances the tip.
    concurrency:
      group: backport-commit-${{ matrix.target_branch }}
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        # 7.17 was intentionally skipped because it was added late and was bug fix only
        target_branch: ${{ fromJSON(needs.get-branches.outputs.branches) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.WRITE_TRADEBOT_DETECTION_RULES_TOKEN }}
          ref: main
          fetch-depth: 100

      - name: Set github config
        run: |
          git config --global user.email "178941316+tradebot-elastic@users.noreply.github.com"
          git config --global user.name "tradebot-elastic"

      - name: Get branch histories
        run: |
          git fetch origin ${{matrix.target_branch}} --depth 1
          git status
          git log -1 --format='%H'

      - name: Checkout the commit into the staging area
        run: |
          # Checkout the merged commit
          git checkout ${{github.event.pull_request.merge_commit_sha}}

          # Move it to the staging area
          git reset --soft HEAD^

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          pip install .[dev]

      - name: Prune non-${{matrix.target_branch}} rules
        env:
          UNSTAGED_LIST_FILE: "../unstaged-rules.txt"
        run: |
          python -m detection_rules dev unstage-incompatible-rules --target-stack-version ${{matrix.target_branch}}

          # Track which rules were unstaged
          git diff --name-only > $UNSTAGED_LIST_FILE

          # Since they've been tracked, remove any untracked files
          git checkout -- .

      - name: Commit and push to ${{matrix.target_branch}}
        env:
          COMMIT_MSG_FILE: "../commit-message.txt"
          UNSTAGED_LIST_FILE: "../unstaged-rules.txt"
        run: |
          set -x

          TARGET_BRANCH="${{ matrix.target_branch }}"

          # Re-fetch immediately before switching — tip can move during pip install
          # while another PR's backport job is pushing the same release branch.
          echo "Refresh ${TARGET_BRANCH} tip and keep staged changes"
          git fetch origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

          NEEDS_BACKPORT=$(git diff HEAD --quiet --exit-code && echo n || echo y)

          if [ "n" = "$NEEDS_BACKPORT" ]
          then
            echo "No changes to backport"
            exit 0
          fi

          echo "Create the new commit with the same author"
          git commit --reuse-message ${{github.event.pull_request.merge_commit_sha}}

          echo "Save the commit message"
          git log ${{github.event.pull_request.merge_commit_sha}} --format=%B -n1 > $COMMIT_MSG_FILE

          echo "Append to the commit message"
          if [ -s "$UNSTAGED_LIST_FILE" ]
          then
            echo "Track note for the removed files"

            echo "" >> $COMMIT_MSG_FILE
            echo "Removed changes from:" >> $COMMIT_MSG_FILE
            awk '{print "- " $0}' $UNSTAGED_LIST_FILE >> $COMMIT_MSG_FILE
            echo "" >> $COMMIT_MSG_FILE
            echo '(selectively cherry picked from commit ${{github.event.pull_request.merge_commit_sha}})' >> $COMMIT_MSG_FILE
          else
            echo "No removed files"

            echo "" >> $COMMIT_MSG_FILE
            echo '(cherry picked from commit ${{github.event.pull_request.merge_commit_sha}})' >> $COMMIT_MSG_FILE
          fi

          echo "Amend the commit message and push"
          git commit --amend -F $COMMIT_MSG_FILE

          # Re-fetch/rebase before each push — covers manual tip moves and any
          # race that slips past the workflow-level producer lock.
          pushed=
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}" || exit 1
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt ${attempt}); retrying after sleep"
            sleep 5
          done
          if [ -z "${pushed}" ]; then
            echo "Failed to push after retries"
            exit 1
          fi

      - name: "Notify slack on failure"
        uses: craftech-io/slack-action@fb1d4e50375d7758efb90fa0564734bae931f84f # v1
        with:
          slack_webhook_url: ${{ secrets.EXTERNAL_SLACK_DETECTION_RULES_URL }}
          status: failure
        if: failure()

  # Two-phase ordered status producer for release-line-caught-up:
  #   1) post-pending — runs in parallel with cherry-picks, posts pending only
  #   2) mark-caught-up — needs post-pending + commit, posts only terminal success/failure
  # Ordering within the workflow run is enforced by `needs: post-pending` on the finalizer.
  # Per-merge-SHA concurrency cancels duplicate producer runs (e.g. re-label after merge).
  post-pending:
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: auto')
      && !contains(github.event.pull_request.labels.*.name, 'backport: skip')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'backport: auto')
        || (github.event.action == 'closed')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Mark release-line-caught-up pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_CONTEXT: release-line-caught-up
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.MERGE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Waiting for auto-backports and release-branch Unit Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  mark-caught-up-skip:
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: skip')
      && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Mark release-line-caught-up success (backport skipped)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_CONTEXT: release-line-caught-up
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.MERGE_SHA,
              state: 'success',
              context: process.env.STATUS_CONTEXT,
              description: 'backport: skip; no release-line wait required',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # Merged with neither backport label → fail closed so the next gate does not
  # spin for the full wait window on a missing status.
  mark-caught-up-unlabeled:
    if: |
      github.event.pull_request.merged == true
      && github.event.action == 'closed'
      && !contains(github.event.pull_request.labels.*.name, 'backport: auto')
      && !contains(github.event.pull_request.labels.*.name, 'backport: skip')
    runs-on: ubuntu-latest
    steps:
      - name: Mark release-line-caught-up failure (no backport label)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_CONTEXT: release-line-caught-up
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.MERGE_SHA,
              state: 'failure',
              context: process.env.STATUS_CONTEXT,
              description: 'Merged without backport: auto or backport: skip',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setFailed('Merged without backport: auto or backport: skip; refusing to leave release-line status missing.');

  mark-caught-up:
    needs: [get-branches, commit, post-pending]
    # Always finalize when backport: auto merged — including get-branches/commit
    # skipped or failed — so the next PR never waits on a missing status.
    # Posts only terminal success/failure (pending comes from post-pending).
    if: |
      always()
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'backport: auto')
      && !contains(github.event.pull_request.labels.*.name, 'backport: skip')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'backport: auto')
        || (github.event.action == 'closed')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Wait for tip Unit Tests and mark release-line-caught-up
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BRANCHES: ${{ needs.get-branches.outputs.branches }}
          GET_BRANCHES_RESULT: ${{ needs.get-branches.result }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          POST_PENDING_RESULT: ${{ needs.post-pending.result }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_CONTEXT: release-line-caught-up
          WORKFLOW_FILE: pythonpackage.yml
          WAIT_SECONDS: "3600"
          POLL_SECONDS: "120"
        with:
          script: |
            const { owner, repo } = context.repo;
            const contextName = process.env.STATUS_CONTEXT;
            const mergeSha = process.env.MERGE_SHA;
            const targetUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            async function postStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: mergeSha,
                state,
                context: contextName,
                description: description.slice(0, 140),
                target_url: targetUrl,
              });
            }

            try {
              if (process.env.POST_PENDING_RESULT === 'failure') {
                core.warning('post-pending failed; continuing to publish a terminal status');
              }

              if (process.env.GET_BRANCHES_RESULT !== 'success') {
                const message = `Target-branch discovery ${process.env.GET_BRANCHES_RESULT}`;
                await postStatus('failure', message);
                core.setFailed(message);
                return;
              }

              if (process.env.COMMIT_RESULT !== 'success') {
                const message = `Auto-backport commit job ${process.env.COMMIT_RESULT}`;
                await postStatus('failure', message);
                core.setFailed(message);
                return;
              }

              let branches;
              try {
                branches = JSON.parse(process.env.BRANCHES || '[]');
              } catch (err) {
                const message = `Invalid target-branch list: ${err}`;
                await postStatus('failure', message);
                core.setFailed(message);
                return;
              }
              if (!Array.isArray(branches) || branches.length === 0) {
                const message = 'No release target branches to wait on';
                await postStatus('failure', message);
                core.setFailed(message);
                return;
              }

              const workflowFile = process.env.WORKFLOW_FILE;
              const waitMs = Number(process.env.WAIT_SECONDS) * 1000;
              const pollMs = Number(process.env.POLL_SECONDS) * 1000;
              const deadline = Date.now() + waitMs;

              async function sleep() {
                await new Promise((resolve) => setTimeout(resolve, pollMs));
              }

              async function unitTestRuns(sha) {
                const params = {
                  owner,
                  repo,
                  workflow_id: workflowFile,
                  head_sha: sha,
                  event: 'push',
                  per_page: 10,
                };
                const actions = github.rest.actions;
                const listRuns = actions.listWorkflowRunsForWorkflow || actions.listWorkflowRuns;
                const { data } = await listRuns(params);
                return data.workflow_runs || [];
              }

              // Newest run wins: if it is still queued/running, wait; only then use its conclusion.
              function classifyRuns(runs) {
                if (!runs.length) {
                  return 'missing';
                }
                const sorted = [...runs].sort(
                  (a, b) => new Date(b.created_at || b.updated_at) - new Date(a.created_at || a.updated_at),
                );
                const newest = sorted[0];
                if (['in_progress', 'queued', 'waiting', 'pending'].includes(newest.status)) {
                  return 'pending';
                }
                if (newest.status === 'completed') {
                  if (newest.conclusion === 'success') {
                    return 'success';
                  }
                  return `failed:${newest.conclusion}`;
                }
                return 'missing';
              }

              while (true) {
                try {
                  const results = [];
                  for (const branch of branches) {
                    const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
                    const sha = data.commit.sha;
                    const result = classifyRuns(await unitTestRuns(sha));
                    results.push({ branch, sha, result });
                  }

                  const summary = results
                    .map((item) => `${item.branch} @ ${item.sha.slice(0, 7)}: ${item.result}`)
                    .join('\n');
                  core.info(summary);

                  if (results.every((item) => item.result === 'success')) {
                    await postStatus('success', 'All release targets backported; tip Unit Tests passed');
                    return;
                  }

                  const failed = results.find((item) => item.result.startsWith('failed:'));
                  if (failed) {
                    const message = `${failed.branch} Unit Tests ${failed.result}`;
                    await postStatus('failure', message);
                    core.setFailed(`${message}\n${summary}`);
                    return;
                  }

                  if (Date.now() >= deadline) {
                    const message = `Timed out waiting for release-branch Unit Tests`;
                    await postStatus('failure', message);
                    core.setFailed(`${message}\n${summary}`);
                    return;
                  }
                } catch (err) {
                  // Do not sticky-fail the merge SHA on transient REST errors;
                  // only terminal failure for real tip/backport outcomes or timeout.
                  core.warning(`Transient release-line finalizer poll error: ${err}`);
                  if (Date.now() >= deadline) {
                    const message = `Timed out waiting for release-branch Unit Tests (last error: ${err})`;
                    try {
                      await postStatus('failure', message);
                    } catch (statusErr) {
                      core.error(`Failed to post terminal status: ${statusErr}`);
                    }
                    core.setFailed(message);
                    return;
                  }
                }
                await sleep();
              }
            } catch (err) {
              // Setup / pre-poll failures (branch list, commit job) only.
              const message = `release-line finalizer error: ${err}`;
              try {
                await postStatus('failure', message);
              } catch (statusErr) {
                core.error(`Failed to post terminal status: ${statusErr}`);
              }
              core.setFailed(message);
            }
