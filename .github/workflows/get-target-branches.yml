name: List Target Branches

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to read target-branches from (use main for PR gates)"
        type: string
        required: false
        default: ""
    # Map the workflow outputs to job outputs
    outputs:
      branches:
        description: "List of target branches"
        value: ${{ jobs.list-target-branches.outputs.matrix }}

permissions:
  contents: read

jobs:
  list-target-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.get-branch-list.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Default checkout is the caller SHA; PR gates must pin main so a PR cannot
          # shrink the target list by editing stack-schema-map / this workflow.
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          pip install .[dev]

      - id: get-branch-list
        run: |
          python -m detection_rules dev utils get-branches
          echo "matrix=$(cat ./detection_rules/etc/target-branches.yaml)" >> "$GITHUB_OUTPUT"
