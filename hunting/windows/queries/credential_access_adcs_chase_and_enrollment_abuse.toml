[hunt]
author = "Elastic"
description = """
Hunts for Active Directory Certificate Services (AD CS) enrollment chase activity and related
identity-binding abuse. Covers Certighost (CVE-2026-54121) precursors and sibling behaviors:
chase request attributes (cdc/rmd/ccm), SAN DNS overrides on certificate requests, machine-account
staging before enrollment, CA process (certsrv.exe) egress to LDAP/SMB/LDAPS endpoints, and
ES|QL correlation of issued/requested cert SAN identity to Kerberos PKINIT TGTs.
"""
integration = ["system", "windows", "endpoint"]
uuid = "613112a7-a67f-49b1-a86e-96a0e9fc9736"
name = "AD CS Chase Attributes and Suspicious Certificate Enrollment"
language = ["ES|QL"]
license = "Elastic License v2"
notes = [
  "Enable CA AuditFilter and Certification Services auditing so 4886/4887/4888 populate Attributes.",
  "Companion rules: privilege_escalation_adcs_certighost_cdc_rmd_chase, privilege_escalation_adcs_certsrv_directory_port_egress, credential_access_adcs_certificate_issued_then_kerberos_pkinit.",
  "ES|QL hunt 5 normalizes SubjectAlternativeName DNS Name=host.domain → HOST$ and joins 4768; filter kerb_pkinit > 0 for abuse follow-on.",
  "PreAuthType 15 and 16 are both PKINIT/smart-card related per Microsoft 4768 docs; Certighost lab PKINIT observed PreAuthType 16.",
  "Do not suppress on Attributes CertificateTemplate text — that blob is requester-controlled; use winlog.event_data.CertificateTemplate for DC-template exclusions.",
]
mitre = ["T1649", "T1068", "T1136.002", "T1003.006", "T1558"]
query = [
'''
/* Hunt 1: inventory any AD CS chase / referral attributes */
FROM logs-system.security-*, logs-windows.forwarded-*, winlogbeat-*
| WHERE @timestamp > NOW() - 7 days
  AND event.code IN ("4886", "4887", "4888")
  AND winlog.event_data.Attributes IS NOT NULL
  AND (
    winlog.event_data.Attributes LIKE "*cdc:*"
    OR winlog.event_data.Attributes LIKE "*rmd:*"
    OR winlog.event_data.Attributes LIKE "*ccm:*"
  )
| KEEP @timestamp, host.name, event.code, winlog.event_data.Requester,
       winlog.event_data.CertificateTemplate, winlog.event_data.SubjectAlternativeName,
       winlog.event_data.Attributes
| SORT @timestamp DESC
| LIMIT 100
''',
'''
/* Hunt 2: Certighost-like chase + SAN:dns (triage escalator; not required for the EQL rule) */
FROM logs-system.security-*, logs-windows.forwarded-*, winlogbeat-*
| WHERE @timestamp > NOW() - 7 days
  AND event.code IN ("4886", "4887", "4888")
  AND winlog.event_data.Attributes LIKE "*cdc:*"
  AND winlog.event_data.Attributes LIKE "*SAN:dns*"
| KEEP @timestamp, host.name, event.code, winlog.event_data.Requester,
       winlog.event_data.Subject, winlog.event_data.SubjectAlternativeName,
       winlog.event_data.Attributes
| SORT @timestamp DESC
| LIMIT 100
''',
'''
/* Hunt 3: issued certificates that used chase attributes */
FROM logs-system.security-*, logs-windows.forwarded-*, winlogbeat-*
| WHERE @timestamp > NOW() - 30 days
  AND event.code == "4887"
  AND winlog.event_data.Attributes IS NOT NULL
  AND (
    winlog.event_data.Attributes LIKE "*cdc:*"
    OR winlog.event_data.Attributes LIKE "*rmd:*"
  )
| KEEP @timestamp, host.name, winlog.event_data.Requester,
       winlog.event_data.CertificateTemplate, winlog.event_data.SubjectAlternativeName,
       winlog.event_data.Attributes
| SORT @timestamp DESC
| LIMIT 50
''',
'''
/* Hunt 4: CA process egress on directory ports (chase / LDAP / SMB) */
FROM logs-endpoint.events.network-*
| WHERE @timestamp > NOW() - 7 days
  AND host.os.type == "windows"
  AND process.name == "certsrv.exe"
  AND network.direction == "egress"
  AND destination.port IN (389, 445, 636)
  AND destination.ip IS NOT NULL
| STATS connections = COUNT(*), ports = VALUES(destination.port)
    BY host.name, destination.ip
| SORT connections DESC
| LIMIT 50
''',
'''
/* Hunt 5: correlate AD CS SAN-bound identity with Kerberos TGTs (PKINIT) */
FROM logs-system.security-*, logs-windows.forwarded-*, winlogbeat-*
| WHERE @timestamp > NOW() - 7 days
  AND event.code IN ("4886", "4887", "4768")
| EVAL san_dns = CASE(
    winlog.event_data.SubjectAlternativeName LIKE "DNS Name=*",
      REPLACE(winlog.event_data.SubjectAlternativeName, "DNS Name=", ""),
    NULL
  )
| EVAL san_host = MV_FIRST(SPLIT(san_dns, "."))
| EVAL identity = CASE(
    event.code IN ("4886", "4887") AND san_host IS NOT NULL,
      CONCAT(TO_UPPER(san_host), "$"),
    event.code == "4768",
      winlog.event_data.TargetUserName,
    NULL
  )
| WHERE identity RLIKE "[A-Za-z0-9-]+\\$"
| STATS
    adcs = COUNT(*) WHERE event.code IN ("4886", "4887"),
    chase = COUNT(*) WHERE event.code IN ("4886", "4887")
      AND winlog.event_data.Attributes LIKE "*cdc:*",
    kerb = COUNT(*) WHERE event.code == "4768",
    kerb_pkinit = COUNT(*) WHERE event.code == "4768"
      AND winlog.event_data.PreAuthType IN ("15", "16"),
    requesters = VALUES(winlog.event_data.Requester),
    preauth = VALUES(winlog.event_data.PreAuthType),
    client_ips = VALUES(winlog.event_data.IpAddress)
  BY identity
| WHERE adcs > 0 AND chase > 0
| SORT chase DESC
| LIMIT 50
'''
]
