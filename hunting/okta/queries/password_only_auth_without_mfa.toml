[hunt]
author = "Elastic"
description = """
Identifies Okta applications where password-only authentication is observed through `user.authentication.verify` events without corresponding MFA (`auth_via_mfa`) or SSO events within the selected time range. Helps identify applications that may have been accessed without an additional authentication factor.
"""
integration = ["okta"]
uuid = "df9e8b99-97c1-4632-b633-97a2615d1b65"
name = "Password Only Authentication"
language = ["ES|QL"]
license = "Elastic License v2"
notes = [
    "`okta.actor.alternate_id` (or target user) is the account authenticating with password only.",
    "Confirm whether MFA is enrolled for the user and whether sign-on policy allows password-only for that app/group.",
    "Pivot on the same user for `event.action` values `user.authentication.auth_via_mfa` and `user.authentication.sso` in a wider window to rule out delayed MFA/SSO.",
    "Expect false positives for service accounts, break-glass accounts, or apps intentionally excluded from MFA; tune those out before treating as malicious.or if the environment have different IDP used for MFA " ] 
mitre = ['T1078.004']
query = ['''
// Search Okta System logs from the last 7 days
FROM logs-okta.system*
| WHERE @timestamp > NOW() - 7 day
| WHERE event.dataset == "okta.system" AND okta.outcome.result == "SUCCESS"

// Select authentication verification, MFA, and SSO events
| WHERE okta.event_type IN (
    "user.authentication.verify",
    "user.authentication.auth_via_mfa",
    "user.authentication.sso"
)
// Identify authentication verification events containing only password step Multi Value(mv) was used as few cases we see an array for methodTypeUsed
| EVAL password_only_verify = CASE(
    okta.event_type == "user.authentication.verify"
    AND MV_CONTAINS(okta.target.detailEntry.methodTypeUsed, "password")
    AND MV_COUNT(okta.target.detailEntry.methodTypeUsed) == 1,
    1, 0
)
// Flag MFA authentication events
| EVAL mfa_event = CASE(
    okta.event_type == "user.authentication.auth_via_mfa", 1, 0
)
// Flag SSO authentication events
| EVAL sso_event = CASE(
    okta.event_type == "user.authentication.sso", 1, 0
)
// Aggregate password-only, MFA, and SSO events by application
| STATS
    password_only_events = SUM(password_only_verify),
    mfa_events = SUM(mfa_event),
    sso_events = SUM(sso_event)
  BY okta.target.id
// Return applications with password-only events and no observed MFA or SSO events
| WHERE password_only_events > 0
    AND mfa_events == 0
    AND sso_events == 0
''']
