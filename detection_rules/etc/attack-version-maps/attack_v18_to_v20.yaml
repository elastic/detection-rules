# MITRE ATT&CK v18 -> v20 version mapping.
#
# auto_derive_missing: true means that any tactic/technique/subtechnique not
# listed below is automatically resolved from v20 STIX data at conversion time.
# The identity mapping (same ID, target-version name and URL) is used unless an
# explicit entry below overrides it.
#
# Add explicit entries here ONLY for exceptions:
#   id change  -> map source id to the new target id/name/reference
#   drop       -> set the entry to null
#
# All v18 IDs that still exist unchanged in v20 are handled automatically.
# Explicit technique/subtechnique rows below follow the MITRE revoked-by links
# in the v20 STIX data (auto_derive drops revoked ids): every id that is active
# in v18 and revoked in v20, plus T1547.011, which was already revoked in v18
# but still appears in detection-rules TOML.
