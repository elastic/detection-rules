[metadata]
creation_date = "2026/11/02"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/02"

[rule]
author = ["Elastic"]
description = """
Detects a code editor such as Visual Studio Code, Cursor, Sublime Text, Zed, or a JetBrains IDE, or a
shell or other process launched from one of those editors, creates or modifies a specific LaunchAgent or LaunchDaemon
plist on a host. Malicious extensions, workspace tasks, and plugins can install persistence from the editor session
without a separate suspicious parent process.
"""
from = "now-9m"
index = ["logs-endpoint.events.file-*"]
language = "kuery"
license = "Elastic License v2"
name = "Code Editor Session Created a LaunchAgent or LaunchDaemon"
note = """## Triage and analysis

### Investigating Code Editor Session Created a LaunchAgent or LaunchDaemon

LaunchAgents and LaunchDaemons are plist files that make macOS start a program at login or boot. Code editors do not
normally install launch items. When a plist in these directories is written by the editor, by one of its helper
processes, or by a shell, task, or extension running in the editor session, a malicious extension or workspace task may
be establishing persistence.

`Effective_process.executable` identifies the editor responsible for the write, even when the writer is a child such as
`zsh`, `curl`, `cp`, or `python`. The New Terms rule type alerts the first time a given plist path is written this way on
a host within the history window.

### Possible investigation steps

- Review `file.path` and `file.Ext.original.path` (for renames) to identify the plist and where it was staged.
- Read the plist with `plutil -p <path>` and review `Program`, `ProgramArguments`, `RunAtLoad`, and `KeepAlive`.
- Compare `process.executable` with `Effective_process.executable` to tell a direct editor write from a child process
  launched in the editor terminal, task runner, or extension host.
- For VS Code and Cursor, review installed extensions and recent `.vscode/tasks.json` changes in the open workspace.
- Check whether the binary or script referenced by the plist exists, how it got there, and whether it is signed.
- Look for related process, network, and file activity from the same `Effective_process.entity_id` around the alert.

### False positive analysis

- Developers may run installers from the integrated terminal that register their own launch item, for example
  `brew services` (`homebrew.mxcl.*.plist`) or vendor install scripts. Confirm the plist belongs to a known tool.
- A developer may open and save an existing plist in the editor. Confirm the change with the user.
- Build exceptions on `file.path` together with `process.executable`, not on the editor alone.

### Response and remediation

- Unload the launch item with `launchctl bootout gui/<uid> <plist_path>` (or `system` for LaunchDaemons) and remove the
  plist.
- Remove or quarantine the program it references.
- Uninstall the suspected extension or remove the malicious workspace task.
- Hunt for the same plist name, referenced program, and extension on other hosts.
"""
references = [
    "https://www.mdsec.co.uk/2021/01/macos-post-exploitation-shenanigans-with-vscode-extensions/",
    "https://www.jamf.com/blog/threat-actors-expand-abuse-of-visual-studio-code/",
    "https://cursor.com/blog/claude-code-extension-security-notice",
]
risk_score = 47
rule_id = "3b41e81b-8848-4e34-a142-3be08287258d"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: New Terms",
    "Platform: macOS",
]
timestamp_override = "event.ingested"
type = "new_terms"
query = '''
host.os.type:macos and event.category:file and event.action:(modification or rename) and
file.extension:plist and
file.path:(
  /Library/LaunchAgents/* or /Library/LaunchDaemons/* or /Users/*/Library/LaunchAgents/* or
  /System/Library/LaunchAgents/* or /System/Library/LaunchDaemons/*
) and
not file.path:*.app/Contents/* and
(
  Effective_process.executable:(
    */Applications/Visual*Studio*Code*.app/* or */Applications/Cursor.app/* or */Applications/Sublime*Text*.app/* or
    */Applications/Zed*.app/* or */Applications/IntelliJ*IDEA*.app/* or */Applications/PyCharm*.app/* or
    */Applications/WebStorm*.app/* or */Applications/GoLand*.app/* or */Applications/PhpStorm*.app/* or
    */Applications/RubyMine*.app/* or */Applications/CLion*.app/* or */Applications/Rider.app/* or
    */Applications/DataGrip*.app/* or */Applications/RustRover*.app/* or */Applications/Fleet*.app/* or
    */Applications/Aqua*.app/* or */Applications/DataSpell*.app/* or */Applications/Android*Studio*.app/* or
    */Applications/Windsurf.app/* or */Applications/Kiro.app/* or */Applications/Antigravity.app/* or
    */Applications/Trae.app/* or */Applications/Void.app/*
  ) or
  process.executable:(
    */Applications/Visual*Studio*Code*.app/* or */Applications/Cursor.app/* or */Applications/Sublime*Text*.app/* or
    */Applications/Zed*.app/* or */Applications/IntelliJ*IDEA*.app/* or */Applications/PyCharm*.app/* or
    */Applications/WebStorm*.app/* or */Applications/GoLand*.app/* or */Applications/PhpStorm*.app/* or
    */Applications/RubyMine*.app/* or */Applications/CLion*.app/* or */Applications/Rider.app/* or
    */Applications/DataGrip*.app/* or */Applications/RustRover*.app/* or */Applications/Fleet*.app/* or
    */Applications/Aqua*.app/* or */Applications/DataSpell*.app/* or */Applications/Android*Studio*.app/* or
    */Applications/Windsurf.app/* or */Applications/Kiro.app/* or */Applications/Antigravity.app/* or
    */Applications/Trae.app/* or */Applications/Void.app/*
  )
)
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1543"
name = "Create or Modify System Process"
reference = "https://attack.mitre.org/techniques/T1543/"

[[rule.threat.technique.subtechnique]]
id = "T1543.001"
name = "Launch Agent"
reference = "https://attack.mitre.org/techniques/T1543/001/"

[[rule.threat.technique.subtechnique]]
id = "T1543.004"
name = "Launch Daemon"
reference = "https://attack.mitre.org/techniques/T1543/004/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

[rule.new_terms]
field = "new_terms_fields"
value = ["host.id", "file.path"]

[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-7d"
