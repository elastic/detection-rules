[metadata]
creation_date = "2026/09/09"
integration = ["endpoint", "macos"]
maturity = "production"
updated_date = "2026/09/09"

[rule]
author = ["Elastic"]
description = """
Identifies a burst of inbound SSH authentication failures on a macOS host followed shortly by a successful SSH login
on the same host. On macOS, each inbound SSH authentication attempt spawns the sshd-keygen-wrapper process once, and a
successful login spawns the user's shell as a child of the sshd-session process. When the macOS Security Events
integration is deployed, the rule additionally correlates sshd authentication-failure and "Accepted" messages from
the unified log. A successful login immediately after repeated failures indicates that a password brute force or
password spraying attack against an exposed SSH service has likely succeeded.
"""
from = "now-9m"
index = ["logs-endpoint.events.process-*", "logs-macos.authentication-*"]
language = "eql"
license = "Elastic License v2"
name = "Potential Successful macOS SSH Brute Force Attack"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Potential Successful macOS SSH Brute Force Attack

SSH (Secure Shell) is a protocol used to securely access remote systems. This rule identifies a burst of inbound SSH
authentication failures on a macOS host followed within seconds by a successful SSH login on the same host, indicating that
a password brute force or password spraying attack has likely succeeded. On macOS, each inbound SSH connection spawns
`sshd-keygen-wrapper` once, and a successful login spawns the user's shell as a child of `sshd-session` (or `sshd` on older
releases). When the macOS Security Events integration is deployed, the rule additionally correlates `Failed password`,
`Failed keyboard-interactive/pam`, and `PAM: authentication error` messages with a subsequent `Accepted` message from
`sshd-session` in the unified log. The sequence is correlated per host; source IP and username are not available in either
data source and must be retrieved from the host's authentication logs during triage.

### Possible investigation steps

- Review the sequence events in the alert to identify the failure signals (`sshd-keygen-wrapper` process starts or unified-log failure messages) and the success signal (a shell such as `zsh` or `bash` started by `sshd-session`, or an `Accepted` message).
- If unified-log events are present, extract the targeted username, source IP address, and port from the `message` field of the failure and `Accepted` events to identify the attacker and the compromised account.
- If only process events are present, review the host's SSH authentication logs (for example, `log show --predicate 'process == "sshd-session"' --info`) for the corresponding failures, the accepted authentication method, source IP, and username.
- Determine whether the source IP address is internal or external and whether it is associated with known infrastructure, scanners, or previous alerts.
- Investigate the process tree beneath the spawned shell for commands executed after the successful login, such as discovery, persistence, or credential access activity.
- Review other alerts and events associated with the affected host and account during the past 48 hours.
- Verify whether the compromised account has administrative privileges or is a member of the `admin` group.
- Determine whether Remote Login is expected to be enabled on this host and whether the account is expected to log in over SSH.

### False positive analysis

- Automated tooling that retries SSH connections with stale credentials before succeeding with a valid one (for example, configuration management, deployment scripts, or credential rotation processes) can produce a burst of failures followed by a success. Verify the source and exclude known automation if the behavior is expected.
- A user with an expired or recently rotated password who retries repeatedly before succeeding. The 15-second window and PAM's per-attempt delay make this unlikely from a single interactive session, but multiple parallel sessions from the same user can approach the threshold.
- Security scanners or credential-validation health checks that test SSH authentication against known hosts.
- Build servers, developer workstations, or CI/CD infrastructure that receive many legitimate SSH connections in short windows.

### Response and remediation

- Treat the alert as a potential compromise: a successful login after repeated failures means the attacker likely holds valid credentials for the host.
- Terminate active SSH sessions for the compromised account on the affected host and isolate the host from the network if unauthorized access is confirmed.
- Reset the password of the compromised account and any other accounts sharing the same credential; review the account for unexpected privilege changes, SSH authorized keys, or persistence mechanisms such as launch agents or login items.
- Review commands executed in the session and the host for follow-on activity, including data access, lateral movement, or additional accounts created.
- Block or rate-limit the source IP address at the network perimeter or on the host, and review why the SSH service was reachable from that source.
- Review and harden the host's SSH configuration: disable password authentication in favor of key-based authentication, restrict access with `AllowUsers`/`AllowGroups`, and disable Remote Login where it is not required.
- Search for similar sequences across other macOS hosts to determine whether the activity is part of a broader campaign.
- Escalate to the incident response team and update logging and detection coverage based on the findings.
"""

references = ["https://themittenmac.com/detecting-ssh-activity-via-process-monitoring/"]
risk_score = 73
rule_id = "f5898b1e-3071-4597-b066-43d298c7b415"
setup = """## Setup

This rule requires data from one or both of the following sources.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a macOS System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, either "Traditional Endpoints" or "Cloud Workloads".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/current/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).

### macOS Security Events Integration Setup
The Authentication data stream of the macOS Security Events integration (`logs-macos.authentication-*`) can be used
as a second data source. The integration's default configuration does not produce matching documents; three changes
are required in the Authentication data stream's Advanced options of the integration policy:
- **Predicate**: edit the entry `process == "sshd"` to `process == "sshd" OR process == "sshd-session"`. On current
macOS releases (OpenSSH 9.8+), authentication log messages are emitted by the `sshd-session` process, which the
default predicate excludes.
- **Include info**: enable it. sshd authentication failure and success messages are logged at Info level and are not
collected by default.
- **Processors**: add `- add_host_metadata:` (with `netinfo.enabled: false`) so unified-log documents carry `host.id`
and `host.os.type`, which this rule requires for OS scoping and sequence correlation.
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Initial Access",
    "Data Source: Elastic Defend",
    "Data Source: macOS Security Events",
    "Resources: Investigation Guide",
]
type = "eql"
query = '''
sequence by host.id with maxspan=15s
[any where host.os.type == "macos" and (
    (event.category == "process" and event.type == "start" and
        ?process.name == "sshd-keygen-wrapper" and ?process.parent.name == "launchd") or
    (event.dataset == "macos.authentication" and event.category == "authentication" and
        ?macos.event.message.description : ("Failed password for*",
                                            "Failed keyboard-interactive/pam for*",
                                            "error: PAM: authentication error for*"))
)] with runs=10
[any where host.os.type == "macos" and (
    (event.category == "process" and event.type == "start" and
        ?process.parent.name in ("sshd-session", "sshd") and
        ?process.name in ("zsh", "bash", "sh", "tcsh", "csh", "ksh", "fish")) or
    (event.dataset == "macos.authentication" and event.category == "authentication" and
        ?macos.event.message.description : "Accepted *")
)]
'''

