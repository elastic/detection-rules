[metadata]
creation_date = "2026/08/06"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/10/31"

[rule]
author = ["clivoa"]
description = """
Identifies an untrusted/unsigned process, `osascript`, or a process with an untrusted/unsigned parent referencing a
cryptocurrency wallet application's data directory or a browser cryptocurrency wallet extension's local storage on its
command line. Covered sources are wallet application data (Exodus, Electrum, Electrum-LTC, Electron Cash, Sparrow,
Ledger Live, Coinomi, Atomic, Guarda, Trezor Suite, Wasabi, Monero, the Bitcoin, Litecoin, Dash and Dogecoin Core data
directories, `wallet.dat`) and the browser extension local storage of popular wallets (MetaMask, Phantom, Coinbase Wallet,
Rabby, Trust Wallet). Wallet application data holds private keys and seed phrases (software wallets) or account metadata
(hardware-wallet companion apps like Ledger Live) that an adversary can use to target or drain funds. macOS infostealer
families including AMOS/Atomic, Poseidon, Cthulhu and Banshee target this data.
"""
false_positives = [
    """
    An unsigned or ad-hoc signed backup, sync or wallet migration tool reading these directories as part of its normal
    function will match. Verify the tool and add a code-signing identity exception if it is expected to run routinely.
    """,
    """
    Locally built or unsigned developer tooling, and scripts run under an unsigned interpreter, will match when a wallet
    path appears on the command line. Confirm the process ancestry and the user's intent.
    """,
    """
    Self-built or package-manager-built Bitcoin, Litecoin, Dash or Dogecoin node binaries are often ad-hoc signed and will
    match when their data directory is passed on the command line (for example `-datadir`). Scope an exception to the
    node's executable path.
    """,
    """
    Automation using `osascript` matches regardless of signing, since `osascript` is trusted and would otherwise be an
    easy bypass. Check the script content and the invoking context.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process*"]
language = "eql"
license = "Elastic License v2"
name = "Untrusted Process Access to Cryptocurrency Wallet Data"
note = """## Triage and analysis

### Investigating Untrusted Process Access to Cryptocurrency Wallet Data

This rule flags a process referencing a cryptocurrency wallet application's data directory or a wallet browser
extension's local storage path on its command line, where the process itself (or its parent) is unsigned/untrusted,
or where `osascript` is involved (a common macOS infostealer technique for shelling out to a reader command).

### Possible investigation steps

- Review the full process tree (`process.parent.name`, `process.parent.executable`,
  `process.parent.code_signature.*`) to determine whether an untrusted binary directly read the data, or spawned a
  trusted utility (e.g. `cat`, `cp`, `zip`) to do so on its behalf — both are covered by this rule.
- Check the process's code signature (`process.code_signature.exists`, `.trusted`, `.subject_name`) to identify
  whether it is a known legitimate tool that should be added to an exception.
- If `osascript` is involved, inspect the full `process.command_line` for the embedded shell command to see exactly
  what was read or exfiltrated.
- Check for subsequent network connections or file compression/archival from the same process tree — wallet data
  theft is typically followed immediately by exfiltration.
- Correlate with other alerts on the host (Gatekeeper/quarantine bypass, keychain dumping, browser
  cookie/credential-file access) — real macOS stealer chains typically hit several of these techniques together.

### False positive analysis

- A trusted backup, sync, or migration tool signed by a known developer reading these directories as part of its
  normal function. Verify the tool and its code signature before escalating; add a code-signature-based exception if
  it is expected to run routinely.

### Response and remediation

- Isolate the host and preserve the process tree, the full command line, and any archive or staging files it wrote.
- Treat every wallet referenced on the command line as compromised. Move funds from the affected software wallets to a
  new wallet created on a clean device, and do not reuse their seed phrases.
- For hardware-wallet companion apps such as Ledger Live, the keys stay on the device, but the exposed account
  metadata reveals holdings and addresses. Warn the user about follow-up phishing and address-poisoning attempts.
- Revoke sessions and rotate credentials for the browser profile that holds the affected wallet extensions, since
  macOS stealers usually collect browser data and the Keychain in the same run.
- Identify how the untrusted binary arrived (Gatekeeper or quarantine bypass, a fake installer, a malicious
  `osascript` prompt) and remove it along with any persistence it created.
"""
references = [
    "https://attack.mitre.org/techniques/T1555/",
    "https://attack.mitre.org/techniques/T1005/",
    "https://www.sophos.com/en-us/blog/why-amos-matters-the-macos-malware-stealing-data-at-scale",
    "https://www.microsoft.com/en-us/security/blog/2026/02/02/infostealers-without-borders-macos-python-stealers-and-platform-abuse/",
]
risk_score = 73
rule_id = "5aa9f6aa-9fbc-40df-ad18-edb38ad97a71"
setup = """## Setup

This rule requires data coming in from Elastic Defend.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a macOS System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, for MacOS it is recommended to select "Traditional Endpoints".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/current/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Collection",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where event.action == "exec" and host.os.type == "macos" and process.command_line != null and
 process.command_line like~ (
   "*Library/Application Support/Exodus*",
   "*/.electrum*",
   "*/.electron-cash*",
   "*/.sparrow*",
   "*Library/Application Support/Ledger Live*",
   "*Library/Application Support/Coinomi*",
   "*Library/Application Support/atomic*",
   "*Library/Application Support/Guarda*",
   "*Library/Application Support/@trezor/suite-desktop*",
   "*Library/Application Support/Bitcoin*",
   "*Library/Application Support/Litecoin*",
   "*Library/Application Support/DashCore*",
   "*Library/Application Support/Dogecoin*",
   "*/.walletwasabi*",
   "*Library/Application Support/monero-wallet-gui*",
   "*/Monero/wallets*",
   "*wallet.dat*",
   "*Local Extension Settings/nkbihfbeogaeaoehlefnkodbefgpgknn*",
   "*Local Extension Settings/bfnaelmomeimhlpmgjnjophhpkkoljpa*",
   "*Local Extension Settings/hnfanknocfeofbddgcijnmhnfnkdnaad*",
   "*Local Extension Settings/acmacodkjbdgmoleebolmdjonilkdbch*",
   "*Local Extension Settings/egjidjbpglichdcondbcbdnbeeppgdph*"
 ) and
 (
   process.code_signature.trusted == false or process.code_signature.exists == false or
   process.name == "osascript" or
   process.parent.code_signature.trusted == false or process.parent.code_signature.exists == false
 ) and
 not process.executable == "/Library/Elastic/Endpoint/elastic-endpoint.app/Contents/MacOS/elastic-endpoint"
'''


