[metadata]
creation_date = "2026/08/07"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/08/07"

[rule]
author = ["clivoa"]
description = """
Identifies a command line database client (`sqlite3`, `duckdb`) querying a Chromium-based browser's
credential, cookie, or autofill database (`Login Data`, `Cookies`, `Cookies.binarycookies`,
`Web Data`). `sqlite3` ships with macOS and is Apple-signed, so an adversary can read credentials
and session cookies out of a browser profile without introducing an untrusted binary. This rule
keys on the database being queried rather than on the trust level of the process querying it.
"""
false_positives = [
    """
    Backup, migration, forensics, and browser profile inspection tooling may query these same
    database files directly through `sqlite3` or `duckdb`. Investigate whether the process, its
    parent, and the queried profile path are expected for this host before escalation.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process*"]
language = "eql"
license = "Elastic License v2"
name = "Browser Credential Database Query via Database CLI Utility"
note = """## Triage and analysis

### Investigating Browser Credential Database Query via Database CLI Utility

This rule flags a database CLI tool (`sqlite3`, `duckdb`) with a browser credential/cookie database
name (`Login Data`, `Cookies`, `Cookies.binarycookies`, `Web Data`) on its command line. Because
these are real, Apple-signed, trusted system tools, this technique bypasses any detection keyed
solely on code-signing trust.

### Possible investigation steps

- Review the full `process.command_line` for the exact SQL query executed — a `SELECT` against
  `logins`/`cookies`/`autofill`-shaped tables (e.g. `username_value`, `password_value`, `host_key`)
  is a strong indicator of real credential/cookie extraction versus incidental access.
- Check `process.parent.name`/`process.parent.command_line` for the invoking context — an
  interactive Terminal session versus a remote SSH session versus a script/automation tool.
- Correlate with subsequent network activity or file staging/compression from the same process
  tree — credential extraction is typically followed by exfiltration.
- Check whether the browser application itself was running at the time (Chrome locks its own
  SQLite databases while running in some configurations; access while the browser is closed can be
  a meaningful signal on its own).

### False positive analysis

- A database migration, backup, or browser-forensics tool that legitimately queries these exact
  files will match. Verify the tool and add a process-identity exception if it is expected to run
  routinely in your environment.
- An administrator or developer inspecting their own browser profile from a terminal will also
  match. Confirm the session and the user's intent.

### Response and remediation

- If confirmed malicious, treat as a credential/cookie compromise: rotate any credentials stored in
  the affected browser profile, and force session invalidation for any accounts with active cookies
  in the queried database.
- Consider whether the same technique could be used against other trusted database CLIs
  (`duckdb`, or a scripting language's built-in SQLite bindings) not covered by this rule's
  `process.name` list.
"""
references = [
    "https://www.sqlite.org/cli.html",
    "https://www.microsoft.com/en-us/security/blog/2026/02/02/infostealers-without-borders-macos-python-stealers-and-platform-abuse/",
    "https://www.sophos.com/en-us/blog/why-amos-matters-the-macos-malware-stealing-data-at-scale",
]
risk_score = 73
rule_id = "c94e9b30-1910-45a0-a930-622937231c32"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where event.action == "exec" and host.os.type == "macos" and process.name in~ ("sqlite3", "duckdb") and
 process.command_line like~ ("*Login Data*", "*/Cookies*", "*Cookies.binarycookies*", "*Web Data*")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1555"
name = "Credentials from Password Stores"
reference = "https://attack.mitre.org/techniques/T1555/"
[[rule.threat.technique.subtechnique]]
id = "T1555.003"
name = "Credentials from Web Browsers"
reference = "https://attack.mitre.org/techniques/T1555/003/"

[[rule.threat.technique]]
id = "T1539"
name = "Steal Web Session Cookie"
reference = "https://attack.mitre.org/techniques/T1539/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
