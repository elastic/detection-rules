[metadata]
creation_date = "2026/08/07"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/08/07"

[rule]
author = ["clivoa"]
description = """
This rule detects a database CLI tool (`sqlite3`, `duckdb`) directly querying a Chromium-based
browser's credential/cookie SQLite database (`Login Data`, `Cookies`, `Cookies.binarycookies`, `Web
Data`). `sqlite3` is a real, Apple-signed, trusted macOS system binary present by default on every
Mac — an attacker can use it to `SELECT` credentials, cookies, or autofill data directly out of a
browser profile's SQLite storage, entirely bypassing code-signing-based detections (both this
project's own `credential_access_untrusted_process_cryptocurrency_wallet_access.toml` and Elastic's
existing `credential_access_suspicious_web_browser_sensitive_file_access.toml` key off
`process.code_signature.trusted`/`exists`, and a trusted `sqlite3` process satisfies neither). This
was found during real testing (not a theoretical concern): a real `sqlite3` query against a real
Chrome `Login Data` database, and a second real query against `Cookies`, both real Apple-signed,
`code_signature.trusted == true` events. The real discriminator here is *what* is being queried, not
*who* is querying it.
"""
false_positives = [
    """
    Real testing found a legitimate, unrelated `sqlite3` invocation against an arbitrary local
    application database (e.g. `sqlite3 /tmp/myapp.db "SELECT * FROM notes;"`) does not match this
    rule -- confirmed via a live `_eql/search` against real captured telemetry showing the rule's
    path-based condition correctly excludes it. The false-positive surface that remains is any
    legitimate tool that also happens to invoke `sqlite3`/`duckdb` directly against one of the exact
    named browser database files (a database migration/backup tool, a forensics tool, or a browser
    profile inspector) -- none identified in this project's own testing, but plausible in a real
    environment and worth an exception if found.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process*"]
language = "eql"
license = "Elastic License v2"
name = "sqlite3 Query Against a Browser Credential Database"
note = """## Triage and analysis

### Investigating sqlite3 Query Against a Browser Credential Database

This rule flags a database CLI tool (`sqlite3`, `duckdb`) with a browser credential/cookie database
name (`Login Data`, `Cookies`, `Cookies.binarycookies`, `Web Data`) on its command line. Because
these are real, Apple-signed, trusted system tools, this technique bypasses any detection keyed
solely on code-signing trust.

### Possible investigation steps

- Review the full `process.command_line` for the exact SQL query executed — a `SELECT` against
  `logins`/`cookies`/`autofill`-shaped tables (e.g. `username_value`, `password_value`, `host_key`)
  is a strong indicator of real credential/cookie extraction versus incidental access.
- Check `process.parent.name`/`process.parent.command_line` for the invoking context — an
  interactive Terminal session versus a remote SSH session versus a script/automation tool.
- Correlate with subsequent network activity or file staging/compression from the same process
  tree — credential extraction is typically followed by exfiltration.
- Check whether the browser application itself was running at the time (Chrome locks its own
  SQLite databases while running in some configurations; access while the browser is closed can be
  a meaningful signal on its own).

### False positive analysis

- A legitimate, unrelated `sqlite3`/`duckdb` invocation against a different, non-browser-credential
  database will not match this rule — it keys specifically on the named browser database files, not
  on `sqlite3`/`duckdb` usage in general (validated with real testing, see `false_positives`).
- A database migration, backup, or browser-forensics tool that legitimately queries these exact
  files would be a real match; verify the tool and add a process-identity exception if it's expected
  to run routinely in your environment.

### Response and remediation

- If confirmed malicious, treat as a credential/cookie compromise: rotate any credentials stored in
  the affected browser profile, and force session invalidation for any accounts with active cookies
  in the queried database.
- Consider whether the same technique could be used against other trusted database CLIs
  (`duckdb`, or a scripting language's built-in SQLite bindings) not covered by this rule's
  `process.name` list.
"""
references = ["https://www.sqlite.org/cli.html"]
risk_score = 73
rule_id = "c94e9b30-1910-45a0-a930-622937231c32"
setup = """## Setup

This rule requires data coming in from Elastic Defend.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a macOS System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, for MacOS it is recommended to select "Traditional Endpoints".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/current/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where event.action == "exec" and host.os.type == "macos" and process.name in~ ("sqlite3", "duckdb") and
 process.command_line like~ ("*Login Data*", "*/Cookies*", "*Cookies.binarycookies*", "*Web Data*")
'''


