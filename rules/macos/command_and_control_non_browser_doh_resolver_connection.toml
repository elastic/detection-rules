[metadata]
creation_date = "2026/08/05"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/08/08"

[rule]
author = ["clivoa"]
description = """
Identifies a non-browser process on macOS opening a direct TLS connection to the IP address of a well known
public DNS-over-HTTPS (DoH) resolver (Cloudflare, Google, Quad9). DoH carries DNS queries inside ordinary HTTPS,
so a process using one of these resolvers as a command and control or tunneling channel does not appear in
port 53 DNS monitoring. The endpoint network event records the connection, not its contents, so a match
indicates a connection to a DoH endpoint rather than confirmed DoH traffic.
"""
false_positives = [
    """
    Non-browser system components and CLI tools (`curl`, package managers, some VPN clients) may support DoH
    natively or resolve via a system-wide DoH-enabled resolver. Investigate whether the process and its
    configuration are common or approved before escalation.
    """,
    """
    Chromium-family browsers other than Google Chrome (Brave, Edge, Arc, Vivaldi) are not covered by the
    exclusion and will match when they use DoH. Add their signing identifier and installation path if they are
    deployed in your environment.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.network*"]
language = "eql"
license = "Elastic License v2"
name = "Potential Non-Browser Process Connection to a DNS-over-HTTPS Resolver"
references = [
    "https://attack.mitre.org/techniques/T1071/004/",
    "https://blog.netlab.360.com/an-analysis-of-godlua-backdoor-en/",
    "https://github.com/SpiderLabs/DoHC2",
]
risk_score = 21
rule_id = "238232f5-d181-4380-8239-bf76dcbf64d1"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
network where host.os.type == "macos" and event.action == "connection_attempted" and event.type == "start" and
  destination.port == 443 and
  cidrMatch(destination.ip, "1.1.1.1/32", "1.0.0.1/32", "8.8.8.8/32", "8.8.4.4/32", "9.9.9.9/32", "149.112.112.112/32") and
  not (
    process.code_signature.trusted == true and
    (
      (process.code_signature.signing_id == "com.apple.WebKit.Networking" and
       process.executable like "*/System/Library/Frameworks/WebKit.framework/*/XPCServices/com.apple.WebKit.Networking.xpc/Contents/MacOS/com.apple.WebKit.Networking") or
      (process.code_signature.signing_id == "com.google.Chrome.helper" and
       process.executable like "/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/Versions/*/Helpers/Google Chrome Helper.app/Contents/MacOS/Google Chrome Helper") or
      (process.code_signature.signing_id == "org.mozilla.firefox" and
       process.executable == "/Applications/Firefox.app/Contents/MacOS/firefox")
    )
  )
'''

[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1071"
name = "Application Layer Protocol"
reference = "https://attack.mitre.org/techniques/T1071/"
[[rule.threat.technique.subtechnique]]
id = "T1071.004"
name = "DNS"
reference = "https://attack.mitre.org/techniques/T1071/004/"

[[rule.threat.technique]]
id = "T1572"
name = "Protocol Tunneling"
reference = "https://attack.mitre.org/techniques/T1572/"

[rule.threat.tactic]
id = "TA0011"
name = "Command and Control"
reference = "https://attack.mitre.org/tactics/TA0011/"
