[metadata]
creation_date = "2026/10/06"
integration = ["openai_chatgpt_enterprise"]
maturity = "production"
updated_date = "2026/10/06"

[rule]
author = ["Elastic"]
description = """
Detects ChatGPT Enterprise Codex MCP tool calls (`app_mcp_call`). Codex MCP invocations can query external systems
(for example issue trackers) and pull organizational data into an agent session.
"""
false_positives = [
    "Approved Codex workflows call MCP connectors as part of normal engineering automation.",
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "OpenAI ChatGPT Enterprise Codex MCP Tool Call"
note = """
## Triage and analysis

### Investigating OpenAI ChatGPT Enterprise Codex MCP Tool Call

Codex invoked an MCP tool. Confirm connector approval and inspect tool arguments for sensitive queries.

### Response and remediation

- Disable unauthorized connectors and review data returned into the Codex session.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise",
    "https://github.com/elastic/integrations/issues/20898",
    "https://github.com/elastic/integrations/tree/main/packages/openai_chatgpt_enterprise",
]
risk_score = 47
rule_id = "2b284f6d-5307-4f42-968a-0769005c740e"
setup = """
## Setup

Requires the OpenAI ChatGPT Enterprise integration collecting compliance logs into Elasticsearch.

https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise
"""
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: OpenAI",
    "Data Source: OpenAI ChatGPT Enterprise",
    "Service: OpenAI ChatGPT Enterprise",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Collection",
    "Tactic: Command and Control",
    "Mitre Atlas: AML.T0081",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-openai_chatgpt_enterprise.codex_log-* metadata _id, _version, _index
| where
    data_stream.dataset == "openai_chatgpt_enterprise.codex_log" and
    event.action == "app_mcp_call"
| keep
    _id, _version, _index, @timestamp, event.action, user.id, user.email,
    openai_chatgpt_enterprise.codex_log.client_id,
    openai_chatgpt_enterprise.codex_log.event_details.call_id,
    openai_chatgpt_enterprise.codex_log.event_details.tool_meta.connector_id,
    openai_chatgpt_enterprise.codex_log.event_details.tool_meta.resource_id,
    gen_ai.tool.name, gen_ai.tool.call.id, data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1213"
name = "Data from Information Repositories"
reference = "https://attack.mitre.org/techniques/T1213/"


[rule.threat.tactic]
id = "TA0009"
name = "Collection"
reference = "https://attack.mitre.org/tactics/TA0009/"

[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0081"
name = "Modify AI Agent Configuration"
reference = "https://atlas.mitre.org/techniques/AML.T0081/"


[rule.threat_mappings.threat.tactic]
id = "AML.TA0009"
name = "Collection"
reference = "https://atlas.mitre.org/tactics/AML.TA0009/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "user.id",
    "gen_ai.tool.name",
    "openai_chatgpt_enterprise.codex_log.event_details.tool_meta.connector_id",
    "openai_chatgpt_enterprise.codex_log.event_details.tool_meta.resource_id",
    "openai_chatgpt_enterprise.codex_log.client_id",
]

