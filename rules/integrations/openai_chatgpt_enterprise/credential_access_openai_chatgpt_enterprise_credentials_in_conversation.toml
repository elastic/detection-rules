[metadata]
creation_date = "2026/10/06"
integration = ["openai_chatgpt_enterprise"]
maturity = "production"
updated_date = "2026/10/06"

[rule]
author = ["Elastic"]
description = """
Detects ChatGPT Enterprise conversation messages whose text matches known credential patterns (cloud keys, GitHub
tokens, private keys, Slack tokens, Stripe keys, API keys, or password assignments). Secrets pasted into chats can
be retained in compliance logs and model context.
"""
false_positives = [
    "Documentation and unit-test examples that paste placeholder keys can match token patterns.",
    "Security researchers validating DLP or prompt-security controls may intentionally submit synthetic secrets.",
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "OpenAI ChatGPT Enterprise Conversation Message Containing Credentials"
note = """
## Triage and analysis

### Investigating OpenAI ChatGPT Enterprise Conversation Message Containing Credentials

A conversation message matched a credential regex. Confirm whether the value is live before rotating it.

#### Possible investigation steps

- Read `message` and decide if the match is a live secret, example key, or incidental text.
- Identify the user and conversation, then look for shares, downloads, or Codex tool use nearby.

### Response and remediation

- Rotate live credentials and remove residual copies from shared conversations where possible.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise",
    "https://github.com/elastic/integrations/issues/20898",
    "https://github.com/elastic/integrations/tree/main/packages/openai_chatgpt_enterprise",
]
risk_score = 73
rule_id = "231c2ade-69c8-4415-b710-0c56f5f07e95"
setup = """
## Setup

Requires the OpenAI ChatGPT Enterprise integration collecting compliance logs into Elasticsearch.

https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise
"""
severity = "high"
tags = [
    "Domain: GenAI",
    "Platform: OpenAI",
    "Data Source: OpenAI ChatGPT Enterprise",
    "Service: OpenAI ChatGPT Enterprise",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Credential Access",
    "Mitre Atlas: AML.T0055",
    "Mitre Atlas: AML.T0057",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-openai_chatgpt_enterprise.conversation_message-* metadata _id, _version, _index
| eval Esql.message_text = coalesce(message, "")
| where
    data_stream.dataset == "openai_chatgpt_enterprise.conversation_message" and
    Esql.message_text is not null and
    Esql.message_text != "" and
    (
        Esql.message_text rlike ".*(AKIA|ASIA)[A-Z0-9]{16}.*" or
        Esql.message_text rlike ".*gh[pousr]_[A-Za-z0-9]{36}.*" or
        Esql.message_text rlike ".*github_pat_[A-Za-z0-9_]+.*" or
        Esql.message_text rlike ".*-----BEGIN [A-Z ]*PRIVATE KEY-----.*" or
        Esql.message_text rlike ".*xox[baprs]-[0-9]+-[0-9]+-[A-Za-z0-9]+.*" or
        Esql.message_text rlike ".*sk_live_[A-Za-z0-9]+.*" or
        Esql.message_text rlike ".*AIza[-A-Za-z0-9_]+.*" or
        Esql.message_text rlike ".*npm_[A-Za-z0-9]+.*" or
        Esql.message_text rlike ".*sk-[A-Za-z0-9]{20,}.*" or
        Esql.message_text rlike ".*(?i)(password|passwd|pwd)\\s*[=:]\\s*\\S+.*"
    )
| keep
    _id, _version, _index, @timestamp, message, user.id, user.email,
    openai_chatgpt_enterprise.conversation_message.conversation.id,
    openai_chatgpt_enterprise.conversation_message.conversation.title,
    openai_chatgpt_enterprise.conversation_message.message.author.type,
    openai_chatgpt_enterprise.conversation_message.message.id,
    data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.001"
name = "Credentials In Files"
reference = "https://attack.mitre.org/techniques/T1552/001/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0055"
name = "LLM Data Leakage"
reference = "https://atlas.mitre.org/techniques/AML.T0055/"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0057"
name = "LLM Jailbreak"
reference = "https://atlas.mitre.org/techniques/AML.T0057/"


[rule.threat_mappings.threat.tactic]
id = "AML.TA0009"
name = "Exfiltration"
reference = "https://atlas.mitre.org/tactics/AML.TA0009/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "user.id",
    "user.email",
    "message",
    "openai_chatgpt_enterprise.conversation_message.conversation.id",
    "openai_chatgpt_enterprise.conversation_message.conversation.title",
]

