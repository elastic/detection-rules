[metadata]
creation_date = "2026/10/06"
integration = ["openai_chatgpt_enterprise"]
maturity = "production"
updated_date = "2026/10/06"

[rule]
author = ["Elastic"]
description = """
Detects ChatGPT Enterprise Codex security-log events that create or update a repository scan configuration. Changing
scan scope, lookback, or notification rules can weaken secrets scanning coverage or redirect findings.
"""
false_positives = [
    "Security engineering teams legitimately onboard repositories and tune scan lookback windows.",
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "OpenAI ChatGPT Enterprise Codex Security Scan Configuration Changed"
note = """
## Triage and analysis

### Investigating OpenAI ChatGPT Enterprise Codex Security Scan Configuration Changed

A Codex security scan configuration changed. Validate repository ownership and notification-rule deltas.

### Response and remediation

- Revert unauthorized scan configuration changes and review related findings / proposed PRs.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise",
    "https://github.com/elastic/integrations/issues/20898",
    "https://github.com/elastic/integrations/tree/main/packages/openai_chatgpt_enterprise",
]
risk_score = 47
rule_id = "6c634405-3880-4354-8fea-925ec7eadd9b"
setup = """
## Setup

Requires the OpenAI ChatGPT Enterprise integration collecting compliance logs into Elasticsearch.

https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise
"""
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: OpenAI",
    "Data Source: OpenAI ChatGPT Enterprise",
    "Service: OpenAI ChatGPT Enterprise",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Impact",
    "Tactic: Defense Evasion",
    "Mitre Atlas: AML.T0081",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-openai_chatgpt_enterprise.codex_security_log-* metadata _id, _version, _index
| where
    data_stream.dataset == "openai_chatgpt_enterprise.codex_security_log" and
    event.action in ("scan_configuration_created", "scan_configuration_updated")
| keep
    _id, _version, _index, @timestamp, event.action, user.id, user.email,
    openai_chatgpt_enterprise.codex_security_log.client_id,
    openai_chatgpt_enterprise.codex_security_log.workspace_id,
    openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_id,
    openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_fields.repo_url,
    openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_fields.scan_type,
    openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_fields.state,
    openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_fields.lookback_days,
    data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"
[[rule.threat.technique.subtechnique]]
id = "T1562.001"
name = "Disable or Modify Tools"
reference = "https://attack.mitre.org/techniques/T1562/001/"


[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0081"
name = "Modify AI Agent Configuration"
reference = "https://atlas.mitre.org/techniques/AML.T0081/"


[rule.threat_mappings.threat.tactic]
id = "AML.TA0007"
name = "Defense Evasion"
reference = "https://atlas.mitre.org/tactics/AML.TA0007/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "user.id",
    "openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_fields.repo_url",
    "openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_fields.scan_type",
    "openai_chatgpt_enterprise.codex_security_log.event_details.scan_configuration_fields.state",
]

