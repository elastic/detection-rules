[metadata]
creation_date = "2026/10/06"
integration = ["openai_chatgpt_enterprise"]
maturity = "production"
updated_date = "2026/10/06"

[rule]
author = ["Elastic"]
description = """
Detects ChatGPT Enterprise audit events that delete stored memory. Adversaries may delete memory entries to remove
evidence of prior prompts, preferences, or staging instructions after misuse.
"""
false_positives = [
    "Users delete memories during privacy cleanup or troubleshooting.",
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "OpenAI ChatGPT Enterprise Memory Deleted"
note = """
## Triage and analysis

### Investigating OpenAI ChatGPT Enterprise Memory Deleted

A memory entry was deleted. Correlate with unusual chat activity or prior credential exposure.

### Response and remediation

- Preserve remaining audit history and investigate the actor's recent conversations.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise",
    "https://github.com/elastic/integrations/issues/20898",
    "https://github.com/elastic/integrations/tree/main/packages/openai_chatgpt_enterprise",
]
risk_score = 21
rule_id = "c54f19db-fdea-4d32-9cc0-8f8b6016416e"
setup = """
## Setup

Requires the OpenAI ChatGPT Enterprise integration collecting compliance logs into Elasticsearch.

https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise
"""
severity = "low"
tags = [
    "Domain: GenAI",
    "Platform: OpenAI",
    "Data Source: OpenAI ChatGPT Enterprise",
    "Service: OpenAI ChatGPT Enterprise",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Defense Evasion",
    "Mitre Atlas: AML.T0092",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-openai_chatgpt_enterprise.audit_log-* metadata _id, _version, _index
| where
    data_stream.dataset == "openai_chatgpt_enterprise.audit_log" and
    event.action == "delete_memory"
| keep
    _id, _version, _index, @timestamp, event.action, user.id, user.email, source.ip,
    openai_chatgpt_enterprise.audit_log.action_data.memory_id,
    openai_chatgpt_enterprise.audit_log.action_data.auth_user_id,
    openai_chatgpt_enterprise.audit_log.action_privilege, data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1070"
name = "Indicator Removal"
reference = "https://attack.mitre.org/techniques/T1070/"


[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0092"
name = "Manipulate User LLM Chat History"
reference = "https://atlas.mitre.org/techniques/AML.T0092/"


[rule.threat_mappings.threat.tactic]
id = "AML.TA0007"
name = "Defense Evasion"
reference = "https://atlas.mitre.org/tactics/AML.TA0007/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "user.id",
    "openai_chatgpt_enterprise.audit_log.action_data.memory_id",
    "source.ip",
]

