[metadata]
creation_date = "2026/10/09"
integration = ["openai_chatgpt_enterprise"]
maturity = "production"
min_stack_comments = "field_extract (flattened field support) is available starting in 9.5.0, as a Technical Preview function; GA in 9.6.0."
min_stack_version = "9.5.0"
updated_date = "2026/10/09"

[rule]
author = ["Elastic"]
description = """
Detects ChatGPT Enterprise Gmail connector activity that sends a message to a recipient. Adversaries who abuse a linked
Gmail connector after session compromise can exfiltrate data or perform lateral phishing by sending mail on behalf of
the user.
"""
false_positives = ["Users legitimately asking ChatGPT to draft or send mail through an approved Gmail connector."]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "OpenAI ChatGPT Enterprise Gmail Message Sent via Connector"
note = """## Triage and analysis

### Investigating OpenAI ChatGPT Enterprise Gmail Message Sent via Connector

ChatGPT used the linked Gmail connector to send mail. That can be legitimate assistance or abuse for exfiltration or
phishing after connector or session compromise.

Escalate when the recipient is unexpected, the subject or body looks like phishing or data staging, or nearby activity
shows sensitive Gmail or Drive discovery. Close as a false positive for approved send-on-behalf workflows.

#### Possible investigation steps

- Review `user.email`, `Esql.destination_email`, and `openai_chatgpt_enterprise.app_log.input` (subject and body when
  present).
- Correlate with nearby Gmail discovery searches, Google Drive downloads, or unusual authentication activity for the
  same user.
- Confirm whether Gmail connector use and outbound send are approved for that user.
- Check the recipient mailbox or message headers if the send reached an external address.

### False positive analysis

- Users who send calendar notes, status updates, or other approved outbound mail through the Gmail connector will match.

### Response and remediation

- Revoke Gmail connector access if unauthorized, review sent mail, and treat exposed content per your data-incident
  process.
- Hunt for additional sends, sensitive Gmail searches, or Drive downloads from the same user in the surrounding window.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise",
    "https://platform.openai.com/docs/compliance",
]
risk_score = 47
rule_id = "7184e35d-5605-4283-badf-435e1974e488"
setup = """## Setup

This rule requires the OpenAI ChatGPT Enterprise integration to collect `app_log` events for the Gmail app
(`app_type: SERVICE`) with flattened `openai_chatgpt_enterprise.app_log.input` fields, including `to`.

https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise
"""
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: OpenAI",
    "Data Source: OpenAI ChatGPT Enterprise",
    "Service: OpenAI ChatGPT Enterprise",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Exfiltration",
    "Tactic: Lateral Movement",
    "Mitre Atlas: AML.T0053",
    "Mitre Atlas: AML.T0025",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-openai_chatgpt_enterprise.app_log-* metadata _id, _version, _index
| where
    data_stream.dataset == "openai_chatgpt_enterprise.app_log" and
    openai_chatgpt_enterprise.app_log.app_name == "Gmail" and
    openai_chatgpt_enterprise.app_log.app_type == "SERVICE" and
    openai_chatgpt_enterprise.app_log.input is not null
| eval Esql.destination_email = field_extract(openai_chatgpt_enterprise.app_log.input, "to")
| where Esql.destination_email is not null
| keep
    _id, _version, _index, @timestamp, user.id, user.email,
    Esql.destination_email,
    openai_chatgpt_enterprise.app_log.app_name,
    openai_chatgpt_enterprise.app_log.app_type,
    openai_chatgpt_enterprise.app_log.input,
    data_stream.*
'''


