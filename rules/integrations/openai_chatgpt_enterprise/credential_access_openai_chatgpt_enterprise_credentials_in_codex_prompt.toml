[metadata]
creation_date = "2026/10/06"
integration = ["openai_chatgpt_enterprise"]
maturity = "production"
updated_date = "2026/10/06"

[rule]
author = ["Elastic"]
description = """
Detects ChatGPT Enterprise Codex prompt or response text that matches known credential patterns. Secrets pasted into
Codex sessions can be retained in compliance logs and may be reused by agent tool calls.
"""
false_positives = [
    "Developers may paste example keys while debugging or documenting integrations.",
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "OpenAI ChatGPT Enterprise Codex Prompt Containing Credentials"
note = """
## Triage and analysis

### Investigating OpenAI ChatGPT Enterprise Codex Prompt Containing Credentials

A Codex prompt/response matched a credential regex. Confirm the value is live and whether tool calls ran afterward.

### Response and remediation

- Rotate live credentials and review Codex tool activity in the same session.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise",
    "https://github.com/elastic/integrations/issues/20898",
    "https://github.com/elastic/integrations/tree/main/packages/openai_chatgpt_enterprise",
]
risk_score = 73
rule_id = "de41effc-9966-4cae-a5bb-2773bf7f641f"
setup = """
## Setup

Requires the OpenAI ChatGPT Enterprise integration collecting compliance logs into Elasticsearch.

https://www.elastic.co/docs/reference/integrations/openai_chatgpt_enterprise
"""
severity = "high"
tags = [
    "Domain: GenAI",
    "Platform: OpenAI",
    "Data Source: OpenAI ChatGPT Enterprise",
    "Service: OpenAI ChatGPT Enterprise",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Credential Access",
    "Mitre Atlas: AML.T0055",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-openai_chatgpt_enterprise.codex_log-* metadata _id, _version, _index
| eval Esql.message_text = coalesce(
        openai_chatgpt_enterprise.codex_log.event_details.prompt_text,
        openai_chatgpt_enterprise.codex_log.event_details.response_text,
        ""
    )
| where
    data_stream.dataset == "openai_chatgpt_enterprise.codex_log" and
    event.action == "prompt_response_received" and
    Esql.message_text is not null and
    Esql.message_text != "" and
    (
        Esql.message_text rlike ".*(AKIA|ASIA)[A-Z0-9]{16}.*" or
        Esql.message_text rlike ".*gh[pousr]_[A-Za-z0-9]{36}.*" or
        Esql.message_text rlike ".*github_pat_[A-Za-z0-9_]+.*" or
        Esql.message_text rlike ".*-----BEGIN [A-Z ]*PRIVATE KEY-----.*" or
        Esql.message_text rlike ".*xox[baprs]-[0-9]+-[0-9]+-[A-Za-z0-9]+.*" or
        Esql.message_text rlike ".*sk_live_[A-Za-z0-9]+.*" or
        Esql.message_text rlike ".*AIza[-A-Za-z0-9_]+.*" or
        Esql.message_text rlike ".*npm_[A-Za-z0-9]+.*" or
        Esql.message_text rlike ".*sk-[A-Za-z0-9]{20,}.*" or
        Esql.message_text rlike ".*(?i)(password|passwd|pwd)\\s*[=:]\\s*\\S+.*"
    )
| keep
    _id, _version, _index, @timestamp, event.action, user.id, user.email,
    openai_chatgpt_enterprise.codex_log.client_id,
    openai_chatgpt_enterprise.codex_log.event_details.session_id,
    openai_chatgpt_enterprise.codex_log.event_details.prompt_text,
    openai_chatgpt_enterprise.codex_log.event_details.response_text,
    gen_ai.request.model, data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0055"
name = "LLM Data Leakage"
reference = "https://atlas.mitre.org/techniques/AML.T0055/"


[rule.threat_mappings.threat.tactic]
id = "AML.TA0009"
name = "Exfiltration"
reference = "https://atlas.mitre.org/tactics/AML.TA0009/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "user.id",
    "user.email",
    "openai_chatgpt_enterprise.codex_log.event_details.session_id",
    "openai_chatgpt_enterprise.codex_log.event_details.prompt_text",
    "openai_chatgpt_enterprise.codex_log.client_id",
]

