[metadata]
creation_date = "2026/10/23"
integration = ["security_ai", "aws_bedrock"]
maturity = "production"
min_stack_comments = "Detection rules for the security_ai integration package are supported in v9.6.0 and above"
min_stack_version = "9.6.0"
updated_date = "2026/11/02"

[rule]
anomaly_threshold = 1
author = ["Elastic"]
description = """
A machine learning job has detected that an Amazon Bedrock model requested a tool that is rare for a caller, compared
with that caller's own history. A model that suddenly selects an unfamiliar tool can indicate that an AI agent was redirected
toward an unexpected capability, for example through prompt injection or unsafe delegation (OWASP ASI02, Tool Misuse and
Exploitation). The tool name is a requested operation in the model output, not a confirmed tool execution.
"""
false_positives = [
    """
    A newly deployed or newly enabled tool is rare by definition until it has been used regularly. Confirm any recent change to the agent's tool set.
    """,
    """
    Seasonal or rarely used legitimate tools, such as monthly reporting or maintenance tools, can appear unusual when they are used.
    """,
]
from = "now-3h"
interval = "15m"
license = "Elastic License v2"
machine_learning_job_id = "security_ai_bedrock_asi02_rare_tool"
name = "AWS Bedrock Unusual Tool Selection"
note = """
## Triage and Analysis

### Investigating AWS Bedrock Unusual Tool Selection

This alert means that a tool name in the model output was rare for the caller. The ML job uses the `rare` function by `tool_name`, partitioned by `user.id`, on a datafeed that aggregates each requested tool name separately per one-hour bucket.

### Limitations

- The anomaly threshold is an ML record score from 0 to 100, not a tool-request count. It is set to 1 to keep recall as high as possible, because alerts were validated on a small synthetic workload from a single caller.
- Baselines are per caller (`user.id`). For AWS ARNs, the account ID is part of the identifier. This assumes the integration reports a stable `user.id`, with the session name removed for assumed roles. Until it does, each role session gets its own baseline. Every runtime or agent that shares a role or IAM user shares one baseline. Bedrock invocation events carry no runtime ARN, so per-agent detection is not possible with this telemetry.
- The values are tool requests generated by the model, not confirmed tool executions. An alert does not establish malicious intent or an authorization violation.
- Machine learning learns repeated anomalies, so scores fade when the same behavior recurs. Persistent known-bad cases need a deterministic rule.
- Misuse of a familiar tool with harmful arguments at normal volume and batch size can evade this detection.

### Possible investigation steps

- Open the anomaly in Anomaly Explorer for job `security_ai_bedrock_asi02_rare_tool` and note the unusual `tool_name` and the `user.id` partition.
- Search `logs-aws_bedrock.invocation-*` for responses where `gen_ai.output.messages.content.toolUse.name` equals the unusual tool in the bucket time range. Use `aws_bedrock.invocation.request_id` to pivot to the full record.
- Identify the caller from `user.id` and `cloud.account.id`, and confirm whether the tool is part of the agent's configured tool set.
- Determine what the tool can do (read, write, delete, send, or execute) and what data or systems it can reach.
- Review the input messages and the `security_ai` results on the same document, such as instruction-override, encoding, or refusal detections, for signs of prompt injection.
- Check CloudTrail and the tool or API logs of the agent to determine whether the tool was executed.

### False positive analysis

- A newly released tool or a changed agent configuration makes a tool appear unusual. After confirming the change, no action is needed, and the model learns the tool as normal over time.
- Rarely used maintenance or reporting tools can alert whenever they run. Consider a scoped exception if the use is routine.

### Response and remediation

- If the tool selection is unexpected, restrict the tool or the agent's permissions, and review the conversation that led to it.
- Treat the source of the prompt as untrusted if prompt injection is suspected, and block or sanitize it.
- If the tool was executed, assess the impact on the data and systems it can reach, and rotate any exposed credentials.
- Maintain an allowlist or denylist as a deterministic rule for tools that must never be used. ML rarity is not a reliable control for known-bad tools.
"""
references = [
    "https://genai.owasp.org/",
    "https://docs.elastic.co/en/integrations/aws_bedrock",
]
risk_score = 47
rule_id = "2aad4e1b-85d9-4200-ab3d-949675fdc183"
setup = """
## Setup

This rule requires the Security for AI integration assets, the Amazon Bedrock integration, and AWS Bedrock model invocation logs.

### Prerequisite Requirements
- Install the Amazon Bedrock integration and collect the `invocation` data stream (`logs-aws_bedrock.invocation-*`). The `runtime` and `guardrails` data streams are not used.
- Enable AWS Bedrock model invocation logging, delivered to S3 or CloudWatch Logs, with credentials for the Elastic Agent that can read that destination.
- Confirm the tool-use fields are indexed: `gen_ai.output.messages.content.toolUse.toolUseId`, `gen_ai.output.messages.content.toolUse.name`, `gen_ai.output.messages.role`, `gen_ai.response.finish_reasons`, `user.id`, `aws_bedrock.invocation.request_id`, and `cloud.account.id`. Only successful `Converse` and `ConverseStream` invocations are analyzed.

### Anomaly Detection Setup
- Install the Security for AI integration, then install its Kibana assets. This loads the `security_ai-ml` machine learning module.
- Create the `security_ai_bedrock_asi02_rare_tool` anomaly detection job from that module, or enable this rule so that the job is started for you. The job and its datafeed read the index pattern you select when you create the job (`logs-aws_bedrock.invocation-*`) directly, and the datafeed derives `user.id` and the tool-request metrics at search time. No transform or extra index is required.
- Anomaly detection learns each caller's normal behavior from its own telemetry, so the job needs time to learn before its results are reliable.
- For more details, refer to the [anomaly detection documentation](https://www.elastic.co/guide/en/kibana/current/xpack-ml-anomalies.html).
"""
severity = "medium"
tags = [
    "Domain: GenAI",
    "Data Source: AWS Bedrock",
    "Platform: AWS",
    "Service: AWS Bedrock",
    "Use Case: Security for AI",
    "Rule Type: Machine Learning",
    "Rule Type: ML",
    "Resources: Investigation Guide",
    "Tactic: Execution",
    "Mitre Atlas: AML.T0053",
]
type = "machine_learning"

