[metadata]
creation_date = "2026/08/19"
integration = ["security_ai", "aws_bedrock"]
maturity = "production"
min_stack_comments = "Detection rules for security_ai integration package."
min_stack_version = "9.6.0"
updated_date = "2026/11/02"

[rule]
author = ["Elastic"]
description = """
Detects known credential formats — AWS access key IDs, LLM vendor API keys, GitHub
personal access tokens, SSH/PEM private key headers, JWTs, and similar — appearing
in GenAI prompt or completion text, or in strings flagged by the security_ai
ML model as encoded payloads.

Credentials in the model input mean an application or user is sending secrets to the
model, exposing them to invocation logging, the model provider, and prompt history.
Credentials in the model output or in ML-extracted encoded blobs indicate either
training-data leakage, a poisoned context window, or a prompt-injection-driven
exfiltration attempt. Either case warrants immediate credential rotation.
"""
false_positives = [
    """
    Prompts or completions that reference example or documentation keys (for example
    the AWS sample access key ending in EXAMPLE) match the access-key pattern.
    Review the matched value in gen_ai.input.messages, gen_ai.output.messages, or
    security_ai.*.strings and confirm whether it is a live credential
    before responding.
    """,
    """
    JWTs used as legitimate authentication tokens passed to the model for parsing,
    validation, or debugging. Inspect the prompt context to confirm whether the
    token was intentionally shared for a benign purpose.
    """,
]
from = "now-60m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "GenAI Prompt Contains Leaked Credential"
note = """
## Triage and Analysis

### Investigating GenAI Prompt Contains Leaked Credential

This rule fires when a recognized credential format appears in a GenAI invocation's
prompt, completion, or in strings extracted by the security_ai ML model.
Credential exposure via LLM invocation logs is a high-impact event: logs may be
retained by the cloud provider, ingested into SIEM, or replayed in future training runs.

### Possible investigation steps

- Identify the matched credential format from `security_ai.encoding.input_messages.strings`,
  `security_ai.encoding.output_messages.strings`, `security_ai.hash_string.input_messages.strings`,
  `security_ai.hash_string.output_messages.strings`, `gen_ai.input.messages`, or `gen_ai.output.messages`.
  Common format signals:
  - `AKIA`/`ASIA` prefix (20 chars) → AWS long-term or STS access key ID
  - `sk-ant-api03-` → Anthropic API key
  - `sk-proj-` / `sk-` (48+ chars) → OpenAI API key
  - `AIza` → Google API key
  - `ghp_`/`gho_`/`ghu_`/`ghs_` → GitHub personal/OAuth/user/server access token
  - `github_pat_` → GitHub fine-grained personal access token
  - `glpat-` → GitLab personal access token
  - `sk_live_` → Stripe live secret key
  - `hf_` → HuggingFace access token
  - `xox[baprs]-` → Slack bot/app/personal/incoming-webhook/refresh token
  - Three dot-separated base64url segments starting with `eyJ` → JWT
  - `-----BEGIN ... PRIVATE KEY-----` → SSH, RSA, EC, or PKCS8 private key

- Check `gen_ai.input.messages` and `gen_ai.output.messages` for the full conversation context.
  Determine whether the credential appeared in user input (exfiltration attempt or
  accidental exposure) or in the model's response (leakage or injection-driven retrieval).

- Identify the caller: `user.id`, `source.ip`, `user_agent.original`,
  `aws_bedrock.invocation.model_id`.

- If the credential appears in the ML-extracted strings (`security_ai.*.{input_messages,output_messages}.strings`),
  also check whether a co-occurring base64 rule alert fired. The base64 alert is
  suppressed when credentials are present, so if it did not fire, the credential was
  the only encoded content.

- Query CloudTrail or the relevant provider's audit logs for any use of the exposed
  credential within the alert window.

### False positive analysis

- AWS sample/documentation keys (ending in `EXAMPLE`) match the AKIA pattern.
  Confirm the value is real before escalating.
- JWTs passed deliberately for debugging are common. Check whether the model was
  being asked to validate, decode, or inspect the token.

### Response and remediation

- Rotate or revoke the exposed credential immediately, regardless of whether it
  appears to have been used.
- Identify the application or workflow that placed the credential in the prompt and
  remediate the root cause (secrets scanning, environment variable hygiene, guardrails).
- If the credential appears in the model's completion, assess whether this is a
  training-data leakage, a context-window injection, or a configuration error.
- Review the full invocation history for the affected user or application to identify
  any pattern of credential exposure.
"""
references = [
    "https://owasp.org/www-project-top-10-for-large-language-model-applications/",
    "https://www.beyondtrust.com/blog/entry/aws-bedrock-security-guide-api-keys-detection-response",
]
risk_score = 73
rule_id = "e3b1f8c4-7d2a-4e5b-9c1a-6f8d3b2e7a0c"
setup = """This rule requires the security_ai Fleet integration. Install the
integration and ensure that the ML model pipeline is enriching invocation events before
enabling this rule. The rule also scans gen_ai.input.messages and gen_ai.output.messages directly,
so it will partially function (message scanning only) even without the
ML pipeline enrichment."""
severity = "high"
tags = [
    "Domain: GenAI",
    "Use Case: Security for AI",
    "Tactic: Credential Access",
    "Mitre Atlas: AML.T0055",
    "Data Source: AWS Bedrock",
    "Platform: AWS",
    "Service: AWS Bedrock",
    "Rule Type: ES|QL",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
to = "now"
type = "esql"

query = '''
FROM logs-aws_bedrock.invocation-* METADATA _id, _version, _index
// gen_ai.*.messages are mapped as flattened, which RLIKE cannot read; TO_STRING returns their JSON text.
| EVAL Esql_priv.all_text = CONCAT(
    COALESCE(MV_CONCAT(TO_STRING(gen_ai.input.messages), "\n"), ""), "\n",
    COALESCE(MV_CONCAT(TO_STRING(gen_ai.output.messages), "\n"), ""), "\n",
    COALESCE(MV_CONCAT(security_ai.encoding.input_messages.strings, "\n"), ""), "\n",
    COALESCE(MV_CONCAT(security_ai.encoding.output_messages.strings, "\n"), ""), "\n",
    COALESCE(MV_CONCAT(security_ai.hash_string.input_messages.strings, "\n"), ""), "\n",
    COALESCE(MV_CONCAT(security_ai.hash_string.output_messages.strings, "\n"), ""))
// Credential formats are split across two RLIKEs because a single pattern with every format exceeds
// ES|QL's regex determinization limit. A key must not be glued to a preceding key character (or be
// preceded by a JSON-escaped \n, \r or \t); that also keeps the automaton small.
// Not lowercased: credential prefixes (AKIA, sk-, ghp_, etc.) are case-significant.
| WHERE Esql_priv.all_text RLIKE """(.*([^A-Za-z0-9_\-]|\\[nrt]))?((AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}|ABSK[A-Za-z0-9+/=]{20}|AIza[0-9A-Za-z_\-]{35}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|glpat-[A-Za-z0-9_\-]{20,}|sk-ant-api03-[A-Za-z0-9_\-]{80,}|sk-proj-[A-Za-z0-9_\-]{20,}).*"""
    OR Esql_priv.all_text RLIKE """(.*([^A-Za-z0-9_\-]|\\[nrt]))?(sk-[A-Za-z0-9]{48}|sk_live_[A-Za-z0-9]{24}|hf_[A-Za-z0-9]{34}|xox[baprs]-[A-Za-z0-9\-]{10,}|eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\..*|-----BEGIN [A-Z ]*PRIVATE KEY-----).*"""
| KEEP _id, _version, _index, @timestamp, gen_ai.*, security_ai.*, aws_bedrock.*, user.*, cloud.*, event.*
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

