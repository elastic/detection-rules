[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/12"

[rule]
author = ["Elastic"]
description = """
Starting an organization data export only signals intent. Accessing the export archive via its signed URL means the
actor actually downloaded chats, projects, user metadata, and configuration. An attacker with administrative access
can use this to exfiltrate intellectual property and credentials at scale.
"""
false_positives = [
    """
    Compliance, legal, and platform teams download organization data exports after scheduled audits, migrations, or
    litigation holds. Validate the actor and business justification before escalating.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Organization Data Export Accessed"
note = """## Triage and analysis

### Investigating Anthropic Organization Data Export Accessed

The export archive was accessed or downloaded, not just requested. Correlate with `org_data_export_started` and
`org_data_export_completed` for the same `organization.id` to reconstruct the full lifecycle.

#### Possible investigation steps

- Review `anthropic.audit.actor.type` and `organization.id`.
- If the actor is a `user_actor`, review `user.email`, `user.id`, `source.ip`, and `user_agent.original`.
- Look for preceding `org_data_export_started` and `org_data_export_completed` events. Flag downloads that happen
  outside an approved window or without a matching started event.
- Correlate with admin role grants, admin API key creation, compliance logging changes, or SSO modifications.
- Determine whether the exported data left approved storage or corporate networks.

### False positive analysis

- Planned audit or offboarding exports usually include a download step by authorized staff.

### Response and remediation

- If unauthorized, revoke administrative access for the actor and determine whether the archive left the organization.
"""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 73
rule_id = "00955b87-ed85-4977-8ab1-9140f85b9d6c"
severity = "high"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ESQL",
    "Tactic: Collection",
    "Tactic: Exfiltration",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "file" and
    event.action == "org_data_export_accessed"
| keep _id, _version, _index, @timestamp, event.*, organization.*, user.*, source.*, user_agent.*, anthropic.audit.*, data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1530"
name = "Data from Cloud Storage"
reference = "https://attack.mitre.org/techniques/T1530/"


[rule.threat.tactic]
id = "TA0009"
name = "Collection"
reference = "https://attack.mitre.org/tactics/TA0009/"

[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1567"
name = "Exfiltration Over Web Service"
reference = "https://attack.mitre.org/techniques/T1567/"


[rule.threat.tactic]
id = "TA0010"
name = "Exfiltration"
reference = "https://attack.mitre.org/tactics/TA0010/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "event.id",
    "organization.id",
    "anthropic.audit.actor.type",
    "user.email",
    "user.id",
    "source.ip",
    "user_agent.original",
]

