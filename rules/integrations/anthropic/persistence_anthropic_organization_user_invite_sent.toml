[metadata]
creation_date = "2026/09/16"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/16"

[rule]
author = ["Elastic"]
description = """
Sending an organization user invite creates a path for a new member to join the Anthropic tenant with a chosen role.
An adversary who compromises an administrator or admin API key can invite a mailbox they control and accept the invite
to gain durable access. Invites may target internal corporate addresses or external domains; this rule does not
distinguish them because invite events do not carry verified organization domains for reliable comparison.
"""
false_positives = [
    """
    IT administrators and hiring workflows routinely invite new members during onboarding, contractor access, or
    staffing changes. Verify the invited email, role, and that a hiring or access request exists when policy requires
    one.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Organization User Invite Sent"
note = """## Triage and analysis

### Investigating Anthropic Organization User Invite Sent

This rule matches successful `org_user_invite_sent` IAM events. The invited mailbox is in `user.target.email` (also
present in `related.user`). The role granted on acceptance is `anthropic.audit.invited_role` when present.

Invites can be internal or external relative to the organization's trusted domains. The audit event does not include
the organization's verified domain list, so this rule alerts on any successful invite and leaves domain judgment to
triage.

#### Possible investigation steps

- Review `user.target.email`, `related.user`, `anthropic.audit.invited_role`, and `anthropic.audit.invite_id`.
- If the actor is a `user_actor`, review `user.email`, `user.id`, `source.ip`, and `user_agent.original`.
- If the actor is an `admin_api_key_actor`, review `anthropic.audit.actor.admin_api_key_id`.
- Compare the invitee domain to known corporate domains for the tenant; treat unexpected external domains as higher
  priority.
- Search for `org_user_invite_accepted` for the same `anthropic.audit.invite_id` or invitee email.
- Look for nearby role grants, SSO changes, or admin API key creation from the same actor.

### False positive analysis

- Planned onboarding invites are expected. Confirm the invitee and role against HR or identity tickets.

### Response and remediation

- If unauthorized, delete or revoke the pending invite, review other IAM changes by the same actor, and rotate
  compromised admin credentials or API keys.
"""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 47
rule_id = "5fd313e8-c61c-4737-88f7-b452a2f25a3b"
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Persistence",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "iam" and
    event.action == "org_user_invite_sent" and
    event.outcome == "success"
| keep _id, _version, _index, @timestamp, event.*, organization.*, user.*, related.*, source.*, user_agent.*, anthropic.audit.*, data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1136"
name = "Create Account"
reference = "https://attack.mitre.org/techniques/T1136/"
[[rule.threat.technique.subtechnique]]
id = "T1136.003"
name = "Cloud Account"
reference = "https://attack.mitre.org/techniques/T1136/003/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "event.id",
    "event.outcome",
    "organization.id",
    "user.target.email",
    "related.user",
    "anthropic.audit.invited_role",
    "anthropic.audit.invite_id",
    "anthropic.audit.actor.type",
    "anthropic.audit.actor.admin_api_key_id",
    "user.email",
    "user.id",
    "source.ip",
    "user_agent.original",
]
