[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/15"

[rule]
author = ["Elastic"]
description = """
Detects at least five failed Anthropic magic link or SSO sign-in attempts for the same user email within one hour.
That pattern fits repeated guessing, stale magic link abuse, or automated login attempts against one account. Magic
link and SSO authentication failure events typically carry `user.email` but often omit `organization.id` and do not
populate `user.id`, so grouping and alert suppression use the email address and aggregated source IPs for triage.
"""
false_positives = [
    """
    A user repeatedly clicking an expired or invalid magic link from the same browser session can produce several
    failures before requesting a new link or signing in successfully.
    """,
    """
    IdP or SSO cutover testing against a pilot account can generate a short burst of failed attempts for one email
    during maintenance windows.
    """,
]
from = "now-60m"
interval = "15m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Multiple Authentication Failures"
note = """## Triage and analysis

### Investigating Anthropic Multiple Authentication Failures

This ES|QL rule fires when one `user.email` generates at least five `magic_link_login_failed` or `sso_login_failed`
events within a rolling one-hour window. Authentication failure payloads from the compliance activities API often omit
`organization.id` (the integration maps it when present) and do not set `user.id`, so pivot on `user.email`,
`source.ip`, and actor metadata rather than organization or user UUID fields. Aggregated `Esql.source_ip_count_distinct`
and `Esql.source_ip_values` show whether failures came from one client or many egress paths. Pair with successful login
events, SSO weakening, or magic link second factor changes when account takeover or spray against a known address is
suspected.

#### Possible investigation steps

- Review `user.email`, `Esql.event_count`, `Esql.event_action_values`, `Esql.source_ip_values`, and
  `Esql.source_ip_count_distinct`.
- When `Esql.source_ip_count_distinct` is low, failures likely reflect one device or egress path (typos, expired links,
  or focused guessing). Many distinct IPs for the same email can indicate distributed automation or proxy rotation.
- Inspect `Esql.user_agent_original_values` and `Esql.anthropic_audit_actor_type_values` for automation or unusual
  clients.
- Search for successful `magic_link_login_succeeded` or `sso_login_succeeded` events for the same email or IPs in the
  same window.
- Correlate with **Anthropic SSO Disabled or Connection Removed** or magic link second factor disablement when
  org-scoped admin events are available elsewhere in the tenant timeline.

### False positive analysis

- Expired magic link retries from a legitimate user often cluster in a short period from one IP.
- SSO or IdP testing against a named pilot account can mimic targeted brute-force activity.

### Response and remediation

- If takeover or stuffing is suspected, invalidate active sessions for the account, reset credentials and MFA, and
  review recent successful logins from new IPs.
- When failures precede a successful login from an unfamiliar IP, treat as potential compromise and expand the
  investigation to data access and admin changes.

## Setup

The Anthropic Fleet integration, or similarly structured data from the Anthropic compliance activities API, is
required to be compatible with this rule."""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 47
rule_id = "ff3e1a0f-1761-4e15-b22b-36b59cb04a00"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: LLM",
    "Data Source: Anthropic",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Tactic: Credential Access",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-*
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "authentication" and
    event.outcome == "failure" and
    event.action in ("magic_link_login_failed", "sso_login_failed") and
    user.email is not null
| stats
    Esql.event_count = count(*),
    Esql.event_id_values = values(event.id),
    Esql.event_action_values = values(event.action),
    Esql.source_ip_values = values(source.ip),
    Esql.source_ip_count_distinct = count_distinct(source.ip),
    Esql.user_agent_original_values = values(user_agent.original),
    Esql.anthropic_audit_actor_type_values = values(anthropic.audit.actor.type),
    Esql.timestamp_first_seen = min(@timestamp),
    Esql.timestamp_last_seen = max(@timestamp)
  by user.email
| where Esql.event_count >= 5
| keep user.email, Esql.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1110"
name = "Brute Force"
reference = "https://attack.mitre.org/techniques/T1110/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.alert_suppression]
group_by = ["user.email"]
duration = {value = 1, unit = "h"}
missing_fields_strategy = "suppress"

[rule.investigation_fields]
field_names = [
    "user.email",
    "Esql.event_count",
    "Esql.event_id_values",
    "Esql.event_action_values",
    "Esql.source_ip_values",
    "Esql.source_ip_count_distinct",
    "Esql.user_agent_original_values",
    "Esql.anthropic_audit_actor_type_values",
    "Esql.timestamp_first_seen",
    "Esql.timestamp_last_seen",
]
