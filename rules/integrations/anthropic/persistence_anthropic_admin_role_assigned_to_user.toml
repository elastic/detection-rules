[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/21"

[rule]
author = ["Elastic"]
description = """
The admin role controls organization settings, integrations, membership, and security configuration in Anthropic
Claude for Enterprise. An attacker can assign it to a compromised or newly invited account to turn initial access
into durable control-plane access. From admin, they can disable SSO, mint admin API keys for automation, start data
exports, and weaken audit logging.
"""
false_positives = [
    """
    IT administrators assign admin roles during onboarding, staffing changes, or incident response. Verify that the
    target user should hold admin privileges, and that a change request exists when policy requires one.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Admin Role Assigned to User"
note = """## Triage and analysis

### Investigating Anthropic Admin Role Assigned to User

Org admin can change SSO, API keys, exports, and integrations. This rule matches `role_assignment_granted` where
`user.target.roles` is the literal `admin` (not project roles; not `rbac_role_assigned`).

Unauthorized = no IAM ticket naming the target as admin, target recently invited from an unexpected domain, or the
grant is followed by key creation / SSO weakening / exports by the same actor or target.

#### Possible investigation steps

- Identify target (`user.target.id`, `related.user`) and assigner (`actor.type`; for `user_actor` check email/IP/UA).
- Check whether the target was invited or otherwise role-changed shortly before becoming admin.
- After the grant, review ~48h of target activity and org IAM (primary owner transfer, admin keys, SSO, exports).
- Close as FP when ticket + job function match. Escalate when the grant is untracked or precedes control-plane abuse.

### False positive analysis

- Onboarding and IR staffing changes are valid — require change request when policy demands one.

### Response and remediation

- On unauthorized grant: revoke admin, rotate credentials for assigner and target, audit admin API keys and
  integration changes for the organization.
"""
references = [
    "https://www.elastic.co/security-labs/elastic-advances-llm-security",
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 73
rule_id = "f280afaf-332a-40c9-9213-8e2e717ed320"
severity = "high"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Persistence",
    "Tactic: Privilege Escalation",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    mv_contains(event.category, "iam") and
    event.action == "role_assignment_granted" and
    user.target.roles == "admin"
| keep _id, _version, _index, @timestamp, event.*, organization.*, user.*, source.*, user_agent.*, anthropic.audit.*, data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
