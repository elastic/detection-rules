[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/12"

[rule]
author = ["Elastic"]
description = """
The admin role controls organization settings, integrations, membership, and security configuration in Anthropic
Claude for Enterprise. An attacker can assign it to a compromised or newly invited account to turn initial access
into durable control-plane access. From admin, they can disable SSO, mint admin API keys for automation, start data
exports, and weaken audit logging.
"""
false_positives = [
    """
    IT administrators assign admin roles during onboarding, staffing changes, or incident response. Verify that the
    target user should hold admin privileges, and that a change request exists when policy requires one.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Admin Role Assigned to User"
note = """## Triage and analysis

### Investigating Anthropic Admin Role Assigned to User

Organization admin roles in Anthropic control who can change SSO, API keys, exports, and integrations. Unexpected
assignments can be account compromise or an insider abusing elevated access.

This rule fires when the admin role is granted through a `role_assignment_granted` event. Admin grants through the
separate `rbac_role_assigned` event path use `anthropic.audit.role_id` instead of `user.target.roles` and are not
matched here.

#### Possible investigation steps

- Identify the target user using `user.target.id`, `user.target.roles`, and `related.user`.
- Review `anthropic.audit.resource_type`, `anthropic.audit.resource_id`, and `anthropic.audit.actor.type`.
- If the actor is a `user_actor`, review `user.email`, `user.id`, `source.ip`, and `user_agent.original`.
- Check whether the target user was recently invited or had other role changes in the same window.
- Look for related activity from the same actor, such as admin API key creation, exports, or SSO changes.
- Review the last 48 hours of audit events for the target user after the role assignment.
- Pivot on `organization.id` for other IAM changes in the same period, including primary owner transfers or
  destructive actions.

### False positive analysis

- Confirm with the administrator who performed the assignment that the change was intentional.
- Verify the target user is expected to hold admin access for their job function.

### Response and remediation

- If unauthorized, revoke the role, rotate credentials, and review other configuration changes made by the same actor.
- Audit recent admin API keys and integration changes for the organization.

## Setup

The Anthropic Fleet integration, or similarly structured data from the Anthropic compliance activities API, is
required to be compatible with this rule."""
references = [
    "https://attack.mitre.org/techniques/T1098/003/",
    "https://www.elastic.co/security-labs/elastic-advances-llm-security",
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 73
rule_id = "f280afaf-332a-40c9-9213-8e2e717ed320"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: LLM",
    "Data Source: Anthropic",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Tactic: Persistence",
    "Tactic: Privilege Escalation",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "iam" and
    event.action == "role_assignment_granted" and
    user.target.roles == "admin"
| keep *
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



