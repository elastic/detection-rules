[metadata]
creation_date = "2026/09/15"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/15"

[rule]
author = ["Elastic"]
description = """
Detects an unusually high volume of Claude file uploads from the same user email and source IP within a single
calendar day. Sustained upload activity can indicate staging of sensitive documents in Claude chats for later retrieval,
automated ingestion of data into LLM workflows, or abuse of organizational Claude access to move files into the cloud
service.
"""
false_positives = [
    """
    Developers, analysts, or knowledge workers bulk-uploading documents during migrations, evaluations, or large project
    onboarding can exceed the daily threshold from a single workstation or VPN egress.
    """,
]
from = "now-24h"
interval = "1h"
language = "esql"
license = "Elastic License v2"
name = "Anthropic High File Upload Activity"
note = """## Triage and analysis

### Investigating Anthropic High File Upload Activity

This ES|QL rule fires when one `user.email` and `source.ip` pair records at least 100 `claude_file_uploaded` events
within the same UTC day bucket in a rolling 24-hour lookback. Matching triples `(user.email, source.ip,
Esql.time_bucket)` are suppressed for 24 hours so hourly runs do not re-alert while the window still contains the
burst. Pivot to raw `logs-anthropic.audit-*` logs for individual filenames and chat or project identifiers.

#### Possible investigation steps

- Review `Esql.event_count`, `Esql.file_name_values`, and `Esql.anthropic_audit_claude_chat_id_values`.
- Inspect `Esql.anthropic_audit_claude_project_id_values` for whether uploads target shared or sensitive projects.
- Compare upload volume to `claude_file_viewed` or chat activity from the same actor in the same window.
- Correlate with artifact sharing changes, data exports, or compliance key creation from the same user.

### False positive analysis

- Document migration or RAG indexing pilots often produce high upload counts from one analyst seat.
- Automation that attaches files to many chats in a batch can look like exfiltration staging.

### Response and remediation

- If unauthorized, revoke the actor's sessions, review uploaded file names for sensitive content, and tighten project
  sharing or upload policies.
"""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 47
rule_id = "58295a79-5dde-4fc9-a967-2dbe39fb8bc7"
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Threat Detection",
    "Use Case: UEBA",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Exfiltration",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-*
| where
    data_stream.dataset == "anthropic.audit" and
    event.action == "claude_file_uploaded" and
    event.outcome == "success" and
    user.email is not null and
    source.ip is not null
| eval Esql.time_bucket = DATE_TRUNC(1 day, @timestamp)
| stats
    Esql.event_count = count(*),
    Esql.event_id_values = values(event.id),
    Esql.file_name_values = values(file.name),
    Esql.anthropic_audit_claude_file_id_values = values(anthropic.audit.claude_file_id),
    Esql.anthropic_audit_claude_chat_id_values = values(anthropic.audit.claude_chat_id),
    Esql.anthropic_audit_claude_project_id_values = values(anthropic.audit.claude_project_id),
    Esql.user_agent_original_values = values(user_agent.original),
    Esql.anthropic_audit_actor_type_values = values(anthropic.audit.actor.type),
    Esql.timestamp_first_seen = min(@timestamp),
    Esql.timestamp_last_seen = max(@timestamp)
  by user.email, source.ip, Esql.time_bucket
| where Esql.event_count >= 100
| keep user.email, source.ip, Esql.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1567"
name = "Exfiltration Over Web Service"
reference = "https://attack.mitre.org/techniques/T1567/"


[rule.threat.tactic]
id = "TA0010"
name = "Exfiltration"
reference = "https://attack.mitre.org/tactics/TA0010/"

[rule.alert_suppression]
group_by = ["user.email", "source.ip", "Esql.time_bucket"]
duration = {value = 24, unit = "h"}
missing_fields_strategy = "suppress"

[rule.investigation_fields]
field_names = [
    "user.email",
    "source.ip",
    "Esql.time_bucket",
    "Esql.event_count",
    "Esql.event_id_values",
    "Esql.file_name_values",
    "Esql.anthropic_audit_claude_file_id_values",
    "Esql.anthropic_audit_claude_chat_id_values",
    "Esql.anthropic_audit_claude_project_id_values",
    "Esql.user_agent_original_values",
    "Esql.anthropic_audit_actor_type_values",
    "Esql.timestamp_first_seen",
    "Esql.timestamp_last_seen",
]
