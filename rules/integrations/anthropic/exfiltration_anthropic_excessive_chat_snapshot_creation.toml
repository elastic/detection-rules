[metadata]
creation_date = "2026/09/16"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/16"

[rule]
author = ["Elastic"]
description = """
Detects an unusually high number of successful Claude chat snapshot creation events for the same user email within a
rolling 24-hour window. Chat snapshots package conversation content into shareable exports; sustained creation volume
can indicate staging of organizational chat data for exfiltration via Anthropic's web service or automated bulk export
of sensitive prompts and responses.
"""
false_positives = [
    """
    Power users, trainers, or documentation owners who intentionally snapshot many chats for sharing, archival, or
    handoff workflows can exceed the threshold without malicious intent.
    """,
]
from = "now-24h"
interval = "1h"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Excessive Chat Snapshot Creation"
note = """## Triage and analysis

### Investigating Anthropic Excessive Chat Snapshot Creation

This ES|QL rule fires when one `user.email` records at least 10 successful `claude_chat_snapshot_created` events in a
rolling 24-hour lookback. Source IP and user agent are retained as `VALUES` for investigation but are not grouping
keys, so activity spread across multiple egress IPs still accumulates. Matching `user.email` values are suppressed for
24 hours so hourly runs do not re-alert while the window still contains the burst.

#### Possible investigation steps

- Review `Esql.event_count`, `Esql.anthropic_audit_claude_chat_snapshot_id_values`, and
  `Esql.anthropic_audit_claude_chat_id_values`.
- Inspect `Esql.source_ip_values` and `Esql.user_agent_original_values` for automation or unfamiliar clients.
- Correlate with high file uploads, artifact public sharing, data exports, or chat deletions from the same email.
- Determine whether the actor is a service account or human user via `Esql.anthropic_audit_actor_type_values`.
- Pivot on `Esql.organization_id_values` if the same email appears across organizations.

### False positive analysis

- Bulk snapshot creation during knowledge handoffs, training material packaging, or project archival can exceed the
  threshold from a single power-user seat.
- Automation that snapshots chats for compliance archival may look like exfiltration staging.

### Response and remediation

- If unauthorized, revoke sessions, review snapshot destinations and shared links, and tighten chat sharing or export
  policies for the actor.
"""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 47
rule_id = "0cd6c462-28eb-482a-b445-9ced6a034b49"
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Threat Detection",
    "Use Case: UEBA",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Exfiltration",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-*
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "configuration" and
    event.action == "claude_chat_snapshot_created" and
    event.outcome == "success" and
    user.email is not null
| stats
    Esql.event_count = count(*),
    Esql.event_id_values = values(event.id),
    Esql.anthropic_audit_claude_chat_snapshot_id_values = values(anthropic.audit.claude_chat_snapshot_id),
    Esql.anthropic_audit_claude_chat_id_values = values(anthropic.audit.claude_chat_id),
    Esql.source_ip_values = values(source.ip),
    Esql.user_agent_original_values = values(user_agent.original),
    Esql.anthropic_audit_actor_type_values = values(anthropic.audit.actor.type),
    Esql.organization_id_values = values(organization.id),
    Esql.user_id_values = values(user.id),
    Esql.timestamp_first_seen = min(@timestamp),
    Esql.timestamp_last_seen = max(@timestamp)
  by user.email
| where Esql.event_count >= 10
| keep user.email, Esql.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1567"
name = "Exfiltration Over Web Service"
reference = "https://attack.mitre.org/techniques/T1567/"


[rule.threat.tactic]
id = "TA0010"
name = "Exfiltration"
reference = "https://attack.mitre.org/tactics/TA0010/"

[rule.alert_suppression]
group_by = ["user.email"]
duration = {value = 24, unit = "h"}
missing_fields_strategy = "suppress"

[rule.investigation_fields]
field_names = [
    "user.email",
    "Esql.event_count",
    "Esql.event_id_values",
    "Esql.anthropic_audit_claude_chat_snapshot_id_values",
    "Esql.anthropic_audit_claude_chat_id_values",
    "Esql.source_ip_values",
    "Esql.user_agent_original_values",
    "Esql.anthropic_audit_actor_type_values",
    "Esql.organization_id_values",
    "Esql.user_id_values",
    "Esql.timestamp_first_seen",
    "Esql.timestamp_last_seen",
]
