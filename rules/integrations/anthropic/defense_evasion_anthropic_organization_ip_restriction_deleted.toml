[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/12"

[rule]
author = ["Elastic"]
description = """
Organization IP restrictions limit Anthropic administrative access to approved network ranges. Deleting one widens
where a compromised admin session or API key can be used. The audit event does not always carry the deleted CIDR or
restriction identifier, so treat this as an early signal and pivot to nearby IP restriction create or update events
for the same organization.
"""
false_positives = [
    """
    Network or security teams remove IP restrictions during office moves, VPN migrations, or policy redesigns.
    Validate the actor, and confirm replacement restrictions were applied if the control is still required.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Organization IP Restriction Deleted"
note = """## Triage and analysis

### Investigating Anthropic Organization IP Restriction Deleted

IP restrictions are a network-layer guardrail on administrative access to Anthropic organization settings. Removing
them widens where a compromised admin session or API key can be used. The delete event often only identifies the
organization and actor type, not the removed range.

#### Possible investigation steps

- Review `anthropic.audit.actor.type` and `organization.id`.
- If the actor is a `user_actor`, review `user.email`, `user.id`, `source.ip`, and `user_agent.original`.
- If the actor is `anthropic_actor`, pivot on `organization.id` for nearby `org_ip_restriction_created` or
  `org_ip_restriction_updated` events to recover the restriction details.
- Look for related `org_ip_restriction_created` or `org_ip_restriction_updated` events before or after the deletion.
- Correlate with admin role grants, admin API key creation, SSO changes, or exports in the same window.
- Confirm with the network or security team whether an IP allowlist change was planned.

### False positive analysis

- Planned migrations sometimes require temporarily removing outdated IP restrictions before new ranges are applied.

### Response and remediation

- If unauthorized, restore the required IP restrictions and review administrative activity from non-corporate source
  IPs.
- Rotate admin credentials and API keys used during the exposure window.

## Setup

The Anthropic Fleet integration, or similarly structured data from the Anthropic compliance activities API, is
required to be compatible with this rule."""
references = [
    "https://attack.mitre.org/techniques/T1562/007/",
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 73
rule_id = "ae472523-3854-4b2b-868d-a001c764a136"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: LLM",
    "Data Source: Anthropic",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Tactic: Defense Evasion",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "configuration" and
    event.action == "org_ip_restriction_deleted"
| keep *
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"
[[rule.threat.technique.subtechnique]]
id = "T1562.007"
name = "Disable or Modify Cloud Firewall"
reference = "https://attack.mitre.org/techniques/T1562/007/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "event.id",
    "organization.id",
    "anthropic.audit.actor.type",
    "user.email",
    "user.id",
    "source.ip",
    "user_agent.original",
]

