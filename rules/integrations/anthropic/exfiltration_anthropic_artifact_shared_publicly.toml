[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/12"

[rule]
author = ["Elastic"]
description = """
Claude artifacts can be shared with specific audiences. Making an artifact public exposes its contents to
unauthenticated viewers on the internet. An attacker with access to sensitive artifacts can publish them publicly to
push intellectual property, credentials embedded in prompts, or other confidential material outside organizational
controls.
"""
false_positives = [
    """
    Users publish artifacts intentionally for demos, documentation, or external collaboration. Validate the artifact,
    actor, and business justification before escalating.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Artifact Shared Publicly"
note = """## Triage and analysis

### Investigating Anthropic Artifact Shared Publicly

This rule matches `claude_artifact_sharing_updated` when `anthropic.audit.access_level` is `public`. Review what
artifact was exposed and whether publication was authorized.

#### Possible investigation steps

- Review `anthropic.audit.claude_artifact_id`, `anthropic.audit.access_level`, and `anthropic.audit.actor.type`.
  `anthropic.audit.audience` can appear when populated, but treat `access_level: public` as the authoritative sharing
  state.
- If the actor is a `user_actor`, review `user.email`, `user.id`, `source.ip`, and `user_agent.original`.
- Confirm whether the artifact contains credentials, customer data, or proprietary content.
- Look for related chat access failures or data exports involving the same actor.

### False positive analysis

- Marketing, developer relations, or training teams publish artifacts intentionally for external audiences.

### Response and remediation

- If unauthorized, revoke public sharing for the artifact and review other artifacts modified by the same actor.

## Setup

The Anthropic Fleet integration, or similarly structured data from the Anthropic compliance activities API, is
required to be compatible with this rule."""
references = [
    "https://attack.mitre.org/techniques/T1567/",
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 47
rule_id = "14290b38-a8dd-474d-bfd7-cce282f4f745"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: LLM",
    "Data Source: Anthropic",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Tactic: Exfiltration",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "configuration" and
    event.action == "claude_artifact_sharing_updated" and
    anthropic.audit.access_level == "public"
| keep *
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1567"
name = "Exfiltration Over Web Service"
reference = "https://attack.mitre.org/techniques/T1567/"


[rule.threat.tactic]
id = "TA0010"
name = "Exfiltration"
reference = "https://attack.mitre.org/tactics/TA0010/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "event.id",
    "organization.id",
    "anthropic.audit.claude_artifact_id",
    "anthropic.audit.access_level",
    "anthropic.audit.audience",
    "anthropic.audit.actor.type",
    "user.email",
    "user.id",
    "source.ip",
    "user_agent.original",
]
