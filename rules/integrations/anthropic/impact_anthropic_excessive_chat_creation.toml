[metadata]
creation_date = "2026/09/15"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/15"

[rule]
author = ["Elastic"]
description = """
Detects an unusually high number of Claude chat creation events for the same user email within a single calendar day.
Burst chat creation can indicate automated LLM abuse, resource hijacking to burn organizational quotas, or scripted
workflows used to stage many parallel conversations for data processing or prompt-injection campaigns.
"""
false_positives = [
    """
    Power users, automation engineers, or evaluation scripts that create many short-lived chats during testing can exceed
    the daily threshold without malicious intent.
    """,
]
from = "now-24h"
interval = "1h"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Excessive Chat Creation"
note = """## Triage and analysis

### Investigating Anthropic Excessive Chat Creation

This ES|QL rule fires when one `user.email` records at least 20 `claude_chat_created` events within the same UTC day
bucket in a rolling 24-hour lookback. Matching pairs `(user.email, Esql.time_bucket)` are suppressed for 24 hours.

#### Possible investigation steps

- Review `Esql.event_count`, `Esql.anthropic_audit_claude_chat_id_values`, and
  `Esql.anthropic_audit_claude_project_id_values`.
- Inspect `Esql.source_ip_values` and `Esql.user_agent_original_values` for automation or API-like clients.
- Correlate with high file uploads, chat deletions, or data export activity from the same email.
- Determine whether the actor is a service account or human user via `Esql.anthropic_audit_actor_type_values`.

### False positive analysis

- Load testing or batch automation that spins up many chats for summarization pipelines can trigger this rule.
- Onboarding exercises that create template chats for each team member may cluster on one admin account.

### Response and remediation

- If abuse is confirmed, revoke sessions, review project membership, and consider rate limits or policy changes for
  the actor.
"""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 47
rule_id = "5904e1c0-1caa-446a-9e55-152e357c251a"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: LLM",
    "Data Source: Anthropic",
    "Use Case: Threat Detection",
    "Use Case: UEBA",
    "Resources: Investigation Guide",
    "Rule Type: ESQL",
    "Tactic: Impact",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-*
| where
    data_stream.dataset == "anthropic.audit" and
    event.action == "claude_chat_created" and
    event.outcome == "success" and
    user.email is not null
| eval Esql.time_bucket = DATE_TRUNC(1 day, @timestamp)
| stats
    Esql.event_count = count(*),
    Esql.event_id_values = values(event.id),
    Esql.anthropic_audit_claude_chat_id_values = values(anthropic.audit.claude_chat_id),
    Esql.anthropic_audit_claude_project_id_values = values(anthropic.audit.claude_project_id),
    Esql.source_ip_values = values(source.ip),
    Esql.user_agent_original_values = values(user_agent.original),
    Esql.anthropic_audit_actor_type_values = values(anthropic.audit.actor.type),
    Esql.user_id_values = values(user.id),
    Esql.timestamp_first_seen = min(@timestamp),
    Esql.timestamp_last_seen = max(@timestamp)
  by user.email, Esql.time_bucket
| where Esql.event_count >= 20
| keep user.email, Esql.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1496"
name = "Resource Hijacking"
reference = "https://attack.mitre.org/techniques/T1496/"


[rule.threat.tactic]
id = "TA0040"
name = "Impact"
reference = "https://attack.mitre.org/tactics/TA0040/"

[rule.alert_suppression]
group_by = ["user.email", "Esql.time_bucket"]
duration = {value = 24, unit = "h"}
missing_fields_strategy = "suppress"

[rule.investigation_fields]
field_names = [
    "user.email",
    "Esql.time_bucket",
    "Esql.event_count",
    "Esql.event_id_values",
    "Esql.anthropic_audit_claude_chat_id_values",
    "Esql.anthropic_audit_claude_project_id_values",
    "Esql.source_ip_values",
    "Esql.user_agent_original_values",
    "Esql.anthropic_audit_actor_type_values",
    "Esql.user_id_values",
    "Esql.timestamp_first_seen",
    "Esql.timestamp_last_seen",
]
