[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/12"

[rule]
author = ["Elastic"]
description = """
Organization deletion and bulk delete remove tenant data, projects, and member access in a single administrative
action. An attacker can use this to break AI-assisted workflows as an impact technique, to extort the organization, or
to destroy evidence after finishing a data export. Once deletion progresses, recovery options shrink and earlier
exfiltration activity is harder to reconstruct from the tenant itself.
"""
false_positives = [
    """
    Planned tenant offboarding, sandbox teardown, or contract termination can produce these events. Confirm the actor
    and timing against change management or offboarding records before escalating.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Organization Destructive Action"
note = """## Triage and analysis

### Investigating Anthropic Organization Destructive Action

This rule matches organization deletion requests and bulk delete activity. Treat `org_deletion_requested` as an urgent
early signal; recovery options shrink as the action progresses to bulk delete completion.

#### Possible investigation steps

- Identify the actor using `anthropic.audit.actor.type` and `organization.id`.
- If the actor is a `user_actor`, review `user.email`, `user.id`, `source.ip`, and `user_agent.original`.
- Review the action value and urgency:
  - `org_deletion_requested`: deletion was requested. Intervene immediately if unauthorized.
  - `org_bulk_delete_initiated`: bulk delete started.
  - `org_deleted_via_bulk`: bulk delete completed. Prioritize evidence preservation outside the tenant.
- Look for preceding admin role grants, primary owner transfers, admin API key creation, or data exports.
- Confirm with platform owners whether offboarding or decommissioning was scheduled.

### False positive analysis

- Match the event time and actor to an approved offboarding or lab teardown project.

### Response and remediation

- If the activity was unauthorized, engage Anthropic support and internal incident response immediately.
- Preserve remaining audit logs (including any prior exports) and rotate administrative credentials for the
  organization.

## Setup

The Anthropic Fleet integration, or similarly structured data from the Anthropic compliance activities API, is
required to be compatible with this rule."""
references = [
    "https://attack.mitre.org/techniques/T1485/",
    "https://attack.mitre.org/techniques/T1531/",
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 73
rule_id = "11347993-e71f-4659-a903-e9a0e8bd55de"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: LLM",
    "Data Source: Anthropic",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Tactic: Impact",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "configuration" and
    event.action in ("org_deletion_requested", "org_bulk_delete_initiated", "org_deleted_via_bulk")
| keep *
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1485"
name = "Data Destruction"
reference = "https://attack.mitre.org/techniques/T1485/"

[[rule.threat.technique]]
id = "T1531"
name = "Account Access Removal"
reference = "https://attack.mitre.org/techniques/T1531/"


[rule.threat.tactic]
id = "TA0040"
name = "Impact"
reference = "https://attack.mitre.org/tactics/TA0040/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "event.id",
    "organization.id",
    "anthropic.audit.actor.type",
    "user.email",
    "user.id",
    "source.ip",
    "user_agent.original",
]

