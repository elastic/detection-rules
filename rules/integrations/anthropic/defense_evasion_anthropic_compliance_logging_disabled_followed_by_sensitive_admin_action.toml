[metadata]
creation_date = "2026/09/12"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/16"

[rule]
author = ["Elastic"]
description = """
Disabling compliance API logging hides later administrative activity in logs-anthropic.audit-*. An attacker can
disable logging and then immediately create API keys or start exports before defenders link the control change to the
data collection. This rule catches that blind-then-act pattern inside a single organization.
"""
false_positives = [
    """
    Integration testing sometimes disables compliance logging while validating Fleet connectivity, then creates keys
    or runs test exports. Validate the actor and change ticket before escalating.
    """,
]
from = "now-24h"
interval = "9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Compliance Logging Disabled Followed by Sensitive Admin Action"
note = """## Triage and analysis

### Investigating Anthropic Compliance Logging Disabled Followed by Sensitive Admin Action

This ES|QL rule correlates a compliance API logging disable with a high-risk follow-on in the same organization within
24 hours. Settings updates that re-enable logging are included so a disable, re-enable, then later admin action does
not satisfy the sequence. The latest settings event before the follow-on must still be a disable. Events are aggregated
by `organization.id`, so the disable and the follow-on may be different actors. The alert document is a stats row
(`Esql.*` fields); pivot to raw `logs-anthropic.audit-*` logs for individual events. If logging stays disabled, the
follow-on may be the last activity visible in this data source.

#### Possible investigation steps

- Review `organization.id`, `Esql.disable_time`, `Esql.latest_followon`, and `Esql.event_action_values` on the alert,
  then pivot to raw events in that window. For each event, check `anthropic.audit.actor.type`, `user.email`,
  `source.ip`, and `user_agent.original`. If the actor is `admin_api_key_actor`, pivot on
  `anthropic.audit.actor.admin_api_key_id`.
- Confirm whether logging was re-enabled, and whether intermediate activity is missing from `logs-anthropic.audit-*`.
- Inspect follow-on actions in `Esql.event_action_values`. This rule matches:
  - `admin_api_key_created`: programmatic admin access.
  - `api_key_created`: review `anthropic.audit.scopes` for compliance read permissions.
  - `org_data_export_started`, `org_data_export_accessed`: organization content export lifecycle.
  - `audit_log_export_started`, `audit_log_export_accessed`: compliance audit log export lifecycle.
- Search the same `organization.id` for SSO changes, role grants, primary owner transfers, or IP restriction changes
  that may have happened during the blind window but are absent from this index.
- Correlate with the standalone "Anthropic Compliance API Logging Disabled" rule if only the first event fired.

### False positive analysis

- Fleet onboarding sometimes disables logging briefly, then creates credentials and runs validation exports.

### Response and remediation

- Re-enable compliance API logging and preserve any locally cached audit data from the blind window.
- Revoke unauthorized keys and review export download activity during the exposure period.
"""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 99
rule_id = "07f7966d-37f8-4b1c-805e-943b050727c9"
severity = "critical"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Log Auditing",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: Higher-Order",
    "Rule Type: ES|QL",
    "Tactic: Defense Evasion",
    "Tactic: Persistence",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where data_stream.dataset == "anthropic.audit"
| where (
    event.action == "org_compliance_api_settings_updated"
    or
    event.action in (
      "admin_api_key_created",
      "api_key_created",
      "org_data_export_started",
      "audit_log_export_started",
      "org_data_export_accessed",
      "audit_log_export_accessed"
    )
  )
| eval is_disable_event = case(
    event.action == "org_compliance_api_settings_updated" and anthropic.audit.compliance_api_logging_enabled == false,
    1, 0
  )
| eval is_enable_event = case(
    event.action == "org_compliance_api_settings_updated" and anthropic.audit.compliance_api_logging_enabled == true,
    1, 0
  )
| eval is_followon_event = case(
    event.action != "org_compliance_api_settings_updated",
    1, 0
  )
| stats
    Esql.disable_count = count(case(is_disable_event == 1, 1, null)),
    Esql.followon_count = count(case(is_followon_event == 1, 1, null)),
    Esql.disable_time = min(case(is_disable_event == 1, @timestamp, null)),
    Esql.last_disable_time = max(case(is_disable_event == 1, @timestamp, null)),
    Esql.last_enable_time = max(case(is_enable_event == 1, @timestamp, null)),
    Esql.latest_followon = max(case(is_followon_event == 1, @timestamp, null)),
    Esql.event_action_values = values(case(is_followon_event == 1, event.action, null)),
    Esql.event_id_values = values(event.id),
    Esql.user_email_values = values(user.email),
    Esql.user_id_values = values(user.id),
    Esql.source_ip_values = values(source.ip),
    Esql.anthropic_audit_actor_type_values = values(anthropic.audit.actor.type)
  by organization.id
| where Esql.disable_count >= 1 and Esql.followon_count >= 1
| where Esql.latest_followon > Esql.disable_time
| where date_diff("hours", Esql.disable_time, Esql.latest_followon) <= 24
| where Esql.last_enable_time is null or Esql.last_enable_time < Esql.last_disable_time or Esql.last_enable_time > Esql.latest_followon
| sort Esql.latest_followon desc
| keep organization.id, Esql.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"
[[rule.threat.technique.subtechnique]]
id = "T1562.008"
name = "Disable or Modify Cloud Logs"
reference = "https://attack.mitre.org/techniques/T1562/008/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
