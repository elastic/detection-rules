[metadata]
creation_date = "2026/09/16"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/16"

[rule]
author = ["Elastic"]
description = """
Extra usage spend limits cap Anthropic organizational spend beyond included usage. Deleting a spend limit removes that
cap and can enable unrestricted API or Claude consumption. An attacker who already has administrative or API access can
delete the limit to burn budget, run large automated workloads, or stage resource abuse without the previous guardrail.
"""
false_positives = [
    """
    Finance or platform teams delete outdated spend limits when consolidating billing policies or replacing them with
    new limits. Confirm the actor, nearby create or update events, and an approved change before escalating.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Anthropic Extra Usage Spend Limit Deleted"
note = """## Triage and analysis

### Investigating Anthropic Extra Usage Spend Limit Deleted

This rule matches `extra_usage_spend_limit_deleted` configuration events. The deletion removes a spend cap rather than
creating spend by itself. Treat it as an early signal and look for follow-on high-volume API or chat activity.

#### Possible investigation steps

- Review `anthropic.audit.spend_limit_id`, `organization.id`, and `anthropic.audit.actor.type`.
- If the actor is a `user_actor`, review `user.email`, `user.id`, `source.ip`, and `user_agent.original`.
- If the actor is an `api_actor`, review `anthropic.audit.actor.api_key_id`, `source.ip`, and `user_agent.original`.
- Look for nearby `extra_usage_spend_limit_created` or `extra_usage_spend_limit_updated` events that indicate planned
  replacement versus a standalone deletion.
- Correlate with high chat creation, file uploads, or other high-volume activity from the same organization after the
  deletion.
- Confirm with finance or platform owners whether a billing policy change was scheduled.

### False positive analysis

- Planned spend-limit redesigns often delete an old limit shortly before creating a replacement.

### Response and remediation

- If unauthorized, restore an appropriate spend limit and review API keys and admin sessions active during the exposure
  window.
- Investigate whether significant extra usage accrued after the deletion.
"""
references = ["https://platform.claude.com/docs/en/api/compliance/activities/list"]
risk_score = 47
rule_id = "9a944f66-417d-4dee-83a2-afd3f7980212"
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Tactic: Impact",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-anthropic.audit-* metadata _id, _version, _index
| where
    data_stream.dataset == "anthropic.audit" and
    event.category == "configuration" and
    event.action == "extra_usage_spend_limit_deleted"
| keep _id, _version, _index, @timestamp, event.*, organization.*, user.*, source.*, user_agent.*, anthropic.audit.*, data_stream.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1496"
name = "Resource Hijacking"
reference = "https://attack.mitre.org/techniques/T1496/"


[rule.threat.tactic]
id = "TA0040"
name = "Impact"
reference = "https://attack.mitre.org/tactics/TA0040/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "event.id",
    "organization.id",
    "anthropic.audit.spend_limit_id",
    "anthropic.audit.actor.type",
    "anthropic.audit.actor.api_key_id",
    "user.email",
    "user.id",
    "source.ip",
    "user_agent.original",
]

