[metadata]
creation_date = "2026/09/15"
integration = ["anthropic"]
maturity = "production"
updated_date = "2026/09/15"

[rule]
author = ["Elastic"]
description = """
Detects when a Claude project owner or editor role is granted through a `role_assignment_granted` event. Project owners
and editors can access project chats, artifacts, and knowledge bases that may hold sensitive data. An attacker with
organization access can grant these roles to persist access to high-value project content without holding organization
admin privileges.
"""
false_positives = [
    """
    Legitimate project collaboration routinely adds owners and editors when teams spin up or staff Claude projects.
    Verify the project (`anthropic.audit.resource_id`), role, and available actor fields against expected membership
    changes.
    """,
    """
    Shared service or automation accounts may receive editor access during content workflows. Confirm the assigner
    and affected project are expected for the workflow; grantee identity may require correlating org membership or
    `anthropic.audit.target_id` when the API supplies it.
    """,
]
from = "now-9m"
index = ["logs-anthropic.audit-*"]
language = "kuery"
license = "Elastic License v2"
name = "Anthropic Sensitive Claude Project Role Assigned to User"
note = """## Triage and analysis

### Investigating Anthropic Sensitive Claude Project Role Assigned to User

This is a first-seen (new_terms) signal keyed on **`organization.id`** and **`anthropic.audit.resource_id`**
for `role_assignment_granted` events where `user.target.roles` is `chat_project:owner` or `chat_project:editor`.
Organization-wide `admin` grants use the same action with `user.target.roles` equal to `admin` and are covered by
**Anthropic Admin Role Assigned to User**. Admin grants through `rbac_role_assigned` use `anthropic.audit.role_id`
instead of `user.target.roles` and are not matched here.

The rule tracks the first sensitive project-role grant on a Claude project in an organization, not first-seen
assigners. `user.id` is often absent when `anthropic.audit.actor.type` is `anthropic_actor`. Self-assignment at
project creation is common. When a grantee is present, review **`user.target.id`**, **`anthropic.audit.target_id`**,
**`anthropic.audit.target_type`**, and **`related.user`**.

#### Possible investigation steps

- Identify the assigner using `user.id`, `user.email`, `source.ip`, and `user_agent.original` when
  `anthropic.audit.actor.type` is `user_actor`.
- Review `user.target.roles`, `anthropic.audit.resource_type`, `anthropic.audit.resource_id`, and
  `anthropic.audit.actor.type` for the affected Claude project.
- If grantee context is needed, inspect `anthropic.audit.target_id`, `anthropic.audit.target_type`, and
  `related.user`; correlate with org membership changes in the same window.
- Determine whether the assigner or project had other IAM, export, or sharing changes recently.
- Correlate with data export, artifact sharing, or compliance logging changes involving the same project or users.

### False positive analysis

- Confirm with the project or organization administrator that the assignment was intentional.
- Baseline recurring collaborators and internal project onboarding patterns before escalating.

### Response and remediation

- If unauthorized, revoke the project role on the affected resource and review other changes on the same
  `anthropic.audit.resource_id` and `organization.id`.
- Audit project content access and recent exports for the affected resource.
"""
references = [
    "https://platform.claude.com/docs/en/api/compliance/activities/list",
]
risk_score = 47
rule_id = "28a17de8-c18e-4672-8953-2c2716a3f7b4"
severity = "medium"
tags = [
    "Domain: GenAI",
    "Platform: Anthropic",
    "Data Source: Anthropic Audit Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Use Case: UEBA",
    "Resources: Investigation Guide",
    "Rule Type: New Terms",
    "Tactic: Persistence",
    "Tactic: Privilege Escalation",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset: "anthropic.audit" and
    event.category: "iam" and
    event.action: "role_assignment_granted" and
    user.target.roles: ("chat_project:owner" or "chat_project:editor")
'''


