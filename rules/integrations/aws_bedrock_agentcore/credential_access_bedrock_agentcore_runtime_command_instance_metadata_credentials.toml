[metadata]
creation_date = "2026/11/25"
integration = ["aws_bedrock_agentcore"]
maturity = "production"
min_stack_comments = """
The aws_bedrock_agentcore integration adds the runtime_logs data stream in package 1.5.0, which requires Kibana 9.6.0 or
later.
"""
min_stack_version = "9.6.0"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies an Amazon Bedrock AgentCore Runtime command that attempts to retrieve IAM execution-role credentials from the
microVM metadata service (MMDS), or command output that contains an AWS temporary credential response. The
InvokeAgentRuntimeCommand API runs shell commands as root inside Runtime and Harness microVMs, bypassing the agent,
model, tools, and guardrails. An attacker with permission to invoke this API can read the attached execution role's
credentials from MMDS and reuse them outside AgentCore.
"""
false_positives = [
    """
    Authorized security testing or troubleshooting may query the metadata service or print temporary credentials.
    Confirm the caller and purpose. Production workloads should not retrieve or return raw execution-role credentials.
    """,
]
from = "now-30m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Bedrock AgentCore Runtime Command Accesses Instance Metadata Credentials"
note = """## Triage and analysis

### Investigating AWS Bedrock AgentCore Runtime Command Accesses Instance Metadata Credentials

Amazon Bedrock AgentCore Runtime and Harness run in Firecracker microVMs. Their IAM execution-role credentials are available from the microVM metadata service at `169.254.169.254`. `InvokeAgentRuntimeCommand` executes a caller-controlled shell command as root alongside the runtime and bypasses the agent, model, tools, and guardrails.

This rule detects a Runtime/Harness command referencing MMDS credential endpoints or token headers. It also detects a temporary-credential response (`AccessKeyId`, `SecretAccessKey`, and a token) written to runtime output, which can reveal a successful retrieval even if the request was obfuscated.

### Possible investigation steps

- Review `process.command_line` and `message`. Determine whether the event is an attempted MMDS probe or contains returned credentials.
- Identify the Runtime in `aws.bedrock_agentcore.runtime_logs.agent_runtime_id`, endpoint, and session. For Harness activity, resolve the Harness to its underlying Runtime.
- Pivot on `aws.bedrock_agentcore.runtime_logs.request_id` to the matching `InvokeAgentRuntimeCommand` CloudTrail data event and identify its caller, source address, and target resource ARN.
- Identify the execution role attached to the Runtime or Harness. Review CloudTrail for calls made as that role outside AgentCore after the command.
- If the caller created the resource, correlate `CreateAgentRuntime`, `CreateAgentRuntimeEndpoint`, `CreateWorkloadIdentity`, `CreateHarness`, `GetAgentRuntime`, and `iam:PassRole` activity.

### False positive analysis

- Approved security tests can reproduce this behavior. Confirm the source identity and exclude only the specific authorized principal or Runtime.
- Operational diagnostics should not print live credential objects. Treat unexpected testing in production as suspicious even when authorized elsewhere.

### Response and remediation

- Revoke active sessions for the affected execution role and investigate every action performed with it since the command.
- Remove `bedrock-agentcore:InvokeAgentRuntimeCommand` from principals that do not need direct root-shell access. Constrain broad `bedrock-agentcore:*` grants and `iam:PassRole`.
- Reduce the execution role to the minimum permissions needed by the workload and enable CloudTrail data events for AgentCore Runtime resources.
"""
references = ["https://www.beyondtrust.com/blog/entry/aws-agentcore-privilege-escalation"]
risk_score = 73
rule_id = "d0fc9cb7-547c-4d1a-82fb-14f5bd34e86e"
setup = "This rule requires version 1.5.0 or later of the Amazon Bedrock AgentCore integration and collection of the auto-created /aws/bedrock-agentcore/runtimes/* CloudWatch log groups into the aws_bedrock_agentcore.runtime_logs dataset. CloudTrail data events for AWS::BedrockAgentCore::Runtime and AWS::BedrockAgentCore::RuntimeEndpoint are recommended for caller attribution."
severity = "high"
tags = [
    "Domain: Cloud",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Platform: AWS",
    "Data Source: AWS Bedrock",
    "Data Source: Amazon Bedrock",
    "Service: AWS Bedrock",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
    "Threat: IMDS Credential Theft",
    "Threat: Unauthorized AI Usage",
    "Rule Type: ES|QL",
    "Domain: GenAI",
    "Mitre Atlas: AML.T0098",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-aws_bedrock_agentcore.runtime_logs-* metadata _id, _version, _index
| where
    (
        event.action == "invoke-agent-runtime-command" and TO_LOWER(process.command_line) like (
            "*169.254.169.254*",
            "*fd00:ec2::254*",
            "*/latest/api/token*",
            "*/latest/meta-data/iam*",
            "*security-credentials*",
            "*x-aws-ec2-metadata-token*"
        )
    ) or (
        message like "*AccessKeyId*" and
        message like "*SecretAccessKey*" and
        message like ("*Token*", "*SessionToken*")
    )
| keep _id, _version, _index, @timestamp, aws.*, cloud.*, event.*, message, process.command_line
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.005"
name = "Cloud Instance Metadata API"
reference = "https://attack.mitre.org/techniques/T1552/005/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0098"
name = "AI Agent Tool Credential Harvesting"
reference = "https://atlas.mitre.org/techniques/AML.T0098/"


[rule.threat_mappings.threat.tactic]
id = "AML.TA0013"
name = "Credential Access"
reference = "https://atlas.mitre.org/tactics/AML.TA0013/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.bedrock_agentcore.runtime_logs.agent_runtime_id",
    "aws.bedrock_agentcore.runtime_logs.endpoint_name",
    "aws.bedrock_agentcore.runtime_logs.session_id",
    "aws.bedrock_agentcore.runtime_logs.request_id",
    "event.action",
    "process.command_line",
    "message",
    "cloud.account.id",
    "cloud.region",
]

