[metadata]
creation_date = "2026/08/10"
integration = ["aws_bedrock_agentcore"]
maturity = "production"
updated_date = "2026/08/10"

[rule]
author = ["Elastic"]
description = """
Identifies a burst of failed tool invocations against a single AWS Bedrock AgentCore Gateway within a short window.
A benign tool call fails occasionally (bad input, transient upstream error), but a concentrated run of failures on
one gateway is also the observable signature of an attacker, or a compromised tool wrapper, probing a tool's
parameter surface for an injection point, an authorization bypass, or a schema weakness. Important telemetry limits
confirmed by emulation: the gateway error event exposes isError only inside a flattened payload_object (so this
must be a KQL threshold, not ES|QL), the gateway_name, target, and tool.name fields are not present on the
error events (so failures can be attributed only to the gateway via resource_arn, not to a specific tool, target,
or caller), and a target that is broken for every caller produces the same burst as one caller probing it. Triage
gateway and target health before assuming malicious probing.
"""
false_positives = [
    """
    A tool or target that is broken or misconfigured for all callers (upstream outage, bad deployment, expired
    credential) produces the same failure burst as a single caller probing it, and the gateway error telemetry
    carries no caller, target, or tool identity to distinguish them. Confirm the gateway's target health and change
    history before treating a burst as adversarial, and add exceptions by gateway (resource_arn) for gateways with
    known-flaky upstreams.
    """,
]
from = "now-60m"
index = ["logs-aws_bedrock_agentcore.gateway_application_logs-*"]
interval = "10m"
language = "kuery"
license = "Elastic License v2"
name = "AWS Bedrock AgentCore Gateway Tool Invocation Failure Burst"
note = """## Triage and analysis

### Investigating AWS Bedrock AgentCore Gateway Tool Invocation Failure Burst

This rule detects many failed tool invocations against one AgentCore Gateway in a short window.

### Possible investigation steps

- Determine whether the gateway's target is simply unhealthy: review the target's upstream service, recent
  deployments, and credential/permission changes. A target failing for everyone is the most common cause.
- Review `aws.bedrock_agentcore.gateway.payload_object` on the failing events; the nested `log` field contains the
  underlying error (message, type, stack) to distinguish a genuine fault from probing.
- Identify the gateway from `aws.bedrock_agentcore.gateway.resource_arn` and confirm which tools/targets it fronts.
- Each failed invocation emits multiple gateway log lines, so the rule counts distinct
  `aws.bedrock_agentcore.gateway.request_id` values — the threshold reflects distinct failed invocations, not raw
  log events.
- Correlate with the AgentCore runtime logs for the same window to identify the agent/session driving the calls,
  since the gateway error events do not carry a caller identity.

### False positive analysis

- A broken or misconfigured target fails identically for all callers and will trigger this rule. Gateway error
  telemetry carries no caller, target, or tool identity, so distinguishing probing from an outage requires
  reviewing target health.

### Response and remediation

- If the underlying errors indicate varied/malformed inputs rather than a plain outage, treat the calling agent
  context as potentially compromised, review its tool configuration and input validation, and restrict the
  gateway target's permissions.
"""
references = [
    "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html",
    "https://atlas.mitre.org/techniques/AML.T0053",
]
risk_score = 47
rule_id = "bfbf698f-b8f2-4589-9e25-405bc8c34fcb"
setup = """The AWS Bedrock AgentCore integration must be enabled with the gateway_application_logs data stream
collecting into logs-aws_bedrock_agentcore.gateway_application_logs-*."""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: GenAI",
    "Platform: AWS",
    "Data Source: AWS Bedrock AgentCore Gateway Logs",
    "Service: AWS Bedrock AgentCore",
    "Use Case: Threat Detection",
    "Tactic: Initial Access",
    "Rule Type: Threshold",
    "Mitre Atlas: T0053",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "threshold"

query = '''
data_stream.dataset: "aws_bedrock_agentcore.gateway_application_logs" and
aws.bedrock_agentcore.gateway.payload_object.isError: "true"
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1190"
name = "Exploit Public-Facing Application"
reference = "https://attack.mitre.org/techniques/T1190/"

[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"

[rule.threshold]
field = ["aws.bedrock_agentcore.gateway.resource_arn"]
value = 1

[[rule.threshold.cardinality]]
field = "aws.bedrock_agentcore.gateway.request_id"
value = 10
