[metadata]
creation_date = "2026/11/26"
integration = ["aws", "aws_bedrock_agentcore"]
maturity = "production"
updated_date = "2026/11/26"

[rule]
author = ["Elastic"]
description = """
Identifies the first time a given user, in a given account, successfully calls GetResourceApiKey or
GetResourceOauth2Token against Amazon Bedrock AgentCore's Token Vault. These calls take only a workload-identity
token and a credential-provider name, and the API does not bind a credential provider to the specific workload
identity that created it, so any workload's token can retrieve any other workload's stored API key or OAuth token
in the same account. Because there is no ownership check to alert on directly, this rule instead surfaces new or
unusual callers of this sensitive retrieval API for analyst review.
"""
false_positives = [
    """
    A newly deployed agent or workload legitimately retrieving its own credential-provider secret for the first
    time. Validate the caller identity against the credential provider it requested and confirm the pairing is
    expected.
    """,
]
from = "now-9m"
index = ["logs-aws.cloudtrail-*"]
language = "kuery"
license = "Elastic License v2"
name = "AWS Bedrock AgentCore Resource Credential Retrieved by New Principal"
note = """## Triage and analysis

### Investigating AWS Bedrock AgentCore Resource Credential Retrieved by New Principal
This rule fires the first time (per the 7-day history window) a principal calls `GetResourceApiKey` or `GetResourceOauth2Token`.
Both APIs take only `(workloadIdentityToken, resourceCredentialProviderName)`; AgentCore does not check that the calling workload identity is the one that created or was associated with the credential provider, so any workload in the account can retrieve any other workload's stored secret.
Because CloudTrail does not log the decoded workload identity inside the token (it is redacted as `HIDDEN_DUE_TO_SECURITY_REASONS`), this rule cannot directly test for a cross-workload mismatch and instead flags any new caller of this sensitive retrieval path.

#### Possible investigation steps
- Review `aws.cloudtrail.user_identity.arn`, `user_agent.original`, and `source.ip` for the caller.
- Extract `resourceCredentialProviderName` from `aws.cloudtrail.request_parameters` and confirm which credential provider was accessed.
- Look for a preceding `GetWorkloadAccessToken`/`GetWorkloadAccessTokenForUserId` call from the same principal in the same window; its `workloadName` shows which workload identity's token was used.
- Confirm with the team that owns the credential provider's underlying secret (`GetApiKeyCredentialProvider`/Secrets Manager) whether this caller/workload should have access.

### False positive analysis
- A legitimately new agent, workload, or automation identity retrieving its own credential provider's secret for the first time. Confirm the workload/provider pairing is expected and add the identity to known automation if so.

### Response and remediation
- If unauthorized, rotate the credential provider's underlying secret immediately (it has no workload-level isolation once retrieved).
- Restrict which workloads are deployed with access to sensitive credential providers; avoid sharing one account-wide Token Vault across unrelated agents where possible.
- Review all recent `GetResourceApiKey`/`GetResourceOauth2Token` calls for the affected credential provider for other unexpected callers.
"""
references = [
    "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-getting-started.html",
    "https://docs.aws.amazon.com/bedrock-agentcore-apis-reference/latest/APIReference/API_amazon-bedrock-agentcore_GetResourceApiKey.html",
]
risk_score = 47
rule_id = "e9cc490e-885f-4c73-b186-8cd4872a8fb7"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: GenAI",
    "Data Source: AWS",
    "Data Source: AWS CloudTrail",
    "Data Source: Amazon Web Services",
    "Use Case: Identity and Access Audit",
    "Resources: Investigation Guide",
    "Tactic: Credential Access",
    "Rule Type: New Terms",
    "Platform: AWS",
    "Service: AWS Bedrock",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset: "aws.cloudtrail" and
    event.provider: "bedrock-agentcore.amazonaws.com" and
    event.action: ("GetResourceApiKey" or "GetResourceOauth2Token") and
    event.outcome: "success"
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1528"
name = "Steal Application Access Token"
reference = "https://attack.mitre.org/techniques/T1528/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"
[[rule.threat_mappings.threat.technique]]
id = "AML.T0012"
name = "Valid Accounts"
reference = "https://atlas.mitre.org/techniques/AML.T0012/"


[rule.threat_mappings.threat.tactic]
id = "AML.TA0012"
name = "Privilege Escalation"
reference = "https://atlas.mitre.org/tactics/AML.TA0012/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "user.name",
    "user_agent.original",
    "source.ip",
    "source.geo.country_name",
    "aws.cloudtrail.user_identity.arn",
    "aws.cloudtrail.user_identity.type",
    "aws.cloudtrail.user_identity.access_key_id",
    "event.action",
    "event.provider",
    "event.outcome",
    "cloud.account.id",
    "cloud.region",
    "aws.cloudtrail.request_id",
    "aws.cloudtrail.request_parameters",
]

[rule.new_terms]
field = "new_terms_fields"
value = ["cloud.account.id", "user.name"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-7d"
