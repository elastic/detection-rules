name = "Credential Access"
reference = "https://atlas.mitre.org/tactics/AML.TA0013/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.bedrock_agentcore.code_interpreter.code_interpreter_id",
    "aws.bedrock_agentcore.code_interpreter.resource_arn",
    "aws.bedrock_agentcore.code_interpreter.session_id",
    "aws.bedrock_agentcore.code_interpreter.request_id",
    "aws.bedrock_agentcore.code_interpreter.tool.name",
    "process.command_line",
    "aws.bedrock_agentcore.code_interpreter.request_payload.code",
    "aws.bedrock_agentcore.code_interpreter.response_payload.stdout",
    "aws.bedrock_agentcore.code_interpreter.response_payload.stderr",
    "event.action",
    "event.outcome",
    "cloud.account.id",
    "cloud.region",
]

