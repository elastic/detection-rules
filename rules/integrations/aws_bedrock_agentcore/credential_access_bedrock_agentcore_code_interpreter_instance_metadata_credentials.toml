[metadata]
creation_date = "2026/11/25"
integration = ["aws_bedrock_agentcore"]
maturity = "production"
min_stack_comments = """
The aws_bedrock_agentcore integration adds the code_interpreter_application_logs data stream in package 1.5.0, which
requires Kibana 9.6.0 or later.
"""
min_stack_version = "9.6.0"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies code or shell commands submitted to an Amazon Bedrock AgentCore Code Interpreter that attempt to retrieve IAM
execution-role credentials from the microVM metadata service (MMDS), or a response that contains AWS temporary
credentials. An attacker with permission to invoke a Code Interpreter that has an execution role can retrieve the role's
credentials and reuse them outside AgentCore. This can elevate the attacker to the permissions of the attached role.
"""
false_positives = [
    """
    Authorized security testing or troubleshooting may query MMDS or inspect temporary credentials. Confirm the caller
    and purpose. Production Code Interpreters should not retrieve or return raw execution-role credentials.
    """,
]
from = "now-30m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Bedrock AgentCore Code Interpreter Accesses Instance Metadata Credentials"
note = """## Triage and analysis

### Investigating AWS Bedrock AgentCore Code Interpreter Accesses Instance Metadata Credentials

Amazon Bedrock AgentCore Code Interpreter executes caller-supplied code and shell commands in a Firecracker microVM. When a custom Code Interpreter has an IAM execution role attached, that role's temporary credentials are available from the microVM metadata service at `169.254.169.254`.

This rule detects submitted code or commands that reference MMDS credential endpoints or token headers. It also detects a temporary-credential object (`AccessKeyId`, `SecretAccessKey`, and a token) in stdout or stderr, which can reveal a successful credential retrieval even when the request was obfuscated or used an AWS SDK credential provider.

### Possible investigation steps

- Review `process.command_line`, `aws.bedrock_agentcore.code_interpreter.request_payload.code`, stdout, and stderr to determine how credentials were requested and whether the sandbox returned them.
- Identify the Code Interpreter, session, and tool. Pivot on `aws.bedrock_agentcore.code_interpreter.request_id` to the matching `InvokeCodeInterpreter` CloudTrail data event to identify the caller and source address.
- Confirm whether the Code Interpreter has an execution role. Code Interpreters without a role do not expose AWS role credentials through this path.
- Review CloudTrail for API calls made as the attached execution role after this event, especially `sts:GetCallerIdentity`, discovery, data access, and role-assumption activity from an external source.
- Correlate with `StartCodeInterpreterSession`, `CreateCodeInterpreter`, and `iam:PassRole` events to distinguish an existing-resource attack from an attacker-created resource.

### False positive analysis

- Approved security tests can reproduce this behavior. Confirm the source identity and exclude only the specific authorized principal or Code Interpreter.
- Code examples discussing MMDS could match, but live temporary credentials in the response strongly indicate successful credential access.

### Response and remediation

- Stop the affected session and revoke active sessions for the attached execution role. Investigate every action performed with it since the invocation.
- Remove the execution role when the Code Interpreter does not need AWS API access. Otherwise restrict it to the minimum required permissions and constrain `iam:PassRole`.
- Enable CloudTrail data events for Code Interpreter resources and application-log delivery for every custom Code Interpreter.
"""
references = ["https://www.beyondtrust.com/blog/entry/aws-agentcore-privilege-escalation"]
risk_score = 73
rule_id = "268da8be-d4d2-42f9-852f-0a1c538b211f"
setup = "This rule requires version 1.5.0 or later of the Amazon Bedrock AgentCore integration and Code Interpreter APPLICATION_LOGS delivery collected into the aws_bedrock_agentcore.code_interpreter_application_logs dataset. CloudTrail data events for AWS::BedrockAgentCore::CodeInterpreterCustom are recommended for caller attribution."
severity = "high"
tags = [
    "Domain: Cloud",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Platform: AWS",
    "Data Source: AWS Bedrock",
    "Data Source: Amazon Bedrock",
    "Service: AWS Bedrock",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
    "Threat: IMDS Credential Theft",
    "Threat: Unauthorized AI Usage",
    "Rule Type: ES|QL",
    "Domain: GenAI",
    "Mitre Atlas: AML.T0098",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-aws_bedrock_agentcore.code_interpreter_application_logs-* metadata _id, _version, _index
| where aws.bedrock_agentcore.code_interpreter.operation == "InvokeCodeInterpreter" and (
    process.command_line like (
        "*169.254.169.254*",
        "*fd00:ec2::254*",
        "*/latest/api/token*",
        "*/latest/meta-data/iam*",
        "*security-credentials*",
        "*X-aws-ec2-metadata-token*"
    )
    or aws.bedrock_agentcore.code_interpreter.request_payload.code like (
        "*169.254.169.254*",
        "*fd00:ec2::254*",
        "*/latest/api/token*",
        "*/latest/meta-data/iam*",
        "*security-credentials*",
        "*X-aws-ec2-metadata-token*"
    )
    or (
        aws.bedrock_agentcore.code_interpreter.response_payload.stdout like "*AccessKeyId*" and
        aws.bedrock_agentcore.code_interpreter.response_payload.stdout like "*SecretAccessKey*" and
        aws.bedrock_agentcore.code_interpreter.response_payload.stdout like ("*Token*", "*SessionToken*")
    )
    or (
        aws.bedrock_agentcore.code_interpreter.response_payload.stderr like "*AccessKeyId*" and
        aws.bedrock_agentcore.code_interpreter.response_payload.stderr like "*SecretAccessKey*" and
        aws.bedrock_agentcore.code_interpreter.response_payload.stderr like ("*Token*", "*SessionToken*")
    )
)
| keep _id, _version, _index, @timestamp, aws.*, cloud.*, event.*, process.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
