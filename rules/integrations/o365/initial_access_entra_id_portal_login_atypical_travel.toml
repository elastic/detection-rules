field_names = [
    "o365.audit.UserId",
    "source.geo.country_name",
    "source.geo.region_name",
    "Esql.first_seen",
    "Esql.last_seen",
    "Esql.event_count",
    "Esql.source_ip_values",
    "Esql.actor_ip_values",
    "Esql.source_as_organization_name_values",
    "Esql.user_agent_original_values",
    "Esql.application_id_values",
    "Esql.object_id_values",
    "Esql.request_type_values",
    "Esql.result_status_detail_values",
