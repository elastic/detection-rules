[metadata]
creation_date = "2026/08/07"
integration = ["azure"]
maturity = "production"
updated_date = "2026/08/07"

[rule]
author = ["Elastic"]
description = """
Identifies a Microsoft Entra ID device registration that follows shortly after a phishing-resistant, device-bound
credential (Windows Hello for Business, FIDO2 security key, or passkey) was used to sign in with no device identifier.
In the "borrowing Windows Hello keys" technique, an adversary reuses a WHfB/NGC key or passkey away from its bound
device to mint device-agnostic tokens, then uses those tokens to register an attacker-controlled device and obtain a
Primary Refresh Token (PRT) for long-lived persistence. Correlating a deviceless WHfB/passkey sign-in with a subsequent
device registration by the same user is a high-fidelity signal of this escalation and is distinct from device-code-flow
phishing kits.
"""
from = "now-30m"
index = ["filebeat-*", "logs-azure.signinlogs-*", "logs-azure.auditlogs-*"]
language = "eql"
license = "Elastic License v2"
name = "Entra ID Deviceless Windows Hello Sign-in Followed by Device Registration"
note = """## Triage and analysis

### Investigating Entra ID Deviceless Windows Hello Sign-in Followed by Device Registration

This rule correlates two events by the same user within a short window: (1) a sign-in satisfied by a device-bound credential (Windows Hello for Business, FIDO2, or passkey) with an empty `device_detail.device_id`, followed by (2) a device registration. Device-bound credentials should only sign in from the device that holds them; a deviceless WHfB/passkey sign-in that is immediately used to register a new device is the escalation step of the "borrowing Windows Hello keys" technique, establishing attacker device persistence and a Primary Refresh Token.

### Possible investigation steps
- Identify the user via `azure.signinlogs.properties.user_principal_name` / `azure.auditlogs.properties.initiated_by.user.userPrincipalName`.
- Confirm the first-stage sign-in used a device-bound method (`authentication_details.authentication_method`) with no `device_detail.device_id`.
- Review the registered device name and id in the `Register device` / `Add registered owner to device` audit event. Tooling-registered devices are often generic (for example DESKTOP-*) or default OS builds.
- Examine `source.ip`, `source.geo.*`, and `user_agent.original` on the sign-in for automation or hosting/VPS origins (ROADtools/roadtx).
- Check for a Primary Refresh Token issuance and any subsequent "Add Windows Hello for Business credential" event for the same user (backdoor enrollment).

### False positive analysis
- A user completing initial passwordless enrollment and registering their first device in the same session could match. Correlate with expected onboarding activity and the device's provenance.

### Response and remediation
- Delete the attacker-registered device and revoke the user's sessions and refresh tokens (delete devices first to break device-bound PRT persistence).
- Treat the WHfB/passkey key as compromised: remove the affected authentication methods and re-enroll from a trusted device.
- Review Conditional Access to require compliant devices for sensitive resources.
"""
references = [
    "https://dirkjanm.io/borrowing-windows-hello-keys/",
    "https://dirkjanm.io/phishing-for-microsoft-entra-primary-refresh-tokens/",
]
risk_score = 73
rule_id = "62848597-595c-4cc3-8d24-6c47a5fee9a9"
setup = """#### Required Microsoft Entra ID Sign-In and Audit Logs
This rule requires the Azure integration with Microsoft Entra ID Sign-In and Audit logs enabled and collected via Azure Event Hub.
"""
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Tactic: Defense Evasion",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Sign-in Logs",
    "Data Source: Microsoft Entra ID Audit Logs",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence with maxspan=15m
  [authentication where
    data_stream.dataset == "azure.signinlogs" and
    azure.signinlogs.result_signature == "SUCCESS" and
    azure.signinlogs.properties.user_type == "Member" and
    azure.signinlogs.properties.authentication_details.authentication_method in (
        "Windows Hello for Business", "FIDO2*", "Passkey*", "*passkey*"
    ) and
    (
        azure.signinlogs.properties.device_detail.device_id == null or
        azure.signinlogs.properties.device_detail.device_id == "" or
        azure.signinlogs.properties.device_detail.is_managed != true
    )
  ] by azure.signinlogs.properties.user_id
  [any where
    data_stream.dataset == "azure.auditlogs" and
    azure.auditlogs.operation_name in ("Register device", "Add registered owner to device", "Add device") and
    event.outcome == "success"
  ] by azure.auditlogs.properties.initiated_by.user.id
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.005"
name = "Device Registration"
reference = "https://attack.mitre.org/techniques/T1098/005/"



