[metadata]
creation_date = "2026/08/07"
integration = ["azure"]
maturity = "production"
updated_date = "2026/08/07"

[rule]
author = ["Elastic"]
description = """
Identifies the first-seen registration of a Windows Hello for Business (WHfB) credential for a Microsoft Entra ID user
from a given source ASN in a tenant, based on a 14-day new_terms history. Enrollment is commonly part of legitimate
onboarding or passwordless rollout and is not inherently malicious. Adversaries who have obtained a token that satisfies
fresh (NGC) multi-factor authentication - for example by borrowing an existing WHfB key or passkey - can also enroll
their own WHfB credential to establish durable, phishing-resistant persistence that survives password resets and
standard session revocation. Correlate first-seen enrollments with the sign-in and device state that preceded them.
"""
false_positives = [
    """
    Legitimate WHfB and passwordless onboarding commonly generate this event, especially for new users or users
    enrolling from a new network ASN. This rule fires only on first-seen combinations of tenant, user, and source ASN
    over 14 days. Investigate unexpected ASNs, users outside the enrollment population, or enrollments preceded by
    anomalous sign-ins.
    """,
]
from = "now-9m"
index = ["filebeat-*", "logs-azure.auditlogs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Windows Hello for Business Credential Registered"
note = """## Triage and analysis

### Investigating Entra ID Windows Hello for Business Credential Registered

This is a first-seen (new_terms) signal: a WHfB credential was registered for a tenant, user, and source ASN combination that has not been observed in the prior 14 days. Enrolling a WHfB credential adds a phishing-resistant, device-bound authenticator to a user. That is often legitimate onboarding and is not inherently malicious. Adversaries can abuse the same action as persistence: after obtaining a token with a fresh MFA (NGC) claim - often by borrowing an existing WHfB key or passkey - they enroll their own WHfB credential, which survives password resets and ordinary session revocation.

### Possible investigation steps
- Identify the target via `azure.auditlogs.properties.target_resources.0.user_principal_name` and the initiator via `azure.auditlogs.properties.initiated_by.user.userPrincipalName`.
- Confirm whether the user was expected to enroll WHfB (onboarding, passwordless rollout) and whether the source ASN is new for that user.
- Correlate with `azure.signinlogs` for the same user shortly before: look for a deviceless WHfB/passkey sign-in, device-code flow, or an attacker device registration and PRT issuance.
- Review whether the user already had authentication methods; an additional WHfB credential on an established account from a new ASN is more suspicious.
- Examine source IP/geo and user agent of the preceding sign-in for automation or hosting/VPS origins.

### False positive analysis
- First-time WHfB enrollment during onboarding or passwordless rollout is expected. Repeat enrollments from the same tenant, user, and ASN within 14 days do not fire.
- Users traveling or switching ISP/VPN may appear as a new ASN. Validate against known networks before treating as suspicious.

### Response and remediation
- If unauthorized, delete the WHfB credential (and any attacker-registered device) via Microsoft Graph or the Entra portal.
- Revoke the user's sessions and refresh tokens (delete registered devices first to break device-bound PRT persistence).
- Reset credentials and re-enroll phishing-resistant methods from a trusted device.
- Review the sign-in that authorized the enrollment to determine the initial access vector.
"""
references = ["https://dirkjanm.io/borrowing-windows-hello-keys/"]
risk_score = 21
rule_id = "8c6f8cca-f730-4cdd-93a7-d65f087a4116"
setup = """#### Required Microsoft Entra ID Audit Logs
This rule requires the Azure integration with Microsoft Entra ID Audit logs enabled and collected via Azure Event Hub.
"""
severity = "low"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Platform: Entra ID",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Rule Type: New Terms",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Audit Logs",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset: "azure.auditlogs" and
    azure.auditlogs.operation_name: "Add Windows Hello for Business credential" and
    event.outcome: ("Success" or "success") and
    azure.tenant_id: * and
    azure.auditlogs.properties.initiated_by.user.userPrincipalName: * and
    source.as.number: *
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.001"
name = "Additional Cloud Credentials"
reference = "https://attack.mitre.org/techniques/T1098/001/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

[rule.new_terms]
field = "new_terms_fields"
value = [
    "azure.tenant_id",
    "azure.auditlogs.properties.initiated_by.user.userPrincipalName",
    "source.as.number",
]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-14d"


