[metadata]
creation_date = "2026/08/07"
integration = ["azure"]
maturity = "production"
updated_date = "2026/08/07"

[rule]
author = ["Elastic"]
description = """
Identifies the registration of a Windows Hello for Business (WHfB) credential on a Microsoft Entra ID user account.
Adversaries who have obtained a token that satisfies fresh (NGC) multi-factor authentication - for example by borrowing
an existing WHfB key or passkey - can enroll their own WHfB credential to establish durable, phishing-resistant
persistence that survives password resets and standard session revocation. In environments that are not actively rolling
out passwordless authentication, enrollment of a WHfB credential is high-signal and should be correlated with the
sign-in and device state that preceded it.
"""
false_positives = [
    """
    Organizations actively deploying Windows Hello for Business or passwordless authentication will generate this event
    during legitimate user enrollment. Tune to new_terms on the user, scope to users outside the enrollment population,
    or correlate with anomalous preceding sign-ins during rollout periods.
    """,
]
from = "now-9m"
index = ["filebeat-*", "logs-azure.auditlogs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Windows Hello for Business Credential Registered"
note = """## Triage and analysis

### Investigating Entra ID Windows Hello for Business Credential Registered

Enrolling a Windows Hello for Business (WHfB) credential adds a phishing-resistant, device-bound authenticator to a user. Adversaries abuse this as persistence: after obtaining a token with a fresh MFA (NGC) claim - often by borrowing an existing WHfB key or passkey - they enroll their own WHfB credential, which survives password resets and ordinary session revocation. In tenants not actively deploying passwordless, this event is rare and high-signal.

### Possible investigation steps
- Identify the target via `azure.auditlogs.properties.target_resources.0.user_principal_name` and the initiator via `azure.auditlogs.properties.initiated_by.user.userPrincipalName`.
- Determine whether the user was expected to enroll WHfB (onboarding, passwordless rollout). If not, treat as suspicious.
- Correlate with `azure.signinlogs` for the same user shortly before: look for a deviceless WHfB/passkey sign-in, device-code flow, or an attacker device registration and PRT issuance.
- Review whether the user already had authentication methods; an additional WHfB credential on an established account is more suspicious.
- Examine source IP/geo and user agent of the preceding sign-in for automation or hosting/VPS origins.

### False positive analysis
- Legitimate WHfB / passwordless onboarding generates this event. During active rollout, scope out the enrolling population or convert to a first-seen (new_terms) approach per user.

### Response and remediation
- If unauthorized, delete the WHfB credential (and any attacker-registered device) via Microsoft Graph or the Entra portal.
- Revoke the user's sessions and refresh tokens (delete registered devices first to break device-bound PRT persistence).
- Reset credentials and re-enroll phishing-resistant methods from a trusted device.
- Review the sign-in that authorized the enrollment to determine the initial access vector.
"""
references = ["https://dirkjanm.io/borrowing-windows-hello-keys/"]
risk_score = 47
rule_id = "8c6f8cca-f730-4cdd-93a7-d65f087a4116"
setup = """#### Required Microsoft Entra ID Audit Logs
This rule requires the Azure integration with Microsoft Entra ID Audit logs enabled and collected via Azure Event Hub.
"""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Audit Logs",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset: "azure.auditlogs" and
    azure.auditlogs.operation_name: "Add Windows Hello for Business credential" and
    event.outcome: ("Success" or "success") and
    azure.tenant_id: *
'''

[rule.new_terms]
field = "new_terms_fields"
value = ["azure.tenant_id"]

[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-5d"

[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.005"
name = "Device Registration"
reference = "https://attack.mitre.org/techniques/T1098/005/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

