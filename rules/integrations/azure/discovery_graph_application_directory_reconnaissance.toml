reference = "https://attack.mitre.org/tactics/TA0007/"

[rule.investigation_fields]
field_names = [
    "azure.tenant_id",
    "azure.graphactivitylogs.properties.service_principal_id",
    "Esql.paths",
    "Esql.status_codes",
    "Esql.source_ips",
    "Esql.time_window",
]
