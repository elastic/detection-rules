[metadata]
creation_date = "2026/10/21"
integration = ["azure"]
maturity = "production"
updated_date = "2026/10/21"

[rule]
author = ["Elastic"]
description = """
Identifies a Microsoft Entra ID user whose recent fresh authentications are predominantly phishing-resistant
(passkey/FIDO2 or Windows Hello for Business) but who then successfully completes a phishable method such as
Authenticator push, OATH, SMS, or voice. Adversary-in-the-middle proxies force this downgrade by suppressing the passkey
prompt so the victim falls back to a relayable method. Legitimate fallback produces the same pattern, so the alert
requires corroboration.
"""
false_positives = [
    """
    A user who predominantly uses a passkey can legitimately fall back to a weaker method when their authenticator is
    unavailable (lost or forgotten security key, new or wiped device, biometric failure). Correlate the triggering
    session's source IP, geo, ASN, user agent, device, and Conditional Access result with the user's norm, and confirm
    whether a help-desk or self-service recovery occurred. Only meaningful in environments with meaningful passkey
    adoption.
    """,
]
from = "now-7d"
interval = "1h"
language = "esql"
license = "Elastic License v2"
name = "Entra ID MFA Downgrade from Phishing-Resistant Posture"
note = """## Triage and analysis

### Investigating Entra ID MFA Downgrade from Phishing-Resistant Posture

This rule flags a user whose fresh authentications over the window are predominantly phishing-resistant (passkey/FIDO2 or Windows Hello for Business) but who then successfully completed authentication with a phishable method (Authenticator push, OATH, SMS, or voice) in the recent trigger window. Each sign-in's `authentication_details` steps are paired with their `succeeded` flag, so only methods that actually succeeded are counted. The phishing-resistant ratio is computed only over sessions with a successful fresh method (resistant plus phishable); sessions with only single sign-on token reuse (or whose establishing event is outside the window) are reported as unknown and excluded from the ratio rather than assumed to be passkey. Adversary-in-the-middle phishing can force this downgrade by suppressing the passkey prompt so the victim falls back to a relayable method the proxy can capture.

### Possible investigation steps

- Review the triggering phishable session(s) (`Esql.trigger_ips`, `Esql.trigger_apps`, `Esql.trigger_sessions`): inspect `Esql.trigger_user_agents` and `device_detail` for an unsupported/impossible browser-OS pairing, `source.ip`/geo/ASN for hosting or VPS origins, and `Esql.trigger_ca_status` for whether Conditional Access actually granted access.
- Confirm the user is genuinely passkey-preferring (`Esql.resistant_sessions`, `Esql.fresh_auth_sessions`, `Esql.resistant_ratio`) rather than one who routinely mixes methods, and review `Esql.unknown_sessions` (token reuse / unresolved origin) separately.
- Correlate with recent authentication-method registration (a new passkey added nearby) and with device registration or PRT issuance for post-compromise persistence, and with subsequent `Previously satisfied` token reuse from a new ASN (stolen-session use).

### False positive analysis

- Legitimate fallback when a passkey authenticator is unavailable produces the same shape; validate device, network, and recovery workflow.
- A durable shift away from passkey lowers the resistant ratio over the window and stops qualifying.

### Response and remediation

- If unauthorized, treat the account as potentially compromised: revoke sessions and refresh tokens, remove any attacker-registered authentication methods or devices (delete devices first to break device-bound PRT persistence), and reset credentials.
- Enforce a phishing-resistant Conditional Access authentication strength so weaker methods cannot satisfy authentication.
"""
references = [
    "https://www.proofpoint.com/us/blog/threat-insight/dont-phish-let-me-down-fido-authentication-downgrade",
    "https://pushsecurity.com/blog/mfa-downgrade-attacks",
    "https://www.ioactive.com/authentication-downgrade-attacks-deep-dive-into-mfa-bypass/",
    "https://www.elastic.co/security-labs/entra-id-oauth-phishing-detection",
]
risk_score = 47
rule_id = "df328357-ebe0-4e51-94df-3bda9fa990f7"
setup = """#### Required Microsoft Entra ID Sign-In Logs
This rule requires the Azure integration with Microsoft Entra ID Sign-In logs enabled and collected via Azure Event Hub.
"""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Platform: Entra ID",
    "Platform: Azure",
    "Data Source: Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Threat: AiTM Phishing",
    "Rule Type: ES|QL",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-azure.signinlogs-*
| WHERE azure.signinlogs.category == "SignInLogs"
    AND azure.signinlogs.properties.session_id IS NOT NULL
    AND azure.signinlogs.properties.authentication_details IS NOT NULL
    AND azure.signinlogs.properties.user_id IS NOT NULL
    AND azure.signinlogs.properties.user_principal_name IS NOT NULL
    AND azure.signinlogs.properties.tenant_id IS NOT NULL
| EVAL ad = TO_STRING(azure.signinlogs.properties.authentication_details)
| GROK ad """"authentication_method":%{DATA:method_raw},"authentication_"""
| GROK ad """"succeeded":%{DATA:succeeded_raw}}"""
| EVAL Esql.auth_methods = SPLIT(REPLACE(method_raw, """[\[\]"]""", ""), ","),
       Esql.auth_method_succeeded = SPLIT(REPLACE(succeeded_raw, """[\[\]"]""", ""), ",")
| EVAL Esql.method_outcome_pairs = MV_CONCAT(MV_ZIP(Esql.auth_methods, Esql.auth_method_succeeded, "~"), " || ")
| EVAL Esql.resistant_method_success = CASE(
      Esql.method_outcome_pairs LIKE "*Passkey (synced)~true*" OR Esql.method_outcome_pairs LIKE "*Passkey (device-bound)~true*"
      OR Esql.method_outcome_pairs LIKE "*FIDO2 security key~true*" OR Esql.method_outcome_pairs LIKE "*Windows Hello for Business~true*", 1, 0),
    Esql.phishable_method_success = CASE(
      Esql.method_outcome_pairs LIKE "*Mobile app notification~true*" OR Esql.method_outcome_pairs LIKE "*OATH verification code~true*"
      OR Esql.method_outcome_pairs LIKE "*Text message~true*" OR Esql.method_outcome_pairs LIKE "*Voice call~true*", 1, 0),
    Esql.in_trigger_window = CASE(@timestamp >= NOW() - 24 hour, 1, 0)
| EVAL Esql.trigger_ip = CASE(Esql.phishable_method_success == 1 AND Esql.in_trigger_window == 1, source.ip, null),
       Esql.trigger_app = CASE(Esql.phishable_method_success == 1 AND Esql.in_trigger_window == 1, azure.signinlogs.properties.app_display_name, null),
       Esql.trigger_session = CASE(Esql.phishable_method_success == 1 AND Esql.in_trigger_window == 1, azure.signinlogs.properties.session_id, null),
       Esql.trigger_user_agent = CASE(Esql.phishable_method_success == 1 AND Esql.in_trigger_window == 1, user_agent.original, null),
       Esql.trigger_ca = CASE(Esql.phishable_method_success == 1 AND Esql.in_trigger_window == 1, azure.signinlogs.properties.conditional_access_status, null)
| STATS Esql.total_sessions = COUNT_DISTINCT(azure.signinlogs.properties.session_id),
        Esql.resistant_sessions = COUNT_DISTINCT(CASE(Esql.resistant_method_success == 1, azure.signinlogs.properties.session_id, null)),
        Esql.phishable_sessions = COUNT_DISTINCT(CASE(Esql.phishable_method_success == 1, azure.signinlogs.properties.session_id, null)),
        Esql.trigger_phishable_sessions = COUNT_DISTINCT(CASE(Esql.phishable_method_success == 1 AND Esql.in_trigger_window == 1, azure.signinlogs.properties.session_id, null)),
        Esql.last_seen = MAX(@timestamp),
        Esql.trigger_ips = VALUES(Esql.trigger_ip),
        Esql.trigger_apps = VALUES(Esql.trigger_app),
        Esql.trigger_sessions = VALUES(Esql.trigger_session),
        Esql.trigger_user_agents = VALUES(Esql.trigger_user_agent),
        Esql.trigger_ca_status = VALUES(Esql.trigger_ca)
    BY azure.signinlogs.properties.tenant_id, azure.signinlogs.properties.user_id, user.name = azure.signinlogs.properties.user_principal_name
| WHERE Esql.resistant_sessions >= 1 AND Esql.trigger_phishable_sessions >= 1
| EVAL Esql.unknown_sessions = Esql.total_sessions - Esql.phishable_sessions - Esql.resistant_sessions,
       Esql.fresh_auth_sessions = Esql.resistant_sessions + Esql.phishable_sessions,
       Esql.resistant_ratio_raw = Esql.resistant_sessions::double / (Esql.resistant_sessions + Esql.phishable_sessions)
| WHERE Esql.resistant_ratio_raw >= 0.9
| EVAL Esql.resistant_ratio = ROUND(Esql.resistant_ratio_raw, 2)
| KEEP user.name, azure.signinlogs.properties.tenant_id, azure.signinlogs.properties.user_id,
       Esql.total_sessions, Esql.resistant_sessions, Esql.phishable_sessions, Esql.unknown_sessions,
       Esql.fresh_auth_sessions, Esql.trigger_phishable_sessions, Esql.resistant_ratio, Esql.last_seen,
       Esql.trigger_ips, Esql.trigger_apps, Esql.trigger_sessions, Esql.trigger_user_agents, Esql.trigger_ca_status
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1556"
name = "Modify Authentication Process"
reference = "https://attack.mitre.org/techniques/T1556/"
[[rule.threat.technique.subtechnique]]
id = "T1556.006"
name = "Multi-Factor Authentication"
reference = "https://attack.mitre.org/techniques/T1556/006/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.alert_suppression]
group_by = ["azure.signinlogs.properties.user_id"]
missing_fields_strategy = "suppress"

[rule.alert_suppression.duration]
unit = "h"
value = 168

