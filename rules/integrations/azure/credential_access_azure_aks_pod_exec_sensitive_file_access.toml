[metadata]
creation_date = "2026/11/23"
integration = ["azure"]
maturity = "production"
min_stack_comments = "field_extract (flattened field support) is available starting in 9.5.0, as a Technical Preview function; GA in 9.6.0."
min_stack_version = "9.5.0"
updated_date = "2026/11/23"

[rule]
author = ["Elastic"]
description = """
Detects an AKS (Azure Kubernetes Service) pods/exec session whose decoded command references sensitive credential paths,
such as mounted service account and Azure Workload Identity tokens, the node cloud provider configuration
(/etc/kubernetes/azure.json), kubelet and Azure VM agent state, host credential files, user cloud and SSH credential
directories, private key material, and process environment variables. Adversaries exec into pods to harvest mounted
tokens and host credentials for persistence and lateral movement. Node, control-plane, and kube-system service account
identities are excluded.
"""
false_positives = [
    """
    Break-glass debugging that reads service account tokens or credential files should be rare and ticketed. Exclude
    specific operator identities after review rather than removing path patterns.
    """,
]
from = "now-9m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Azure AKS Pod Exec Sensitive File or Credential Path Access"
note = """## Triage and analysis

### Investigating Azure AKS Pod Exec Sensitive File or Credential Path Access

AKS kube-audit events are carried under the flattened `azure.platformlogs.properties.log.*` subtree and share the ARM
operation `event.action: Microsoft.ContainerService/managedClusters/diagnosticLogs/Read`. The exec command is only
recorded as URL-encoded `command=` parameters in `requestURI`, so the rule decodes it into `Esql.executed_command` before
matching. Only the `ResponseComplete` audit stage is evaluated, because AKS records both `ResponseStarted` and
`ResponseComplete` for each exec session.

### Possible investigation steps

- Review `Esql.executed_command` and `Esql.access_type`. `AZURE_WORKLOAD_IDENTITY_TOKEN`, `AZURE_NODE_CLOUD_CONFIG`, and
  `AZURE_VM_AGENT_SETTINGS` can expose Azure credentials directly; `K8S_SA_TOKEN` and `MOUNTED_SECRET` expose cluster
  credentials.
- Review `Esql.username`, `Esql.user_agent`, and `Esql.source_ips` to identify the operator and client, and check
  `Esql.response_code` (`101` means the session was established).
- Determine what the target pod in `Esql.namespace`/`Esql.pod_name` mounts: its service account permissions, Workload
  Identity federation, hostPath volumes, or privileged settings that expose node files.
- Correlate with subsequent secret reads, TokenRequest calls, or Azure sign-ins that reuse the harvested material.

### False positive analysis

- Incident response or platform engineering workflows that inspect tokens may match; exclude the stable operator
  identity after review.
- Reading public certificate bundles that end in `.pem` can match `CERTIFICATE_OR_KEY`; validate the exact path.

### Response and remediation

- If unauthorized, terminate the exec session, revoke the acting identity, and rotate any tokens, keys, or managed
  identity credentials that may have been read.
- Disable `automountServiceAccountToken` where unused, drop capabilities, and avoid hostPath mounts of node paths.
- Collect kube-audit artifacts per incident response procedures.
"""
references = [
    "https://kubernetes.io/docs/concepts/security/pod-security-standards/",
    "https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview",
    "https://microsoft.github.io/Threat-Matrix-for-Kubernetes/",
    "https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/",
    "https://github.com/inguardians/peirates",
]
risk_score = 73
rule_id = "3fb68caa-c41a-47bb-be9d-481915e7b1c8"
setup = """The Azure Fleet integration collecting AKS diagnostic logs with the `kube-audit` category forwarded through Event Hub
into the `azure.platformlogs` data stream is required for this rule. kubectl 1.30 and later issue pod exec as a `get`
request, which the `kube-audit-admin` category excludes.
"""
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: Kubernetes",
    "Domain: Containers",
    "Data Source: Azure",
    "Data Source: Azure Platform Logs",
    "Data Source: Kubernetes",
    "Platform: Azure",
    "Platform: Kubernetes",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Execution",
    "Resources: Investigation Guide",
    "Noise: Low",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-azure.platformlogs-* METADATA _id, _index, _version
| WHERE data_stream.dataset == "azure.platformlogs"
    AND event.action == "Microsoft.ContainerService/managedClusters/diagnosticLogs/Read"
    AND azure.platformlogs.category == "kube-audit"
| EVAL Esql.stage = FIELD_EXTRACT(azure.platformlogs.properties, "log.stage"),
    Esql.resource = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.resource"),
    Esql.subresource = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.subresource"),
    Esql.verb = FIELD_EXTRACT(azure.platformlogs.properties, "log.verb"),
    Esql.requestURI = FIELD_EXTRACT(azure.platformlogs.properties, "log.requestURI"),
    Esql.namespace = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.namespace"),
    Esql.pod_name = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.name"),
    Esql.username = FIELD_EXTRACT(azure.platformlogs.properties, "log.user.username"),
    Esql.user_agent = FIELD_EXTRACT(azure.platformlogs.properties, "log.userAgent"),
    Esql.source_ips = FIELD_EXTRACT(azure.platformlogs.properties, "log.sourceIPs"),
    Esql.response_code = FIELD_EXTRACT(azure.platformlogs.properties, "log.responseStatus.code")
| WHERE Esql.stage == "ResponseComplete"
    AND Esql.resource == "pods"
    AND Esql.subresource == "exec"
    AND Esql.verb IN ("create", "get")
    AND Esql.requestURI LIKE "*command=*"
    AND Esql.username IS NOT NULL
    AND NOT Esql.username RLIKE "system:node:.*|system:serviceaccount:kube-system:.*"
    AND NOT Esql.username IN ("aksService", "hcpService", "readinessChecker", "system:apiserver", "system:kube-controller-manager", "system:kube-scheduler")
| EVAL Esql.executed_command = TRIM(REPLACE(REPLACE(REPLACE(
    URL_DECODE(Esql.requestURI),
    """^[^?]*\?""", ""),
    """&?(container|stderr|stdin|stdout|tty)=[^&]*""", ""),
    """&?command=""", " "))
| WHERE Esql.executed_command RLIKE """.*(/var/run/secrets/|/run/secrets/|/etc/kubernetes/|/var/lib/kubelet/|/var/lib/waagent/|/etc/shadow|/etc/gshadow|/etc/passwd|/etc/sudoers|(\~|\$HOME|/root|/home/[^/]+)/\.(ssh|aws|azure|kube|docker|config/gcloud)|\.p12|\.pfx|\.pem|\.key|\.jks|\.keystore|/etc/.*\.conf.*(password|secret|key|token|credential)|/proc/.*/environ).*"""
    AND NOT Esql.executed_command RLIKE """.*/etc/resolv\.conf.*"""
| EVAL Esql.access_type = CASE(
    Esql.executed_command RLIKE """.*/var/run/secrets/azure/tokens/.*""", "AZURE_WORKLOAD_IDENTITY_TOKEN",
    Esql.executed_command RLIKE """.*/etc/kubernetes/azure\.json.*""", "AZURE_NODE_CLOUD_CONFIG",
    Esql.executed_command RLIKE """.*/var/lib/waagent/.*""", "AZURE_VM_AGENT_SETTINGS",
    Esql.executed_command RLIKE """.*/var/run/secrets/kubernetes\.io/serviceaccount/token.*""", "K8S_SA_TOKEN",
    Esql.executed_command RLIKE """.*(/var)?/run/secrets/.*""", "MOUNTED_SECRET",
    Esql.executed_command RLIKE """.*/etc/kubernetes/.*""", "K8S_CONFIG",
    Esql.executed_command RLIKE """.*/var/lib/kubelet/.*""", "KUBELET_CONFIG",
    Esql.executed_command RLIKE """.*/etc/g?shadow.*""", "HOST_CREDENTIALS",
    Esql.executed_command RLIKE """.*/etc/passwd.*""", "USER_ENUMERATION",
    Esql.executed_command RLIKE """.*/etc/sudoers.*""", "SUDOERS_ACCESS",
    Esql.executed_command RLIKE """.*(\~|\$HOME|/root|/home/[^/]+)/\.(ssh|aws|azure|kube|docker|config/gcloud).*""", "USER_CREDENTIALS",
    Esql.executed_command RLIKE """.*\.(p12|pfx|pem|key|jks|keystore).*""", "CERTIFICATE_OR_KEY",
    Esql.executed_command RLIKE """.*/proc/.*/environ.*""", "PROCESS_ENV_SECRETS",
    "EMBEDDED_CONFIG_SECRET"
  )
| KEEP Esql.*, event.action, data_stream.namespace, _id, _index, _version
'''


