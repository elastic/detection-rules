[metadata]
creation_date = "2026/11/25"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies a Microsoft Entra agent identity or agent identity blueprint principal authenticating from a source
geolocation (country) that, together with the identity, has not appeared in recent history. Agent identities
authenticate through the blueprint token-exchange flow and blueprint principals authenticate with the blueprint's
credentials; both normally originate from a fixed runtime egress and a stable set of countries. A first-seen country for
an agent or blueprint identity can indicate a leaked blueprint credential being exercised from attacker infrastructure,
a consented third-party blueprint being driven from the attacker's location (as in Proofpoint's "BluePhishing"
research), or an agent being operated from outside its intended runtime.
"""
false_positives = [
    """
    New agent runtime deployments, region or egress changes, travel of an operator driving a credential, or DR exercises
    can produce a legitimate first-seen country for an agent or blueprint identity. Validate with the owning team and
    baseline expected egress before excluding.
    """,
    """
    Initial onboarding of new agent identities or blueprints will register first-seen countries. Suppress expected
    onboarding waves rather than disabling the rule.
    """,
    "    GeoIP enrichment updates can occasionally produce a one-time new country for a stable egress IP.\n    ",
]
from = "now-65m"
index = ["filebeat-*", "logs-azure.signinlogs-*"]
interval = "1h"
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Agent Identity or Blueprint Sign-in from Unusual Geolocation"
note = """## Triage and analysis

### Investigating Entra ID Agent Identity or Blueprint Sign-in from Unusual Geolocation

This rule matches successful **ServicePrincipalSignInLogs** events where the acting identity is an agent identity
blueprint principal or a child agent identity (`azure.signinlogs.properties.agent.agent_type` is
`agentIdentityBlueprintPrincipal` or `agenticAppInstance`) and the pair `azure.signinlogs.properties.app_id` +
`source.geo.country_name` has not been seen in the history window. This is a first-seen country for the identity, not
proof of compromise by itself.

#### Possible investigation steps

- Identify the identity and type from `azure.signinlogs.properties.app_id`, `azure.signinlogs.properties.service_principal_name`,
  and `azure.signinlogs.properties.agent.agent_type`; for child agents, note the blueprint in
  `azure.signinlogs.properties.agent.parent_app_id`.
- Review `source.ip`, `source.geo.country_name`, `source.geo.city_name`, and `source.as.organization.name` against the
  identity's expected runtime and egress.
- Determine whether the identity (or its blueprint) is owned by an external organization (service principal
  `appOwnerOrganizationId` differs from the tenant), which would indicate a consented third-party blueprint.
- Check for a preceding blueprint sign-in with a new credential or a first-seen blueprint principal for the same
  blueprint, which would indicate the two-stage token exchange from a new location.
- Pivot on `azure.signinlogs.properties.agent.parent_app_id` to see whether sibling agents authenticated from the same
  unusual country.

### False positive analysis

- New runtimes, regions, operator travel, or CI/CD expansion can produce a legitimate first-seen country. Validate with
  the owner and prefer allowlisting reviewed identities over disabling the rule.

### Response and remediation

- If the location is unexpected, treat as a potential blueprint credential incident: rotate blueprint credentials, review
  child agent permissions (direct and inherited), and apply Conditional Access to the blueprint.
"""
references = [
    "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent",
    "https://learn.microsoft.com/en-us/entra/agent-id/sign-in-audit-logs-agents",
    "https://learn.microsoft.com/en-us/entra/agent-id/agent-autonomous-app-oauth-flow",
    "https://securitylabs.datadoghq.com/articles/agent-id-inside-agent-compromise/",
]
risk_score = 47
rule_id = "e7a2d1b9-4c63-4f58-9b0a-3d8e2c7f1a46"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Initial Access",
    "Resources: Investigation Guide",
    "Rule Type: New Terms",
    "Platform: Entra ID",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:azure.signinlogs
    and azure.signinlogs.category:ServicePrincipalSignInLogs
    and azure.signinlogs.properties.status.error_code:0
    and azure.signinlogs.properties.agent.agent_type:("agenticAppInstance" or "agentIdentityBlueprintPrincipal")
    and azure.signinlogs.properties.app_id:*
    and source.geo.country_name:*
    and not source.as.organization.name:(*MICROSOFT* or *Microsoft*)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"
[[rule.threat.technique.subtechnique]]
id = "T1078.004"
name = "Cloud Accounts"
reference = "https://attack.mitre.org/techniques/T1078/004/"



[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "source.ip",
    "source.geo.country_name",
    "source.geo.city_name",
    "source.as.number",
    "source.as.organization.name",
    "azure.signinlogs.properties.app_id",
    "azure.signinlogs.properties.service_principal_name",
    "azure.signinlogs.properties.agent.agent_type",
    "azure.signinlogs.properties.agent.parent_app_id",
    "azure.signinlogs.properties.resource_display_name",
    "azure.signinlogs.properties.correlation_id",
]

[rule.new_terms]
field = "new_terms_fields"
value = ["azure.signinlogs.properties.app_id", "source.geo.country_name"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-10d"


