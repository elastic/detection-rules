[metadata]
creation_date = "2026/11/23"
integration = ["azure"]
maturity = "production"
min_stack_comments = "field_extract (flattened field support) is available starting in 9.5.0, as a Technical Preview function; GA in 9.6.0."
min_stack_version = "9.5.0"
updated_date = "2026/11/23"

[rule]
author = ["Elastic"]
description = """
Detects an AKS (Azure Kubernetes Service) pods/exec session whose decoded command targets the Azure Instance Metadata
Service (IMDS) or the Azure WireServer, including the dotted, decimal, and hex forms of 169.254.169.254 and
168.63.129.16 and the managed identity token, instance, attested, and goal state paths. Querying IMDS from inside a pod
is a common credential-theft step used to obtain the node or workload managed identity token for lateral movement into
Azure Resource Manager. Node, control-plane, and kube-system service account identities are excluded.
"""
false_positives = [
    """
    Troubleshooting that queries IMDS from inside a pod is rare and should be ticketed. Platform components that need
    IMDS run as kube-system service accounts or node identities, which are excluded. Exclude a specific operator
    identity after review rather than removing IMDS patterns.
    """,
]
from = "now-9m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Azure AKS Pod Exec Cloud Instance Metadata Access"
note = """## Triage and analysis

### Investigating Azure AKS Pod Exec Cloud Instance Metadata Access

AKS kube-audit events are carried under the flattened `azure.platformlogs.properties.log.*` subtree and share the ARM
operation `event.action: Microsoft.ContainerService/managedClusters/diagnosticLogs/Read`. The exec command is only
recorded as URL-encoded `command=` parameters in `requestURI`, so the rule decodes it into `Esql.executed_command` before
matching. Only the `ResponseComplete` audit stage is evaluated, because AKS records both `ResponseStarted` and
`ResponseComplete` for each exec session.

### Possible investigation steps

- Review `Esql.executed_command` for the decoded payload. `Esql.is_credential_theft` is `true` when the command requests
  a managed identity token (`metadata/identity/oauth2/token`) or WireServer goal state and extension settings, which can
  include protected settings.
- Use `Esql.cloud_target` to separate IMDS (`AZURE_IMDS`) from WireServer (`AZURE_WIRESERVER`) access.
- Review `Esql.username`, `Esql.user_agent`, and `Esql.source_ips` to identify the operator and client. Check the
  trailing entries in `Esql.source_ips` for the originating client behind any proxy hops.
- Check `Esql.response_code`. A `101` means the session was established; a `403` is a denied attempt that still shows
  intent.
- Identify the managed identity bound to the node pool or workload in `Esql.namespace`/`Esql.pod_name`, then review Azure
  activity and sign-in logs for that identity after the alert time.

### False positive analysis

- Break-glass debugging that intentionally queries IMDS from a pod should be rare. Exclude the specific operator identity
  after review rather than removing IMDS patterns.
- Cloud-provider and node agents reach IMDS directly rather than through `pods/exec` and are not expected to match.

### Response and remediation

- If unauthorized, terminate the exec session, revoke the acting identity's credentials or kubeconfig, and review
  activity performed by the node or workload managed identity.
- Restrict pod access to IMDS with network policy where workloads do not need it, and remove `pods/exec` from roles
  that do not require it.
- Collect kube-audit and Azure activity artifacts per incident response procedures.
"""
references = [
    "https://learn.microsoft.com/en-us/azure/virtual-machines/instance-metadata-service",
    "https://learn.microsoft.com/en-us/azure/virtual-network/what-is-ip-address-168-63-129-16",
    "https://microsoft.github.io/Threat-Matrix-for-Kubernetes/",
    "https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/",
]
risk_score = 73
rule_id = "7952ab6b-1aba-4143-ad61-ac5341e76662"
setup = """The Azure Fleet integration collecting AKS diagnostic logs with the `kube-audit` category forwarded through Event Hub
into the `azure.platformlogs` data stream is required for this rule. kubectl 1.30 and later issue pod exec as a `get`
request, which the `kube-audit-admin` category excludes.
"""
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: Kubernetes",
    "Domain: Containers",
    "Data Source: Azure",
    "Data Source: Azure Platform Logs",
    "Data Source: Kubernetes",
    "Platform: Azure",
    "Platform: Kubernetes",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Execution",
    "Resources: Investigation Guide",
    "Noise: Low",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-azure.platformlogs-* METADATA _id, _index, _version
| WHERE data_stream.dataset == "azure.platformlogs"
    AND event.action == "Microsoft.ContainerService/managedClusters/diagnosticLogs/Read"
    AND azure.platformlogs.category == "kube-audit"
| EVAL Esql.stage = FIELD_EXTRACT(azure.platformlogs.properties, "log.stage"),
    Esql.resource = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.resource"),
    Esql.subresource = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.subresource"),
    Esql.verb = FIELD_EXTRACT(azure.platformlogs.properties, "log.verb"),
    Esql.requestURI = FIELD_EXTRACT(azure.platformlogs.properties, "log.requestURI"),
    Esql.namespace = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.namespace"),
    Esql.pod_name = FIELD_EXTRACT(azure.platformlogs.properties, "log.objectRef.name"),
    Esql.username = FIELD_EXTRACT(azure.platformlogs.properties, "log.user.username"),
    Esql.user_agent = FIELD_EXTRACT(azure.platformlogs.properties, "log.userAgent"),
    Esql.source_ips = FIELD_EXTRACT(azure.platformlogs.properties, "log.sourceIPs"),
    Esql.response_code = FIELD_EXTRACT(azure.platformlogs.properties, "log.responseStatus.code")
| WHERE Esql.stage == "ResponseComplete"
    AND Esql.resource == "pods"
    AND Esql.subresource == "exec"
    AND Esql.verb IN ("create", "get")
    AND Esql.requestURI LIKE "*command=*"
    AND Esql.username IS NOT NULL
    AND NOT Esql.username RLIKE "system:node:.*|system:serviceaccount:kube-system:.*"
    AND NOT Esql.username IN ("aksService", "hcpService", "readinessChecker", "system:apiserver", "system:kube-controller-manager", "system:kube-scheduler")
| EVAL Esql.executed_command = TRIM(REPLACE(REPLACE(REPLACE(
    URL_DECODE(Esql.requestURI),
    """^[^?]*\?""", ""),
    """&?(container|stderr|stdin|stdout|tty)=[^&]*""", ""),
    """&?command=""", " "))
| WHERE Esql.executed_command RLIKE """.*(169\.254\.169\.254|2852039166|0xa9fea9fe|168\.63\.129\.16|2822734096|0xa83f8110|metadata/identity/oauth2/token|metadata/instance|metadata/attested|metadata/scheduledevents|machine/\?comp=goalstate|/vmSettings).*"""
| EVAL Esql.cloud_target = CASE(
    Esql.executed_command RLIKE """.*(168\.63\.129\.16|2822734096|0xa83f8110|comp=goalstate|/vmSettings).*""", "AZURE_WIRESERVER",
    "AZURE_IMDS"
  ),
  Esql.is_credential_theft = CASE(
    Esql.executed_command RLIKE """.*(oauth2/token|comp=goalstate|/vmSettings).*""", true,
    false
  )
| KEEP Esql.*, event.action, data_stream.namespace, _id, _index, _version
'''


