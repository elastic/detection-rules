[metadata]
creation_date = "2026/10/21"
integration = ["azure"]
maturity = "production"
updated_date = "2026/10/21"

[rule]
author = ["Elastic"]
description = """
Identifies a successful Microsoft Entra ID sign-in from a browser and operating system combination not previously seen
for the user, without a phishing-resistant method and not from an Entra-joined or registered device.
Adversary-in-the-middle proxies often present a spoofed client fingerprint, including impossible pairings such as Safari
on Windows, to suppress the passkey prompt and force a phishable fallback. A genuinely new client also triggers this
rule, so corroborate with source and authentication context.
"""
false_positives = [
    """
    A legitimate new or rare client (a new operating system, a newly adopted browser, a privacy-hardened or developer
    browser, or a corporate kiosk/appliance) produces a new browser/OS combination the first time the user is seen on
    it. The device-trust filter already excludes the user's Entra-joined and registered endpoints, so the residual false
    positives are first sign-ins from genuinely unmanaged personal devices (BYOD, a home laptop, a new phone). Baseline
    the browser and OS families that are normal for the user and add exceptions for sanctioned clients, and correlate
    the source IP, ASN, and the authentication methods completed in the session before escalating.
    """,
]
from = "now-9m"
index = ["logs-azure.signinlogs-*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Non-Passkey Sign-In with Unusual Browser and OS Combination"
note = """## Triage and analysis

### Investigating Entra ID Non-Passkey Sign-In with Unusual Browser and OS Combination

Microsoft Entra ID recorded a successful sign-in whose browser family and operating-system family combination has not been seen for this user in the history window, on an authentication that did not complete a phishing-resistant method and did not come from an Entra-joined or registered device. Because the browser and OS families are version-independent, this is a new client type rather than a routine version change. Adversary-in-the-middle proxies and automation often present a client fingerprint that matches no legitimate client the user has used, including impossible pairings (for example Safari on Windows) produced by a spoofed user agent used to suppress the passkey prompt and force a phishable fallback, as documented by Proofpoint.

### Possible investigation steps

- Inspect the new combination (`user_agent.name`, `user_agent.os.name`) and the raw `user_agent.original`; determine whether the pairing is impossible (Safari only runs on Apple operating systems), merely rare, or a legitimately new client for the environment.
- Review `source.ip`, geo, and ASN for a hosting provider, VPS, or anonymizing origin inconsistent with the user's norm.
- Examine the authentication methods completed in the session (`azure.signinlogs.properties.authentication_details`): a phishable method (Authenticator push, OATH, SMS, voice) succeeding for a user who normally uses a passkey is a downgrade indicator.
- Check the Conditional Access result (`azure.signinlogs.properties.conditional_access_status`) to determine whether access was actually granted, and whether the same user also triggered the MFA-downgrade posture rule ("Entra ID MFA Downgrade from Phishing-Resistant Posture").
- Correlate with subsequent token reuse (`Previously satisfied`) from the same session or ASN for stolen-session use.

### False positive analysis

- The first sign-in from any genuinely new or rare client (new OS, newly adopted or developer browser, kiosk/appliance) produces a new combination. Baseline normal browser/OS families and add exceptions for sanctioned clients.
- A privacy extension or enterprise proxy that rewrites the user agent can produce stable but unusual pairings; confirm the origin and user before escalating.

### Response and remediation

- If the sign-in is unauthorized, treat the account as potentially compromised: revoke sessions and refresh tokens, remove any attacker-registered authentication methods or devices (delete devices first to break device-bound PRT persistence), and reset credentials.
- Enforce a phishing-resistant Conditional Access authentication strength so suppressing the passkey prompt cannot satisfy authentication with a weaker method.
"""
references = [
    "https://www.proofpoint.com/us/blog/threat-insight/dont-phish-let-me-down-fido-authentication-downgrade",
    "https://pushsecurity.com/blog/mfa-downgrade-attacks",
    "https://www.ioactive.com/authentication-downgrade-attacks-deep-dive-into-mfa-bypass/",
    "https://www.elastic.co/security-labs/entra-id-oauth-phishing-detection",
]
risk_score = 47
rule_id = "d685d0fd-9072-4bf8-bbd2-200051c19289"
setup = """#### Required Microsoft Entra ID Sign-In Logs
This rule requires the Azure integration with Microsoft Entra ID Sign-In logs enabled and collected via Azure Event Hub.
"""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Platform: Entra ID",
    "Platform: Azure",
    "Data Source: Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Threat: AiTM Phishing",
    "Rule Type: New Terms",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset: "azure.signinlogs" and
    azure.signinlogs.category: "SignInLogs" and
    azure.signinlogs.properties.authentication_details.authentication_method: (* and not (
        "Passkey (synced)" or
        "Passkey (device-bound)" or
        "FIDO2 security key" or
        "Windows Hello for Business" or
        "Previously satisfied"
    )) and
    not azure.signinlogs.properties.device_detail.trust_type: * and
    event.outcome: "success"
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1556"
name = "Modify Authentication Process"
reference = "https://attack.mitre.org/techniques/T1556/"
[[rule.threat.technique.subtechnique]]
id = "T1556.006"
name = "Multi-Factor Authentication"
reference = "https://attack.mitre.org/techniques/T1556/006/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.new_terms]
field = "new_terms_fields"
value = ["user.name", "user_agent.name", "user_agent.os.name"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-7d"


