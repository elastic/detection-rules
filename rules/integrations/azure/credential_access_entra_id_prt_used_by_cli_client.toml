[metadata]
creation_date = "2026/10/09"
integration = ["azure"]
maturity = "production"
updated_date = "2026/10/09"

[rule]
author = ["Elastic"]
description = """
Identifies a Microsoft Entra ID sign-in that presents a Primary Refresh Token (PRT) from a command-line or scripting
first-party client (Azure CLI, Azure PowerShell, Microsoft Graph PowerShell, or Azure AD PowerShell). Legitimate PRT
usage comes from device-integrated applications - Windows sign-in components, Microsoft Edge, Office, OneDrive, the
Store client, and the Microsoft Authentication Broker - never from command-line tools. A PRT redeemed through a CLI
client is the fingerprint of PRT replay with ROADtools (`roadtx prtauth` / `browserprtauth`): after registering a device
and acquiring a device-bound PRT, the operator replays it through a public CLI client to mint tokens for Microsoft Graph
and other resources, bypassing interactive controls. This path is missed by the device-registration-to-PRT chain rules,
which require the Microsoft Authentication Broker client and an Azure AD joined device.
"""
false_positives = [
    """
    Authorized red team or penetration testing engagements exercising ROADtools PRT replay. Document the engagement and
    add exceptions on the calling user or source IP.
    """,
    """
    Unusual but possible administrative tooling that redeems a PRT through a CLI client. Validate the user, device, and
    source; command-line PRT redemption is not part of normal first-party client behavior.
    """,
]
from = "now-9m"
index = ["logs-azure.signinlogs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Primary Refresh Token Used by a Command-Line Client"
note = """## Triage and analysis

### Investigating Entra ID Primary Refresh Token Used by a Command-Line Client

Entra ID issues Primary Refresh Tokens (PRTs) to registered or joined devices, and legitimate PRT redemption is
performed by device-integrated applications (Windows sign-in, Microsoft Edge, Office, OneDrive, the Store client, the
Microsoft Authentication Broker). A PRT presented by a command-line client (Azure CLI `04b07795-...`, Azure PowerShell
`1950a258-...`, Microsoft Graph PowerShell `14d82eec-...`, Azure AD PowerShell `1b730954-...`) is not normal first-party
behavior and is the signature of ROADtools PRT replay.

### Possible investigation steps

- Confirm the client via `azure.signinlogs.properties.app_id` / `app_display_name` and the token type
(`azure.signinlogs.properties.incoming_token_type` = `primaryRefreshToken`).
- Identify the user and device via `azure.signinlogs.properties.user_principal_name` and
`azure.signinlogs.properties.device_detail.device_id` / `trust_type`. ROADtools devices are typically Azure AD
registered (not joined) and unmanaged.
- Review the resource accessed (`azure.signinlogs.properties.resource_display_name`); Microsoft Graph, Exchange, or
SharePoint indicate the PRT is being used to reach data.
- Review source IP / ASN / geolocation and compare to the user's baseline; hosting/VPS egress raises priority.
- Pivot to `logs-azure.auditlogs-*` for a recent device registration (`Add device` / `Register device`) by the same
user, and to earlier sign-ins for the device-code or refresh-token flow that seeded the registration.

### Response and remediation

- Remove the rogue device registration BEFORE revoking sessions (device-bound PRTs survive `revokeSignInSessions`):
`GET /v1.0/users/{id}/registeredDevices`, then `DELETE /v1.0/devices/{deviceObjectId}`.
- Revoke refresh tokens and sessions (`POST /v1.0/users/{id}/revokeSignInSessions`), reset credentials, and re-register
MFA.
- Audit other persistence established in the window (authentication methods, OAuth grants, app credentials).
"""
references = [
    "https://github.com/dirkjanm/ROADtools",
    "https://dirkjanm.io/abusing-azure-ad-sso-with-the-primary-refresh-token/",
    "https://dirkjanm.io/introducing-roadtools-token-exchange-roadtx/",
    "https://unit42.paloaltonetworks.com/roadtools-cloud-attacks/",
]
risk_score = 73
rule_id = "c894f171-b863-413e-adbb-7ef4844d104a"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
    "Noise: Low",
    "Performance: Normal",
    "Rule Type: Custom Query (KQL)",
    "Platform: Entra ID",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset: "azure.signinlogs" and
azure.signinlogs.properties.incoming_token_type: "primaryRefreshToken" and
azure.signinlogs.properties.app_id: (
    "04b07795-8ddb-461a-bbee-02f9e1bf7b46" or
    "1950a258-227b-4e31-a9cf-717495945fc2" or
    "14d82eec-204b-4c2f-b7e8-296a70dab67e" or
    "1b730954-1685-4b74-9bfd-dac224a7b894"
)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1550"
name = "Use Alternate Authentication Material"
reference = "https://attack.mitre.org/techniques/T1550/"
[[rule.threat.technique.subtechnique]]
id = "T1550.001"
name = "Application Access Token"
reference = "https://attack.mitre.org/techniques/T1550/001/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1528"
name = "Steal Application Access Token"
reference = "https://attack.mitre.org/techniques/T1528/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "azure.signinlogs.properties.user_principal_name",
    "azure.signinlogs.properties.app_id",
    "azure.signinlogs.properties.app_display_name",
    "azure.signinlogs.properties.incoming_token_type",
    "azure.signinlogs.properties.resource_display_name",
    "azure.signinlogs.properties.device_detail.trust_type",
    "azure.signinlogs.properties.device_detail.is_managed",
    "source.ip",
    "source.geo.country_name",
]

