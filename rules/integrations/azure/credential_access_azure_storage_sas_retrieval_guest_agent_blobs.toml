[metadata]
creation_date = "2026/08/17"
integration = ["azure"]
maturity = "production"
updated_date = "2026/08/17"

[rule]
author = ["Elastic"]
description = """
Identifies successful Azure Storage GetBlob operations authenticated with a Shared Access Signature (SAS) that read
objects in the Microsoft fabric $system container. WireServer and HostGAPlugin vmSettings embed a statusUploadBlob SAS
whose path is /$system/<vm>.<guid>.status on md-hdd-*.blob.storage.azure.net. A SAS read of that container is
expected from the guest agent and Azure fabric; it is also the blob an adversary can fetch after scraping vmSettings.
This is not inherently malicious. Do not key this detection on source IP: SSRF or a compromised guest uses the VM's own
egress, which looks benign.
"""
false_positives = [
    """
    The Azure guest agent and Microsoft fabric regularly GetBlob `$system` status objects with a platform-issued SAS.
    This rule will fire on that legitimate traffic. Tune by storage account, user agent, or known fabric ranges after
    baselining.
    """,
]
from = "now-9m"
index = ["logs-azure.platformlogs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Azure Storage SAS Retrieval of Guest Agent Blobs"
note = """## Triage and analysis

### Investigating Azure Storage SAS Retrieval of Guest Agent Blobs

HostGAPlugin `/vmSettings` and WireServer GoalState include a `statusUploadBlob` URL. In production that URL is a
SAS on a Microsoft-owned account (`md-hdd-*.blob.storage.azure.net`) with container `$system` and an object named
`<vm>.<guid>.status`. The guest agent and fabric use that SAS continuously. An attacker who scraped vmSettings can
replay the same URL.

`$system` is the durable observable. Lab stand-in containers (`vmsettings`, `cse`) and the on-disk path `waagent`
are not production blob-path indicators and are not used in this query. Customer Custom Script Extension `fileUrl`
values are attacker- or operator-chosen and have no stable path.

`source.ip` is often empty. `source.address` is `callerIpAddress` in `ip:port` form. Do not new-terms on either:
the interesting case is a compromised VM or SSRF, so the source address is the VM or an Azure relay, not a rare
attacker IP.

### Possible investigation steps

- Confirm the object is `$system` status (`azure.platformlogs.uri` / `azure.platformlogs.properties.objectKey`).
- Review SAS parameters (`sp`, `se`, `sr`). Long-lived `sp=r` is normal for statusUploadBlob.
- Correlate the same VM with unusual processes or scripting user agents calling `168.63.129.16` (WireServer `:80`,
  HostGAPlugin `:32526`). That combination is more interesting than the SAS read alone.
- Review Azure Activity Logs for Run Command or extension writes on the VM.

### False positive analysis

- Guest agent and fabric status uploads. This is the dominant volume. Prefer correlating with endpoint or NPC
  WireServer alerts rather than treating this rule as a standalone high-fidelity hit.

### Response and remediation

- If correlated with on-guest WireServer scraping, rotate extension secrets and any other SAS recovered from
  vmSettings, and isolate the VM.
- Restrict storage firewalls where customer-owned SAS targets are involved.
"""
references = [
    "https://www.netspi.com/blog/technical-blog/cloud-pentesting/decrypting-azure-vm-extension-settings-with-wireserver/",
    "https://cybercx.com.au/blog/azure-ssrf-metadata/",
    "https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview",
    "https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/storagebloblogs",
]
risk_score = 21
rule_id = "211a0c2a-e8aa-4230-b33a-2f907aa40e66"
setup = """#### Required Azure Storage Diagnostic Logs

Enable StorageRead diagnostic logs on Azure Storage Accounts and stream them to the Event Hub used by the Azure
integration.
"""
severity = "low"
tags = [
    "Domain: Cloud",
    "Data Source: Azure",
    "Data Source: Azure Platform Logs",
    "Platform: Azure",
    "Service: Azure Storage",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Collection",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset: azure.platformlogs and
    event.action: GetBlob and
    azure.platformlogs.identity.type: SAS and
    azure.platformlogs.statusCode: 200 and
    azure.platformlogs.uri: (*$system* and *sp=*)
'''


