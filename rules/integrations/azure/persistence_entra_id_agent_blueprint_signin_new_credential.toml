[metadata]
creation_date = "2026/11/25"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies an agent identity blueprint principal authenticating with a credential (client secret, certificate, or
federated credential key) that, together with the blueprint application, has not appeared in recent history. In the
Microsoft Entra Agent ID model the blueprint holds the authentication material for all of its child agent identities, so
any principal that can add a credential to a blueprint can then impersonate every agent associated with it, including
across tenants. A newly observed credential in use on a blueprint sign-in is a strong indicator of blueprint takeover,
persistence, or a leaked blueprint secret being exercised from attacker infrastructure.
"""
false_positives = [
    """
    Planned credential rotation on a blueprint (new secret, certificate, or federated identity credential) will produce
    a genuinely new (blueprint app, credential key) pair. Validate with the blueprint owner and baseline expected
    rotations before excluding.
    """,
    """
    Initial onboarding of a new agent blueprint will register as a first-seen credential. Suppress expected onboarding
    waves rather than disabling the rule.
    """,
]
from = "now-65m"
index = ["filebeat-*", "logs-azure.signinlogs-*"]
interval = "1h"
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Agent Blueprint Authentication with New Credential"
note = """## Triage and analysis

### Investigating Entra ID Agent Blueprint Authentication with New Credential

This rule matches successful **ServicePrincipalSignInLogs** events where the acting identity is an agent identity
blueprint principal (`azure.signinlogs.properties.agent.agent_type` is `agentIdentityBlueprintPrincipal`) and the pair
`azure.signinlogs.properties.app_id` + `azure.signinlogs.properties.service_principal_credential_key_id` has not been
seen in the history window. The blueprint credential authenticates the blueprint and, through the token-exchange flow,
every child agent identity, so a new credential on a blueprint is a high-value signal.

#### Possible investigation steps

- Confirm the blueprint identity from `azure.signinlogs.properties.app_id` and `azure.signinlogs.properties.service_principal_name`.
- Note the credential in `azure.signinlogs.properties.service_principal_credential_key_id` and review Entra audit logs for a
  recent "Update application - Certificates and secrets management" / `addPassword` / `addKey` / federated credential event on
  that blueprint, including who performed it (`initiatedBy`).
- Review `source.ip`, `source.as.organization.name`, and `source.geo.*` against the blueprint's expected runtime and egress.
- Pivot on the blueprint `app_id` and look for child agent sign-ins (`agent.agent_type:agenticAppInstance` with
  `agent.parent_app_id` equal to this blueprint) shortly after, which indicate the credential being used to mint child tokens.
- Determine whether the actor who added the credential is expected to manage this blueprint (Agent ID Administrator, AI
  Administrator, blueprint owner, or a principal holding `AgentIdentityBlueprint.AddRemoveCreds.All`).

### False positive analysis

- Legitimate credential rotation or blueprint onboarding produces a first-seen (blueprint, credential) pair. Confirm with
  the owner and baseline expected rotations.

### Response and remediation

- If the credential is unexpected, remove it from the blueprint, rotate remaining blueprint credentials, and review all
  child agent identities and their inherited and direct permissions for abuse.
- Review and restrict who can add credentials to blueprints (Agent ID Administrator, AI Administrator, blueprint owners,
  and `AgentIdentityBlueprint.AddRemoveCreds.All`).
"""
references = [
    "https://learn.microsoft.com/en-us/entra/agent-id/sign-in-audit-logs-agents",
    "https://learn.microsoft.com/en-us/entra/agent-id/agent-autonomous-app-oauth-flow",
    "https://securitylabs.datadoghq.com/articles/agent-id-inside-agent-compromise/",
    "https://securitylabs.datadoghq.com/articles/agent-id-protect-detect-respond/",
    "https://blog.compass-security.com/2026/06/entra-agent-id-from-a-security-perspective/",
    "https://www.zscaler.com/blogs/cybersecurity-best-practices/entra-id-ai-workflows",
]
risk_score = 73
rule_id = "a7e1c4d2-9b3f-4e6a-8c21-5f0d7e2a9c14"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Resources: Investigation Guide",
    "Rule Type: New Terms",
    "Platform: Entra ID",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:azure.signinlogs
    and azure.signinlogs.category:ServicePrincipalSignInLogs
    and azure.signinlogs.properties.status.error_code:0
    and azure.signinlogs.properties.agent.agent_type:"agentIdentityBlueprintPrincipal"
    and azure.signinlogs.properties.service_principal_credential_key_id:*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.001"
name = "Additional Cloud Credentials"
reference = "https://attack.mitre.org/techniques/T1098/001/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"
[[rule.threat.technique.subtechnique]]
id = "T1078.004"
name = "Cloud Accounts"
reference = "https://attack.mitre.org/techniques/T1078/004/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "source.ip",
    "source.as.number",
    "source.as.organization.name",
    "source.geo.country_name",
    "azure.signinlogs.properties.app_id",
    "azure.signinlogs.properties.service_principal_name",
    "azure.signinlogs.properties.service_principal_credential_key_id",
    "azure.signinlogs.properties.agent.agent_type",
    "azure.signinlogs.properties.resource_display_name",
    "azure.signinlogs.properties.correlation_id",
]

[rule.new_terms]
field = "new_terms_fields"
value = [
    "azure.signinlogs.properties.app_id",
    "azure.signinlogs.properties.service_principal_credential_key_id",
]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-10d"


