[metadata]
creation_date = "2026/08/04"
integration = ["azure"]
maturity = "production"
updated_date = "2026/08/31"

[rule]
author = ["Elastic"]
description = """
Detects an AKS (Azure Kubernetes Service) identity that lists or watches multiple distinct Kubernetes API resource
types associated with cluster orientation (namespaces, nodes, pods, roles, clusterroles, configmaps, serviceaccounts,
rolebindings, clusterrolebindings) within a short window. Cardinality of distinct resources touched, not raw event
count, is the signal that separates recon/orientation behavior from steady-state controllers that repeatedly touch a
narrow set of resources. Known platform and control-plane identities are excluded.
"""
false_positives = [
    """
    GitOps, backup, and platform operators may span these resource types during sync. Exclude validated service accounts
    or raise the cardinality threshold after baselining.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "Azure AKS Multi-Resource Setup Discovery"
note = """## Triage and analysis

### Investigating Azure AKS Multi-Resource Setup Discovery

AKS kube-audit events are carried under the flattened `azure.platformlogs.properties.log.*` subtree, so this rule uses
`field_extract` to pull `verb`, `objectRef.resource`, `objectRef.namespace`, `user.username`, `userAgent`, and
`sourceIPs` out of `azure.platformlogs.properties` into named `Esql.*`/`Esql_priv.*` fields. It groups `list`/`watch`/`get`
calls on orientation-related resources by `Esql_priv.username`, `Esql.user_agent`, and `Esql_priv.source_ip` over the
rule's lookback and alerts when the distinct `Esql.resource` cardinality for that identity/client fingerprint is 3 or
greater — mirroring the `count_distinct(resource)` pattern used by the Kubernetes ES|QL multi-resource discovery rule.
Known platform and control-plane identities (`aksService`, `hcpService`, `acsService`, `readinessChecker`, node and
`kube-system`/`elastic-system` service accounts, and core control-plane users) are excluded, as are known
automation-tool user agents (Azure Arc control-plane binaries, Helm, Terraform, and `OpenAPI-Generator` clients)
whose pre-flight `list`/`get` checks otherwise resemble cluster orientation. `kubectl` is intentionally never excluded
by user agent alone, since both administrators and attackers using a stolen token typically drive activity through it.

### Possible investigation steps

- Review `Esql_priv.username`, `Esql.user_agent`, and `Esql_priv.source_ip` to identify the acting identity and its
  client fingerprint, and bound the activity with `Esql.earliest_timestamp`/`Esql.latest_timestamp` before pivoting
  into the raw `kube-audit` logs to see call ordering.
- Check `Esql.enumerated_resources` and `Esql.enumerated_namespaces` to see which resource types and namespaces were
  touched, and whether the scope matches a known job, GitOps sync, or CI/CD pipeline. Cluster-scoped kinds (nodes,
  clusterroles, clusterrolebindings) and namespace-scoped kinds (for example pods) requested without a namespace
  (an all-namespaces list/watch, for example `kubectl get pods -A`) both surface as `(cluster-scoped)`, per the
  Kubernetes audit event schema, where the object reference does not apply to list-type requests that lack a specific
  namespace target; an all-namespaces call against a normally namespace-scoped kind is a broader enumeration than a
  single-namespace query and should be weighed accordingly.
- Validate whether the identity is expected automation (GitOps, CI/CD, monitoring) versus a human or potentially
  stolen token; unexpected `kubectl` or custom user agents (for example `kubectl-recon`) from human-style identities
  warrant closer review.
- Correlate with follow-on activity from the same identity or source IP: secret reads, `SelfSubjectAccessReview`
  checks, pod exec, RBAC changes (roles/rolebindings/clusterrolebindings), or anonymous/unusual user agents.
- Cross-reference `Esql_priv.source_ip` against expected AKS control-plane, node, and CI/CD egress ranges for the
  cluster; unfamiliar source networks raise the priority of the alert. The same identity operating from multiple
  distinct user agents or source IPs (separate alert rows) can itself indicate credential sharing or reuse.

### False positive analysis

- Controllers and operators (GitOps, backup, service-mesh, autoscalers) that reconcile cluster state can legitimately
  span several of these resource types in one window; validate the service account and exclude it once confirmed.
- CI/CD pipelines or bootstrap tooling that provision namespaces, roles, and service accounts together during
  deployment can trigger this rule; correlate with change/deploy windows before treating the activity as suspicious.
- Helm, Terraform, and Azure Arc control-plane user agents are pre-filtered because their pre-install/reconciliation
  `list`/`get` checks are the dominant automation noise source for this pattern; add newly identified, validated
  automation identities or user agents to the exclusion list in the rule query to reduce further noise.
- Activity scoped to the `elastic-system` namespace (routine Elastic Agent/Fleet management) is excluded from the
  resource-cardinality count, since it otherwise pads out the distinct-resource-type signal with expected day-2
  operations; cluster-scoped resources with no namespace (nodes, clusterroles, clusterrolebindings) are unaffected
  and appear in `Esql.enumerated_namespaces` as `(cluster-scoped)` rather than a bare null.
- User agent strings are client-supplied and can be spoofed, so the user-agent exclusions above narrow noise but
  should not be treated as strong identity verification on their own; corroborate with the acting identity and RBAC
  before dismissing an alert.

### Response and remediation

- If unauthorized, revoke or rotate the implicated credentials/tokens, review and tighten RBAC bindings for the
  identity, and inspect for follow-on data access or privilege escalation.
- Collect the relevant `kube-audit` events and AKS diagnostic logs for the identity, source IP, and time window as
  part of incident response.
- If the identity is a compromised service account, rotate its token or certificate and review any workloads that
  mount it.
"""
references = ["https://microsoft.github.io/Threat-Matrix-for-Kubernetes/"]
risk_score = 47
rule_id = "86bdaa43-9268-436f-b944-d9c64a68def3"
setup = """
The Azure Fleet integration collecting AKS diagnostic logs with the `kube-audit` category forwarded through Event Hub
into the `azure.platformlogs` data stream is required for this rule.
"""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Kubernetes",
    "Data Source: Azure",
    "Data Source: Azure Platform Logs",
    "Data Source: Kubernetes",
    "Use Case: Threat Detection",
    "Tactic: Discovery",
    "Resources: Investigation Guide",
    "Rule Type: ESQL",
    "Platform: Azure",
    "Platform: Kubernetes",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-azure.platformlogs-* metadata _id, _index, _version
| where data_stream.dataset == "azure.platformlogs"
    and event.action == "Microsoft.ContainerService/managedClusters/diagnosticLogs/Read"
    and azure.platformlogs.category == "kube-audit"
| eval Esql.verb = field_extract(azure.platformlogs.properties, "log.verb"),
    Esql.resource = field_extract(azure.platformlogs.properties, "log.objectRef.resource"),
    Esql.namespace = field_extract(azure.platformlogs.properties, "log.objectRef.namespace"),
    Esql_priv.username = field_extract(azure.platformlogs.properties, "log.user.username"),
    Esql.user_agent = field_extract(azure.platformlogs.properties, "log.userAgent"),
    Esql_priv.source_ip = mv_first(field_extract(azure.platformlogs.properties, "log.sourceIPs"))
| where Esql.verb in ("list", "watch", "get")
    and Esql.resource in ("namespaces", "nodes", "pods", "roles", "clusterroles", "configmaps", "serviceaccounts", "rolebindings", "clusterrolebindings")
    and Esql_priv.username is not null
    and (Esql.namespace is null or Esql.namespace != "elastic-system")
    and not Esql_priv.username rlike "system:node:.*|system:serviceaccount:kube-system:.*|system:serviceaccount:elastic-system:.*"
    and not Esql_priv.username in ("aksService", "hcpService", "readinessChecker", "acsService", "system:apiserver", "system:kube-controller-manager", "system:kube-scheduler")
    and not Esql.user_agent rlike """(resourcesyncoperator|identityOperator|telegraf|clustermetadatasync|ConfigurationAgent|manager|extensionmanager)/.*\(linux/amd64\) kubernetes/\$Format|Helm/.*|.*Terraform.*|OpenAPI-Generator/.*"""
| eval Esql.namespace = coalesce(Esql.namespace, "(cluster-scoped)")
| stats
    Esql.unique_resources = count_distinct(Esql.resource),
    Esql.enumerated_resources = values(Esql.resource),
    Esql.enumerated_namespaces = values(Esql.namespace),
    Esql.event_count = count(*),
    Esql.earliest_timestamp = min(@timestamp),
    Esql.latest_timestamp = max(@timestamp)
  by Esql_priv.username, Esql.user_agent, Esql_priv.source_ip
| where Esql.unique_resources >= 3
| keep Esql.*, Esql_priv.*
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1613"
name = "Container and Resource Discovery"
reference = "https://attack.mitre.org/techniques/T1613/"

