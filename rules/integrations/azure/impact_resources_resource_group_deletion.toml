[metadata]
creation_date = "2020/08/17"
integration = ["azure"]
maturity = "production"
updated_date = "2026/09/21"

[rule]
author = ["Elastic"]
description = """
Identifies Azure resource group deletions by a principal that has not performed this operation in the prior 7 days.
Deletion of a resource group is permanent and removes all resources in the group. This rule uses an ES|QL first-seen
(new terms) approach keyed on the acting principal so routine infrastructure-as-code teardown is suppressed after the
first occurrence, while still surfacing first-time or unusual identities performing the delete.
"""
false_positives = [
    """
    Infrastructure-as-code, CI/CD, and platform automation (for example Crossplane, Terraform, ARM/Bicep, AKS control
    plane) commonly delete resource groups during environment teardown. The first occurrence per principal will alert;
    baseline expected service principals and exclude them if the activity is authorized.
    """,
    """
    Administrators may delete resource groups during decommissioning, lab cleanup, or organizational restructuring.
    Verify the actor, change ticket, and whether the deleted group was non-production before treating the event as
    malicious.
    """,
]
from = "now-7d"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Azure Resource Group Deleted by Unusual Principal"
note = """## Triage and analysis

### Investigating Azure Resource Group Deleted by Unusual Principal

Azure Resource Groups contain related resources for a solution. Deleting a group is irreversible and removes every resource in it. This rule aggregates successful `RESOURCEGROUPS/DELETE` operations over a 7-day lookback and alerts when a principal's first delete in that window falls in the current schedule interval. Repeat deletes by the same automation identity are suppressed; a newly seen user or service principal is not.

### Possible investigation steps

- Identify the acting principal from `azure.activitylogs.identity.authorization.evidence.principal_id` and check `Esql.principal_type_values` (User vs ServicePrincipal vs Group).
- Review `Esql.appid_values` and `Esql.role_values` to distinguish first-party / IaC identities from interactive clients such as Azure Portal or Azure CLI.
- Inspect `Esql.resource_group_values` and `azure.resource.name` for the groups that were deleted and whether they look like lab, ephemeral, or production naming.
- Check `Esql.source_ip_values` and correlate Entra ID sign-in logs for the same principal around `Esql.first_time_seen`.
- Look for related activity by the same principal: role assignments, lock removal, mass resource deletes, or snapshot/backup deletion.
- Confirm whether the delete was ticketed or matches a known pipeline / GitOps controller.

### False positive analysis

- Crossplane, Terraform, GitHub Actions, and similar automation will alert on the first resource-group delete per principal in 7 days, then go quiet. Exclude verified automation principals after review.
- AKS and other Microsoft-owned control-plane identities may delete managed node resource groups as part of cluster lifecycle.
- Newly provisioned automation identities performing expected teardown will fire once; do not allowlist by tenant or user GUID.

### Response and remediation

- If unauthorized, disable the principal, revoke standing Contributor/Owner on the subscription, and place resource locks on remaining critical groups.
- Restore from backup or IaC state if the deleted group hosted production resources.
- Audit other deletes and RBAC changes by the same principal during the same window.
- Require privileged delete operations to go through PIM or a change-control pipeline.

## Setup

The Azure Fleet integration, Filebeat module, or similarly structured data is required to be compatible with this rule."""
references = [
    "https://docs.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-portal",
]
risk_score = 47
rule_id = "bb4fe8d2-7ae2-475c-8b5d-55b449e4264f"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Data Source: Azure",
    "Use Case: Log Auditing",
    "Tactic: Impact",
    "Resources: Investigation Guide",
    "Noise: Low",
    "Performance: Fast",
    "Profile: Recommended",
    "Rule Type: ES|QL",
    "Platform: Azure",
    "Data Source: Azure Activity Logs",
    "Service: Azure Resource Manager",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-azure.activitylogs-*
| WHERE event.dataset == "azure.activitylogs"
    AND event.action == "MICROSOFT.RESOURCES/SUBSCRIPTIONS/RESOURCEGROUPS/DELETE"
    AND event.outcome IN ("success", "Success")
    AND azure.activitylogs.identity.authorization.evidence.principal_id IS NOT NULL
| STATS Esql.first_time_seen = MIN(@timestamp),
        Esql.last_time_seen = MAX(@timestamp),
        Esql.event_count = COUNT(*),
        Esql.resource_group_values = VALUES(azure.resource.group),
        Esql.resource_name_values = VALUES(azure.resource.name),
        Esql.principal_type_values = VALUES(azure.activitylogs.identity.authorization.evidence.principal_type),
        Esql.appid_values = VALUES(azure.activitylogs.identity.claims.appid),
        Esql.role_values = VALUES(azure.activitylogs.identity.authorization.evidence.role),
        Esql.source_ip_values = VALUES(source.ip),
        Esql.subscription_id_values = VALUES(azure.subscription_id)
        BY azure.activitylogs.identity.authorization.evidence.principal_id
// new terms emulation: fire when this principal's first_seen falls in the current interval
// (schedule + ingest-lag buffer), i.e. it was absent from the rest of the 7-day window
| EVAL Esql.recent_minutes = DATE_DIFF("minute", Esql.first_time_seen, NOW())
| WHERE Esql.recent_minutes <= 10
// surface real fields for the analyst and rule exceptions
| EVAL azure.resource.group = MV_FIRST(Esql.resource_group_values),
       azure.resource.name = MV_FIRST(Esql.resource_name_values),
       source.ip = MV_FIRST(Esql.source_ip_values)
| KEEP azure.activitylogs.identity.authorization.evidence.principal_id, azure.resource.group, azure.resource.name, source.ip, Esql.*
'''


