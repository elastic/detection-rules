[metadata]
creation_date = "2026/11/25"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies the first time a Microsoft Entra agent identity, agent application, or agent identity blueprint principal
successfully authenticates with a client secret. Microsoft recommends that blueprints, especially privileged ones,
authenticate with certificates or federated identity credentials rather than secrets, and agent identities normally
authenticate through the blueprint's federated credential flow. A secret is easily leaked from code, configuration, or
environment variables, and an attacker who adds or steals a blueprint secret can take over every agent identity created
from that blueprint, including agents in other tenants that consented to it. A blueprint that begins authenticating with
a secret may indicate a backdoor credential or a third-party blueprint operated by an attacker.
"""
false_positives = [
    """
    Development or test blueprints commonly authenticate with client secrets during onboarding. Confirm the blueprint
    owner and whether a secret is the approved authentication method, then exclude by
    `azure.signinlogs.properties.app_id`.
    """,
]
from = "now-9m"
index = ["logs-azure.signinlogs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Agent Identity or Blueprint Authentication with Client Secret"
note = """## Triage and analysis

### Investigating Entra ID Agent Identity or Blueprint Authentication with Client Secret

This rule fires the first time an agentic identity (`azure.signinlogs.properties.agent.agent_type` of
`agentIdentityBlueprintPrincipal`, `agenticApp`, or `agenticAppInstance`) authenticates with
`azure.signinlogs.properties.client_credential_type` of `clientSecret`.

#### Possible investigation steps

- Identify the agent or blueprint from `azure.signinlogs.properties.app_id` and `azure.signinlogs.properties.app_display_name`.
- Determine whether the blueprint is published by this tenant or is a third-party blueprint. For a blueprint owned by
  this tenant, review the blueprint's client secrets and Entra audit logs for a recent
  `Update application – Certificates and secrets management` event. Credentials of a third-party blueprint are not visible
  in the consuming tenant.
- Review `azure.signinlogs.properties.service_principal_credential_key_id` to identify which secret was used.
- Review the source (`source.ip`, `source.geo.country_name`, `source.as.organization.name`) for consistency with where
  the agent is expected to run.
- Review agent identities created by the blueprint and the resources they accessed after this sign-in.

### False positive analysis

- Development blueprints may use secrets during onboarding. Validate with the owner and exclude known, approved blueprints.

### Response and remediation

- If unexpected, remove the secret from the blueprint, review all credentials on the blueprint, and replace secret
  authentication with a certificate or federated identity credential.
- For a third-party blueprint, contact the publisher and consider revoking consent until the credential is rotated.
- Review and remove unexpected agent identities and permissions associated with the blueprint.
"""
references = [
    "https://securitylabs.datadoghq.com/articles/agent-id-protect-detect-respond/",
    "https://docs.datadoghq.com/security/default_rules/def-000-e84/",
    "https://learn.microsoft.com/en-us/entra/agent-id/sign-in-audit-logs-agents",
    "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent",
]
risk_score = 47
rule_id = "4b7e2c9d-6a15-4f83-b0d2-8e1c5a3f7b92"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Initial Access",
    "Resources: Investigation Guide",
    "Platform: Entra ID",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:azure.signinlogs
    and azure.signinlogs.category:ServicePrincipalSignInLogs
    and azure.signinlogs.properties.status.error_code:0
    and azure.signinlogs.properties.agent.agent_type:("agentIdentityBlueprintPrincipal" or "agenticApp" or "agenticAppInstance")
    and azure.signinlogs.properties.client_credential_type:"clientSecret"
    and azure.signinlogs.properties.app_id:*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"
[[rule.threat.technique.subtechnique]]
id = "T1078.004"
name = "Cloud Accounts"
reference = "https://attack.mitre.org/techniques/T1078/004/"



[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"

[rule.new_terms]
field = "new_terms_fields"
value = ["azure.signinlogs.properties.app_id"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-10d"


