[metadata]
creation_date = "2026/11/25"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies an Entra ID agent identity or agent identity blueprint principal adding a certificate or secret credential to
an application object. In the Microsoft Entra Agent ID model, only a human administrator, blueprint owner, or a
dedicated identity governance platform is expected to manage credentials on an application or blueprint; an agent
identity performing this action itself breaks the intended security boundary, since any principal that can add a
credential to an application can subsequently authenticate as it. This is a stronger, actor-aware signal than a generic
credential-modification alert because the acting identity itself, not just the action, is anomalous.
"""
false_positives = [
    """
    An identity governance platform or agent orchestration tool that itself runs as an agent identity may be a
    legitimate, intentional exception to the expected human-administrator model. Validate the acting identity against
    its documented operational role before excluding.
    """,
]
from = "now-9m"
index = ["logs-azure.auditlogs-*", "filebeat-*"]
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Agent Identity Modified Application Credentials"
note = """## Triage and analysis

### Investigating Entra ID Agent Identity Modified Application Credentials

This rule matches successful **AuditLogs** "Update application - Certificates and secrets management" events where the
acting identity (`azure.auditlogs.properties.initiated_by.app.agentType`) is populated and is not `notAgentic`, meaning
an agent identity or agent identity blueprint principal, rather than a human administrator, added a credential to an
application object.

#### Possible investigation steps

- Identify the acting identity from `azure.auditlogs.properties.initiated_by.app.displayName` and
  `azure.auditlogs.properties.initiated_by.app.servicePrincipalId`, and its agent type from
  `azure.auditlogs.properties.initiated_by.app.agentType`.
- Identify the target application from `azure.auditlogs.properties.target_resources.0.display_name` and
  `azure.auditlogs.properties.target_resources.0.id`, and determine whether it is an agent identity blueprint.
- Determine whether the acting identity is a child agent identity of the targeted blueprint, or an unrelated
  identity. A credential added to a blueprint by an identity that is not its own child, owner, or administrator is
  especially suspicious and indicates a broken inheritance boundary.
- Check whether the acting identity holds `AgentIdentityBlueprint.AddRemoveCreds.All`,
  `AgentIdentityBlueprint.ReadWrite.All`, or similar app roles, and when and by whom that permission was granted.
- Review subsequent sign-in activity for the target application using the newly added credential key ID
  (`azure.auditlogs.properties.target_resources.0.modified_properties.N.new_value`) to determine whether it was used.

### False positive analysis

- A deliberately deployed identity governance or agent orchestration platform that itself runs as an agent identity
  may legitimately perform this action as part of its function. Validate against its documented operational role.

### Response and remediation

- If unauthorized, remove the added credential from the target application, rotate remaining credentials, and
  review the acting identity's permissions and recent activity.
- Review and restrict which identities can add credentials to applications and agent identity blueprints, and remove
  `AgentIdentityBlueprint.AddRemoveCreds.All` / `AgentIdentityBlueprint.ReadWrite.All` from any identity that does not
  require it.

## Setup

The Azure Fleet integration, Filebeat module, or similarly structured data is required to be compatible with this rule."""
references = [
    "https://www.zscaler.com/blogs/cybersecurity-best-practices/entra-id-ai-workflows",
    "https://learn.microsoft.com/en-us/entra/agent-id/sign-in-audit-logs-agents",
    "https://learn.microsoft.com/en-us/entra/agent-id/agent-autonomous-app-oauth-flow",
    "https://learn.microsoft.com/en-us/graph/permissions-reference",
]
risk_score = 73
rule_id = "f90eeaf4-83e6-4650-8ea7-cdd3a5bcf32a"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Audit Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Resources: Investigation Guide",
    "Rule Type: Custom Query (KQL)",
    "Platform: Entra ID",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset:azure.auditlogs
    and azure.auditlogs.operation_name:"Update application – Certificates and secrets management "
    and event.outcome:(Success or success)
    and azure.auditlogs.properties.initiated_by.app.agentType:(* and not "notAgentic")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.001"
name = "Additional Cloud Credentials"
reference = "https://attack.mitre.org/techniques/T1098/001/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"
[[rule.threat.technique.subtechnique]]
id = "T1078.004"
name = "Cloud Accounts"
reference = "https://attack.mitre.org/techniques/T1078/004/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "azure.auditlogs.properties.initiated_by.app.displayName",
    "azure.auditlogs.properties.initiated_by.app.servicePrincipalId",
    "azure.auditlogs.properties.initiated_by.app.agentType",
    "azure.auditlogs.properties.target_resources.0.display_name",
    "azure.auditlogs.properties.target_resources.0.id",
    "event.outcome",
]

