[metadata]
creation_date = "2026/11/25"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies the first observed authentication of a Microsoft Entra agent identity blueprint principal, scoped by
blueprint application ID, within the history window. When a tenant admin consents to a third-party (multitenant) agent
blueprint, a blueprint principal is created locally and can immediately authenticate using credentials held in the
blueprint's home (attacker) tenant. Because the blueprint principal authenticates locally in the victim tenant, standard
cross-tenant sign-in indicators are not set, so a newly observed blueprint principal authenticating is one of the few
sign-in-side signals of a freshly consented blueprint, including a malicious externally owned one as described in
Proofpoint's "BluePhishing" research. This complements the companion rule that detects a known blueprint authenticating
with a new credential, catching the case where no credential key ID is present on the sign-in.
"""
false_positives = [
    """
    Onboarding of a legitimate internal or approved third-party agent blueprint produces a first-seen blueprint
    principal authentication. Validate with the blueprint owner and the corresponding consent event, and suppress
    expected onboarding waves rather than disabling the rule.
    """,
]
from = "now-65m"
index = ["filebeat-*", "logs-azure.signinlogs-*"]
interval = "1h"
language = "kuery"
license = "Elastic License v2"
name = "Entra ID Agent Blueprint Principal First Authentication"
note = """## Triage and analysis

### Investigating Entra ID Agent Blueprint Principal First Authentication

This rule matches successful **ServicePrincipalSignInLogs** events where the acting identity is an agent identity
blueprint principal (`azure.signinlogs.properties.agent.agent_type` is `agentIdentityBlueprintPrincipal`) and the
blueprint `azure.signinlogs.properties.app_id` has not been seen authenticating in the history window. This is a
first-seen blueprint principal, which maps to a newly created or newly consented agent blueprint.

#### Possible investigation steps

- Identify the blueprint from `azure.signinlogs.properties.app_id` and `azure.signinlogs.properties.service_principal_name`.
- Determine whether the blueprint principal is owned by an external organization (service principal
  `appOwnerOrganizationId` differs from the tenant). An externally owned blueprint principal that authenticates locally
  indicates a consented third-party blueprint (BluePhishing).
- Review Entra audit logs for a recent `Consent to application` / `Add service principal` event for this blueprint and
  who granted the consent (`initiatedBy`).
- Review `source.ip`, `source.as.organization.name`, and `source.geo.*` against expected blueprint runtime and egress.
- Pivot on child agent sign-ins (`agent.agent_type:agenticAppInstance` with `agent.parent_app_id` equal to this
  blueprint) and any `Add service principal` events initiated by this blueprint principal (agent identity creation).

### False positive analysis

- Legitimate blueprint onboarding or approved third-party blueprint consent produces a first-seen blueprint principal.
  Confirm with the owner and the consent record before excluding.

### Response and remediation

- If the blueprint is unexpected or externally owned without approval, remove the consent/blueprint principal, review all
  agent identities derived from it and their inherited permissions, and restrict third-party application and agent
  blueprint consent via consent policies and permission classifications.
"""
references = [
    "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent",
    "https://learn.microsoft.com/en-us/entra/agent-id/sign-in-audit-logs-agents",
    "https://learn.microsoft.com/en-us/entra/agent-id/agent-autonomous-app-oauth-flow",
    "https://securitylabs.datadoghq.com/articles/agent-id-inside-agent-compromise/",
]
risk_score = 47
rule_id = "d4e5f6a7-8b9c-4d0e-1f2a-3b4c5d6e7f80"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Initial Access",
    "Resources: Investigation Guide",
    "Rule Type: New Terms",
    "Platform: Entra ID",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:azure.signinlogs
    and azure.signinlogs.category:ServicePrincipalSignInLogs
    and azure.signinlogs.properties.status.error_code:0
    and azure.signinlogs.properties.agent.agent_type:"agentIdentityBlueprintPrincipal"
    and azure.signinlogs.properties.app_id:*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"
[[rule.threat.technique.subtechnique]]
id = "T1078.004"
name = "Cloud Accounts"
reference = "https://attack.mitre.org/techniques/T1078/004/"



[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "source.ip",
    "source.as.number",
    "source.as.organization.name",
    "source.geo.country_name",
    "azure.signinlogs.properties.app_id",
    "azure.signinlogs.properties.service_principal_name",
    "azure.signinlogs.properties.agent.agent_type",
    "azure.signinlogs.properties.resource_display_name",
    "azure.signinlogs.properties.correlation_id",
]

[rule.new_terms]
field = "new_terms_fields"
value = ["azure.signinlogs.properties.app_id"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-10d"


