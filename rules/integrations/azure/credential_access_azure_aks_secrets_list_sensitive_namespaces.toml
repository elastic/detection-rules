[metadata]
creation_date = "2026/11/23"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/23"

[rule]
author = ["Elastic"]
description = """
Detects Kubernetes Secrets list operations on AKS (Azure Kubernetes Service) across all namespaces (cluster-wide) or in
sensitive namespaces such as kube-system, default, kube-public, gatekeeper-system, or cert-manager. Broad secret listing
is a common credential-discovery step after cluster access is obtained. Allowed and denied attempts both match. Node,
control-plane, kube-system, and AKS-managed add-on service accounts are excluded.
"""
false_positives = [
    """
    Cluster backup, secret-management, and policy tooling may list secrets in these namespaces. Exclude known backup or
    operator service accounts after review.
    """,
]
from = "now-9m"
index = ["logs-azure.platformlogs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Azure AKS Secrets List in Sensitive Namespaces"
note = """## Triage and analysis

### Investigating Azure AKS Secrets List in Sensitive Namespaces

AKS kube-audit events are carried under the flattened `azure.platformlogs.properties.log.*` subtree and share the ARM
operation `event.action: Microsoft.ContainerService/managedClusters/diagnosticLogs/Read`. A `list` against `secrets`
across the cluster (`kubectl get secrets -A`, which has no `objectRef.namespace`) or in `kube-system` and other sensitive
namespaces returns secret values in bulk, not only names. Human users and non-platform service accounts performing this
list are uncommon outside backup and admin workflows.

### Possible investigation steps

- Identify the acting identity in `user.username` / `user.groups` and whether cluster-admin or broad secret list rights
  are expected.
- Confirm the scope in `objectRef.namespace` (empty means cluster-wide) and `requestURI`, the client in `userAgent`, and
  origin in `sourceIPs` (external IPs are higher concern than in-cluster addresses).
- Check `responseStatus.code`. A `200` returned the secrets; a `403` is a denied attempt that still shows intent.
- Correlate with subsequent Secret `get` bursts, TokenRequest, CSR activity, or pod exec by the same identity.
- Review RBAC bindings that granted `list` on secrets in the sensitive namespace.

### False positive analysis

- Velero/backup agents, external-secrets, cert-manager, and platform operators may list secrets cluster-wide or in
  kube-system; exclude those SAs. AKS-managed add-on namespaces (Istio, application routing, Azure Policy, Calico,
  Azure Arc, Dapr, Flux) are already excluded.
- Cluster administrators using `kubectl get secrets -n kube-system` during incidents will match; validate change tickets.

### Response and remediation

- If unauthorized, revoke the identity, rotate secrets that may have been enumerated/read, and remove overly broad
  RoleBindings/ClusterRoleBindings.
- Prefer namespace-scoped roles and avoid granting cluster-wide secret list to humans or workloads.
- Collect kube-audit artifacts per incident response procedures.
"""
references = [
    "https://kubernetes.io/docs/concepts/configuration/secret/",
    "https://microsoft.github.io/Threat-Matrix-for-Kubernetes/",
    "https://unit42.paloaltonetworks.com/modern-kubernetes-threats/",
]
risk_score = 73
rule_id = "d6f57280-bf37-46b9-aa81-47911b2868f5"
setup = """The Azure Fleet integration collecting AKS diagnostic logs with the `kube-audit` category forwarded through Event Hub
into the `azure.platformlogs` data stream is required for this rule. Secret list is a read operation excluded from
`kube-audit-admin`.
"""
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: Kubernetes",
    "Data Source: Azure",
    "Data Source: Azure Platform Logs",
    "Data Source: Kubernetes",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Discovery",
    "Resources: Investigation Guide",
    "Domain: Containers",
    "Platform: Azure",
    "Platform: Kubernetes",
    "Rule Type: Custom Query (KQL)",
    "Noise: Medium",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset:azure.platformlogs and
  event.action:"Microsoft.ContainerService/managedClusters/diagnosticLogs/Read" and
  azure.platformlogs.category:"kube-audit" and
  azure.platformlogs.properties.log.objectRef.resource:"secrets" and
  azure.platformlogs.properties.log.verb:"list" and
  azure.platformlogs.properties.log.stage:"ResponseComplete" and
  azure.platformlogs.properties.log.objectRef.namespace:(
    "kube-system" or "default" or "kube-public" or "gatekeeper-system" or "cert-manager" or not *
  ) and
  not azure.platformlogs.properties.log.sourceIPs:("127.0.0.1" or "::1") and
  not azure.platformlogs.properties.log.user.username:(
    system\:node\:* or "aksService" or "hcpService" or "readinessChecker" or
    system\:serviceaccount\:kube-system\:* or "system:apiserver" or
    "system:kube-controller-manager" or "system:kube-scheduler" or
    system\:serviceaccount\:aks-istio-system\:* or system\:serviceaccount\:app-routing-system\:* or
    system\:serviceaccount\:gatekeeper-system\:* or system\:serviceaccount\:calico-system\:* or
    system\:serviceaccount\:tigera-operator\:* or system\:serviceaccount\:azure-arc\:* or
    system\:serviceaccount\:dapr-system\:* or system\:serviceaccount\:flux-system\:*
  )
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.007"
name = "Container API"
reference = "https://attack.mitre.org/techniques/T1552/007/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1613"
name = "Container and Resource Discovery"
reference = "https://attack.mitre.org/techniques/T1613/"


[rule.threat.tactic]
id = "TA0007"
name = "Discovery"
reference = "https://attack.mitre.org/tactics/TA0007/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "azure.platformlogs.category",
    "azure.platformlogs.properties.log.verb",
    "azure.platformlogs.properties.log.user.username",
    "azure.platformlogs.properties.log.userAgent",
    "azure.platformlogs.properties.log.sourceIPs",
    "azure.platformlogs.properties.log.objectRef.resource",
    "azure.platformlogs.properties.log.objectRef.namespace",
    "azure.platformlogs.properties.log.objectRef.name",
    "azure.platformlogs.properties.log.responseStatus.code",
]

