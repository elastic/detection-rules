[metadata]
creation_date = "2026/11/12"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/12"

[rule]
author = ["Elastic"]
description = """
Identifies an Entra ID administrative password reset where the initiating principal differs from the target user
("Reset user password" / "Update PasswordProfile"). Adversaries and business-email-compromise operators reset another
user's password to hijack the account or establish persistence. This ES|QL rule compares the initiator to the target and
normalizes the initiator across user- and app-initiated operations.
"""
from = "now-10m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Entra ID Password Reset of Another User"
note = """## Triage and analysis

### Investigating Entra ID Password Reset of Another User

An administrator (or an identity with reset rights) resetting another user's password is a routine helpdesk action, but it is also a direct account-takeover and BEC persistence primitive. This rule surfaces resets where the actor is not the target.

### Possible investigation steps

- Confirm the actor (`Esql_priv.actor`) and target (`Esql_priv.target`), and whether the reset was expected/ticketed.
- Review `source.ip` and `source.as.organization.name` for the initiator; unusual networks warrant scrutiny.
- Correlate with subsequent sign-ins to the target account, MFA changes, and mailbox-rule or app-consent activity.

### False positive analysis

- Helpdesk, IT admins, and self-service-delegated roles reset passwords routinely. Baseline known helpdesk/IDM principals and consider layering rareness (first-seen actor) to reduce volume.

### Response and remediation

- If unauthorized, re-reset the target's password, revoke its sessions, review follow-on activity, and rotate the initiator's credentials.
"""
references = [
    "https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-audit-logs",
    "https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1098.003/T1098.003.md",
]
risk_score = 47
rule_id = "16be5981-be9e-4fcd-887d-0069c47c7ff7"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Audit Logs",
    "Domain: Identity",
    "Platform: Azure",
    "Tactic: Persistence",
    "Rule Type: ES|QL",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-azure.auditlogs-* METADATA _id, _version, _index
| WHERE event.dataset == "azure.auditlogs"
    AND event.action IN ("Reset user password", "Update PasswordProfile")
    AND event.outcome == "success"
| EVAL Esql_priv.actor = COALESCE(azure.auditlogs.properties.initiated_by.user.userPrincipalName, azure.auditlogs.properties.initiated_by.app.displayName),
       Esql_priv.target = `azure.auditlogs.properties.target_resources.0.user_principal_name`
| WHERE Esql_priv.actor IS NOT NULL AND Esql_priv.target IS NOT NULL AND Esql_priv.actor != Esql_priv.target
| KEEP _id, _version, _index, @timestamp, Esql_priv.actor, Esql_priv.target, event.action, source.ip, source.as.organization.name
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"


[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
