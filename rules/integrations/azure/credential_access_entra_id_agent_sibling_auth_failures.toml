[metadata]
creation_date = "2026/11/25"
integration = ["azure"]
maturity = "production"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Identifies multiple distinct child agent identities that share the same agent identity blueprint failing to authenticate
from the same source IP within a short window. When an adversary holds a blueprint credential and probes which child
agents or resources it can impersonate, Entra returns distinct token-exchange failures (for example blueprint/child
relationship mismatch or disabled identity) across several siblings. A single source generating failed exchanges for
multiple children of one blueprint is a stronger signal than any single failure and can indicate blueprint credential
abuse or agent enumeration.
"""
false_positives = [
    """
    A broken runtime, expired or rotated blueprint credential, or a misconfigured deployment can cause several sibling
    agents to fail authentication from one host. Correlate with recent blueprint credential and configuration changes.
    """,
]
from = "now-60m"
interval = "30m"
language = "esql"
license = "Elastic License v2"
name = "Entra ID Multiple Agent Identities Failing Authentication from One Source"
note = """## Triage and analysis

### Investigating Entra ID Multiple Agent Identities Failing Authentication from One Source

This rule groups failed **ServicePrincipalSignInLogs** events for child agent identities
(`azure.signinlogs.properties.agent.agent_type` is `agenticAppInstance`) by their parent blueprint
(`azure.signinlogs.properties.agent.parent_app_id`) and `source.ip` in 30-minute windows, and alerts when at least two
distinct child agents of the same blueprint fail from the same source.

#### Possible investigation steps

- Review `Esql.failed_children`, `Esql.error_codes`, and `source.ip`. Common codes include `7002134` (blueprint/child
  relationship mismatch), `7000112` (disabled identity), and `7000215` (invalid credential at the blueprint stage).
- Identify the blueprint from `azure.signinlogs.properties.agent.parent_app_id` and whether this source IP is expected.
- Check for any successful child sign-ins from the same source and blueprint in the same window, which would indicate the
  attacker found a working child after probing.
- Review Entra audit logs for recent credential additions on the blueprint.

### False positive analysis

- A broken or mid-rotation runtime can fail across siblings. Note that some failed exchanges drop
  `agent.parent_app_id`; those events will not group here, so absence of grouping does not rule out abuse.

### Response and remediation

- If the source is unexpected, rotate blueprint credentials, review child agent permissions, and apply Conditional Access
  to the blueprint.
"""
references = [
    "https://learn.microsoft.com/en-us/entra/agent-id/sign-in-audit-logs-agents",
    "https://learn.microsoft.com/en-us/entra/agent-id/agent-autonomous-app-oauth-flow",
    "https://securitylabs.datadoghq.com/articles/agent-id-inside-agent-compromise/",
]
risk_score = 47
rule_id = "f4d9a1c7-6e32-4b85-9a0d-2c7e1b8f5a39"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: Identity",
    "Data Source: Azure",
    "Data Source: Microsoft Entra ID",
    "Data Source: Microsoft Entra ID Sign-In Logs",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Platform: Entra ID",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-azure.signinlogs-* metadata _id, _index
| where data_stream.dataset == "azure.signinlogs"
  and azure.signinlogs.category == "ServicePrincipalSignInLogs"
  and azure.signinlogs.properties.agent.agent_type == "agenticAppInstance"
  and azure.signinlogs.properties.agent.parent_app_id is not null
  and azure.signinlogs.properties.status.error_code != 0
| eval Esql.time_window = date_trunc(30 minutes, @timestamp)
| stats
    Esql.failed_child_count = count_distinct(azure.signinlogs.properties.app_id),
    Esql.failed_children = values(azure.signinlogs.properties.app_id),
    Esql.error_codes = values(azure.signinlogs.properties.status.error_code),
    Esql.first_seen = min(@timestamp),
    Esql.last_seen = max(@timestamp)
  by Esql.time_window, azure.signinlogs.properties.agent.parent_app_id, source.ip
| where Esql.failed_child_count >= 2
| keep azure.signinlogs.properties.agent.parent_app_id, source.ip, Esql.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1110"
name = "Brute Force"
reference = "https://attack.mitre.org/techniques/T1110/"

[[rule.threat.technique.subtechnique]]
id = "T1110.004"
name = "Credential Stuffing"
reference = "https://attack.mitre.org/techniques/T1110/004/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = [
    "azure.signinlogs.properties.agent.parent_app_id",
    "source.ip",
    "Esql.failed_child_count",
    "Esql.failed_children",
    "Esql.error_codes",
    "Esql.time_window",
]
