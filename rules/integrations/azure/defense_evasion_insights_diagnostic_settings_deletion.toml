[metadata]
creation_date = "2020/08/17"
integration = ["azure"]
maturity = "production"
updated_date = "2026/09/21"

[rule]
author = ["Elastic"]
description = """
Identifies deletion of Azure diagnostic settings for a resource group that has not had this operation in the prior 7
days. Diagnostic settings send platform logs and metrics to Log Analytics, Event Hubs, or storage; removing them blinds
monitoring and detection. This rule uses an ES|QL first-seen (new terms) approach keyed on the resource group so groups
that constantly churn logging configuration are suppressed after the first occurrence, while a newly seen group still
alerts.
"""
false_positives = [
    """
    Infrastructure-as-code, CI/CD, and platform automation (for example Crossplane, Terraform, ARM/Bicep) commonly
    delete diagnostic settings during environment teardown or redeploy. The first occurrence per resource group in 7
    days will alert; groups that are rebuilt often will then go quiet.
    """,
    """
    Microsoft-owned resource providers (for example Azure Cosmos DB networking) may remove diagnostic settings as part
    of private-endpoint or control-plane lifecycle. Confirm the actor, app, and whether the group is non-production
    before treating the event as malicious.
    """,
]
from = "now-7d"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Azure Diagnostic Settings Deleted"
note = """## Triage and analysis

### Investigating Azure Diagnostic Settings Deleted

Azure Diagnostic Settings stream platform logs and metrics to a destination for detection and investigation. Deleting them for a resource group that does not normally change logging configuration is a high-signal defense-evasion step. This rule aggregates successful `DIAGNOSTICSETTINGS/DELETE` operations over a 7-day lookback and alerts when a resource group's first delete in that window falls in the current schedule interval. Repeat deletes against the same group are suppressed; a newly seen group is not.

### Possible investigation steps

- Confirm the resource group from `azure.resource.group` and whether it looks like production, lab, or ephemeral naming. Inspect `Esql.resource_name_values` and `Esql.resource_id_values` for which diagnostic settings were removed.
- Identify the actor from `Esql.principal_id_values` and `Esql.principal_type_values` (User vs ServicePrincipal). Resolve the human-readable name from `Esql.initiated_by_user_values`.
- Review `Esql.appid_values` and `Esql.role_values` to distinguish first-party / IaC identities from interactive clients such as Azure Portal or Azure CLI. `Esql.role_assignment_id_values` shows which assignment granted the delete.
- Pivot on `Esql.session_id_values` (`azure.activitylogs.identity.claims.sid`) and `Esql.unique_token_id_values` to Entra sign-in logs and Microsoft Graph activity for the same session.
- Use `Esql.correlation_id_values` to find related ARM operations (lock removal, activity-log disable, mass deletes) in the same activity-log transaction.
- Check `Esql.source_ip_values`, `Esql.source_country_values`, and `Esql.source_as_number_values` around `Esql.first_time_seen`.
- Verify whether logging was restored, and whether other detection-blinding changes occurred in the same window.

### False positive analysis

- Crossplane, Terraform, GitHub Actions, and similar automation will alert on the first diagnostic-settings delete per resource group in 7 days, then go quiet for that group. Frequently rebuilt lab groups are expected.
- Microsoft-owned control-plane identities (for example Cosmos DB virtual-network resource provider) may delete diagnostic settings during private-endpoint lifecycle.
- Newly provisioned resource groups whose first logging teardown is authorized will fire once; do not allowlist by tenant or user GUID.

### Response and remediation

- If unauthorized, disable the principal, restore the diagnostic settings, and place resource locks on remaining critical groups.
- Confirm logs resume flowing to the intended Log Analytics workspace, Event Hub, or storage account.
- Audit other deletes and RBAC changes by the same principal during the same window.
- Require privileged diagnostic-settings changes to go through PIM or a change-control pipeline.
"""
references = [
    "https://docs.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings",
    "https://www.microsoft.com/en-us/security/blog/2025/10/20/inside-the-attack-chain-threat-activity-targeting-azure-blob-storage/",
]
risk_score = 47
rule_id = "5370d4cd-2bb3-4d71-abf5-1e1d0ff5a2de"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Data Source: Azure",
    "Data Source: Azure Activity Logs",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Resources: Investigation Guide",
    "Noise: Low",
    "Performance: Normal",
    "Profile: Recommended",
    "Rule Type: ES|QL",
    "Platform: Azure",
    "Service: Azure Resource Manager",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-azure.activitylogs-*
| WHERE event.dataset == "azure.activitylogs"
    AND event.action == "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE"
    AND event.outcome IN ("success", "Success")
    AND azure.resource.group IS NOT NULL
| STATS Esql.first_time_seen = MIN(@timestamp),
        Esql.last_time_seen = MAX(@timestamp),
        Esql.event_count = COUNT(*),
        Esql.resource_name_values = VALUES(azure.resource.name),
        Esql.resource_id_values = VALUES(azure.resource.id),
        Esql.principal_id_values = VALUES(azure.activitylogs.identity.authorization.evidence.principal_id),
        Esql.principal_type_values = VALUES(azure.activitylogs.identity.authorization.evidence.principal_type),
        Esql.initiated_by_user_values = VALUES(azure.activitylogs.identity.claims_initiated_by_user.name),
        Esql.appid_values = VALUES(azure.activitylogs.identity.claims.appid),
        Esql.session_id_values = VALUES(azure.activitylogs.identity.claims.sid),
        Esql.unique_token_id_values = VALUES(azure.activitylogs.identity.claims.uti),
        Esql.correlation_id_values = VALUES(azure.correlation_id),
        Esql.role_values = VALUES(azure.activitylogs.identity.authorization.evidence.role),
        Esql.role_assignment_id_values = VALUES(azure.activitylogs.identity.authorization.evidence.role_assignment_id),
        Esql.source_ip_values = VALUES(source.ip),
        Esql.source_country_values = VALUES(source.geo.country_name),
        Esql.source_as_number_values = VALUES(source.`as`.number),
        Esql.subscription_id_values = VALUES(azure.subscription_id)
        BY azure.resource.group
// new terms emulation: fire when this resource group's first_seen falls in the current interval
// (schedule + ingest-lag buffer), i.e. it was absent from the rest of the 7-day window
| EVAL Esql.recent_minutes = DATE_DIFF("minute", Esql.first_time_seen, NOW())
| WHERE Esql.recent_minutes <= 10
| KEEP azure.*, Esql.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"
[[rule.threat.technique.subtechnique]]
id = "T1562.001"
name = "Disable or Modify Tools"
reference = "https://attack.mitre.org/techniques/T1562/001/"

[[rule.threat.technique.subtechnique]]
id = "T1562.008"
name = "Disable or Modify Cloud Logs"
reference = "https://attack.mitre.org/techniques/T1562/008/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.alert_suppression]
group_by = ["azure.resource.group"]
missing_fields_strategy = "suppress"

[rule.alert_suppression.duration]
unit = "m"
value = 60

