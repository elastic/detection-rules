[metadata]
creation_date = "2026/11/25"
integration = ["aws"]
maturity = "production"
updated_date = "2026/11/25"

[rule]
author = ["Elastic"]
description = """
Detects a successful AWS Systems Manager (SSM) "CreateDataChannel" request containing a caller-supplied client ID.
Standard SSM Agent channel creation does not ordinarily include this parameter. Its presence can indicate direct use of
a managed node's messaging permissions to obtain a client data-channel token and interact with a Session Manager session
outside the expected "StartSession" or "ResumeSession" authorization path.
"""
false_positives = [
    """
    Custom SSM clients, instrumented or non-standard SSM agents, and services that build on the SSM messaging protocol
    might provide a client ID. Confirm the implementation and expected IAM role before adding a narrow exception.
    """,
]
from = "now-10m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "AWS SSM Data Channel Created by Non-Agent Client"
note = """## Triage and analysis

### Investigating AWS SSM Data Channel Created by Non-Agent Client

This rule identifies successful `CreateDataChannel` requests that include `clientId`. In observed standard SSM Agent
traffic, the agent used `CreateDataChannel` for the session assigned to its managed node without sending this field.
A caller using the node's broad `ssmmessages` permissions can instead supply a client ID to request a data-channel token.
This may indicate an attempt to join another principal's Session Manager session or to use agent authority as an
interactive client.

The alert proves non-standard data-channel creation, not by itself cross-instance execution. Treat it as high risk when
the session belongs to another managed node, when the principal was denied `StartSession` or `ResumeSession`, or when an
`OpenDataChannel` event from the same source follows without the expected target instance context.

### Possible investigation steps

- Extract `sessionId` and `clientId` from `aws.cloudtrail.request_parameters`.
- Find the successful `StartSession` event whose `aws.cloudtrail.response_elements` contains the same session ID. Record
  its target instance and initiating principal.
- Compare that target with the instance ID at the end of the `CreateDataChannel` event's `user.id`. A mismatch can
  indicate cross-instance lateral movement.
- Review preceding failed `StartSession` and `ResumeSession` requests from the same `user.id` and `source.ip`.
- Identify subsequent `OpenDataChannel` events for the session. Compare their source IPs and check whether
  `clientInstanceId` identifies the expected target.
- Confirm whether the source instance runs only the standard Amazon SSM Agent or an approved custom client. Review
  process, shell, and network telemetry from that instance for access to IMDS credentials and direct SSM messaging calls.
- Review Session Manager audit logs, shell history, and commands executed during the affected session.

### False positive analysis

- Determine whether an approved custom agent or management integration supplies `clientId`.
- Do not exclude all instance-profile activity or all `CreateDataChannel` events. Standard managed nodes generate these
  events, and broad exclusions would remove the signal.
- The user agent is attacker controlled. Use it for investigation or a narrow environment-specific exception, not as the
  only detection condition.

### Response and remediation

- Isolate both the source managed node and the target session's node if cross-instance access is confirmed.
- Terminate the affected Session Manager session and revoke or replace the source node's instance profile credentials.
- Review all sessions and channel events involving the source role for additional affected nodes.
- Restrict discovery of active session identifiers and monitor the four `ssmmessages` channel operations granted to
  managed-node and ECS task roles.
"""
references = [
    "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html",
    "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-getting-started-instance-profile.html",
    "https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AmazonSSMManagedInstanceCore.html",
]
risk_score = 47
rule_id = "7ef2f6e2-b94e-434f-8aa9-e145acd17b74"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS SSM",
    "Data Source: AWS EC2",
    "Use Case: Threat Detection",
    "Tactic: Lateral Movement",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-* METADATA _id, _version, _index
| WHERE event.dataset == "aws.cloudtrail"
  AND event.provider == "ssm.amazonaws.com"
  AND event.action == "CreateDataChannel"
  AND event.outcome == "success"
  AND aws.cloudtrail.request_parameters LIKE "*clientId=*"
| KEEP _id, _version, _index, @timestamp, cloud.account.id, cloud.region, user.id, user.name,
       aws.cloudtrail.user_identity.arn, aws.cloudtrail.user_identity.type,
       source.ip, user_agent.original, event.action, event.outcome,
       aws.cloudtrail.request_parameters, aws.cloudtrail.response_elements
'''

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "user.name",
    "user_agent.original",
    "source.ip",
    "aws.cloudtrail.user_identity.arn",
    "aws.cloudtrail.user_identity.type",
    "aws.cloudtrail.user_identity.access_key_id",
    "event.action",
    "event.outcome",
    "cloud.account.id",
    "cloud.region",
    "aws.cloudtrail.request_parameters",
    "aws.cloudtrail.response_elements",
]

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1021"
name = "Remote Services"
reference = "https://attack.mitre.org/techniques/T1021/"

[[rule.threat.technique.subtechnique]]
id = "T1021.007"
name = "Cloud Services"
reference = "https://attack.mitre.org/techniques/T1021/007/"

[rule.threat.tactic]
id = "TA0008"
name = "Lateral Movement"
reference = "https://attack.mitre.org/tactics/TA0008/"
