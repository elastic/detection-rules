[metadata]
creation_date = "2026/09/10"
integration = ["aws"]
maturity = "production"
updated_date = "2026/09/10"

[rule]
author = ["Elastic"]
description = """
Detects the IAM Identity Center access-control attribute configuration being created, changed or removed. That
configuration maps identity-source values into session tags which permission-set policies consume as
aws:PrincipalTag/<key>, so it decides what value every federated session presents to every policy condition built on
those tags. Repointing an existing attribute at a different identity-source path changes the tag value for all sessions
without altering a single policy document, which makes it a quiet way to satisfy a condition the actor should not
satisfy. Because the change is instance-wide and rare, the rule reports every successful write. Review the request
parameters to determine which keys or identity-source paths changed.
"""
false_positives = [
    """
    Initial onboarding of attribute-based access control produces a create followed by updates as the mapping is
    refined. This is expected and infrequent. Confirm the change appears in change management and that the source paths
    point at attributes your identity provider actually supplies.
    """,
    """
    An organization that does not use attribute-based access control at all is unaffected in practice: with no
    permission-set policy referencing aws:PrincipalTag, changing the mapping alters no authorization outcome. The event
    is still worth reviewing, because the configuration is a precondition an attacker would establish before adding a
    tag-conditioned policy.
    """,
]
from = "now-15m"
index = ["logs-aws.cloudtrail-*"]
interval = "10m"
language = "kuery"
license = "Elastic License v2"
name = "AWS Identity Center ABAC Attribute Mapping Changed"
note = """## Triage and analysis

### Investigating AWS Identity Center ABAC Attribute Mapping Changed

Detects the IAM Identity Center access-control attribute configuration being created, changed or removed. That configuration maps identity-source values into session tags which permission-set policies consume as aws:PrincipalTag/<key>, so it decides what value every federated session presents to every policy condition built on those tags.

### Possible investigation steps

- Read the operation first. Create and update operations carry the configured attribute keys and identity-source paths in the request parameters; a delete operation removes ABAC configuration instance-wide.
- Establish whether anything consumes these tags. Enumerate permission-set inline and managed policies for conditions on each corresponding `aws:PrincipalTag/<key>`. If no policy references them, the change altered no authorization outcome and is a precondition rather than an escalation. If a policy does reference them, determine what access the new source path grants and to whom.
- Consider who controls the new source path. The impersonation logic is that whoever can set their own value for the attribute the mapping now reads can present whatever tag that policy requires. An attribute the user can edit on their own directory record is materially worse than one only an administrator can set.
- Identify the actor and whether they are an Identity Center administrator by role. A permission-set session changing the attribute configuration that governs its own tags is a self-referential escalation.
- Review sessions established after the change: pivot to `AssumeRoleWithSAML` and `GetRoleCredentials` for the window following the change and inspect what those sessions reached.

### False positive analysis

- Initial onboarding of attribute-based access control produces a create followed by updates as the mapping is refined. This is expected and infrequent. Confirm the change appears in change management and that the source paths point at attributes your identity provider actually supplies.
- An organization that does not use attribute-based access control at all is unaffected in practice: with no permission-set policy referencing aws:PrincipalTag, changing the mapping alters no authorization outcome. The event is still worth reviewing, because the configuration is a precondition an attacker would establish before adding a tag-conditioned policy.

### Response and remediation

- Recover the approved attribute mapping from configuration management, restore it, and confirm permission-set policies that consume `aws:PrincipalTag` evaluate as intended.
- Review sessions established after the change: a redirected attribute alters which policy conditions a session satisfies, so access granted in that window may exceed what the entitlement intended.
- Restrict `sso:UpdateInstanceAccessControlAttributeConfiguration` to a change-managed identity, since the configuration is instance-wide and affects every permission set using ABAC.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/attributesforaccesscontrol.html",
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_UpdateInstanceAccessControlAttributeConfiguration.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/configure-abac.html",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
]
risk_score = 47
rule_id = "769cffca-6409-5494-9cba-05ce9d1e87d3"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- These operations exist only on organization instances of Identity Center; account instances reject them.
"""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Tactic: Defense Evasion",
    "Rule Type: Custom Query (KQL)",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset: "aws.cloudtrail" and
event.provider: "sso.amazonaws.com" and
event.outcome: "success" and
event.action: (
    "CreateInstanceAccessControlAttributeConfiguration" or
    "UpdateInstanceAccessControlAttributeConfiguration" or
    "DeleteInstanceAccessControlAttributeConfiguration"
)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"


[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1484"
name = "Domain or Tenant Policy Modification"
reference = "https://attack.mitre.org/techniques/T1484/"


[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "aws.cloudtrail.request_id",
    "aws.cloudtrail.user_identity.arn",
    "aws.cloudtrail.user_identity.session_context.session_issuer.arn",
    "aws.cloudtrail.flattened.request_parameters.instanceArn",
    "aws.cloudtrail.flattened.request_parameters.instanceAccessControlAttributeConfiguration.accessControlAttributes.key",
    "aws.cloudtrail.flattened.request_parameters.instanceAccessControlAttributeConfiguration.accessControlAttributes.value.source",
    "source.ip",
]

[rule.alert_suppression.duration]
unit = "m"
value = 20

