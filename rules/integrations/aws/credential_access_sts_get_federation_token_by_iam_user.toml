[metadata]
creation_date = "2026/08/24"
integration = ["aws"]
maturity = "production"
updated_date = "2026/08/24"

[rule]
author = ["Elastic"]
description = """
Detects GetFederationToken calls made by IAM users using long-term access keys (AKIA* prefix).
GetFederationToken returns temporary credentials scoped to a provided IAM policy and is used
by federation brokers to grant web application users access to AWS. When called directly by an
IAM user with a long-term key, it is a strong indicator of tools like aws_consoler — which
converts stolen IAM credentials into browser-accessible AWS console sessions — or other
credential-abuse tooling that leverages federation to escalate access or bypass console login
monitoring.
"""
false_positives = [
    """
    Legacy federation broker applications that use IAM user credentials to call GetFederationToken
    before issuing short-lived credentials to web application users will trigger this rule.
    Modern implementations should use IAM Identity Center or AssumeRoleWithWebIdentity. Validate
    the application architecture before tuning.
    """,
]
from = "now-6m"
index = ["logs-aws.cloudtrail-*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "AWS GetFederationToken Called by IAM User with Long-Term Key"
note = """## Triage and analysis

### Investigating AWS GetFederationToken Called by IAM User with Long-Term Key

GetFederationToken issues temporary credentials that can be exchanged for an AWS console session URL via the AWS federation endpoint (https://signin.amazonaws.com/federation). Tools like aws_consoler automate this exchange — an adversary who exfiltrates a long-term IAM access key can gain full browser-based AWS console access without knowing the IAM user's password or MFA device.

IAM users calling GetFederationToken directly with long-term keys (AKIA* prefix) is unusual in modern AWS environments: the standard pattern is an application role calling AssumeRole, not an IAM user calling GetFederationToken. This combination is a reliable indicator of either legacy federation infrastructure or credential-abuse tooling.

### Possible investigation steps

- Identify the IAM user from aws.cloudtrail.user_identity.arn and confirm the access key (aws.cloudtrail.user_identity.access_key_id) is an expected key for that user.
- Review source.ip and source.as.organization.name against known infrastructure. A call from an unexpected IP with a long-term key is high-risk.
- Check whether a console sign-in event (ConsoleLogin from signin.amazonaws.com) followed the GetFederationToken call within seconds — this confirms the token was exchanged for a console session.
- Review all API calls made using the resulting federation session (the session name is set in the GetFederationToken Name parameter and appears in subsequent CloudTrail events).
- Determine whether this IAM user should have federation capability and whether the access key may have been exfiltrated.

### Response and remediation

- Immediately deactivate the long-term access key.
- If a console session was established, revoke active sessions for the IAM user.
- Rotate all credentials associated with the user.
- Review GitHub, GitLab, CI/CD configs, and developer workstations for key exposure.
- Migrate any legitimate federation use cases to IAM Identity Center or AssumeRoleWithWebIdentity.
"""
references = [
    "https://docs.aws.amazon.com/STS/latest/APIReference/API_GetFederationToken.html",
    "https://github.com/NetSPI/aws_consoler",
    "https://www.netspi.com/blog/technical-blog/cloud-pentesting/gaining-aws-console-access-via-api-keys/",
    "https://securitylabs.datadoghq.com/cloud-security-atlas/attacks/accessing-the-aws-console-with-getfederationtoken/",
]
risk_score = 47
rule_id = "065a9a1b-9e48-45a1-8fa5-72373245847c"
setup = "The AWS integration must be ingesting management events into `logs-aws.cloudtrail-*`. STS management events are logged by default."
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS CloudTrail",
    "Service: AWS STS",
    "Rule Type: New Terms",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset: "aws.cloudtrail"
    and event.provider: "sts.amazonaws.com"
    and event.action: "GetFederationToken"
    and event.outcome: "success"
    and aws.cloudtrail.user_identity.type: "IAMUser"
    and aws.cloudtrail.user_identity.access_key_id: AKIA*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1606"
name = "Forge Web Credentials"
reference = "https://attack.mitre.org/techniques/T1606/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.cloudtrail.user_identity.arn",
    "aws.cloudtrail.user_identity.type",
    "aws.cloudtrail.user_identity.access_key_id",
    "user.name",
    "event.action",
    "event.outcome",
    "aws.cloudtrail.request_parameters",
    "source.ip",
    "source.as.organization.name",
    "cloud.region",
    "cloud.account.id",
]

[rule.new_terms]
field = "new_terms_fields"
value = ["cloud.account.id", "aws.cloudtrail.user_identity.arn"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-7d"
