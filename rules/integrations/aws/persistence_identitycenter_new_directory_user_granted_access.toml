[metadata]
creation_date = "2026/10/06"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL VALUES GA 9.4 is the binding constraint."
min_stack_version = "9.4.0"
updated_date = "2026/10/06"

[rule]
author = ["Elastic"]
description = """
Detects an Identity Store user being created and then assigned access to an AWS account within the same window, by the
same principal. Neither half is suspicious alone. Directory users are created constantly by onboarding, and account
assignments are the ordinary mechanism for granting access, so a rule on either event by itself is noise. The pair is
the signal: an identity that did not exist minutes ago now holds standing access to an AWS account, and one principal
performed both steps. This is the shape of a backdoor identity. An intruder who already holds Identity Center
administration creates a user in the directory, grants it access directly rather than through a group, and from then on
authenticates as a legitimate workforce identity that no joiner process ever approved and no group membership review
will surface. Direct user assignment is the quieter path, because most organizations review group entitlements rather
than the much smaller set of per-user assignments. The rule reports the created user, the acting principal, the
permission set and the target account, and whether the creation and the grant share an actor. Assignments to users
created outside the window do not match, and a user created without a subsequent grant does not match.
"""
false_positives = [
    """
    Automated joiner tooling that provisions a directory user and assigns account access in one workflow. This is a
    common and legitimate pattern. Identify the automation principal and exclude it specifically rather than the rule as
    a whole, because the detection depends on the creator and the grantor being the same identity, which is exactly what
    such automation does. Where onboarding grants access through group membership instead of a direct assignment, it
    will not match this rule at all.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center New User Granted Account Access"
note = """## Triage and analysis

### Investigating AWS Identity Center New User Granted Account Access

Detects an Identity Store user being created and then assigned access to an AWS account within the same window, by the same principal. Neither half is suspicious alone.

### Possible investigation steps

- Start with the acting principal, reported as the actor on both stages. The rule requires the same principal to create the user and grant the access, so the question is whether that identity is an onboarding automation, a human administrator, or something that should not be administering the directory at all. If it is automation, this is almost certainly routine and the principal should be excluded by name.
- Look at how the access was granted. This rule matches direct user assignments, not group membership. Most organizations onboard through groups, so a direct per-user assignment to a brand new identity is already unusual and is the quieter path for an intruder, because per-user assignments are reviewed far less often than group entitlements.
- Check what the permission set grants. The alert reports the permission set ARN and the target account but does not evaluate the policies attached to it. Resolve it with `aws sso-admin describe-permission-set` and `list-managed-policies-in-permission-set`; an administrator or broadly scoped permission set makes this urgent, a narrowly scoped one makes it ordinary onboarding.
- Confirm the user against the joiner record. The created user's display name, emails and name are masked in CloudTrail as `HIDDEN_DUE_TO_SECURITY_REASONS`, so the user id is the only identifier in the event. Resolve it with `aws identitystore describe-user --user-id` and check it against HR or the ticket that should have requested the account.
- Check for what followed. A backdoor identity is created to be used. Look for `GetRoleCredentials` or portal authentication for that user id after the grant, and for other rules in this set firing on the same subject.

### False positive analysis

- Automated joiner tooling that provisions a directory user and assigns account access in one workflow. This is a common and legitimate pattern. Identify the automation principal and exclude it specifically rather than the rule as a whole, because the detection depends on the creator and the grantor being the same identity, which is exactly what such automation does. Where onboarding grants access through group membership instead of a direct assignment, it will not match this rule at all.

### Response and remediation

- Remediate by deleting the account assignment first and the user second. Deleting the user alone does not end sessions already issued; existing role credentials remain valid until they expire.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-info-in-cloudtrail.html",
    "https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_CreateUser.html",
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_CreateAccountAssignment.html",
    "https://securitylabs.datadoghq.com/articles/tales-from-the-cloud-trenches-the-attacker-doth-persist-too-much/",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://www.cloudquery.io/blog/aws-priv-esc-identity-center",
]
risk_score = 47
rule_id = "111882b3-3b74-5293-ad1e-d01ecb1db113"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- Both stages are emitted in the Identity Center owner account, so no member-account trail is required.
- User creation through the console is emitted under sso-directory.amazonaws.com rather than identitystore.amazonaws.com and is matched as well.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Persistence",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail" AND event.outcome == "success" AND (
    (event.provider IN ("identitystore.amazonaws.com", "sso-directory.amazonaws.com") AND event.action == "CreateUser")
    OR (event.provider == "sso.amazonaws.com" AND event.action == "CreateAccountAssignment"))
| GROK aws.cloudtrail.response_elements """[{,] ?userId=%{DATA:Esql.gk_userid_0}[,}]"""
| GROK aws.cloudtrail.response_elements """[{,] ?user=\[?\{[^{}]*?userId=%{DATA:Esql.gk_user_userid_1}[,}\]]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?principalId=%{DATA:Esql.gk_principalid_2}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?principalType=%{DATA:Esql.gk_principaltype_3}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?permissionSetArn=%{DATA:Esql.gk_permissionsetarn_4}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?targetId=%{DATA:Esql.gk_targetid_5}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?targetType=%{DATA:Esql.gk_targettype_6}[,}]"""
| GROK aws.cloudtrail.response_elements """[{,] ?accountAssignmentCreationStatus=\[?\{[^{}]*?status=%{DATA:Esql.gk_accountassignmentcreationstatus_status_7}[,}\]]"""
| EVAL Esql.created_user = COALESCE( Esql.gk_userid_0, Esql.gk_user_userid_1),
    Esql.principal = Esql.gk_principalid_2,
    Esql.principal_type = Esql.gk_principaltype_3,
    Esql.permission_set = Esql.gk_permissionsetarn_4,
    Esql.target_account = Esql.gk_targetid_5,
    Esql_priv.actor = COALESCE(aws.cloudtrail.user_identity.session_context.session_issuer.arn, aws.cloudtrail.user_identity.arn, "unknown")
| EVAL Esql.stage = CASE(
    event.action == "CreateUser" AND Esql.created_user IS NOT NULL, "created",
    event.action == "CreateAccountAssignment" AND Esql.principal_type == "USER"
    AND Esql.gk_targettype_6 == "AWS_ACCOUNT"
    AND Esql.gk_accountassignmentcreationstatus_status_7 IN ("IN_PROGRESS", "SUCCEEDED"), "granted",
    "ignore")
| EVAL Esql.creation_record = CASE(Esql.stage == "created",
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "~", Esql.created_user, "~", Esql_priv.actor))
| INLINE STATS Esql.creations_values = VALUES(Esql.creation_record)
| WHERE Esql.stage == "granted" AND Esql.principal IS NOT NULL
| MV_EXPAND Esql.creations_values
| DISSECT Esql.creations_values "%{Esql.c_ms}~%{Esql.c_user}~%{Esql_priv.c_actor}"
| EVAL Esql.c_time = TO_DATETIME(TO_LONG(Esql.c_ms))
| WHERE Esql.c_user == Esql.principal AND Esql.c_time < @timestamp
| STATS Esql.created_at = MAX(Esql.c_time),
    Esql_priv.creating_principals_values = VALUES(Esql_priv.c_actor),
    Esql.same_actor_creations_count = COUNT(CASE(Esql_priv.c_actor == Esql_priv.actor AND Esql_priv.actor != "unknown", 1))
    BY Esql.granted_at = @timestamp,
    Esql.principal,
    Esql_priv.actor,
    Esql.permission_set,
    Esql.target_account,
    aws.cloudtrail.request_id,
    cloud.account.id,
    user.name,
    cloud.region,
    event.outcome,
    user_agent.original,
    event.action,
    event.provider
| WHERE Esql.same_actor_creations_count > 0
| EVAL Esql.seconds_from_creation_to_grant = DATE_DIFF("seconds", Esql.created_at, Esql.granted_at)
| KEEP Esql.*,
    Esql_priv.*,
    aws.cloudtrail.request_id,
    cloud.account.id,
    user.name,
    cloud.region,
    event.outcome,
    user_agent.original,
    event.action,
    event.provider
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1136"
name = "Create Account"
reference = "https://attack.mitre.org/techniques/T1136/"
[[rule.threat.technique.subtechnique]]
id = "T1136.003"
name = "Cloud Account"
reference = "https://attack.mitre.org/techniques/T1136/003/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

[rule.alert_suppression]
group_by = ["Esql.principal", "Esql.target_account", "Esql.permission_set"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "aws.cloudtrail.request_id",
    "cloud.account.id",
    "Esql.principal",
    "Esql_priv.actor",
    "Esql.permission_set",
    "Esql.target_account",
    "Esql.created_at",
    "Esql.granted_at",
    "Esql_priv.creating_principals_values",
    "Esql.seconds_from_creation_to_grant",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

