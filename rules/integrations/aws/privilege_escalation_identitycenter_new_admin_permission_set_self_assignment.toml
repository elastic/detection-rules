[metadata]
creation_date = "2026/09/08"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL FIELD_EXTRACT: Technical Preview since 9.5, no GA. Verified on 9.6.0."
min_stack_version = "9.6.0"
updated_date = "2026/09/08"

[rule]
author = ["Elastic"]
description = """
Detects one AWS credential attaching the exact AWS AdministratorAccess managed policy to an IAM Identity Center
permission set and requesting an assignment of that permission set to the acting Identity Center user within 30 minutes.
The assignment target must equal the native onBehalfOf user ID and include identity-store attribution. This identifies a
caller granting itself an administrator entitlement, whether the permission set was newly created or already existed;
routine assignments of unmodified permission sets and onboarding another user do not match. The alert proves assignment
request acceptance, not completed provisioning or unrestricted effective access.
"""
false_positives = [
    """
    An authorized administrator bootstrapping a new AdministratorAccess permission set and assigning it to their own
    Identity Center identity. Verify the complete change and restrict any exception to the expected actor and workflow.
    """,
]
from = "now-65m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Administrator Access Self-Assigned"
note = """## Triage and analysis

### Investigating AWS Identity Center Administrator Access Self-Assigned

Detects one AWS credential attaching the exact AWS AdministratorAccess managed policy to an IAM Identity Center permission set and requesting an assignment of that permission set to the acting Identity Center user within 30 minutes. The assignment target must equal the native onBehalfOf user ID and include identity-store attribution.

### Possible investigation steps

- The same access key must attach AdministratorAccess and submit the self-assignment. Review the permission-set ARN, target account, principal ID, actor identity-store ARN and source request IDs. Correlate the immutable onBehalfOf identity with the Identity Center instance; do not infer the user from a role-session name.
- Inspect the source CloudTrail events for the assignment request ID and permission-set ARN to recover complete actor and request context.
- A successful CreateAccountAssignment can return IN_PROGRESS. Check DescribeAccountAssignmentCreationStatus and the member-account role before concluding that access became usable. This read operation can omit its response from CloudTrail, so the detection deliberately ends at the accepted assignment request. SCPs, permissions boundaries and explicit Deny policies can constrain the attached administrator policy.

### False positive analysis

- An authorized administrator bootstrapping a new AdministratorAccess permission set and assigning it to their own Identity Center identity. Verify the complete change and restrict any exception to the expected actor and workflow.

### Response and remediation

- Check approved privileged-access bootstrap or disaster-recovery work. If the sequence is unexplained, contain the acting credentials, review the new assignment and permission-set changes, and investigate subsequent member-account activity. Preserve the actual CloudTrail records before removing the assignment. The query rejects an administrator-policy detachment before assignment; later cleanup does not erase the earlier match.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_CreateAccountAssignment.html",
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_AttachManagedPolicyToPermissionSet.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-cloudtrail-use-cases.html",
    "https://github.com/HackTricks-wiki/hacktricks-cloud/blob/74335dc4ee4248d4c10c69a5698341121bd2183d/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md",
    "https://www.cloudquery.io/blog/aws-priv-esc-identity-center",
    "https://aws.amazon.com/blogs/security/unauthorized-tactic-spotlight-initial-access-through-a-third-party-identity-provider/",
]
risk_score = 73
rule_id = "bda2b174-152a-5625-9bf3-8abd5db26230"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND event.outcome == "success"
    AND event.provider == "sso.amazonaws.com"
    AND event.action IN ("AttachManagedPolicyToPermissionSet", "DetachManagedPolicyFromPermissionSet", "CreateAccountAssignment")
    AND aws.cloudtrail.recipient_account_id IS NOT NULL
    AND aws.cloudtrail.request_id IS NOT NULL
| EVAL Esql.gk_permission_set_arn = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "permissionSetArn"),
    Esql.gk_managed_policy_arn = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "managedPolicyArn"),
    Esql.gk_principal_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "principalId"),
    Esql.gk_principal_type = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "principalType"),
    Esql.gk_target_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "targetId"),
    Esql.gk_target_type = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "targetType"),
    Esql.assignment_status = FIELD_EXTRACT(aws.cloudtrail.flattened.response_elements, "accountAssignmentCreationStatus.status")
| EVAL Esql.stage = CASE(
    event.action == "AttachManagedPolicyToPermissionSet" AND Esql.gk_managed_policy_arn IN ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws-us-gov:iam::aws:policy/AdministratorAccess", "arn:aws-cn:iam::aws:policy/AdministratorAccess"), "admin",
    event.action == "DetachManagedPolicyFromPermissionSet" AND Esql.gk_managed_policy_arn IN ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws-us-gov:iam::aws:policy/AdministratorAccess", "arn:aws-cn:iam::aws:policy/AdministratorAccess"), "detach",
    event.action == "CreateAccountAssignment", "assign")
| EVAL Esql.record = CASE(Esql.stage IN ("admin", "detach"),
        CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", Esql.stage, "|",
            COALESCE(aws.cloudtrail.user_identity.access_key_id, "unknown"))),
    Esql.assignment_record = CASE(Esql.stage == "assign"
        AND aws.cloudtrail.user_identity.access_key_id IS NOT NULL
        AND Esql.gk_permission_set_arn IS NOT NULL
        AND Esql.gk_target_type == "AWS_ACCOUNT"
        AND Esql.gk_target_id IS NOT NULL
        AND Esql.gk_principal_id IS NOT NULL
        AND Esql.assignment_status IN ("IN_PROGRESS", "SUCCEEDED")
        AND Esql.gk_principal_type == "USER"
        AND aws.cloudtrail.user_identity.on_behalf_of.user_id IS NOT NULL
        AND aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn IS NOT NULL
        AND Esql.gk_principal_id == aws.cloudtrail.user_identity.on_behalf_of.user_id,
        CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|",
            aws.cloudtrail.user_identity.access_key_id, "|", Esql.gk_target_id, "|", Esql.gk_principal_id, "|",
            aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn))
| STATS Esql.ps_history_values = VALUES(Esql.record),
    Esql.assignment_values = VALUES(Esql.assignment_record)
    BY aws.cloudtrail.recipient_account_id,
    Esql.permission_set_arn = Esql.gk_permission_set_arn
| MV_EXPAND Esql.assignment_values
| DISSECT Esql.assignment_values "%{Esql.assignment_ms}|%{aws.cloudtrail.request_id}|%{aws.cloudtrail.user_identity.access_key_id}|%{Esql.target_account}|%{Esql.principal_id}|%{Esql.identity_store_arn}"
| EVAL @timestamp = TO_DATETIME(TO_LONG(Esql.assignment_ms))
| MV_EXPAND Esql.ps_history_values
| DISSECT Esql.ps_history_values "%{Esql.change_ms}|%{Esql.change_stage}|%{Esql.change_key}"
| EVAL Esql.change_time = TO_DATETIME(TO_LONG(Esql.change_ms))
| WHERE Esql.change_time < @timestamp AND Esql.change_time >= @timestamp - 30 minutes
| STATS Esql.admin_attached_at = MAX(CASE(Esql.change_stage == "admin" AND Esql.change_key == aws.cloudtrail.user_identity.access_key_id, Esql.change_time)),
    Esql.admin_detached_at = MAX(CASE(Esql.change_stage == "detach", Esql.change_time))
    BY aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.user_identity.access_key_id,
    Esql.permission_set_arn,
    Esql.target_account,
    Esql.principal_id,
    Esql.identity_store_arn,
    aws.cloudtrail.request_id,
    @timestamp
| WHERE Esql.admin_attached_at IS NOT NULL
    AND (Esql.admin_detached_at IS NULL OR Esql.admin_detached_at < Esql.admin_attached_at)
| KEEP @timestamp, aws.cloudtrail.request_id, aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.user_identity.access_key_id, Esql.permission_set_arn, Esql.target_account,
    Esql.principal_id, Esql.identity_store_arn, Esql.admin_attached_at
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.cloudtrail.request_id",
    "aws.cloudtrail.recipient_account_id",
    "aws.cloudtrail.user_identity.access_key_id",
    "Esql.permission_set_arn",
    "Esql.target_account",
    "Esql.principal_id",
    "Esql.identity_store_arn",
    "Esql.admin_attached_at",
]

[rule.alert_suppression.duration]
unit = "m"
value = 70

