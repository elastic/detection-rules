[metadata]
creation_date = "2026/09/17"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL VALUES GA 9.4 is the binding constraint."
min_stack_version = "9.4.0"
updated_date = "2026/09/17"

[rule]
author = ["Elastic"]
description = """
Detects an IAM Identity Center permission-set session creating a durable IAM credential: an access key, a console login
profile, or a service-specific credential. A permission-set session is ephemeral by design. Revoking the account
assignment, deleting the Identity Store user or disabling the identity source ends it, and every use of it is
attributable to an Identity Center identity. An IAM access key or console password has none of those properties: it
survives all of them, it is attributable only to the IAM user that holds it, and it appears in no Identity Center audit
surface. A session that mints one has therefore converted temporary federated access into standalone persistence outside
the identity system that granted it. The caller is identified by an AWSReservedSSO_ session-issuer role, and the
Identity Center identity behind the session is reported from on_behalf_of. The rule also reports whether the IAM user
receiving the credential was created by the same Identity Center identity in the same window, which distinguishes a
complete self-contained backdoor from a credential issued on a pre-existing user.
"""
false_positives = [
    """
    Administrators legitimately use permission-set sessions to do IAM work, including creating service accounts and
    rotating their access keys. That is the main source of benign matches. The useful discriminators are reported:
    whether the IAM user was created by the same identity moments earlier (`Esql.target_user_created_in_same_chain`),
    which permission set was used, and how many credentials were issued. Credential rotation on a long-lived service
    account looks different from a user and key created seconds apart.
    """,
    """
    Infrastructure-as-code executed through a permission-set session will create users and keys as part of normal
    provisioning. Prefer exempting the specific permission set used by automation over exempting the behavior, and
    consider whether that automation should use a role with an instance or service profile rather than a long-lived key.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Session Created Long-Lived IAM Credential"
note = """## Triage and analysis

### Investigating AWS Identity Center Session Created Long-Lived IAM Credential

Detects an IAM Identity Center permission-set session creating a durable IAM credential: an access key, a console login profile, or a service-specific credential. A permission-set session is ephemeral by design.

### Possible investigation steps

- Read the chain indicator first. `Esql.target_user_created_in_same_chain` of 1 means the same Identity Center identity created the IAM user and then issued it a credential, which is a complete standalone backdoor: after this sequence the actor no longer needs Identity Center at all. A value of 0 means the credential was issued on a pre-existing user, which is more often administrative work but still worth confirming.
- Identify the Identity Center identity, not just the role. `Esql.identity_center_subject` is the Identity Store user behind the permission-set session; the session issuer only names the permission set. Resolve the subject with `aws identitystore describe-user --user-id` and establish whether that person should be performing IAM credential operations.
- Note which credential types were issued. `CreateAccessKey` yields programmatic access usable from anywhere. `CreateLoginProfile` yields console access with a password, which also means the account can be used interactively and can enrol its own MFA. Both appearing on one user is a strong signal of deliberate persistence rather than a single administrative task.
- Assess what the new credential can reach. Enumerate the IAM user's attached policies, inline policies and group memberships. A credential on a user with broad permissions is materially worse than one on a narrowly scoped service account.
- Establish whether the credential has been used. Pivot on the reported access key ID to `aws.cloudtrail.user_identity.access_key_id` to find activity performed with it, and on the user name for console sign-ins. Activity from an address or user agent unlike the permission-set session is significant.

### False positive analysis

- Administrators legitimately use permission-set sessions to do IAM work, including creating service accounts and rotating their access keys. That is the main source of benign matches. The useful discriminators are reported: whether the IAM user was created by the same identity moments earlier (`Esql.target_user_created_in_same_chain`), which permission set was used, and how many credentials were issued. Credential rotation on a long-lived service account looks different from a user and key created seconds apart.
- Infrastructure-as-code executed through a permission-set session will create users and keys as part of normal provisioning. Prefer exempting the specific permission set used by automation over exempting the behavior, and consider whether that automation should use a role with an instance or service profile rather than a long-lived key.

### Response and remediation

- Remediate by deleting the access key and login profile, then the IAM user if it was created in this chain. Note that revoking the Identity Center assignment does **not** invalidate the credential, which is the entire point of the technique, so the IAM-side cleanup is mandatory.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html",
    "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-cloudtrail-use-cases.html",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://securitylabs.datadoghq.com/articles/tales-from-the-cloud-trenches-the-attacker-doth-persist-too-much/",
]
risk_score = 47
rule_id = "39cc1552-d260-5360-b93f-5f209e76d387"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- The caller is identified from aws.cloudtrail.user_identity.session_context.session_issuer.arn, which carries the aws-reserved/sso.amazonaws.com role path, and the Identity Center identity from aws.cloudtrail.user_identity.on_behalf_of.user_id.
- The user-creation correlation needs the CreateUser event inside the lookback; a credential issued on a pre-existing user still alerts with the chain indicator set to 0.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM",
    "Service: AWS IAM Identity Center",
    "Tactic: Persistence",
    "Rule Type: ES|QL",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND event.provider == "iam.amazonaws.com"
    AND event.outcome == "success"
    AND event.action IN ("CreateUser", "CreateAccessKey", "CreateLoginProfile", "CreateServiceSpecificCredential")
| GROK aws.cloudtrail.request_parameters """[{,] ?userName=%{DATA:Esql.gk_username_0}[,}]"""
| GROK aws.cloudtrail.response_elements """[{,] ?accessKey=\[?\{[^{}]*?accessKeyId=%{DATA:Esql.gk_accesskey_accesskeyid_1}[,}\]]"""
| GROK aws.cloudtrail.response_elements """[{,] ?user=\[?\{[^{}]*?userName=%{DATA:Esql.gk_user_username_2}[,}\]]"""
| EVAL Esql_priv.session_issuer = aws.cloudtrail.user_identity.session_context.session_issuer.arn,
    Esql.identity_center_subject = aws.cloudtrail.user_identity.on_behalf_of.user_id,
    Esql_priv.target_user = Esql.gk_username_0,
    Esql_priv.access_key_id = Esql.gk_accesskey_accesskeyid_1,
    Esql.created_user = Esql.gk_user_username_2
| WHERE Esql_priv.session_issuer RLIKE "arn:[^:]+:iam::[0-9]{12}:role/aws-reserved/sso[.]amazonaws[.]com/.*AWSReservedSSO_.+"
| EVAL Esql.permission_set = REPLACE(REPLACE(Esql_priv.session_issuer, "^.*AWSReservedSSO_", ""), "_[0-9a-f]{16}$", "")
| EVAL Esql.user_record = CASE(event.action == "CreateUser" AND Esql.created_user IS NOT NULL,
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "~", Esql.created_user, "~", COALESCE(Esql.identity_center_subject, "none")))
| INLINE STATS Esql.user_history_values = VALUES(Esql.user_record)
| WHERE event.action != "CreateUser" AND Esql_priv.target_user IS NOT NULL
| MV_EXPAND Esql.user_history_values
| DISSECT Esql.user_history_values "%{Esql.h_ms}~%{Esql.h_user}~%{Esql.h_subject}"
| EVAL Esql.h_time = TO_DATETIME(TO_LONG(Esql.h_ms))
| EVAL Esql.same_chain = CASE(Esql.h_user == Esql_priv.target_user AND Esql.h_time <= @timestamp
    AND Esql.h_subject == COALESCE(Esql.identity_center_subject, "none"), 1, 0)
| STATS Esql.credentials_created_distinct_count = COUNT_DISTINCT(aws.cloudtrail.request_id),
    Esql.credential_types_values = VALUES(event.action),
    Esql_priv.access_key_ids_values = VALUES(Esql_priv.access_key_id),
    Esql.first_credential_at = MIN(@timestamp),
    Esql.last_credential_at = MAX(@timestamp),
    Esql.target_user_created_in_same_chain = MAX(Esql.same_chain),
    Esql.user_created_at = MIN(CASE(Esql.same_chain == 1, Esql.h_time))
    BY Esql_priv.target_user,
    Esql.permission_set,
    Esql.identity_center_subject,
    Esql_priv.session_issuer,
    cloud.account.id,
    event.outcome,
    event.provider
| KEEP Esql.*, Esql_priv.*, cloud.account.id, event.outcome, event.provider
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.001"
name = "Additional Cloud Credentials"
reference = "https://attack.mitre.org/techniques/T1098/001/"


[[rule.threat.technique]]
id = "T1136"
name = "Create Account"
reference = "https://attack.mitre.org/techniques/T1136/"
[[rule.threat.technique.subtechnique]]
id = "T1136.003"
name = "Cloud Account"
reference = "https://attack.mitre.org/techniques/T1136/003/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

[rule.alert_suppression]
group_by = ["Esql_priv.target_user", "Esql.identity_center_subject"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "Esql_priv.target_user",
    "Esql.target_user_created_in_same_chain",
    "Esql.credential_types_values",
    "Esql.credentials_created_distinct_count",
    "Esql_priv.access_key_ids_values",
    "Esql.identity_center_subject",
    "Esql.permission_set",
    "Esql_priv.session_issuer",
    "Esql.user_created_at",
    "Esql.first_credential_at",
    "cloud.account.id",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

