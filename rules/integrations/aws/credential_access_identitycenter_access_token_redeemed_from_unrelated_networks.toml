[metadata]
creation_date = "2026/09/10"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL VALUES GA 9.4 is the binding constraint."
min_stack_version = "9.4.0"
updated_date = "2026/09/10"

[rule]
author = ["Elastic"]
description = """
Detects a single IAM Identity Center access token being redeemed for AWS role credentials from two or more autonomous
systems. An Identity Center access token is a bearer credential: the portal credential endpoint authenticates the token
itself and not the caller, so anyone who obtains the token can redeem it for the user's AWS role credentials from any
network. CloudTrail records a stable credential identifier for the token alongside the source address of each
redemption, so one identifier appearing from addresses belonging to more than one autonomous system indicates the token
is being used away from where it was issued. The autonomous system rather than the address is compared, so an
organization whose users egress through a pool of addresses belonging to one operator does not match, while a token
redeemed from cloud or hosting infrastructure alongside a corporate or residential network does. The reported countries
and the interval between first and last use let travel be distinguished from replay.
"""
false_positives = [
    """
    A user roaming between networks during a session, for example moving from a corporate or home connection to a mobile
    carrier, changes autonomous system legitimately and can redeem the same token from both. Compare the reported
    countries and the interval: a plausible physical movement over a plausible interval is roaming, while two distant
    countries seconds apart is not. The user agents are also reported, and a change of client alongside the change of
    network strengthens the replay reading.
    """,
    """
    An automation that holds an Identity Center token and runs from more than one egress point, such as a multi-region
    pipeline, will match by design. Confirm whether the reported subject is a workload identity and, if so, exempt that
    subject rather than the behavior, since a human token redeemed from two operators remains worth alerting on.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Token Redeemed from Multiple ASNs"
note = """## Triage and analysis

### Investigating AWS Identity Center Token Redeemed from Multiple ASNs

Detects a single IAM Identity Center access token being redeemed for AWS role credentials from two different network operators. An Identity Center access token is a bearer credential: the portal credential endpoint authenticates the token itself and not the caller, so anyone who obtains the token can redeem it for the user's AWS role credentials from any network.

### Possible investigation steps

- Read the network operators first. The alert reports the autonomous system behind each redemption. A corporate or residential operator paired with a cloud or hosting provider is the strongest form of this signal, because it means the token was redeemed from infrastructure rather than from a user device.
- Check the interval against the countries. The alert reports the seconds between first and last use alongside the country of each address. A token redeemed from two countries within seconds cannot be one person travelling, so it is either a proxy or a second party holding the token.
- Compare the user agents. A browser or AWS CLI user agent on one redemption and a generic HTTP client on the other indicates the token was extracted and replayed by tooling rather than used by the original client.
- Identify the exposure. The token belongs to the reported Identity Store subject, so enumerate that user's permission set assignments to establish what the redeemed credentials could reach. Then pivot to the role sessions the redemptions produced and review their activity from the unfamiliar address specifically.
- Consider how the token was obtained. Identity Center tokens are cached on disk by the AWS CLI under `~/.aws/sso/cache/`, so endpoint file-access telemetry on that path is the most direct corroboration. A token can also leak through a browser extension, a shared shell history, or an application that logs authorization headers.

### False positive analysis

- A user roaming between networks during a session, for example moving from a corporate or home connection to a mobile carrier, changes autonomous system legitimately and can redeem the same token from both. Compare the reported countries and the interval: a plausible physical movement over a plausible interval is roaming, while two distant countries seconds apart is not. The user agents are also reported, and a change of client alongside the change of network strengthens the replay reading.
- An automation that holds an Identity Center token and runs from more than one egress point, such as a multi-region pipeline, will match by design. Confirm whether the reported subject is a workload identity and, if so, exempt that subject rather than the behavior, since a human token redeemed from two operators remains worth alerting on.

### Response and remediation

- Containment: the role credentials the token produced are independent of the token once issued, so revoking the user's active sessions and the token both matter. Delete the user's Identity Center sessions, then review and rotate anything the redeemed credentials reached.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/PortalAPIReference/API_GetRoleCredentials.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/understanding-sign-in-events.html",
    "https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://www.zscaler.com/blogs/cybersecurity-best-practices/aws-sso-access-tokens",
]
risk_score = 73
rule_id = "ce4f7aaa-0089-5704-83f8-df859f62b3fd"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- This rule requires the GeoIP and autonomous-system enrichment that the AWS integration applies to source.ip, because it compares source.as.organization.name rather than the address; without that enrichment the network-operator condition is never satisfied and the rule cannot fire.
- Both redemptions must fall inside the lookback for the aggregation to see them.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Credential Access",
    "Tactic: Defense Evasion",
    "Rule Type: ES|QL",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND event.provider == "sso.amazonaws.com"
    AND event.action IN ("GetRoleCredentials", "ListAccountRoles", "ListAccounts")
    AND aws.cloudtrail.user_identity.credential_id IS NOT NULL
    AND source.ip IS NOT NULL
    AND source.as.organization.name IS NOT NULL
| STATS Esql.source_ip_distinct_count = COUNT_DISTINCT(source.ip),
    Esql.source_as_organization_name_distinct_count = COUNT_DISTINCT(source.as.organization.name),
    Esql.source_ip_values = VALUES(source.ip),
    Esql.source_as_organization_name_values = VALUES(source.as.organization.name),
    Esql.source_geo_country_iso_code_values = VALUES(source.geo.country_iso_code),
    Esql.user_agent_original_values = VALUES(user_agent.original),
    Esql.event_action_values = VALUES(event.action),
    Esql.identity_center_subjects_values = VALUES(aws.cloudtrail.user_identity.on_behalf_of.user_id),
    Esql.redemptions_count = COUNT(*),
    Esql.first_use_at = MIN(@timestamp),
    Esql.last_use_at = MAX(@timestamp)
    BY Esql_priv.credential_id = aws.cloudtrail.user_identity.credential_id,
    event.provider,
    cloud.account.id
| WHERE Esql.source_ip_distinct_count > 1 AND Esql.source_as_organization_name_distinct_count > 1
| EVAL Esql.seconds_between_first_and_last_use = DATE_DIFF("seconds", Esql.first_use_at, Esql.last_use_at)
| KEEP Esql.*, Esql_priv.*, event.provider, cloud.account.id
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1528"
name = "Steal Application Access Token"
reference = "https://attack.mitre.org/techniques/T1528/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1550"
name = "Use Alternate Authentication Material"
reference = "https://attack.mitre.org/techniques/T1550/"
[[rule.threat.technique.subtechnique]]
id = "T1550.001"
name = "Application Access Token"
reference = "https://attack.mitre.org/techniques/T1550/001/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.alert_suppression]
group_by = ["Esql_priv.credential_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "Esql_priv.credential_id",
    "Esql.identity_center_subjects_values",
    "Esql.source_ip_values",
    "Esql.source_as_organization_name_values",
    "Esql.source_geo_country_iso_code_values",
    "Esql.user_agent_original_values",
    "Esql.source_ip_distinct_count",
    "Esql.source_as_organization_name_distinct_count",
    "Esql.redemptions_count",
    "Esql.event_action_values",
    "Esql.first_use_at",
    "Esql.last_use_at",
    "Esql.seconds_between_first_and_last_use",
    "cloud.account.id",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

