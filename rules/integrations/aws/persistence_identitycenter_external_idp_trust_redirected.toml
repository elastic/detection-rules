[metadata]
creation_date = "2026/10/01"
integration = ["aws"]
maturity = "production"
updated_date = "2026/10/01"

[rule]
author = ["Elastic"]
description = """
Detects a change to the external identity provider trust of an IAM Identity Center directory: importing or deleting an
identity provider signing certificate, or creating, updating, enabling or disabling the external identity provider
configuration itself. When an external identity provider is the identity source, Identity Center accepts any assertion
that provider signs, and the signing certificate is the entirety of that trust. Importing an attacker-held certificate
therefore allows authentication as any user in the directory, with no change to any Identity Store user, group,
permission set or assignment, and without satisfying the multi-factor requirements the real provider enforces. Disabling
the external provider is the complementary move, falling authentication back to the Identity Center directory where an
attacker-set password may already exist. These operations are rare in steady-state operation, so every successful
occurrence is reported rather than only those followed by an observed sign-in.
"""
false_positives = [
    """
    Scheduled certificate rotation produces ImportExternalIdPCertificate legitimately, and identity providers rotate
    signing certificates on their own schedule. Confirm the import corresponds to a rotation your identity team
    performed and that the new certificate came from the provider, not from a file an operator was sent. The
    distinguishing evidence is change management, not the event itself.
    """,
    """
    Initial onboarding or migration of an identity source produces the create and enable operations, often together with
    a certificate import. This is expected once per directory and should correspond to a planned project.
    """,
]
from = "now-125m"
index = ["logs-aws.cloudtrail-*"]
interval = "10m"
language = "kuery"
license = "Elastic License v2"
name = "AWS Identity Center Identity Source Changed"
note = """## Triage and analysis

### Investigating AWS Identity Center Identity Source Changed

Detects a change to the external identity provider trust of an IAM Identity Center directory: importing or deleting an identity provider signing certificate, or creating, updating, enabling or disabling the external identity provider configuration itself. When an external identity provider is the identity source, Identity Center accepts any assertion that provider signs, and the signing certificate is the entirety of that trust.

### Possible investigation steps

- Treat this as a potential full-directory authentication compromise until proven otherwise. The external identity provider's signing certificate is the whole of the trust: Identity Center validates the assertion signature and accepts the identity the assertion asserts. An attacker who imports their own certificate can authenticate as any user in the directory without touching a single Identity Store object, and without satisfying the real provider's multi-factor policy. There is no corresponding Identity Store or permission-set event to correlate with, which is precisely why this configuration change is the detection point.
- Read the reported operation. `ImportExternalIdPCertificate` adds a signing certificate and is the highest-concern case. `UpdateExternalIdPConfigurationForDirectory` can repoint issuer or endpoint metadata. `DisableExternalIdPConfigurationForDirectory` falls authentication back to the Identity Center directory, which matters if any user has a password set there. `DeleteExternalIdPCertificate` can be used to force reliance on a certificate the attacker controls after importing one.
- Identify the acting principal and confirm the change was requested. Identity-source changes should originate from a small, known set of administrators and correspond to a change record. A permission-set session making this change is especially significant, because it means federated access was used to alter the federation itself.
- Enumerate the current trust state out of band with `aws sso-admin list-instances` and the directory's identity-provider configuration, and compare the certificate thumbprints against what your identity provider actually publishes. An unrecognised thumbprint is confirmation.
- Review authentication that followed the change. Pivot on the affected directory and look for federated sign-in and authentication events (`UserAuthentication` from signin.amazonaws.com, `Authenticate` and `Federate` from sso.amazonaws.com) after the change timestamp. Any sign-in after an unauthorised certificate import should be treated as unauthenticated, regardless of which user it claims to be.

### False positive analysis

- Scheduled certificate rotation produces ImportExternalIdPCertificate legitimately, and identity providers rotate signing certificates on their own schedule. Confirm the import corresponds to a rotation your identity team performed and that the new certificate came from the provider, not from a file an operator was sent. The distinguishing evidence is change management, not the event itself.
- Initial onboarding or migration of an identity source produces the create and enable operations, often together with a certificate import. This is expected once per directory and should correspond to a planned project.

### Response and remediation

- Containment: remove the unrecognised certificate, re-import the legitimate one, and revoke active Identity Center sessions. Note that role credentials already issued from a forged session remain valid until they expire and must be revoked separately.
"""
references = [
    "https://docs.aws.amazon.com/service-authorization/latest/reference/list_sso-directory.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/logging-using-cloudtrail.html",
    "https://aws.amazon.com/blogs/security/unauthorized-tactic-spotlight-initial-access-through-a-third-party-identity-provider/",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a",
]
risk_score = 73
rule_id = "8308b36a-a539-5e02-9e2b-087b4c14cf41"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- These operations are Identity Store console APIs and are emitted under the sso-directory.amazonaws.com event source rather than identitystore.amazonaws.com, so collect console API activity and do not filter the Identity Center owner account to public API event sources only.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

The lookback overlaps the run interval, so alert suppression on the directory and operation deduplicates repeated matches; measure CloudTrail delivery latency in your environment before shortening the lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Persistence",
    "Tactic: Defense Evasion",
    "Rule Type: Custom Query (KQL)",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset: "aws.cloudtrail" and
event.outcome: "success" and
event.provider: ("sso-directory.amazonaws.com" or "sso.amazonaws.com") and
event.action: (
    "ImportExternalIdPCertificate" or
    "DeleteExternalIdPCertificate" or
    "CreateExternalIdPConfigurationForDirectory" or
    "UpdateExternalIdPConfigurationForDirectory" or
    "EnableExternalIdPConfigurationForDirectory" or
    "DisableExternalIdPConfigurationForDirectory" or
    "AssociateDirectory" or
    "DisassociateDirectory"
)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1556"
name = "Modify Authentication Process"
reference = "https://attack.mitre.org/techniques/T1556/"
[[rule.threat.technique.subtechnique]]
id = "T1556.007"
name = "Hybrid Identity"
reference = "https://attack.mitre.org/techniques/T1556/007/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1484"
name = "Domain or Tenant Policy Modification"
reference = "https://attack.mitre.org/techniques/T1484/"
[[rule.threat.technique.subtechnique]]
id = "T1484.002"
name = "Trust Modification"
reference = "https://attack.mitre.org/techniques/T1484/002/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "aws.cloudtrail.request_id",
    "aws.cloudtrail.user_identity.arn",
    "aws.cloudtrail.user_identity.session_context.session_issuer.arn",
    "aws.cloudtrail.user_identity.on_behalf_of.user_id",
    "aws.cloudtrail.flattened.request_parameters.directoryId",
    "aws.cloudtrail.flattened.request_parameters.identityStoreId",
    "cloud.account.id",
    "source.ip",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

