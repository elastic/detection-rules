missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "Esql.created_at",
    "event.action",
    "Esql.directory",
    "Esql.tenant",
    "Esql_priv.actor",
    "Esql.scim_operations_after_count",
    "Esql.first_scim_operation_at",
    "Esql.seconds_to_first_scim_operation",
    "Esql.scim_operations_values",
    "Esql_priv.scim_access_keys_values",
    "Esql.scim_patch_operations_values",
    "Esql.scim_patch_paths_values",
    "aws.cloudtrail.request_id",
    "source.ip",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

