field_names = [
    "Esql.created_at",
    "event.action",
    "Esql.directory",
    "Esql.tenant",
    "Esql_priv.actor",
    "aws.cloudtrail.request_id",
    "source.ip",
]

[rule.alert_suppression.duration]
unit = "m"
value = 20

