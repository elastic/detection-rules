[metadata]
creation_date = "2026/10/01"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL FIELD_EXTRACT: Technical Preview since 9.5, no GA. Verified on 9.6.0."
min_stack_version = "9.6.0"
updated_date = "2026/10/01"

[rule]
author = ["Elastic"]
description = """
Detects successful creation of an IAM Identity Center SCIM provisioning tenant or bearer token. A SCIM bearer token is
a long-lived credential that authorises the holder to create, modify and delete Identity Store users, groups and group
memberships through the SCIM endpoint. It is not an Identity Center identity and is not covered by any permission set.
Creating an additional tenant or token therefore establishes a durable identity-management channel outside the
Identity Center entitlement model and is the precondition for SCIM-driven privileged group changes and attribute
rebinding.
"""
false_positives = [
    """
    Onboarding or re-onboarding an identity provider for automatic provisioning legitimately creates a tenant and a
    bearer token, and AWS requires token rotation, so a periodic CreateBearerToken is expected. Confirm the creation
    corresponds to a planned onboarding or a scheduled rotation, and that the number of active tokens afterwards matches
    what your identity provider needs. More tokens than providers is the condition worth investigating.
    """,
]
from = "now-15m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center SCIM Provisioning Token Created"
note = """## Triage and analysis

### Investigating AWS Identity Center SCIM Provisioning Token Created

Detects successful creation of an IAM Identity Center SCIM provisioning tenant or bearer token. A SCIM bearer token is a long-lived credential that authorises the holder to create, modify and delete Identity Store users, groups and group memberships through the SCIM endpoint.

### Possible investigation steps

- Understand what the token confers. The holder can create, modify and delete Identity Store users, groups and memberships through the SCIM endpoint. That is sufficient to add an attacker-controlled user to a group carrying an administrative permission set, or to rewrite a user's binding attributes, without holding any Identity Center entitlement and without appearing in Identity Center's own authorisation model.
- Attribute the creation. Review the actor, source address, user agent, account, and request identifier, then compare them with the identity provider onboarding or token-rotation workflow expected in your environment.
- Review subsequent SCIM activity separately. SCIM events use `identitystore-scim.amazonaws.com` and identify the bearer token through `userIdentity.accessKeyId`. Compare their source addresses with your identity provider's published egress ranges.

### False positive analysis

- Onboarding or re-onboarding an identity provider for automatic provisioning legitimately creates a tenant and a bearer token, and AWS requires token rotation, so a periodic CreateBearerToken is expected. Confirm the creation corresponds to a planned onboarding or a scheduled rotation, and that the number of active tokens afterwards matches what your identity provider needs. More tokens than providers is the condition worth investigating.

### Response and remediation

- Establish whether the creation was expected. A SCIM bearer token is created when an identity provider is connected for automatic provisioning and when a token is rotated; outside those two cases it should not appear. Confirm against change management and against the number of identity providers you actually provision from.
- Enumerate the current state out of band with the Identity Center console's automatic-provisioning view, and revoke any token that does not correspond to a provider you operate. Revoking a token immediately stops further SCIM operations but does not reverse identity changes already made, so review users, groups and memberships created or modified in the window.
"""
references = [
    "https://docs.aws.amazon.com/service-authorization/latest/reference/list_sso-directory.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/scim-logging-using-cloudtrail.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/rotate-token.html",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://ammune.ai/blog/scim-api-security-best-practices",
]
risk_score = 47
rule_id = "907803c1-0b2b-571c-83d7-889068cdf776"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management write events from the Identity Center owner account.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- Token and tenant creation operations are Identity Store console APIs emitted under sso-directory.amazonaws.com."""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Persistence",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-* METADATA _id, _version, _index
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND event.outcome == "success"
    AND event.provider == "sso-directory.amazonaws.com"
    AND event.action IN ("CreateBearerToken", "CreateProvisioningTenant")
| EVAL Esql.gk_directory_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "directoryId"),
    Esql.gk_identity_store_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "identityStoreId"),
    Esql.gk_nested_directory_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "user.directoryId"),
    Esql.gk_tenant_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "tenantId"),
    Esql.gk_provisioning_tenant_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "provisioningTenantId")
| EVAL Esql.created_at = @timestamp,
    Esql.directory = COALESCE(Esql.gk_directory_id, Esql.gk_identity_store_id, Esql.gk_nested_directory_id),
    Esql.tenant = COALESCE( Esql.gk_tenant_id, Esql.gk_provisioning_tenant_id),
    Esql_priv.actor = COALESCE(aws.cloudtrail.user_identity.session_context.session_issuer.arn, aws.cloudtrail.user_identity.arn, "unknown")
| KEEP _id, _version, _index, @timestamp, Esql.*, Esql_priv.*, aws.*, cloud.*, event.*, source.*, user.*, user_agent.*
'''


