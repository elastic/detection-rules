[metadata]
creation_date = "2026/09/08"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL FIELD_EXTRACT: Technical Preview since 9.5, no GA. Verified on 9.6.0."
min_stack_version = "9.6.0"
updated_date = "2026/09/08"

[rule]
author = ["Elastic"]
description = """
Detects an Identity Center user whose direct application assignment was revoked obtaining a new JWT-bearer token and using
that token to retrieve AWS role credentials within 15 minutes. The identity-store subject links the revocation to the
token issuance, and the AWS-issued credential ID links the issued token to GetRoleCredentials, so a revoked principal that
still mints a JWT-bearer token and exchanges it for role credentials is surfaced as a single sequence. A token issuance or
credential retrieval for a principal that was not recently revoked for the same application does not match.
"""
false_positives = [
    """
    A deliberate access-control test or coordinated migration that revokes a user's application assignment and then issues
    a JWT-bearer token and retrieves AWS role credentials for that user within the same window.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Revoked User Bypassed Assignment for Credentials"
note = """## Triage and analysis

### Investigating AWS Identity Center Revoked User Bypassed Assignment for Credentials

Detects an Identity Center user whose direct application assignment was revoked obtaining a new JWT-bearer token and using that token to retrieve AWS role credentials within 15 minutes. The identity-store subject links the revocation to the token issuance, and the AWS-issued credential ID links the issued token to GetRoleCredentials.

### Possible investigation steps

- Recover the `DeleteApplicationAssignment`, the `CreateTokenWithIAM` (jwt-bearer) and the `GetRoleCredentials` using `Esql.source_request_ids_values`, `Esql.token_request` and `aws.cloudtrail.request_id`. The alert intentionally retains only correlation fields rather than arbitrary event-level values, so use those request IDs to recover source IP, user agent and actor context from the original CloudTrail events. Confirm the revoked subject is the same subject the JWT-bearer token was issued for, and that the issued `identitycenter:CredentialId` matches the credential used on GetRoleCredentials.
- Review the target account and role (`Esql.target_account`, `Esql.role_name`) that credentials were retrieved for, and whether those STS credentials were subsequently used against resources. The rule proves role-credential retrieval; it does not by itself prove downstream use of the credentials.
- Confirm whether the revocation was intentional and whether the principal still holds access through a group-based assignment. A JWT-bearer token issued and exchanged for role credentials shortly after an individual assignment was revoked is the behavior of interest, even when enforcement configuration is unchanged.
- Verify the actor's authority and any approved change record. A deliberate access-control test or coordinated migration can reproduce the sequence. The 15-minute behavior window and AWS event-time ordering mean late or missing CloudTrail delivery can cause a missed detection; account for delivery latency when investigating.

### False positive analysis

- A deliberate access-control test or coordinated migration that revokes a user's application assignment and then issues a JWT-bearer token and retrieves AWS role credentials for that user within the same window.

### Response and remediation

- Use the source and token request IDs to recover the original CloudTrail events. The token subject is taken from native additionalEventData identitystore:UserId and identitystore:IdentityStoreArn; it is never inferred from a role-session name. The issued identitycenter:CredentialId must match the credentialId of the access-portal request. These are standard CloudTrail fields carried by the default integration.
- Confirm the actor's authority and the change request before remediation. If the sequence is unexplained, preserve evidence, contain the acting credentials and any STS session they produced, and remove unwanted access through established incident-response procedures.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_PutApplicationAssignmentConfiguration.html",
    "https://docs.aws.amazon.com/singlesignon/latest/OIDCAPIReference/API_CreateTokenWithIAM.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-cloudtrail-use-cases.html",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://awsteele.com/blog/2026/07/01/apps-can-now-impersonate-human-access-to-aws-via-iam-identity-center.html",
]
risk_score = 73
rule_id = "303b9036-68fd-5e42-8fdb-4108a39de607"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND event.outcome == "success"
    AND aws.cloudtrail.request_id IS NOT NULL
    AND (
      (event.provider == "sso.amazonaws.com" AND event.action IN ("DeleteApplicationAssignment", "GetRoleCredentials"))
      OR (event.provider == "sso-oauth.amazonaws.com" AND event.action == "CreateTokenWithIAM"))
| EVAL Esql.gk_application_arn = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "applicationArn"),
    Esql.gk_client_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "clientId"),
    Esql.gk_identitystore_user_id = FIELD_EXTRACT(aws.cloudtrail.flattened.additional_eventdata, "identitystore:UserId"),
    Esql.gk_identitystore_arn = FIELD_EXTRACT(aws.cloudtrail.flattened.additional_eventdata, "identitystore:IdentityStoreArn"),
    Esql.gk_credential_id = FIELD_EXTRACT(aws.cloudtrail.flattened.additional_eventdata, "identitycenter:CredentialId"),
    Esql.gk_principal_type = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "principalType"),
    Esql.gk_principal_id = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "principalId"),
    Esql.gk_grant_type = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "grantType"),
    Esql.gk_token_type = FIELD_EXTRACT(aws.cloudtrail.flattened.response_elements, "tokenType"),
    Esql.gk_account_id = FIELD_EXTRACT(aws.cloudtrail.flattened.service_event_details, "account_id"),
    Esql.gk_role_name = FIELD_EXTRACT(aws.cloudtrail.flattened.service_event_details, "role_name")
| EVAL Esql.app = COALESCE(Esql.gk_application_arn, Esql.gk_client_id),
    Esql.subject = COALESCE(Esql.gk_identitystore_user_id, aws.cloudtrail.user_identity.on_behalf_of.user_id),
    Esql.subject_store = COALESCE(Esql.gk_identitystore_arn, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn),
    Esql_priv.credential = COALESCE(Esql.gk_credential_id, aws.cloudtrail.user_identity.credential_id)
| EVAL Esql.stage = CASE(
    event.action == "DeleteApplicationAssignment" AND Esql.gk_principal_type == "USER", "revoke",
    event.action == "CreateTokenWithIAM" AND Esql.gk_grant_type == "urn:ietf:params:oauth:grant-type:jwt-bearer" AND Esql.gk_token_type == "Bearer", "token",
    event.action == "GetRoleCredentials", "use", "ignore")
| EVAL Esql.revoke_record = CASE(
    Esql.stage == "revoke"
      AND Esql.app RLIKE "[-A-Za-z0-9+=,.@_:/]+"
      AND Esql.gk_principal_id RLIKE "[-A-Za-z0-9+=,.@_:/]+"
      AND aws.cloudtrail.request_id RLIKE "[-A-Za-z0-9+=,.@_:/]+",
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.app, "|", Esql.gk_principal_id)),
    Esql.token_record = CASE(
      Esql.stage == "token"
        AND Esql.app RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND Esql.subject RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND Esql.subject_store RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND Esql_priv.credential RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND aws.cloudtrail.request_id RLIKE "[-A-Za-z0-9+=,.@_:/]+",
      CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.app, "|", Esql.subject, "|", Esql.subject_store, "|", Esql_priv.credential)),
    Esql.use_record = CASE(
      Esql.stage == "use"
        AND Esql_priv.credential RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND Esql.subject RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND Esql.subject_store RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND Esql.gk_account_id RLIKE "[0-9]{12}"
        AND Esql.gk_role_name RLIKE "[-A-Za-z0-9+=,.@_/]+"
        AND aws.cloudtrail.request_id RLIKE "[-A-Za-z0-9+=,.@_:/]+",
      CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql_priv.credential, "|", Esql.subject, "|", Esql.subject_store, "|", Esql.gk_account_id, "|", Esql.gk_role_name))
| STATS Esql.revoke_history_values = VALUES(Esql.revoke_record),
    Esql.token_history_values = VALUES(Esql.token_record),
    Esql.use_history_values = VALUES(Esql.use_record)
    BY aws.cloudtrail.recipient_account_id
| MV_EXPAND Esql.use_history_values
| DISSECT Esql.use_history_values "%{Esql.use_ms}|%{Esql.use_request}|%{Esql_priv.credential}|%{Esql.subject}|%{Esql.subject_store}|%{Esql.target_account}|%{Esql.role_name}"
| EVAL Esql.use_time = TO_DATETIME(TO_LONG(Esql.use_ms))
| MV_EXPAND Esql.token_history_values
| DISSECT Esql.token_history_values "%{Esql.token_ms}|%{Esql.token_request}|%{Esql.application_arn}|%{Esql.token_user}|%{Esql.token_store}|%{Esql.token_credential}"
| EVAL Esql.token_time = TO_DATETIME(TO_LONG(Esql.token_ms))
| WHERE Esql.token_credential == Esql_priv.credential
    AND Esql.token_time < Esql.use_time
    AND Esql.token_time >= Esql.use_time - 15 minutes
    AND Esql.token_user == Esql.subject
    AND Esql.token_store == Esql.subject_store
| MV_EXPAND Esql.revoke_history_values
| DISSECT Esql.revoke_history_values "%{Esql.revoke_ms}|%{Esql.revoke_request}|%{Esql.revoked_app}|%{Esql.revoked_user}"
| EVAL Esql.revoke_time = TO_DATETIME(TO_LONG(Esql.revoke_ms))
| WHERE Esql.revoked_app == Esql.application_arn
    AND Esql.revoked_user == Esql.subject
    AND Esql.revoke_time < Esql.token_time
    AND Esql.revoke_time >= Esql.use_time - 15 minutes
| STATS Esql.revoked_at = MAX(Esql.revoke_time),
    Esql.source_request_ids_values = VALUES(Esql.revoke_request)
    BY aws.cloudtrail.recipient_account_id,
    Esql.use_request,
    Esql.use_time,
    Esql.application_arn,
    Esql_priv.credential,
    Esql.subject,
    Esql.subject_store,
    Esql.target_account,
    Esql.role_name,
    Esql.token_request,
    Esql.token_time
| WHERE Esql.revoked_at IS NOT NULL AND Esql.revoked_at < Esql.token_time
| EVAL @timestamp = Esql.use_time,
    aws.cloudtrail.request_id = Esql.use_request
| KEEP Esql.*, Esql_priv.*, @timestamp, aws.cloudtrail.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"


[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.cloudtrail.request_id",
    "Esql.application_arn",
    "Esql.subject",
    "Esql.subject_store",
    "Esql_priv.credential",
    "Esql.target_account",
    "Esql.role_name",
    "Esql.revoked_at",
    "Esql.token_time",
    "Esql.token_request",
    "Esql.source_request_ids_values",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

