[metadata]
creation_date = "2026/09/08"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL VALUES GA 9.4 is the binding constraint."
min_stack_version = "9.4.0"
updated_date = "2026/09/08"

[rule]
author = ["Elastic"]
description = """
Detects an Identity Center user whose direct application assignment was revoked being denied token issuance, disabling
application assignment enforcement, obtaining a new JWT-bearer token and using that exact token to retrieve AWS role
credentials within 30 minutes. Native identity and store attribution must agree across denial and configuration change,
while AWS-issued token credential ID and subject metadata link issuance to GetRoleCredentials. Explicit reassignment or
restored enforcement before issuance cancels the sequence.
"""
false_positives = [
    """
    A deliberate access-control test or coordinated migration that revokes a user, confirms denial, allows that user to
    disable enforcement, and then tests AWS role-credential retrieval.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Revoked User Bypassed Assignment for Credentials"
note = """## Triage and analysis

### Investigating AWS Identity Center Revoked User Bypassed Assignment for Credentials

Detects an Identity Center user whose direct application assignment was revoked being denied token issuance, disabling application assignment enforcement, obtaining a new JWT-bearer token and using that exact token to retrieve AWS role credentials within 30 minutes. Native identity and store attribution must agree across denial and configuration change, while AWS-issued token credential ID and subject metadata link issuance to GetRoleCredentials.

### Possible investigation steps

- The same identity-attributed credential must be involved in denial, disabling enforcement and token issuance. The retrieved role name and target account come from the native serviceEventDetails. This proves role-credential retrieval; it does not prove subsequent use of those STS credentials against a resource.
- These queries read standard AWS CloudTrail fields and calculate correlations at query time. The 125-minute lookback bounds the available context; it is not a complete inventory. Missing history does not become an assumed attachment, protected-resource label or authorization decision. The behavior window for the final access change is 30 minutes where specified. AWS event time determines order; same-second stages deliberately do not match. Review late or missing CloudTrail delivery when investigating a missed detection.

### False positive analysis

- A deliberate access-control test or coordinated migration that revokes a user, confirms denial, allows that user to disable enforcement, and then tests AWS role-credential retrieval.

### Response and remediation

- Recover the enforced assignment configuration, revoked user assignment, attributed token denial, self-directed enforcement bypass, successful token and GetRoleCredentials events. The token subject is taken from native additionalEventData identitystore:UserId and identitystore:IdentityStoreArn; it is never inferred from a role-session name. The issued identitycenter:CredentialId must exactly match the credentialId of the access-portal request. These are standard CloudTrail fields carried by the default integration.
- Investigate why a revoked application user could change application enforcement. Confirm the revocation was intentional, examine any group-based application assignments and verify the complete authorization error. Deliberate access-control testing or a coordinated migration can produce the sequence. Enforcement restored after token issuance does not erase evidence that a token was minted and used during the bypass.
- Use the source request IDs to recover original CloudTrail events. Confirm the actor's authority and the change request before remediation. If the sequence is unexplained, preserve evidence, contain the acting credentials, and remove unwanted access through established incident-response procedures.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_PutApplicationAssignmentConfiguration.html",
    "https://docs.aws.amazon.com/singlesignon/latest/OIDCAPIReference/API_CreateTokenWithIAM.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-cloudtrail-use-cases.html",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://awsteele.com/blog/2026/07/01/apps-can-now-impersonate-human-access-to-aws-via-iam-identity-center.html",
]
risk_score = 73
rule_id = "303b9036-68fd-5e42-8fdb-4108a39de607"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail" AND aws.cloudtrail.request_id IS NOT NULL
    AND (event.outcome == "success" OR (event.action == "CreateTokenWithIAM" AND event.outcome == "failure")) AND (
    (event.provider == "sso.amazonaws.com" AND event.action IN ("DeleteApplicationAssignment", "CreateApplicationAssignment", "PutApplicationAssignmentConfiguration", "DeleteApplication", "GetRoleCredentials"))
    OR (event.provider == "sso-oauth.amazonaws.com" AND event.action == "CreateTokenWithIAM"))
| GROK aws.cloudtrail.request_parameters """[{,] ?applicationArn=%{DATA:Esql.gk_applicationarn_0}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?clientId=%{DATA:Esql.gk_clientid_1}[,}]"""
| GROK aws.cloudtrail.additional_eventdata """[{,] ?identitystore:UserId=%{DATA:Esql.gk_identitystore_userid_2}[,}]"""
| GROK aws.cloudtrail.additional_eventdata """[{,] ?identitystore:IdentityStoreArn=%{DATA:Esql.gk_identitystore_identitystorearn_3}[,}]"""
| GROK aws.cloudtrail.additional_eventdata """[{,] ?identitycenter:CredentialId=%{DATA:Esql.gk_identitycenter_credentialid_4}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?principalType=%{DATA:Esql.gk_principaltype_5}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?assignmentRequired=%{DATA:Esql.gk_assignmentrequired_6}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?grantType=%{DATA:Esql.gk_granttype_7}[,}]"""
| GROK aws.cloudtrail.response_elements """[{,] ?tokenType=%{DATA:Esql.gk_tokentype_8}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?principalId=%{DATA:Esql.gk_principalid_9}[,}]"""
| GROK aws.cloudtrail.service_event_details """[{,] ?account_id=%{DATA:Esql.gk_account_id_10}[,}]"""
| GROK aws.cloudtrail.service_event_details """[{,] ?role_name=%{DATA:Esql.gk_role_name_11}[,}]"""
| EVAL Esql.app = COALESCE(Esql.gk_applicationarn_0, Esql.gk_clientid_1),
    Esql.subject = COALESCE(Esql.gk_identitystore_userid_2, aws.cloudtrail.user_identity.on_behalf_of.user_id),
    Esql.subject_store = COALESCE(Esql.gk_identitystore_identitystorearn_3, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn),
    Esql_priv.credential = COALESCE(Esql.gk_identitycenter_credentialid_4, aws.cloudtrail.user_identity.credential_id)
| EVAL Esql.stage = CASE(
    event.action == "CreateTokenWithIAM" AND event.outcome == "failure" AND aws.cloudtrail.error_code IN ("AccessDenied", "AccessDeniedException"), "denied",
    event.action == "DeleteApplicationAssignment" AND Esql.gk_principaltype_5 == "USER", "revoke",
    event.action == "CreateApplicationAssignment" AND Esql.gk_principaltype_5 == "USER", "assign",
    event.action == "PutApplicationAssignmentConfiguration" AND Esql.gk_assignmentrequired_6 == "false", "bypass",
    event.action == "PutApplicationAssignmentConfiguration" AND Esql.gk_assignmentrequired_6 == "true", "enforce",
    event.action == "DeleteApplication", "delete",
    event.action == "CreateTokenWithIAM" AND event.outcome == "success" AND Esql.gk_granttype_7 == "urn:ietf:params:oauth:grant-type:jwt-bearer" AND Esql.gk_tokentype_8 == "Bearer", "token",
    event.action == "GetRoleCredentials", "use", "ignore")
| EVAL Esql.change_record = CASE(Esql.stage IN ("revoke", "assign", "bypass", "enforce", "delete", "denied"),
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.stage, "|", Esql.app, "|",
    COALESCE(Esql.gk_principalid_9, "unknown"), "|", COALESCE(aws.cloudtrail.user_identity.access_key_id, "unknown"), "|", COALESCE(aws.cloudtrail.user_identity.on_behalf_of.user_id, "unknown"), "|", COALESCE(aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn, "unknown")))
| INLINE STATS Esql.changes_values = VALUES(Esql.change_record) BY aws.cloudtrail.recipient_account_id
| EVAL Esql.token_record = CASE(Esql.stage == "token" AND Esql.subject IS NOT NULL AND Esql.subject_store IS NOT NULL AND Esql_priv.credential IS NOT NULL,
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.app, "|", COALESCE(aws.cloudtrail.user_identity.access_key_id, "unknown"), "|", Esql.subject, "|", Esql.subject_store))
| INLINE STATS Esql.tokens_values = VALUES(Esql.token_record)
    BY aws.cloudtrail.recipient_account_id,
    Esql_priv.credential
| WHERE Esql.stage == "use"
    AND Esql_priv.credential IS NOT NULL
    AND Esql.subject IS NOT NULL
    AND Esql.subject_store IS NOT NULL
    AND Esql.gk_account_id_10 IS NOT NULL
    AND Esql.gk_role_name_11 IS NOT NULL
| EVAL Esql.target_account = Esql.gk_account_id_10, Esql.role_name = Esql.gk_role_name_11
| MV_EXPAND Esql.tokens_values
| DISSECT Esql.tokens_values "%{Esql.token_ms}|%{Esql.token_request}|%{Esql.application_arn}|%{Esql_priv.token_key}|%{Esql.token_user}|%{Esql.token_store}"
| EVAL Esql.token_time = TO_DATETIME(TO_LONG(Esql.token_ms))
| WHERE Esql.token_time < @timestamp
    AND Esql.token_time >= @timestamp - 30 minutes
    AND Esql.token_user == Esql.subject
    AND Esql.token_store == Esql.subject_store
| MV_EXPAND Esql.changes_values
| DISSECT Esql.changes_values "%{Esql.change_ms}|%{Esql.change_request}|%{Esql.change_stage}|%{Esql.changed_app}|%{Esql.changed_user}|%{Esql.change_key}|%{Esql.changing_user}|%{Esql.changing_store}"
| EVAL Esql.change_time = TO_DATETIME(TO_LONG(Esql.change_ms))
| WHERE Esql.changed_app == Esql.application_arn
    AND Esql.change_time < Esql.token_time
    AND Esql.change_time >= @timestamp - 30 minutes
| STATS Esql.revoked_at = MAX(CASE(Esql.change_stage == "revoke" AND Esql.changed_user == Esql.subject, Esql.change_time)),
    Esql.reassigned_at = MAX(CASE(Esql.change_stage == "assign" AND Esql.changed_user == Esql.subject, Esql.change_time)),
    Esql.bypassed_at = MAX(CASE(Esql.change_stage == "bypass" AND Esql.changing_user == Esql.subject AND Esql.changing_store == Esql.subject_store AND Esql.change_key == Esql_priv.token_key, Esql.change_time)),
    Esql.denied_at = MAX(CASE(Esql.change_stage == "denied" AND Esql.changing_user == Esql.subject AND Esql.changing_store == Esql.subject_store AND Esql.change_key == Esql_priv.token_key, Esql.change_time)),
    Esql.enforced_at = MAX(CASE(Esql.change_stage == "enforce", Esql.change_time)),
    Esql.deleted_at = MAX(CASE(Esql.change_stage == "delete", Esql.change_time)),
    Esql.source_request_ids_values = VALUES(Esql.change_request),
    Esql.source_ip_values = VALUES(source.ip)
    BY aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.request_id,
    @timestamp,
    Esql.application_arn,
    Esql_priv.credential,
    Esql.subject,
    Esql.subject_store,
    Esql.target_account,
    Esql.role_name,
    Esql.token_request,
    Esql.token_time,
    user.name,
    cloud.region,
    event.outcome,
    user_agent.original,
    event.action,
    event.provider,
    cloud.account.id
| WHERE Esql.revoked_at < Esql.denied_at
    AND Esql.denied_at < Esql.bypassed_at
    AND Esql.bypassed_at < Esql.token_time
    AND (Esql.reassigned_at IS NULL OR Esql.reassigned_at < Esql.revoked_at)
    AND Esql.enforced_at IS NOT NULL
    AND Esql.enforced_at < Esql.bypassed_at
    AND Esql.deleted_at IS NULL
| KEEP Esql.*,
    Esql_priv.*,
    @timestamp,
    aws.cloudtrail.*,
    user.name,
    cloud.region,
    event.outcome,
    user_agent.original,
    event.action,
    event.provider,
    cloud.account.id
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"


[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.cloudtrail.request_id",
    "Esql.application_arn",
    "Esql.subject",
    "Esql.subject_store",
    "Esql_priv.credential",
    "Esql.target_account",
    "Esql.role_name",
    "Esql.revoked_at",
    "Esql.denied_at",
    "Esql.bypassed_at",
    "Esql.token_time",
    "Esql.token_request",
    "Esql.source_request_ids_values",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

