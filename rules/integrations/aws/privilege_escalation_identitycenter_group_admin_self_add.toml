[metadata]
creation_date = "2026/09/08"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL VALUES GA 9.4 is the binding constraint."
min_stack_version = "9.4.0"
updated_date = "2026/09/08"

[rule]
author = ["Elastic"]
description = """
Detects an Identity Center user adding themself to a group whose recent AWS account assignment and exact
AdministratorAccess permission-set attachment are observed in CloudTrail. The native onBehalfOf identity must match the
added member and identity store. A revoked group assignment, detached administrator policy or deleted permission set
before membership creation cancels the match. This identifies self-addition to an observed privileged entitlement
without a customer-maintained group inventory; it does not prove completed provisioning or effective unrestricted
permissions.
"""
false_positives = [
    """
    An explicitly authorized user joining a recently provisioned administrator group through an identity-attributed
    self-service or emergency-access workflow.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center User Self-Added to Administrator Group"
note = """## Triage and analysis

### Investigating AWS Identity Center User Self-Added to Administrator Group

Detects an Identity Center user adding themself to a group whose recent AWS account assignment and exact AdministratorAccess permission-set attachment are observed in CloudTrail. The native onBehalfOf identity must match the added member and identity store.

### Possible investigation steps

- Review the native acting user and store, group ID, permission-set ARN and target account. The query links the exact group assignment to the exact managed AdministratorAccess attachment; names containing admin are not evidence of privilege. The group assignment must precede self-addition by no more than 30 minutes. Policy and assignment history are limited to the rule lookback.
- The administrator who established the group's entitlement can differ from the user adding themself. Check whether a self-service or JIT workflow legitimately allowed that membership change. Native identity attribution is required; a target user ID alone does not identify the actor. An administrator onboarding a different user does not match, because the rule requires the acting identity and the added member to be the same.
- An accepted asynchronous account assignment can still fail later. Verify assignment completion and the effective IAM role, including SCPs, permission boundaries and explicit Deny policies. Investigate subsequent access using immutable user attribution; this rule ends at successful membership creation.
- These queries read standard AWS CloudTrail fields and calculate correlations at query time. The 125-minute lookback bounds the available context; it is not a complete inventory. Missing history does not become an assumed attachment, protected-resource label or authorization decision. The behavior window for the final access change is 30 minutes where specified. AWS event time determines order; same-second stages deliberately do not match. Review late or missing CloudTrail delivery when investigating a missed detection.

### False positive analysis

- An explicitly authorized user joining a recently provisioned administrator group through an identity-attributed self-service or emergency-access workflow.

### Response and remediation

- Use the source request IDs to recover original CloudTrail events. Confirm the actor's authority and the change request before remediation. If the sequence is unexplained, preserve evidence, contain the acting credentials, and remove unwanted access through established incident-response procedures.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_CreateGroupMembership.html",
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_CreateAccountAssignment.html",
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_AttachManagedPolicyToPermissionSet.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-cloudtrail-use-cases.html",
    "https://github.com/HackTricks-wiki/hacktricks-cloud/blob/74335dc4ee4248d4c10c69a5698341121bd2183d/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md",
    "https://www.cloudquery.io/blog/aws-priv-esc-identity-center",
    "https://securitylabs.datadoghq.com/articles/tales-from-the-cloud-trenches-the-attacker-doth-persist-too-much/",
]
risk_score = 73
rule_id = "0c2feea1-3639-5e34-a64d-556120993582"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail" AND event.outcome == "success"
    AND aws.cloudtrail.recipient_account_id IS NOT NULL AND aws.cloudtrail.request_id IS NOT NULL AND (
    (event.provider == "identitystore.amazonaws.com" AND event.action == "CreateGroupMembership")
    OR (event.provider == "sso-directory.amazonaws.com" AND event.action == "AddMemberToGroup")
    OR (event.provider == "sso.amazonaws.com" AND event.action IN (
    "AttachManagedPolicyToPermissionSet", "DetachManagedPolicyFromPermissionSet", "DeletePermissionSet",
    "CreateAccountAssignment", "DeleteAccountAssignment")))
| GROK aws.cloudtrail.request_parameters """[{,] ?permissionSetArn=%{DATA:Esql.gk_permissionsetarn_0}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?groupId=%{DATA:Esql.gk_groupid_1}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?principalId=%{DATA:Esql.gk_principalid_2}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?targetId=%{DATA:Esql.gk_targetid_3}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?managedPolicyArn=%{DATA:Esql.gk_managedpolicyarn_4}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?memberId=\[?\{[^{}]*?userId=%{DATA:Esql.gk_memberid_userid_5}[,}\]]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?member=\[?\{[^{}]*?memberId=%{DATA:Esql.gk_member_memberid_6}[,}\]]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?identityStoreId=%{DATA:Esql.gk_identitystoreid_7}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?principalType=%{DATA:Esql.gk_principaltype_8}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?targetType=%{DATA:Esql.gk_targettype_9}[,}]"""
| GROK aws.cloudtrail.response_elements """[{,] ?accountAssignmentCreationStatus=\[?\{[^{}]*?status=%{DATA:Esql.gk_accountassignmentcreationstatus_status_10}[,}\]]"""
| GROK aws.cloudtrail.response_elements """[{,] ?accountAssignmentDeletionStatus=\[?\{[^{}]*?status=%{DATA:Esql.gk_accountassignmentdeletionstatus_status_11}[,}\]]"""
| EVAL Esql.ps = Esql.gk_permissionsetarn_0,
    Esql.group = COALESCE(Esql.gk_groupid_1, Esql.gk_principalid_2),
    Esql.target_account = Esql.gk_targetid_3,
    Esql.policy = Esql.gk_managedpolicyarn_4,
    Esql.user = COALESCE(Esql.gk_memberid_userid_5, Esql.gk_member_memberid_6),
    Esql.store = Esql.gk_identitystoreid_7
| EVAL Esql.stage = CASE(
    event.action IN ("CreateGroupMembership", "AddMemberToGroup"), "member",
    event.action == "AttachManagedPolicyToPermissionSet" AND Esql.policy IN ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws-us-gov:iam::aws:policy/AdministratorAccess", "arn:aws-cn:iam::aws:policy/AdministratorAccess"), "admin",
    event.action == "DetachManagedPolicyFromPermissionSet" AND Esql.policy IN ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws-us-gov:iam::aws:policy/AdministratorAccess", "arn:aws-cn:iam::aws:policy/AdministratorAccess"), "detach",
    event.action == "DeletePermissionSet", "delete",
    event.action == "CreateAccountAssignment" AND Esql.gk_principaltype_8 == "GROUP" AND Esql.gk_targettype_9 == "AWS_ACCOUNT"
    AND Esql.gk_accountassignmentcreationstatus_status_10 IN ("IN_PROGRESS", "SUCCEEDED"), "assign",
    event.action == "DeleteAccountAssignment" AND Esql.gk_principaltype_8 == "GROUP" AND Esql.gk_targettype_9 == "AWS_ACCOUNT"
    AND Esql.gk_accountassignmentdeletionstatus_status_11 IN ("IN_PROGRESS", "SUCCEEDED"), "revoke", "ignore")
| EVAL Esql.ps_record = CASE(Esql.stage IN ("admin", "detach", "delete"),
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.stage, "|", Esql.ps)),
    Esql.group_record = CASE(Esql.stage IN ("assign", "revoke"),
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.stage, "|", Esql.ps, "|", Esql.group, "|", Esql.target_account))
| INLINE STATS Esql.ps_history_values = VALUES(Esql.ps_record),
    Esql.group_history_values = VALUES(Esql.group_record)
    BY aws.cloudtrail.recipient_account_id
| EVAL Esql.actor_subject = COALESCE(aws.cloudtrail.user_identity.on_behalf_of.user_id,
    CASE(aws.cloudtrail.user_identity.type == "IdentityCenterUser", user.id))
| WHERE Esql.stage == "member"
    AND Esql.user IS NOT NULL
    AND Esql.user == Esql.actor_subject
    AND ( (aws.cloudtrail.user_identity.access_key_id IS NOT NULL AND aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn IS NOT NULL AND Esql.store == REPLACE(aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn, "^arn:[^:]+:identitystore::[0-9]{12}:identitystore/", "")) OR (aws.cloudtrail.user_identity.type == "IdentityCenterUser" AND aws.cloudtrail.user_identity.on_behalf_of.user_id IS NULL))
| MV_EXPAND Esql.group_history_values
| DISSECT Esql.group_history_values "%{Esql.assignment_ms}|%{Esql.assignment_request}|%{Esql.assignment_stage}|%{Esql.permission_set_arn}|%{Esql.assigned_group}|%{Esql.assigned_account}"
| EVAL Esql.assignment_time = TO_DATETIME(TO_LONG(Esql.assignment_ms))
| WHERE Esql.assigned_group == Esql.group AND Esql.assignment_time < @timestamp
| STATS Esql.assigned_at = MAX(CASE(Esql.assignment_stage == "assign", Esql.assignment_time)),
    Esql.revoked_at = MAX(CASE(Esql.assignment_stage == "revoke", Esql.assignment_time)),
    Esql.assignment_requests_values = VALUES(Esql.assignment_request),
    Esql.ps_history_values = VALUES(Esql.ps_history_values),
    Esql_priv.actor_arns_values = VALUES(aws.cloudtrail.user_identity.arn),
    Esql.source_ip_values = VALUES(source.ip)
    BY aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.user_identity.access_key_id,
    aws.cloudtrail.request_id,
    @timestamp,
    Esql.group,
    Esql.user,
    Esql.store,
    Esql.permission_set_arn,
    Esql.assigned_account
| WHERE Esql.assigned_at IS NOT NULL AND (Esql.revoked_at IS NULL OR Esql.revoked_at < Esql.assigned_at)
| MV_EXPAND Esql.ps_history_values
| DISSECT Esql.ps_history_values "%{Esql.policy_ms}|%{Esql.policy_request}|%{Esql.policy_stage}|%{Esql.policy_ps}"
| EVAL Esql.policy_time = TO_DATETIME(TO_LONG(Esql.policy_ms))
| WHERE Esql.policy_ps == Esql.permission_set_arn AND Esql.policy_time < @timestamp
| STATS Esql.admin_attached_at = MAX(CASE(Esql.policy_stage == "admin", Esql.policy_time)),
    Esql.admin_detached_at = MAX(CASE(Esql.policy_stage == "detach", Esql.policy_time)),
    Esql.deleted_at = MAX(CASE(Esql.policy_stage == "delete", Esql.policy_time)),
    Esql.policy_requests_values = VALUES(Esql.policy_request),
    Esql.assignment_requests_values = VALUES(Esql.assignment_requests_values),
    Esql_priv.actor_arns_values = VALUES(Esql_priv.actor_arns_values),
    Esql.source_ip_values = VALUES(Esql.source_ip_values)
    BY aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.user_identity.access_key_id,
    aws.cloudtrail.request_id,
    @timestamp,
    Esql.group,
    Esql.user,
    Esql.store,
    Esql.permission_set_arn,
    Esql.assigned_account,
    Esql.assigned_at
| WHERE Esql.admin_attached_at IS NOT NULL
    AND Esql.deleted_at IS NULL
    AND (Esql.admin_detached_at IS NULL OR Esql.admin_detached_at < Esql.admin_attached_at)
    AND Esql.assigned_at >= @timestamp - 30 minutes
| KEEP Esql.*, Esql_priv.*, @timestamp, aws.cloudtrail.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.cloudtrail.request_id",
    "aws.cloudtrail.user_identity.access_key_id",
    "Esql.group",
    "Esql.user",
    "Esql.store",
    "Esql.permission_set_arn",
    "Esql.assigned_account",
    "Esql.assigned_at",
    "Esql.admin_attached_at",
    "Esql.assignment_requests_values",
    "Esql.policy_requests_values",
]

[rule.alert_suppression.duration]
value = 130
unit = "m"

