[metadata]
creation_date = "2026/09/08"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL FIELD_EXTRACT: Technical Preview since 9.5, no GA. Verified on 9.6.0."
min_stack_version = "9.6.0"
updated_date = "2026/09/08"

[rule]
author = ["Elastic"]
description = """
Detects an IAM Identity Center permission-set session removing the permissions boundary from a permission set and then
creating an IAM user within 30 minutes, with the native session, reserved role, onBehalfOf user and identity-store
attribution agreeing across both actions. A permissions boundary caps the effective permissions of the roles a permission
set provisions; removing it and immediately exercising IAM user creation is a self-escalation pattern where the session
lifts its own ceiling and uses the widened access. A boundary change made by a different principal, or a removal not
followed by IAM user creation within the window, does not match.
"""
false_positives = [
    """
    An approved emergency or security test in which an Identity Center session removes a permissions boundary from a
    permission set and then creates an IAM user within the same window.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Role Removed Its Own Permissions Boundary"
note = """## Triage and analysis

### Investigating AWS Identity Center Role Removed Its Own Permissions Boundary

Detects an IAM Identity Center permission-set session removing the permissions boundary from a permission set and then creating an IAM user within 30 minutes. The native session, reserved role, onBehalfOf user and identity-store attribution must agree across both actions.

### Possible investigation steps

- Recover the `DeletePermissionsBoundaryFromPermissionSet` that removed the boundary and the subsequent `CreateUser`, using the source request IDs. Confirm which permission set lost its boundary (`Esql.permission_set_arn`) and whether a replacement boundary was reinstated afterward.
- Confirm both actions share the same identity. The native session ARN, reserved-role issuer, onBehalfOf user and identity store must match, and both must land in the same recipient account; AWS forwarding can change the access-key ID, so attribution relies on the preserved identity tuple rather than the key. A boundary removed by one principal and a user created by another is a different scenario worth noting.
- Review the created IAM user (`Esql_priv.target_user`) and whether access keys, a login profile or policies were attached to it afterward. Removing the boundary lifts the ceiling on the roles the permission set provisions, so the new standalone IAM user is persistence outside the Identity Center model.
- Verify the actor's authority and any approved change record. Authorized emergency self-escalation or security testing can match. The 30-minute behavior window and AWS event-time ordering mean late or missing CloudTrail delivery can cause a missed detection; account for delivery latency when investigating.

### False positive analysis

- An approved emergency or security test in which an Identity Center session removes a permissions boundary from a permission set and then creates an IAM user within the same window.

### Response and remediation

- Use the source request IDs to recover original CloudTrail events. Confirm the actor's authority and the change request before remediation. If the sequence is unexplained, preserve evidence, contain the acting credentials, and remove unwanted access through established incident-response procedures.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_DeletePermissionsBoundaryFromPermissionSet.html",
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_ProvisionPermissionSet.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/referencingpermissionsets.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-cloudtrail-use-cases.html",
    "https://github.com/HackTricks-wiki/hacktricks-cloud/blob/74335dc4ee4248d4c10c69a5698341121bd2183d/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md",
    "https://www.cloudquery.io/blog/aws-priv-esc-identity-center",
]
risk_score = 73
rule_id = "39641975-8ba6-5704-be14-128f1fd6890d"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND event.outcome == "success"
    AND aws.cloudtrail.recipient_account_id IS NOT NULL
    AND aws.cloudtrail.request_id IS NOT NULL
    AND ((event.provider == "sso.amazonaws.com" AND event.action == "DeletePermissionsBoundaryFromPermissionSet")
      OR (event.provider == "iam.amazonaws.com" AND event.action == "CreateUser"))
| EVAL Esql.gk_permission_set_arn = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "permissionSetArn"),
    Esql.gk_user_arn = FIELD_EXTRACT(aws.cloudtrail.flattened.response_elements, "user.arn")
| EVAL Esql_priv.actor = aws.cloudtrail.user_identity.arn,
    Esql_priv.actor_role = aws.cloudtrail.user_identity.session_context.session_issuer.arn,
    Esql.ps = Esql.gk_permission_set_arn,
    Esql_priv.target_user = Esql.gk_user_arn
| EVAL Esql.identity = CONCAT(COALESCE(Esql_priv.actor, "unknown"), "|", COALESCE(Esql_priv.actor_role, "unknown"), "|", COALESCE(aws.cloudtrail.user_identity.on_behalf_of.user_id, "unknown"), "|", COALESCE(aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn, "unknown"))
| EVAL Esql.stage = CASE(
    event.action == "DeletePermissionsBoundaryFromPermissionSet", "elevate",
    event.action == "CreateUser", "use", "ignore")
| EVAL Esql.elevate_record = CASE(Esql.stage == "elevate",
        CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.ps, "|", Esql.identity)),
    Esql.use_record = CASE(Esql.stage == "use"
        AND Esql_priv.target_user RLIKE "[-A-Za-z0-9+=,.@_:/]+"
        AND aws.cloudtrail.user_identity.access_key_id IS NOT NULL
        AND aws.cloudtrail.user_identity.on_behalf_of.user_id IS NOT NULL
        AND aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn IS NOT NULL
        AND Esql_priv.actor_role RLIKE "arn:[^:]+:iam::[0-9]{12}:role/aws-reserved/sso[.]amazonaws[.]com/([a-z0-9-]+/)?AWSReservedSSO_.+_[0-9a-f]{16}",
        CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.user_identity.access_key_id, "|",
            aws.cloudtrail.request_id, "|", Esql_priv.actor, "|", Esql_priv.actor_role, "|",
            aws.cloudtrail.user_identity.on_behalf_of.user_id, "|",
            aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn, "|", Esql_priv.target_user, "|",
            COALESCE(TO_STRING(source.ip), "none")))
| STATS Esql.elevate_history_values = VALUES(Esql.elevate_record),
    Esql.use_values = VALUES(Esql.use_record)
    BY aws.cloudtrail.recipient_account_id
| MV_EXPAND Esql.use_values
| DISSECT Esql.use_values "%{Esql.use_ms}|%{Esql.use_access_key}|%{Esql.use_request}|%{Esql_priv.use_actor}|%{Esql_priv.use_actor_role}|%{Esql.use_user}|%{Esql.use_store}|%{Esql_priv.use_target_user}|%{Esql.use_source_ip}"
| EVAL @timestamp = TO_DATETIME(TO_LONG(Esql.use_ms)),
    aws.cloudtrail.user_identity.access_key_id = Esql.use_access_key,
    aws.cloudtrail.request_id = Esql.use_request,
    Esql_priv.actor = Esql_priv.use_actor,
    Esql_priv.actor_role = Esql_priv.use_actor_role,
    aws.cloudtrail.user_identity.on_behalf_of.user_id = Esql.use_user,
    aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn = Esql.use_store,
    Esql_priv.target_user = Esql_priv.use_target_user
| MV_EXPAND Esql.elevate_history_values
| DISSECT Esql.elevate_history_values "%{Esql.change_ms}|%{Esql.change_request}|%{Esql.permission_set_arn}|%{Esql_priv.change_actor}|%{Esql.change_issuer}|%{Esql.change_user}|%{Esql.change_store}"
| EVAL Esql.change_time = TO_DATETIME(TO_LONG(Esql.change_ms)),
    Esql.same_changer = Esql_priv.change_actor == Esql_priv.actor
    AND Esql.change_issuer == Esql_priv.actor_role
    AND Esql.change_user == aws.cloudtrail.user_identity.on_behalf_of.user_id
    AND Esql.change_store == aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn
| WHERE Esql.change_time < @timestamp AND Esql.change_time >= @timestamp - 30 minutes AND Esql.same_changer == true
| STATS Esql.elevated_at = MAX(Esql.change_time),
    Esql.source_request_ids_values = VALUES(Esql.change_request),
    Esql.source_ip_values = VALUES(CASE(Esql.use_source_ip != "none", Esql.use_source_ip))
    BY aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.user_identity.access_key_id,
    aws.cloudtrail.request_id,
    @timestamp,
    Esql_priv.actor,
    Esql_priv.actor_role,
    aws.cloudtrail.user_identity.on_behalf_of.user_id,
    aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn,
    Esql.permission_set_arn,
    Esql_priv.target_user
| WHERE Esql.elevated_at IS NOT NULL AND Esql.elevated_at < @timestamp
| KEEP Esql.*, Esql_priv.*, @timestamp, aws.cloudtrail.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.cloudtrail.request_id",
    "aws.cloudtrail.user_identity.access_key_id",
    "Esql.permission_set_arn",
    "Esql_priv.actor_role",
    "Esql_priv.target_user",
    "Esql.elevated_at",
    "Esql.source_request_ids_values",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

