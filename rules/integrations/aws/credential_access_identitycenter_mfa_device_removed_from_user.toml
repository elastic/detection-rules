[metadata]
creation_date = "2026/10/01"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL VALUES GA 9.4 is the binding constraint."
min_stack_version = "9.4.0"
updated_date = "2026/10/01"

[rule]
author = ["Elastic"]
description = """
Detects the multi-factor authentication device of an IAM Identity Center directory user being removed, or a replacement
device being registered, followed by that identity authenticating. Removing a user's MFA device is the standard
precondition for taking over an account whose password is already known or has just been reset, and registering a new
virtual or WebAuthn device attaches a factor the actor controls, which survives a password reset by the legitimate
owner. Both operations are Identity Store console APIs, so a rule written only against the public Identity Store API
does not see them. The acting principal and the target user are reported separately, which distinguishes an
administrator or help desk operating on another user's factors from a user enrolling their own device.
"""
false_positives = [
    """
    Help-desk recovery for a user who lost a phone produces exactly this sequence: the old device is removed, a new one
    is registered, and the user signs in. In any organization of size this is routine and will be the dominant source of
    matches. The deciding evidence is a recovery request for that user at that time, which CloudTrail does not contain.
    Treat the alert as a prompt to confirm against the service desk record rather than as presumed malicious, and
    prioritise by the target user's entitlements.
    """,
    """
    Ordinary self-service enrolment, where the acting identity and the target user are the same, is expected during
    onboarding and after device replacement. The reported actor and target make that case identifiable; consider
    suppressing self-service enrolment and alerting only when the actor differs from the target.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center MFA Device Removed or Replaced"
note = """## Triage and analysis

### Investigating AWS Identity Center MFA Device Removed or Replaced

Detects the multi-factor authentication device of an IAM Identity Center directory user being removed, or a replacement device being registered, followed by that identity authenticating. Removing a user's MFA device is the standard precondition for taking over an account whose password is already known or has just been reset, and registering a new virtual or WebAuthn device attaches a factor the actor controls, which survives a password reset by the legitimate owner.

### Possible investigation steps

- Compare the acting principal with the target user, both reported. An administrator removing another user's factor is the case that matters; a user enrolling their own device is routine. If the actor is an Identity Center identity rather than an IAM principal, the acting subject is reported from `on_behalf_of`.
- Read the operation sequence. `DeleteMfaDeviceForUser` alone weakens the account. A delete followed by `StartVirtualMfaDeviceRegistration` or `StartWebAuthnDeviceRegistration` for the same user means a factor the actor may control was attached, which persists through a later password reset by the legitimate owner and is the more serious case.
- Check whether authentication followed. `Esql.authentications_after_change_count` counts sign-in completions for that subject after the change, and `Esql.seconds_to_first_authentication` shows how quickly. A sign-in moments after a factor change performed by someone else is the strongest form of this signal.
- Correlate with a password reset. `sso-directory:UpdatePassword` against the same user shortly before or after is the complete account-takeover chain: reset the credential, remove the factor, sign in. Check for it explicitly.
- Assess the target's entitlements. Enumerate the user's group memberships and account assignments; a factor change on a user holding administrative permission sets is materially more serious.
- Confirm against the service desk. The legitimate and malicious sequences are identical in CloudTrail, so the deciding evidence is whether a recovery request exists for this user at this time.

### False positive analysis

- Help-desk recovery for a user who lost a phone produces exactly this sequence: the old device is removed, a new one is registered, and the user signs in. In any organization of size this is routine and will be the dominant source of matches. The deciding evidence is a recovery request for that user at that time, which CloudTrail does not contain. Treat the alert as a prompt to confirm against the service desk record rather than as presumed malicious, and prioritise by the target user's entitlements.
- Ordinary self-service enrolment, where the acting identity and the target user are the same, is expected during onboarding and after device replacement. The reported actor and target make that case identifiable; consider suppressing self-service enrolment and alerting only when the actor differs from the target.

### Response and remediation

- If the change was not requested by the user, re-enroll the factor under supervision and remove any factor registered by the acting principal; a factor the actor controls survives a password reset by the owner.
- Reset the user's Identity Center credential, revoke their active portal sessions, and review activity performed by that subject since the factor was removed.
- If the acting principal is not a help-desk identity, treat its own credentials as suspect and review every other directory change it made in the window.
"""
references = [
    "https://docs.aws.amazon.com/service-authorization/latest/reference/list_sso-directory.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/mfa-how-to.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/understanding-sign-in-events.html",
    "https://www.elastic.co/docs/reference/integrations/aws/cloudtrail",
    "https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a",
    "https://securitylabs.datadoghq.com/articles/tales-from-the-cloud-trenches-the-attacker-doth-persist-too-much/",
]
risk_score = 47
rule_id = "263be792-f812-5b83-a570-1208f2ed69d3"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- These are Identity Store console APIs emitted under the sso-directory.amazonaws.com event source, not identitystore.amazonaws.com, so console API activity must be collected.
- Sign-in correlation applies to the Identity Center directory and AWS Directory Service identity sources; with an external identity provider the credential challenge happens at the provider and MFA is not managed here at all.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Data Source: AWS Sign-In",
    "Service: AWS IAM Identity Center",
    "Tactic: Credential Access",
    "Rule Type: ES|QL",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail" AND event.outcome == "success" AND (
    (event.provider == "sso-directory.amazonaws.com" AND event.action IN ("DeleteMfaDeviceForUser", "UpdateMfaDeviceForUser"))
    OR (event.provider == "signin.amazonaws.com" AND event.action == "UserAuthentication"))
| GROK aws.cloudtrail.request_parameters """[{,] ?user=\[?\{[^{}]*?userId=%{DATA:Esql.gk_user_userid_0}[,}\]]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?userId=%{DATA:Esql.gk_userid_1}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?user=\[?\{[^{}]*?directoryId=%{DATA:Esql.gk_user_directoryid_2}[,}\]]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?identityStoreId=%{DATA:Esql.gk_identitystoreid_3}[,}]"""
| GROK aws.cloudtrail.request_parameters """[{,] ?directoryId=%{DATA:Esql.gk_directoryid_4}[,}]"""
| GROK aws.cloudtrail.additional_eventdata """[{,] ?CredentialType=%{DATA:Esql.gk_credentialtype_5}[,}]"""
| EVAL Esql.target_user = COALESCE(
    Esql.gk_user_userid_0,
    Esql.gk_userid_1),
    Esql.directory = COALESCE(
    Esql.gk_user_directoryid_2,
    Esql.gk_identitystoreid_3,
    Esql.gk_directoryid_4),
    Esql_priv.actor = COALESCE(aws.cloudtrail.user_identity.session_context.session_issuer.arn, aws.cloudtrail.user_identity.arn, "unknown"),
    Esql.acting_subject = COALESCE(aws.cloudtrail.user_identity.on_behalf_of.user_id,
    CASE(aws.cloudtrail.user_identity.type == "IdentityCenterUser", user.id)),
    Esql.credential_types = Esql.gk_credentialtype_5
| EVAL Esql.factor_change = event.provider == "sso-directory.amazonaws.com"
| EVAL Esql.auth_record = CASE(NOT Esql.factor_change AND Esql.acting_subject IS NOT NULL,
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "~", Esql.acting_subject, "~", COALESCE(Esql.credential_types, "none")))
| INLINE STATS Esql.authentications_values = VALUES(Esql.auth_record)
| WHERE Esql.factor_change AND Esql.target_user IS NOT NULL
| MV_EXPAND Esql.authentications_values
| DISSECT Esql.authentications_values "%{Esql.a_ms}~%{Esql.a_subject}~%{Esql.a_credentials}"
| EVAL Esql.a_time = TO_DATETIME(TO_LONG(Esql.a_ms))
| EVAL Esql.matched_auth = CASE(Esql.a_subject == Esql.target_user AND Esql.a_time > @timestamp, 1, 0)
| STATS Esql.authentications_after_change_count = SUM(Esql.matched_auth),
    Esql.first_authentication_at = MIN(CASE(Esql.matched_auth == 1, Esql.a_time)),
    Esql.authentication_credentials_values = VALUES(CASE(Esql.matched_auth == 1, Esql.a_credentials))
    BY Esql.changed_at = @timestamp,
    event.action,
    Esql.target_user,
    Esql.directory,
    Esql_priv.actor,
    Esql.acting_subject,
    aws.cloudtrail.request_id,
    cloud.account.id,
    source.ip,
    user.name,
    cloud.region,
    event.outcome,
    user_agent.original,
    event.provider
| EVAL Esql.actor_is_target = Esql.acting_subject == Esql.target_user,
    Esql.seconds_to_first_authentication = DATE_DIFF("seconds", Esql.changed_at, Esql.first_authentication_at)
| KEEP Esql.*,
    Esql_priv.*,
    event.action,
    aws.cloudtrail.request_id,
    cloud.account.id,
    source.ip,
    user.name,
    cloud.region,
    event.outcome,
    user_agent.original,
    event.provider
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1556"
name = "Modify Authentication Process"
reference = "https://attack.mitre.org/techniques/T1556/"
[[rule.threat.technique.subtechnique]]
id = "T1556.006"
name = "Multi-Factor Authentication"
reference = "https://attack.mitre.org/techniques/T1556/006/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.alert_suppression]
group_by = ["Esql.target_user", "event.action"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "Esql.changed_at",
    "event.action",
    "Esql.target_user",
    "Esql_priv.actor",
    "Esql.acting_subject",
    "Esql.actor_is_target",
    "Esql.directory",
    "Esql.authentications_after_change_count",
    "Esql.first_authentication_at",
    "Esql.seconds_to_first_authentication",
    "Esql.authentication_credentials_values",
    "aws.cloudtrail.request_id",
    "source.ip",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

