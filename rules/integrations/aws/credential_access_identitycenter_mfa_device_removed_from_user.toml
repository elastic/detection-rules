[metadata]
creation_date = "2026/10/01"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL FIELD_EXTRACT: Technical Preview since 9.5, no GA. Verified on 9.6.0."
min_stack_version = "9.6.0"
updated_date = "2026/10/01"

[rule]
author = ["Elastic"]
description = """
Detects the multi-factor authentication device of an IAM Identity Center directory user being removed, or a replacement
device being registered. Removing a user's MFA device is the standard precondition for taking over an account whose
password is already known or has just been reset, and replacing a device can attach a factor the actor controls. Both
operations are Identity Store console APIs, so a rule written only against the public Identity Store API does not see
them. The acting principal and the target user are reported separately, which distinguishes an administrator or help
desk operating on another user's factors from a user managing their own device.
"""
false_positives = [
    """
    Help-desk recovery for a user who lost a phone routinely removes or replaces an MFA device. The deciding evidence is
    a recovery request for that user at that time, which CloudTrail does not contain. Treat the alert as a prompt to
    confirm against the service desk record rather than as presumed malicious, and prioritise by the target user's
    entitlements.
    """,
    """
    Ordinary self-service device management, where the acting identity and the target user are the same, is expected
    during onboarding and after device replacement. The reported actor and target make that case identifiable; consider
    suppressing self-service activity and alerting only when the actor differs from the target.
    """,
]
from = "now-15m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center MFA Device Removed or Replaced"
note = """## Triage and analysis

### Investigating AWS Identity Center MFA Device Removed or Replaced

Detects the multi-factor authentication device of an IAM Identity Center directory user being removed or replaced. Removing a user's MFA device is the standard precondition for taking over an account whose password is already known or has just been reset, while replacing a device can attach a factor the actor controls.

### Possible investigation steps

- Compare the acting principal with the target user, both reported. An administrator removing another user's factor is the case that matters; a user enrolling their own device is routine. If the actor is an Identity Center identity rather than an IAM principal, the acting subject is reported from `on_behalf_of`.
- Read the operation. `DeleteMfaDeviceForUser` removes an existing factor, while `UpdateMfaDeviceForUser` changes the user's MFA device. Either is more suspicious when the acting principal differs from the target user.
- Check whether authentication followed by reviewing subsequent sign-in activity for the target subject. A sign-in moments after an MFA change performed by someone else is the strongest form of this signal.
- Correlate with a password reset. `sso-directory:UpdatePassword` against the same user shortly before or after is the complete account-takeover chain: reset the credential, remove the factor, sign in. Check for it explicitly.
- Assess the target's entitlements. Enumerate the user's group memberships and account assignments; a factor change on a user holding administrative permission sets is materially more serious.
- Confirm against the service desk. The legitimate and malicious sequences are identical in CloudTrail, so the deciding evidence is whether a recovery request exists for this user at this time.

### False positive analysis

- Help-desk recovery for a user who lost a phone routinely removes or replaces an MFA device. The deciding evidence is a recovery request for that user at that time, which CloudTrail does not contain.
- Ordinary self-service device management, where the acting identity and the target user are the same, is expected during onboarding and after device replacement.

### Response and remediation

- If the change was not requested by the user, re-enroll the factor under supervision and remove any factor registered by the acting principal; a factor the actor controls survives a password reset by the owner.
- Reset the user's Identity Center credential, revoke their active portal sessions, and review activity performed by that subject since the factor was removed.
- If the acting principal is not a help-desk identity, treat its own credentials as suspect and review every other directory change it made in the window.
"""
references = [
    "https://docs.aws.amazon.com/service-authorization/latest/reference/list_sso-directory.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/mfa-how-to.html",
]
risk_score = 47
rule_id = "263be792-f812-5b83-a570-1208f2ed69d3"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- These are Identity Store console APIs emitted under the sso-directory.amazonaws.com event source, not identitystore.amazonaws.com, so console API activity must be collected.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Measure CloudTrail delivery latency in your environment before shortening the lookback."""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Credential Access",
    "Rule Type: ES|QL",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-* METADATA _id, _version, _index
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND event.provider == "sso-directory.amazonaws.com"
    AND event.action IN ("DeleteMfaDeviceForUser", "UpdateMfaDeviceForUser")
    AND event.outcome == "success"
| EVAL Esql.target_user = COALESCE(
        FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "user.userId"),
        FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "userId")),
    Esql.directory = COALESCE(
        FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "user.directoryId"),
        FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "identityStoreId"),
        FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "directoryId"))
| EVAL Esql.changed_at = @timestamp,
    Esql_priv.actor = COALESCE(aws.cloudtrail.user_identity.session_context.session_issuer.arn, aws.cloudtrail.user_identity.arn, "unknown"),
    Esql.acting_subject = COALESCE(aws.cloudtrail.user_identity.on_behalf_of.user_id,
    CASE(aws.cloudtrail.user_identity.type == "IdentityCenterUser", user.id))
| WHERE Esql.target_user IS NOT NULL
| EVAL Esql.actor_is_target = Esql.acting_subject == Esql.target_user
| KEEP _id,
    _version,
    _index,
    Esql.*,
    Esql_priv.*,
    event.action,
    aws.cloudtrail.request_id,
    cloud.account.id,
    source.ip,
    user.name,
    cloud.region,
    event.outcome,
    user_agent.original,
    event.provider
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1556"
name = "Modify Authentication Process"
reference = "https://attack.mitre.org/techniques/T1556/"
[[rule.threat.technique.subtechnique]]
id = "T1556.006"
name = "Multi-Factor Authentication"
reference = "https://attack.mitre.org/techniques/T1556/006/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.alert_suppression]
group_by = ["Esql.target_user", "event.action"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "Esql.changed_at",
    "event.action",
    "Esql.target_user",
    "Esql_priv.actor",
    "Esql.acting_subject",
    "Esql.actor_is_target",
    "Esql.directory",
    "aws.cloudtrail.request_id",
    "source.ip",
]

[rule.alert_suppression.duration]
unit = "m"
value = 130

