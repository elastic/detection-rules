[metadata]
creation_date = "2026/09/09"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL FIELD_EXTRACT: Technical Preview since 9.5, no GA. Verified on 9.6.0."
min_stack_version = "9.6.0"
updated_date = "2026/09/09"

[rule]
author = ["Elastic"]
description = """
Detects an IAM Identity Center group membership that is created, used to retrieve AWS role credentials, and then
removed. The membership is followed exactly rather than inferred: CreateGroupMembership returns a membership identifier
that DeleteGroupMembership later supplies, so the added group and member are recovered from the creation event and
matched to the deletion by that identifier. Credential retrieval is attributed to the same Identity Center user that was
added, so the alert reports entitlement that was obtained and consumed inside the membership's lifetime. Memberships
that are never used, and deletions whose creation is outside the window, do not match.
"""
false_positives = [
    """
    An approved just-in-time access workflow produces this exact shape: an automation grants group membership, the user
    consumes the entitlement, and the automation revokes it. Default CloudTrail carries no approval state, so this rule
    cannot distinguish sanctioned JIT from an operator granting themselves transient access. Compare the adding and
    removing principals reported in the alert; an approved workflow normally shows automation on both sides, while a
    membership removed by the same principal that added it is the higher-confidence variant. Exempt the specific
    automation principals rather than the behavior.
    """,
]
from = "now-65m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Temporary Group Membership Used for Credentials"
note = """## Triage and analysis

### Investigating AWS Identity Center Temporary Group Membership Used for Credentials

Detects an IAM Identity Center group membership that is created, used to retrieve AWS role credentials, and then removed. The membership is followed exactly rather than inferred: CreateGroupMembership returns a membership identifier that DeleteGroupMembership later supplies, so the added group and member are recovered from the creation event and matched to the deletion by that identifier.

### Possible investigation steps

- Review the membership's creation, credential use, and deletion times. A membership that is consumed immediately and then deleted leaves no standing entitlement for a later access review to find.
- Enumerate what the retrieved credentials did. This rule proves entitlement was obtained and credentials were issued; it does not establish what those sessions accessed.
- Confirm the group's entitlement independently. Credential retrieval proves the member held some entitlement during the window, but the flattened event data does not prove those credentials were granted specifically by this group's assignment. Check the group's account assignments before concluding the membership was the source.

### False positive analysis

- An approved just-in-time access workflow produces this exact shape: an automation grants group membership, the user consumes the entitlement, and the automation revokes it. Default CloudTrail carries no approval state, so this rule cannot distinguish sanctioned JIT from an operator granting themselves transient access. Compare the adding and removing principals reported in the alert; an approved workflow normally shows automation on both sides, while a membership removed by the same principal that added it is the higher-confidence variant. Exempt the specific automation principals rather than the behavior.

### Response and remediation

- Compare `Esql.added_by` with `Esql.removed_by`. When the same principal both granted and revoked the membership, treat it as self-granted transient access. When automation performed both, this is most likely an approved just-in-time workflow and should be exempted by principal rather than suppressed as a class.
- Note that IAM role sessions created from a permission set persist for their configured duration, up to twelve hours, regardless of the membership being removed. Removing the membership does not revoke credentials already issued.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_CreateGroupMembership.html",
    "https://docs.aws.amazon.com/singlesignon/latest/PortalAPIReference/API_GetRoleCredentials.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/authconcept.html",
    "https://www.cloudquery.io/blog/aws-priv-esc-identity-center",
]
risk_score = 47
rule_id = "85c367fd-220b-5cd4-ab94-3a0eba34190a"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- The membership identifier is only present in the CreateGroupMembership response and the DeleteGroupMembership request, so both must be collected; DeleteGroupMembership does not carry the group or member identifier.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "medium"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Tactic: Defense Evasion",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Profile: Beta",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail" AND event.outcome == "success" AND (
    (event.provider == "identitystore.amazonaws.com" AND event.action IN ("CreateGroupMembership", "DeleteGroupMembership"))
    OR (event.provider == "sso.amazonaws.com" AND event.action == "GetRoleCredentials"))
| EVAL Esql.created_membership = FIELD_EXTRACT(aws.cloudtrail.flattened.response_elements, "membershipId"),
    Esql.deleted_membership = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "membershipId"),
    Esql.group = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "groupId"),
    Esql.member = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "memberId.userId"),
    Esql.subject = aws.cloudtrail.user_identity.on_behalf_of.user_id,
    Esql_priv.principal = COALESCE(aws.cloudtrail.user_identity.session_context.session_issuer.arn, aws.cloudtrail.user_identity.arn)
| EVAL Esql.add_record = CASE(event.action == "CreateGroupMembership"
        AND Esql.created_membership IS NOT NULL AND Esql.group IS NOT NULL
        AND Esql.member IS NOT NULL AND Esql_priv.principal IS NOT NULL,
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", Esql.created_membership, "|", Esql.group, "|", Esql.member, "|", Esql_priv.principal)),
    Esql.use_record = CASE(event.action == "GetRoleCredentials" AND Esql.subject IS NOT NULL,
        CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", Esql.subject)),
    Esql.delete_record = CASE(event.action == "DeleteGroupMembership"
        AND Esql.deleted_membership IS NOT NULL
        AND Esql_priv.principal IS NOT NULL,
        CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", Esql.deleted_membership, "|", Esql_priv.principal))
| STATS Esql.additions = VALUES(Esql.add_record),
    Esql.uses = VALUES(Esql.use_record),
    Esql.deletions = VALUES(Esql.delete_record)
| MV_EXPAND Esql.deletions
| DISSECT Esql.deletions "%{Esql.d_ms}|%{Esql.deleted_membership}|%{Esql.removed_by}"
| EVAL @timestamp = TO_DATETIME(TO_LONG(Esql.d_ms))
| MV_EXPAND Esql.additions
| DISSECT Esql.additions "%{Esql.a_ms}|%{Esql.a_membership}|%{Esql.a_group}|%{Esql.a_member}|%{Esql.added_by}"
| WHERE Esql.a_membership == Esql.deleted_membership
| EVAL Esql.added_at = TO_DATETIME(TO_LONG(Esql.a_ms))
| WHERE Esql.added_at < @timestamp AND Esql.added_at >= @timestamp - 30 minutes
| MV_EXPAND Esql.uses
| DISSECT Esql.uses "%{Esql.u_ms}|%{Esql.u_subject}"
| EVAL Esql.used_at = TO_DATETIME(TO_LONG(Esql.u_ms))
| WHERE Esql.u_subject == Esql.a_member AND Esql.used_at > Esql.added_at AND Esql.used_at < @timestamp
| STATS Esql.used_at = MAX(Esql.used_at)
    BY @timestamp, Esql.a_group, Esql.a_member, Esql.deleted_membership,
      Esql.added_at, Esql.added_by, Esql.removed_by
| KEEP @timestamp, Esql.a_group, Esql.a_member, Esql.deleted_membership,
    Esql.added_at, Esql.used_at, Esql.added_by, Esql.removed_by
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1548"
name = "Abuse Elevation Control Mechanism"
reference = "https://attack.mitre.org/techniques/T1548/"
[[rule.threat.technique.subtechnique]]
id = "T1548.005"
name = "Temporary Elevated Cloud Access"
reference = "https://attack.mitre.org/techniques/T1548/005/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.alert_suppression]
group_by = ["Esql.a_group", "Esql.a_member"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "Esql.a_group",
    "Esql.a_member",
    "Esql.added_at",
    "Esql.used_at",
    "Esql.added_by",
    "Esql.removed_by",
]

[rule.alert_suppression.duration]
unit = "m"
value = 70

