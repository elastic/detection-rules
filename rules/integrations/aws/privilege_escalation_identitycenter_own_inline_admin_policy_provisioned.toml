[metadata]
creation_date = "2026/09/08"
integration = ["aws"]
maturity = "production"
min_stack_comments = "ES|QL FIELD_EXTRACT: Technical Preview since 9.5, no GA. INLINE STATS GA 9.3, JSON_EXTRACT GA 9.5. Verified on 9.6.0."
min_stack_version = "9.6.0"
updated_date = "2026/09/08"

[rule]
author = ["Elastic"]
description = """
Detects an Identity Center role being denied IAM user creation, writing an unconditional administrator inline policy to
its own observed permission set, receiving the matching administrator policy on its actual IAM role through SSO
provisioning, and successfully creating the same previously denied IAM user within 30 minutes. Native session, role,
user and identity-store attribution must agree. Policy replacement or restoration before the relevant stage cancels the
match. An accepted provisioning request alone is insufficient.
"""
false_positives = [
    """
    An approved emergency or security test in which an SSO role confirms an IAM user-creation denial, grants itself an
    administrator inline policy, and retries the same user creation successfully.
    """,
]
from = "now-125m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "AWS Identity Center Role Escalated Its Own Inline Policy"
note = """## Triage and analysis

### Investigating AWS Identity Center Role Escalated Its Own Inline Policy

Detects an Identity Center role being denied IAM user creation, writing an unconditional administrator inline policy to its own observed permission set, receiving the matching administrator policy on its actual IAM role through SSO provisioning, and successfully creating the same previously denied IAM user within 30 minutes. Native session, role, user and identity-store attribution must agree.

### Possible investigation steps

- Recover the failed CreateUser request, the permission-set policy change, the SSO-forwarded successful PutRolePolicy on AwsSSOInlinePolicy, and successful CreateUser for the exact same IAM user ARN. The alert ends at demonstrated use of a previously denied permission. The source permission set must have a creation event in the lookback whose immutable name matches the actual reserved-role name; its ARN must match the policy change. This deliberately excludes older permission sets without the required mapping evidence.
- The native session ARN, reserved role issuer, onBehalfOf user and identity store must match across the chain. AWS forwarding can change the access-key ID, so cross-service attribution uses the preserved identity tuple. All linked records must have the same recipient account. This path was validated in the Identity Center management account; member-account provisioning through a service role without the original native identity is outside this rule. Another administrator writing the administrator policy is a silent control even when the affected user later provisions and uses it.
- Both the SSO inline document and the effective IAM document must contain one flat unconditional Allow, Action * and Resource * statement. JSON parsing rejects conditions, NotAction/NotResource and mixed statements; complex equivalent administrator policies remain outside scope. Verify the source request IDs and approved change record. Authorized emergency self-escalation or security testing can match. The observed successful CreateUser establishes that permission became usable, without claiming every AWS action bypasses SCPs or other constraints.
- These queries read standard AWS CloudTrail fields and calculate correlations at query time. The 125-minute lookback bounds the available context; it is not a complete inventory. Missing history does not become an assumed attachment, protected-resource label or authorization decision. The behavior window for the final access change is 30 minutes where specified. AWS event time determines order; same-second stages deliberately do not match. Review late or missing CloudTrail delivery when investigating a missed detection.

### False positive analysis

- An approved emergency or security test in which an SSO role confirms an IAM user-creation denial, grants itself an administrator inline policy, and retries the same user creation successfully.

### Response and remediation

- Use the source request IDs to recover original CloudTrail events. Confirm the actor's authority and the change request before remediation. If the sequence is unexplained, preserve evidence, contain the acting credentials, and remove unwanted access through established incident-response procedures.
"""
references = [
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_PutInlinePolicyToPermissionSet.html",
    "https://docs.aws.amazon.com/singlesignon/latest/APIReference/API_ProvisionPermissionSet.html",
    "https://www.elastic.co/docs/reference/query-languages/esql/functions-operators/string-functions/json_extract",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/referencingpermissionsets.html",
    "https://docs.aws.amazon.com/singlesignon/latest/userguide/sso-cloudtrail-use-cases.html",
    "https://github.com/HackTricks-wiki/hacktricks-cloud/blob/74335dc4ee4248d4c10c69a5698341121bd2183d/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md",
    "https://www.cloudquery.io/blog/aws-priv-esc-identity-center",
]
risk_score = 73
rule_id = "d46f0d3e-de51-5e9e-b93e-2ca43cd0fa6f"
setup = """## Setup

This rule reads the AWS integration CloudTrail data stream `logs-aws.cloudtrail-*`.

- Collect management read and write events from the Identity Center owner account, and from the member accounts the rules correlate into.
- Keep the integration's default Keyword and Flattened event-information setting; it is what stores the request and response payloads these queries read.
- No custom pipeline, mappings, registry, enrich policy or lookup index is required. The standard Fleet final pipeline may remove `event.original`; these queries do not use it.
- Verified on Elasticsearch 9.6.0 with AWS integration 8.1.3.
- This rule reads Identity Center attribution fields that the AWS integration only maps from version 7.4.0 onward: aws.cloudtrail.user_identity.on_behalf_of.user_id, aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn and aws.cloudtrail.user_identity.credential_id. On an earlier integration those fields are absent and the rule cannot match, so AWS integration 7.4.0 or later is required rather than recommended.

Queries order stages by AWS event time, so measure CloudTrail delivery latency in your environment before shortening any lookback."""
severity = "high"
tags = [
    "Domain: Cloud",
    "Platform: AWS",
    "Data Source: AWS",
    "Data Source: Amazon Web Services",
    "Data Source: AWS CloudTrail",
    "Service: AWS IAM Identity Center",
    "Tactic: Privilege Escalation",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-aws.cloudtrail-*
| WHERE data_stream.dataset == "aws.cloudtrail"
    AND aws.cloudtrail.recipient_account_id IS NOT NULL
    AND aws.cloudtrail.request_id IS NOT NULL
    AND ( (event.provider == "sso.amazonaws.com" AND event.outcome == "success" AND event.action IN ("CreatePermissionSet", "DeletePermissionSet", "PutInlinePolicyToPermissionSet", "DeleteInlinePolicyFromPermissionSet")) OR (event.provider == "iam.amazonaws.com" AND event.action IN ("CreateUser", "PutRolePolicy", "DeleteRolePolicy")))
| EVAL Esql_priv.actor = aws.cloudtrail.user_identity.arn,
    Esql_priv.actor_role = aws.cloudtrail.user_identity.session_context.session_issuer.arn,
    Esql.ps = COALESCE(FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "permissionSetArn"), FIELD_EXTRACT(aws.cloudtrail.flattened.response_elements, "permissionSet.permissionSetArn")),
    Esql.created_name = FIELD_EXTRACT(aws.cloudtrail.flattened.response_elements, "permissionSet.name"),
    Esql.target_role = FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "roleName"),
    Esql_priv.target_user = FIELD_EXTRACT(aws.cloudtrail.flattened.response_elements, "user.arn")
| GROK aws.cloudtrail.error_message "on resource: (?<Esql.denied_target>arn:[^ ]+:user/[^ ]+) "
| EVAL Esql.document = COALESCE(FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "inlinePolicy"), FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "policyDocument"))
| EVAL Esql.statements = JSON_EXTRACT(Esql.document, "Statement")
| EVAL Esql.statement = CASE(STARTS_WITH(Esql.statements, "["),
    CASE(Esql.statements RLIKE "\\[ *\\{[^{}]*\\} *\\]", JSON_EXTRACT(Esql.statements, "[0]")),
    CASE(Esql.statements RLIKE "\\{[^{}]*\\}", Esql.statements))
| EVAL Esql.is_admin = JSON_EXTRACT(Esql.statement, "Effect") == "Allow"
    AND JSON_EXTRACT(Esql.statement, "Action") == "*"
    AND JSON_EXTRACT(Esql.statement, "Resource") == "*"
    AND NOT Esql.statement LIKE "*NotAction*"
    AND NOT Esql.statement LIKE "*NotResource*"
    AND NOT Esql.statement LIKE "*Condition*"
| EVAL Esql.stage = CASE(
    event.action == "CreateUser" AND event.outcome == "failure" AND aws.cloudtrail.error_code IN ("AccessDenied", "AccessDeniedException"), "denied",
    event.outcome != "success", "ignore",
    event.action == "CreateUser", "use", event.action == "CreatePermissionSet", "create",
    event.action == "DeletePermissionSet", "delete", event.action == "PutInlinePolicyToPermissionSet" AND Esql.is_admin == true, "elevate", event.action IN ("PutInlinePolicyToPermissionSet", "DeleteInlinePolicyFromPermissionSet"), "replace", event.action == "PutRolePolicy" AND aws.cloudtrail.user_identity.invoked_by == "sso.amazonaws.com"
    AND Esql.is_admin == true AND FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "policyName") == "AwsSSOInlinePolicy", "effect",
    event.action IN ("PutRolePolicy", "DeleteRolePolicy") AND FIELD_EXTRACT(aws.cloudtrail.flattened.request_parameters, "policyName") == "AwsSSOInlinePolicy", "restore", "ignore")
| EVAL Esql.identity = CONCAT(COALESCE(Esql_priv.actor, "unknown"), "|", COALESCE(Esql_priv.actor_role, "unknown"), "|", COALESCE(aws.cloudtrail.user_identity.on_behalf_of.user_id, "unknown"), "|", COALESCE(aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn, "unknown"))
| EVAL Esql.ps_record = CASE(Esql.stage IN ("create", "delete", "elevate", "replace"),
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.stage, "|", Esql.ps, "|", COALESCE(Esql.created_name, "unknown"), "|", Esql.identity)),
    Esql.iam_record = CASE(Esql.stage IN ("effect", "restore", "denied"),
    CONCAT(TO_STRING(TO_LONG(@timestamp)), "|", aws.cloudtrail.request_id, "|", Esql.stage, "|", COALESCE(Esql.target_role, "unknown"), "|", COALESCE(Esql.denied_target, "unknown"), "|", Esql.identity))
| INLINE STATS Esql.ps_history_values = VALUES(Esql.ps_record),
    Esql.iam_history_values = VALUES(Esql.iam_record)
    BY aws.cloudtrail.recipient_account_id
| WHERE Esql.stage == "use"
    AND Esql_priv.target_user IS NOT NULL
    AND aws.cloudtrail.user_identity.access_key_id IS NOT NULL
    AND aws.cloudtrail.user_identity.on_behalf_of.user_id IS NOT NULL
    AND aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn IS NOT NULL
    AND Esql_priv.actor_role RLIKE "arn:[^:]+:iam::[0-9]{12}:role/aws-reserved/sso[.]amazonaws[.]com/([a-z0-9-]+/)?AWSReservedSSO_.+_[0-9a-f]{16}"
| EVAL Esql.role_name = REPLACE(Esql_priv.actor_role, "^.*/", "")
| EVAL Esql.actor_ps_name = REPLACE(REPLACE(Esql.role_name, "^AWSReservedSSO_", ""), "_[0-9a-f]{16}$", "")
| MV_EXPAND Esql.iam_history_values
| DISSECT Esql.iam_history_values "%{Esql.iam_ms}|%{Esql.iam_request}|%{Esql.iam_stage}|%{Esql.iam_role}|%{Esql.iam_user}|%{Esql_priv.iam_actor}|%{Esql.iam_issuer}|%{Esql.iam_subject}|%{Esql.iam_store}"
| EVAL Esql.iam_time = TO_DATETIME(TO_LONG(Esql.iam_ms)),
    Esql.same_actor = Esql_priv.iam_actor == Esql_priv.actor
    AND Esql.iam_issuer == Esql_priv.actor_role
    AND Esql.iam_subject == aws.cloudtrail.user_identity.on_behalf_of.user_id
    AND Esql.iam_store == aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn
| WHERE Esql.iam_time < @timestamp AND Esql.iam_time >= @timestamp - 30 minutes
| STATS Esql.denied_at = MIN(CASE(Esql.iam_stage == "denied" AND Esql.same_actor == true AND Esql.iam_user == Esql_priv.target_user, Esql.iam_time)),
    Esql.effective_at = MAX(CASE(Esql.iam_stage == "effect" AND Esql.same_actor == true AND Esql.iam_role == Esql.role_name, Esql.iam_time)),
    Esql.restored_at = MAX(CASE(Esql.iam_stage == "restore" AND Esql.iam_role == Esql.role_name, Esql.iam_time)),
    Esql.ps_history_values = VALUES(Esql.ps_history_values),
    Esql.iam_request_ids_values = VALUES(Esql.iam_request),
    Esql.source_ip_values = VALUES(source.ip)
    BY aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.user_identity.access_key_id,
    aws.cloudtrail.request_id,
    @timestamp,
    Esql_priv.actor,
    Esql_priv.actor_role,
    Esql.actor_ps_name,
    aws.cloudtrail.user_identity.on_behalf_of.user_id,
    aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn,
    Esql_priv.target_user
| WHERE Esql.denied_at < Esql.effective_at AND (Esql.restored_at IS NULL OR Esql.restored_at < Esql.effective_at)
| MV_EXPAND Esql.ps_history_values
| DISSECT Esql.ps_history_values "%{Esql.change_ms}|%{Esql.change_request}|%{Esql.change_stage}|%{Esql.permission_set_arn}|%{Esql.ps_name}|%{Esql_priv.change_actor}|%{Esql.change_issuer}|%{Esql.change_user}|%{Esql.change_store}"
| EVAL Esql.change_time = TO_DATETIME(TO_LONG(Esql.change_ms)),
    Esql.same_changer = Esql_priv.change_actor == Esql_priv.actor
    AND Esql.change_issuer == Esql_priv.actor_role
    AND Esql.change_user == aws.cloudtrail.user_identity.on_behalf_of.user_id
    AND Esql.change_store == aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn
| WHERE Esql.change_time < Esql.effective_at
| STATS Esql.created_at = MAX(CASE(Esql.change_stage == "create" AND Esql.ps_name == Esql.actor_ps_name, Esql.change_time)),
    Esql.elevated_at = MAX(CASE(Esql.change_stage == "elevate" AND Esql.same_changer == true, Esql.change_time)),
    Esql.replaced_at = MAX(CASE(Esql.change_stage == "replace" OR (Esql.change_stage == "elevate" AND Esql.same_changer == false), Esql.change_time)),
    Esql.deleted_at = MAX(CASE(Esql.change_stage == "delete", Esql.change_time)),
    Esql.source_request_ids_values = VALUES(Esql.change_request),
    Esql.iam_request_ids_values = VALUES(Esql.iam_request_ids_values),
    Esql.source_ip_values = VALUES(Esql.source_ip_values)
    BY aws.cloudtrail.recipient_account_id,
    aws.cloudtrail.user_identity.access_key_id,
    aws.cloudtrail.request_id,
    @timestamp,
    Esql_priv.actor,
    Esql_priv.actor_role,
    Esql.actor_ps_name,
    aws.cloudtrail.user_identity.on_behalf_of.user_id,
    aws.cloudtrail.user_identity.on_behalf_of.identity_store_arn,
    Esql.permission_set_arn,
    Esql_priv.target_user,
    Esql.denied_at,
    Esql.effective_at
| WHERE Esql.created_at < Esql.elevated_at
    AND Esql.denied_at < Esql.elevated_at
    AND Esql.deleted_at IS NULL
    AND (Esql.replaced_at IS NULL OR Esql.replaced_at < Esql.elevated_at)
| KEEP Esql.*, Esql_priv.*, @timestamp, aws.cloudtrail.*
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.003"
name = "Additional Cloud Roles"
reference = "https://attack.mitre.org/techniques/T1098/003/"



[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

[rule.alert_suppression]
group_by = ["aws.cloudtrail.request_id"]
missing_fields_strategy = "doNotSuppress"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "aws.cloudtrail.request_id",
    "aws.cloudtrail.user_identity.access_key_id",
    "Esql.permission_set_arn",
    "Esql_priv.actor_role",
    "Esql_priv.target_user",
    "Esql.denied_at",
    "Esql.elevated_at",
    "Esql.effective_at",
    "Esql.source_request_ids_values",
    "Esql.iam_request_ids_values",
]

[rule.alert_suppression.duration]
value = 130
unit = "m"

