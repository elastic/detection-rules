[metadata]
creation_date = "2026/09/14"
integration = ["kubernetes"]
maturity = "production"
updated_date = "2026/09/14"

[rule]
author = ["Elastic"]
description = """
Detects the first successful Kubernetes secrets.get by a pod service account from a previously unseen combination of
service-account identity, user agent, and source IP. Controllers routinely read secrets with a stable client
fingerprint; a new user agent or source for that service account could indicate a stolen token used outside the
workload (for example curl, a custom script, or kubectl from an unexpected host).
"""
false_positives = [
    """
    Controller upgrades, sidecar replacements, or client library version bumps change user agents and can produce a
    first-seen alert for known service accounts. Confirm the new client is expected before treating as compromise.
    """,
    """
    Newly deployed operators or workloads that change egress IP will alert once while the history window learns their
    client fingerprint.
    """,
]
from = "now-6m"
index = ["logs-kubernetes.audit_logs-*"]
language = "kuery"
license = "Elastic License v2"
name = "Kubernetes Unusual Service Account Secret Access via New User Agent"
note = """## Triage and analysis

### Investigating Kubernetes Unusual Service Account Secret Access via New User Agent

This new-terms rule alerts when a `system:serviceaccount:*` identity successfully calls `secrets.get` with a
`user.name` + `user_agent.original` + `source.ip` combination not seen in the history window. Default in-cluster
clients that present `kubernetes/$Format` user agents are excluded.

### Possible investigation steps

- Confirm whether the service account normally uses this user agent or whether the client looks like an interactive
  or scripting tool (`curl`, `python`, `kubectl`, generic HTTP libraries).
- Review `kubernetes.audit.objectRef.namespace` and `kubernetes.audit.objectRef.name` against the workload's expected
  secret mounts and RBAC.
- Pivot on the same `user.name` or `source.ip` for secret list/get bursts, exec, or RBAC changes.
- Compare to recent deployments or operator upgrades that would legitimately introduce a new client string.

### False positive analysis

- Operator or library upgrades that change the user-agent string for an otherwise unchanged service account.
- First enablement of the rule will surface baseline non-`$Format` controller clients until the history window fills.

### Response and remediation

- If malicious, revoke the service-account token, rotate exposed secrets, isolate the originating workload or host,
  and tighten RBAC so the identity can only read required secrets.
"""
setup = "The Kubernetes Fleet integration with API server audit logs enabled is required to be compatible with this rule."
references = [
    "https://kubernetes.io/docs/reference/access-authn-authz/authentication/#service-account-tokens",
]
risk_score = 21
rule_id = "d5b341f1-e558-4d8e-8d01-4d6295cdd9e4"
severity = "low"
tags = [
    "Data Source: Kubernetes",
    "Data Source: Kubernetes API Server Audit Logs",
    "Domain: Kubernetes",
    "Platform: Kubernetes",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:"kubernetes.audit_logs" and event.outcome:success and
event.action:get and kubernetes.audit.objectRef.resource:secrets and
user.name:system\:serviceaccount\:* and
user_agent.original:(* and not *kubernetes/$Format*) and
source.ip:(* and not (127.0.0.1 or "::1"))
'''

[rule.new_terms]
field = "new_terms_fields"
value = ["user.name", "user_agent.original", "source.ip"]

[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-7d"

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"

[[rule.threat.technique.subtechnique]]
id = "T1552.007"
name = "Container API"
reference = "https://attack.mitre.org/techniques/T1552/007/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "user.name",
    "kubernetes.audit.user.username",
    "source.ip",
    "user_agent.original",
    "event.action",
    "event.outcome",
    "kubernetes.audit.objectRef.namespace",
    "kubernetes.audit.objectRef.name",
    "data_stream.namespace",
]
