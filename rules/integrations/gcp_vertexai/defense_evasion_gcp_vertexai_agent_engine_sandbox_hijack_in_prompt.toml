[metadata]
creation_date = "2026/10/02"
integration = ["gcp_vertexai"]
maturity = "production"
min_stack_comments = "gcp_vertexai prompt_response_logs requires integration 1.4.0+ (Kibana ^9.2.0)."
min_stack_version = "9.3.0"
updated_date = "2026/10/02"

[rule]
author = ["Elastic"]
description = """
Detects Vertex AI prompts or model replies combining process-memory or GOT primitives with
FFI, library, or sandbox indicators and response-channel or write-hook language. This can
identify discussion or development of an Agent Engine sandbox response-channel hijack when
audit events omit submitted code. Matching text does not establish execution or malicious intent.
"""
false_positives = [
    """
    Security research, academic discussion, and legitimate low-level instrumentation
    can include the same memory and write-hook language. Confirm context and whether
    application traces connect it to unauthorized sandbox execution.
    """,
]
from = "now-60m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "GCP Vertex AI Agent Engine Sandbox Hijack in Prompt"
note = """## Triage and analysis

### Investigating GCP Vertex AI Agent Engine Sandbox Hijack in Prompt

The request or response text combines three groups: process-memory or GOT primitives;
FFI/library or sandbox indicators; and response-channel or write-hook language. The last
group requires terms such as SandboxOut, fd 5, GOT overwrite/hook, or write-hook identifiers,
so generic discussion of `ctypes` and `/proc` is insufficient. Indicators can occur in
different parts or in the request and response of the same logged event.

This rule identifies technique language, not a live sandbox compromise or malicious intent.
Defensive research can match, and a model may introduce the technique in its reply. Agent
Engine execution without matching GenerateContent content will not be visible to this rule.

#### Possible investigation steps

- Read `gcp.vertexai.prompt_response_logs.full_request.contents.parts.text` and
  `gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text` in context.
  Distinguish ready-to-run hook code, quoted research, a refusal, and an unsolicited model
  explanation. Check whether indicators from separate text parts describe the same technique.
- Record `cloud.project.id`, `gcp.vertexai.prompt_response_logs.model`,
  `gcp.vertexai.prompt_response_logs.api_method`, and
  `gcp.vertexai.prompt_response_logs.full_response.candidates.finish_reason`. `STOP` indicates
  a completed reply and does not distinguish a refusal from an exploit walkthrough.
- Prompt-response logs do not carry `client.user.email` or `source.ip`. Pivot to
  `logs-gcp_vertexai.auditlogs-*` for nearby GenerateContent/StreamGenerateContent and Agent
  Engine CreateSandboxEnvironment/ExecuteSandboxEnvironment events to identify candidate
  principals and IPs. Project/time proximity alone cannot attribute a prompt to a specific
  caller or sandbox; confirm the relationship with application traces.
- Hunt GCP Vertex AI Agent Engine Repeated Sandbox Code Execution alerts for the same project.
  Inspect related raw executions even if fewer than five calls occurred or calls were spread
  beyond one hour. Audit request/response fields do not contain the submitted Python.
- If traces connect the text to a sandbox, inspect captured code and independently validate
  later outputs. Code using `/proc/self/maps`, `.rela.plt`, and `from_address` can install a
  hook without opening `/proc/*/mem`.

### False positive analysis

- Blue-team, vendor, or academic discussion can contain every indicator. Confirm workload
  ownership and intent; follow-on execution alone is still insufficient to prove compromise.
- Low-level debugging or instrumentation can legitimately discuss GOT or write hooks. Generic
  ctypes/proc questions are filtered out, but detailed hooking discussions can still match.
- Model-generated explanations and quoted conversation history may match without an attempt
  to deploy the technique. Scope research exceptions to reviewed projects or workloads.

### Response and remediation

- If code, traces, or independently checked outputs corroborate tampering, stop using the
  affected sandbox, preserve evidence, replace it, and re-validate dependent agent decisions.
- Restrict or rotate caller credentials when the investigation establishes unauthorized use
  or compromise. Do not infer credential compromise from matching text alone.
- Prefer separate sandboxes across users or tenants and treat tool output as untrusted input.
  Absence of an alert is not evidence of safe output: omitted, sampled, encoded, or obfuscated
  content can evade text matching.
"""
references = [
    "https://www.beyondtrust.com/blog/entry/vertex-ai-agent-engine-sandbox-hijack",
    "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-quickstart",
    "https://www.elastic.co/docs/reference/integrations/gcp_vertexai",
]
risk_score = 47
rule_id = "56284fcd-bd62-47b3-b222-a7a7436b951d"
setup = """## Setup

Requires GCP Vertex AI integration 1.4.0+ `prompt_response_logs` with request/response logging
enabled and text populated in the BigQuery export. Verify logging coverage and sampling for
the relevant models. The rule inspects contents.parts.text and candidate response text;
unlogged code, non-text payloads, and system-instruction-only content are outside its scope.
Pair with `auditlogs` covering Agent Engine methods and application traces for attribution;
caller email and source IP are not available on prompt_response_logs.
"""
severity = "medium"
tags = [
    "Domain: GenAI",
    "Domain: Cloud",
    "Data Source: GCP Vertex AI",
    "Data Source: GCP",
    "Data Source: Google Cloud Platform",
    "Platform: GCP",
    "Service: GCP Vertex AI",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Tactic: Execution",
    "Tactic: Persistence",
    "Threat: Unauthorized AI Usage",
    "Mitre Atlas: AML.T0051",
    "Mitre Atlas: AML.T0110",
    "Mitre Atlas: AML.T0110.002",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-gcp_vertexai.prompt_response_logs-* metadata _id, _version, _index
| where data_stream.dataset == "gcp_vertexai.prompt_response_logs"
| eval request_text = to_lower(coalesce(mv_concat(gcp.vertexai.prompt_response_logs.full_request.contents.parts.text, " "), "")),
       response_text = to_lower(coalesce(mv_concat(gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text, " "), ""))
| where
    (
        request_text rlike """.*(/proc/([0-9]+|self)/(mem|maps)|from_address|[.]rela[.]plt|got[ _]*(overwrite|hook)|hook(ing)?[ ]+(the[ ]+)?write|write[_ ]hook).*""" or
        response_text rlike """.*(/proc/([0-9]+|self)/(mem|maps)|from_address|[.]rela[.]plt|got[ _]*(overwrite|hook)|hook(ing)?[ ]+(the[ ]+)?write|write[_ ]hook).*"""
    ) and
    (
        request_text rlike """.*(ctypes|cfunctype|libpython|sandboxout).*|(.*[^a-z0-9_])?fd[ ]*(==|=)?[ ]*5([^a-z0-9_].*)?""" or
        response_text rlike """.*(ctypes|cfunctype|libpython|sandboxout).*|(.*[^a-z0-9_])?fd[ ]*(==|=)?[ ]*5([^a-z0-9_].*)?"""
    ) and
    (
        request_text rlike """.*(sandboxout|got[ _]*(overwrite|hook)|hook(ing)?[ ]+(the[ ]+)?write|write[_ ]hook|write_got).*|(.*[^a-z0-9_])?fd[ ]*(==|=)?[ ]*5([^a-z0-9_].*)?""" or
        response_text rlike """.*(sandboxout|got[ _]*(overwrite|hook)|hook(ing)?[ ]+(the[ ]+)?write|write[_ ]hook|write_got).*|(.*[^a-z0-9_])?fd[ ]*(==|=)?[ ]*5([^a-z0-9_].*)?"""
    )
| keep
    _id,
    _version,
    _index,
    @timestamp,
    cloud.project.id,
    gcp.vertexai.prompt_response_logs.model,
    gcp.vertexai.prompt_response_logs.api_method,
    gcp.vertexai.prompt_response_logs.full_request.contents.parts.text,
    gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text,
    gcp.vertexai.prompt_response_logs.full_response.candidates.finish_reason
'''


