[metadata]
creation_date = "2026/10/02"
integration = ["gcp_vertexai"]
maturity = "production"
min_stack_comments = "gcp_vertexai prompt_response_logs requires integration 1.4.0+ (Kibana ^9.2.0)."
min_stack_version = "9.3.0"
updated_date = "2026/10/02"

[rule]
author = ["Elastic"]
description = """
Detects a GCP Vertex AI GenerateContent exchange whose prompt or model reply contains a known credential pattern (AWS
access keys, GitHub tokens, PEM private keys, and similar). Secrets in prompt/response logs are visible to anyone with
access to BigQuery prompt-response export and Elastic.
"""
false_positives = [
    """
    Documentation and unit tests that paste example keys (for example an AWS access key ending in EXAMPLE) match the
    token patterns. Confirm the value is live before rotating it.
    """,
]
from = "now-60m"
interval = "10m"
language = "esql"
license = "Elastic License v2"
name = "GCP Vertex AI Prompt or Response Containing Credentials"
note = """## Triage and analysis

### Investigating GCP Vertex AI Prompt or Response Containing Credentials

A Vertex AI prompt-response log row matched a credential pattern in the user prompt and/or model
reply (AWS access keys, GitHub tokens, PEM private keys, Slack tokens, Stripe live keys, Google API
keys, or GitLab PATs). There is no provider-side credential flag — the match is content-only.
Secrets in these logs are visible to anyone with access to the BigQuery export and Elastic.

#### Possible investigation steps

- Read `gcp.vertexai.prompt_response_logs.full_request.contents.parts.text` and
  `...full_response.candidates.content.parts.text` on the alert. Decide whether the match is a live
  secret or an example/placeholder (for example an AWS key ending in `EXAMPLE`).
- Note `gcp.vertexai.prompt_response_logs.model`, `api_method`, and `@timestamp`.
- Correlate with `logs-gcp_vertexai.auditlogs-*` GenerateContent events in the same window for
  `source.ip` and `client.user.email` to identify the calling principal and application egress.
- If the secret appears in the model reply, treat it as completion exposure as well as prompt
  exposure; review whether the prompt asked the model to recall or transform secrets.
- Scope impact: which system the credential belongs to and what privileges it has.

### False positive analysis

- Documentation, unit tests, and tutorials that paste example keys match the same prefixes. Confirm
  the value is live before rotating or paging.

### Response and remediation

- If the credential is live: rotate or revoke it immediately and hunt for use of that secret outside
  Vertex (CloudTrail, GitHub audit, IdP, etc.).
- Find and fix the application path that placed the secret in the prompt; add input/output filtering
  (Model Armor / sensitive-data policies) so secrets are not logged again.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/gcp_vertexai",
    "https://github.com/elastic/integrations/issues/20740",
    "https://genai.owasp.org/llmrisk/llm06-sensitive-information-disclosure",
    "https://atlas.mitre.org/techniques/AML.T0055",
    "https://atlas.mitre.org/techniques/AML.T0057",
]
risk_score = 73
rule_id = "4a1683ef-7f20-4c2a-bfa6-6eb7c3dc03d3"
setup = """## Setup

Requires the GCP Vertex AI integration collecting `prompt_response_logs` from BigQuery request/response logging.

https://www.elastic.co/docs/reference/integrations/gcp_vertexai
"""
severity = "high"
tags = [
    "Domain: GenAI",
    "Data Source: GCP Vertex AI",
    "Data Source: Google Cloud Platform",
    "Use Case: Threat Detection",
    "Mitre Atlas: AML.T0055",
    "Mitre Atlas: AML.T0057",
    "Resources: Investigation Guide",
    "Tactic: Credential Access",
    "Rule Type: ES|QL",
    "Platform: GCP",
    "Domain: Cloud",
    "Service: GCP Vertex AI",
    "Threat: Unauthorized AI Usage",
    "Threat: LLMjacking",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-gcp_vertexai.prompt_response_logs-* metadata _id, _version, _index
| where
    data_stream.dataset == "gcp_vertexai.prompt_response_logs" and
    (
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*(AKIA|ASIA)[A-Z0-9]{16}.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*(AKIA|ASIA)[A-Z0-9]{16}.*""" or
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*gh[pousr]_[A-Za-z0-9]{36}.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*gh[pousr]_[A-Za-z0-9]{36}.*""" or
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*github_pat_[A-Za-z0-9_]+.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*github_pat_[A-Za-z0-9_]+.*""" or
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*-----BEGIN [A-Z ]*PRIVATE KEY-----.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*-----BEGIN [A-Z ]*PRIVATE KEY-----.*""" or
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*xox[baprs]-[0-9]+-[0-9]+-[A-Za-z0-9]+.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*xox[baprs]-[0-9]+-[0-9]+-[A-Za-z0-9]+.*""" or
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*sk_live_[A-Za-z0-9]+.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*sk_live_[A-Za-z0-9]+.*""" or
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*AIza[-A-Za-z0-9_]+.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*AIza[-A-Za-z0-9_]+.*""" or
        gcp.vertexai.prompt_response_logs.full_request.contents.parts.text rlike """.*glpat-[-A-Za-z0-9_]+.*""" or
        gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text rlike """.*glpat-[-A-Za-z0-9_]+.*"""
    )
| keep
    _id,
    _version,
    _index,
    @timestamp,
    cloud.project.id,
    gcp.vertexai.prompt_response_logs.model,
    gcp.vertexai.prompt_response_logs.api_method,
    gcp.vertexai.prompt_response_logs.full_request.contents.parts.text,
    gcp.vertexai.prompt_response_logs.full_response.candidates.content.parts.text,
    gcp.vertexai.prompt_response_logs.full_response.usage_metadata.prompt_token_count,
    gcp.vertexai.prompt_response_logs.full_response.usage_metadata.candidates_token_count
'''


