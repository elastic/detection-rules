[metadata]
creation_date = "2026/10/15"
integration = ["zscaler_zpa"]
maturity = "production"
updated_date = "2026/10/15"

[rule]
author = ["Elastic"]
description = """
Identifies at least five failed Zscaler Private Access (ZPA) administrator sign-in attempts followed by a successful
sign-in for the same administrator in one tenant. This pattern may indicate successful password guessing, credential
stuffing, or repeated authentication attempts using compromised credentials.
"""
false_positives = [
    """
    Password changes, expired credentials, identity-provider incidents, administrator error, automated health checks,
    and support testing can produce repeated failures before a successful sign-in. Validate the administrator, source
    addresses, timing, and identity-provider activity before escalating.
    """,
]
from = "now-15m"
index = ["logs-zscaler_zpa.audit-*"]
interval = "5m"
language = "eql"
license = "Elastic License v2"
name = "Multiple Zscaler ZPA Administrator Sign-in Failures Followed by Success"
note = """## Triage and analysis

### Investigating Multiple Zscaler ZPA Administrator Sign-in Failures Followed by Success

ZPA Audit events classify administrator authentication as object type `Authentication`, with operation types
`Sign In Failure` and `Sign In`. The rule correlates five failures followed by a success for the same `user.name`
within the same `organization.id`. The current integration pipeline does not populate `client.ip` for `Sign In Failure`
events, so the sequence intentionally does not correlate or make claims about failure source addresses.

#### Possible investigation steps

- Confirm the administrator in `user.name` and tenant in `organization.id`, then review the sequence timestamps, event
  IDs, and ZPA audit session identifiers.
- Review the successful event's `client.ip`, when present, and investigate unfamiliar hosting, proxy, VPN, or
  geographically inconsistent addresses.
- Correlate with identity-provider authentication, MFA, device, and risk events for the same administrator.
- Search for subsequent administrator, access-policy, provisioning-key, App Connector, Private Service Edge, and Log
  Receiver changes.
- Determine whether failures continued after the successful sign-in or targeted additional administrator accounts.

### False positive analysis

- A legitimate administrator may retry after a password change or IdP outage. Confirm that the success originated from
  an expected administrative path and that no sensitive ZPA changes followed.
- Shared administrative identities can combine activity from multiple people and should be eliminated where possible.

### Response and remediation

- If compromise is suspected, revoke ZPA and identity-provider sessions, reset credentials, and require fresh MFA.
- Restrict or block malicious source infrastructure while preserving access for known administrative paths.
- Review and revert unauthorized ZPA configuration changes made after the successful sign-in.
- Preserve ZPA and identity-provider audit evidence and investigate other accounts targeted by the same sources.
"""
references = [
    "https://www.elastic.co/docs/reference/integrations/zscaler_zpa",
    "https://help.zscaler.com/zpa/understanding-audit-log-fields",
]
risk_score = 73
rule_id = "0bd28840-ee14-4b07-93a8-f192c20fc618"
setup = """## Setup

This rule requires the Elastic **Zscaler ZPA** integration and the ZPA **Audit** data stream.

Configure a ZPA Log Receiver to send Audit logs in the JSON response format documented by the integration. Confirm that
administrator authentication events use object type `Authentication`, include `Sign In` and `Sign In Failure`
operations, and populate `organization.id`, `user.name`, and `event.id`.

This draft has not been tested against a ZPA `Sign In Failure` fixture or live ZPA telemetry. Validate the exact failure
event mapping in your environment before enabling the rule for production use.
"""
severity = "high"
tags = [
    "Domain: Identity",
    "Domain: Network",
    "Domain: SaaS",
    "Use Case: Identity and Access Audit",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Initial Access",
    "Data Source: Zscaler",
    "Data Source: Zscaler ZPA",
    "Platform: Zscaler",
    "Resources: Investigation Guide",
    "Noise: Unknown",
    "Performance: Fast",
    "Rule Type: Event Correlation (EQL)",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence by organization.id, user.name with maxspan=10m
 [any where
  data_stream.dataset == "zscaler_zpa.audit" and
  organization.id != null and user.name != null and
  zscaler_zpa.audit.object.type == "Authentication" and
  zscaler_zpa.audit.operation_type == "Sign In Failure" and
  event.category == "session" and
  event.type == "error" and
  event.outcome == "failure"
 ] with runs=5
 [any where
  data_stream.dataset == "zscaler_zpa.audit" and
  organization.id != null and user.name != null and
  zscaler_zpa.audit.object.type == "Authentication" and
  zscaler_zpa.audit.operation_type == "Sign In" and
  event.category == "authentication" and
  event.type == "start" and
  event.outcome == "success"
 ]
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1110"
name = "Brute Force"
reference = "https://attack.mitre.org/techniques/T1110/"
[[rule.threat.technique.subtechnique]]
id = "T1110.001"
name = "Password Guessing"
reference = "https://attack.mitre.org/techniques/T1110/001/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"
[[rule.threat.technique.subtechnique]]
id = "T1078.004"
name = "Cloud Accounts"
reference = "https://attack.mitre.org/techniques/T1078/004/"



[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"

[rule.alert_suppression]
group_by = ["organization.id", "user.name"]
missing_fields_strategy = "suppress"

[rule.investigation_fields]
field_names = [
    "organization.id",
    "user.name",
    "event.id",
    "event.category",
    "event.type",
    "event.outcome",
    "client.ip",
    "zscaler_zpa.audit.operation_type",
    "zscaler_zpa.audit.object.type",
    "zscaler_zpa.audit.session.id",
]

[rule.alert_suppression.duration]
unit = "m"
value = 15

