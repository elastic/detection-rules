[metadata]
creation_date = "2026/11/24"
integration = ["openshell"]
maturity = "production"
min_stack_comments = "The NVIDIA OpenShell integration requires Elastic Stack 9.4.0 or later."
min_stack_version = "9.4.0"
updated_date = "2026/11/24"

[rule]
author = ["Elastic"]
description = """
Identifies a network connection attempt from an OpenShell sandbox to a cloud instance metadata service (AWS/Azure/GCP
IMDS, Alibaba Cloud, ECS task metadata). Sandboxed AI agents have no legitimate reason to reach the metadata endpoint of
the host they run on; an attempt indicates a prompt-injected or compromised agent trying to harvest instance
credentials, identity tokens, or user-data from the underlying infrastructure. Both allowed and policy-denied attempts
are alerted, because a reach for the metadata service is suspicious regardless of the enforcement outcome.
"""
false_positives = [
    """
    Sandbox images or agent tooling that probe the metadata endpoint to detect the cloud provider at startup (for
    example some SDK auto-configuration routines) can trigger this rule. Validate the calling binary and container, then
    add a scoped exception for the specific process and sandbox rather than excluding the metadata address.
    """,
]
from = "now-9m"
index = ["logs-openshell.ocsf-*"]
interval = "5m"
language = "kuery"
license = "Elastic License v2"
name = "OpenShell Sandbox Connection to Cloud Instance Metadata Service"
note = """## Triage and analysis

### Investigating OpenShell Sandbox Connection to Cloud Instance Metadata Service

The OpenShell Sandbox Supervisor routes all egress from a sandboxed agent through its policy proxy and records every
connection decision as an OCSF network activity event. This rule fires when the destination of such a connection is a
well-known cloud instance metadata address (`169.254.169.254`, `169.254.170.2`, `100.100.100.200`, `fd00:ec2::254`) or the
GCP `metadata.google.internal` hostname. Agents running inside OpenShell should never need to reach the metadata service of
the host or node they run on, so a connection attempt is a strong indicator that the agent is trying to steal cloud
credentials, whether the policy proxy ultimately allowed or denied it.

### Possible investigation steps

- Review `event.action` and `event.reason` to determine whether the connection was denied by policy or allowed. An
  allowed connection means the sandbox network policy permits the metadata endpoint and must be treated as a likely
  credential exposure.
- Identify the sandbox (`container.name`, `container.id`) and the calling binary (`process.name`, `process.executable`,
  `process.pid`) that initiated the connection.
- Inspect `destination.port`, `url.path`, and `http.request.method` for hints of the metadata path targeted (for example
  IAM security credentials or identity tokens).
- Pivot on the same `container.id` for other network events around the alert time to see whether the agent enumerated
  private addresses or attempted egress to unusual destinations after the metadata request.
- Review the agent's task, prompt history, and any recently fetched content to determine whether a prompt injection or
  tool misuse triggered the behavior.

### False positive analysis

- Cloud SDK auto-detection routines occasionally probe the metadata endpoint at startup. Confirm the process and image,
  then add a narrowly scoped exception for that process and sandbox if the behavior is expected.

### Response and remediation

- If the connection was allowed, treat the instance or node credentials as exposed: rotate the instance profile or
  managed identity credentials and review cloud audit logs for use of the role from unexpected sources.
- Stop or isolate the affected sandbox and preserve the supervisor logs and agent transcript for analysis.
- Tighten the sandbox network policy so the metadata address ranges are explicitly denied.

## Setup

This rule requires OpenShell Sandbox Supervisor OCSF audit events collected with the NVIDIA OpenShell integration.
Enable `ocsf_json_enabled` in the OpenShell settings (globally or per sandbox) so the supervisor writes OCSF JSONL to
`/var/log/openshell-ocsf.YYYY-MM-DD.log`, make that directory readable by Elastic Agent (for example by mounting the
sandbox `/var/log` on a volume shared with the agent), and add the integration to the agent policy with **Paths** set to
the mounted location. The integration's ingest pipeline normalizes the OCSF records to ECS, populating `observer.product`,
`event.*`, `destination.*`, `process.*`, `container.*`, `http.*`, `url.*`, and `rule.*` in the `logs-openshell.ocsf-*`
data stream.
"""
references = [
    "https://docs.nvidia.com/openshell/observability/logging",
    "https://docs.nvidia.com/openshell/observability/ocsf-json-export",
    "https://www.elastic.co/docs/reference/integrations/openshell",
]
risk_score = 73
rule_id = "40b084e9-4878-4fb3-81db-fabd6f260eb4"
severity = "high"
tags = [
    "Domain: Container",
    "Domain: GenAI",
    "Data Source: OpenShell",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Rule Type: Custom Query (KQL)",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset : "openshell.ocsf" and event.category : "network" and network.direction : "egress" and
  event.code : "4001" and event.type : "connection" and event.action : ("allowed" or "denied") and
  (
    destination.ip : ("100.100.100.200" or "169.254.169.254" or "169.254.170.2" or "fd00:ec2::254") or
    destination.domain : "metadata.google.internal"
  )
'''


[[rule.severity_mapping]]
field = "event.action"
operator = "equals"
severity = "high"
value = "allowed"

[[rule.severity_mapping]]
field = "event.action"
operator = "equals"
severity = "medium"
value = "denied"

[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.005"
name = "Cloud Instance Metadata API"
reference = "https://attack.mitre.org/techniques/T1552/005/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
[[rule.threat_mappings]]
framework = "MITRE ATLAS"
version = "2026.08"
[[rule.threat_mappings.threat]]
framework = "MITRE ATLAS"

[rule.threat_mappings.threat.tactic]
id = "AML.TA0013"
name = "Credential Access"
reference = "https://atlas.mitre.org/tactics/AML.TA0013/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "event.outcome",
    "event.reason",
    "event.severity",
    "container.name",
    "container.id",
    "process.name",
    "process.executable",
    "process.command_line",
    "process.parent.executable",
    "destination.ip",
    "destination.domain",
    "destination.port",
    "http.request.method",
    "url.path",
    "rule.name",
    "message",
]

