    "event.action",
    "event.outcome",
    "event.reason",
    "event.severity",
    "container.name",
    "container.id",
    "process.name",
    "process.executable",
    "destination.domain",
    "destination.ip",
    "destination.port",
    "url.domain",
    "url.path",
    "rule.id",
    "rule.name",
    "rule.description",
    "openshell.ocsf.confidence",
    "openshell.ocsf.risk_level",
    "openshell.ocsf.remediation.desc",
    "message",
]

