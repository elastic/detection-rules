[metadata]
creation_date = "2026/11/02"
integration = ["github"]
maturity = "production"
updated_date = "2026/11/02"

[rule]
author = ["Elastic"]
description = """
Detects disabling of SAML single sign-on for a GitHub enterprise or organization. Dropping SSO removes IdP-enforced
access control and is a common persistence step after an owner account is compromised.
"""
false_positives = [
    """
    Planned identity provider (IdP) migration or SAML reconfiguration performed during an approved change window.
    Confirm the change against a ticket, keep a second owner session active, and re-enable SSO as soon as the new
    provider is ready.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "GitHub SAML SSO Disabled"
note = """## Triage and analysis

### Investigating GitHub SAML SSO Disabled

`business.disable_saml` and `org.disable_saml` record the disabling of SAML single sign-on at the enterprise or organization level. SAML SSO delegates authentication to an external identity provider (IdP) and lets administrators enforce IdP-side controls such as MFA, conditional access, and centralized deprovisioning. Disabling it removes those controls and allows members to authenticate with GitHub credentials alone, which is a common persistence and defense-evasion step after an owner account is compromised. These events only apply to enterprises/orgs that have SAML configured and will not fire on a personal-account GHEC trial without SSO.

### Possible investigation steps

- Review `user.name`, `github.actor_ip`, and `github.user_agent` to confirm whether an authorized enterprise/org owner made the change, and from an expected location and client.
- Determine whether the change aligns with a documented IdP migration or SAML reconfiguration ticket.
- Check for correlated account-takeover indicators in the same window: recovery-code usage, new owner additions, PAT grants, OAuth app authorizations, and sign-ins from unusual IPs or ASNs.
- Review membership and access changes made while SSO was disabled, since members could authenticate without IdP enforcement during that period.
- Pivot on `github.hashed_token` / `github.programmatic_access_type` to determine whether the action was performed via the UI or a token.

### False positive analysis

- Planned IdP cutover or SAML provider reconfiguration performed within an approved change window. Confirm against a change ticket and scope exceptions by actor when expected.

### Response and remediation

- If the change is unauthorized, re-enable SAML SSO and require SSO for all members.
- Invalidate active sessions and force re-authentication through the IdP.
- Review and reverse any membership, access, or credential changes made while SSO was disabled.
- Confirm the acting owner account is not compromised, rotate its credentials, and review its other recent administrative actions.
"""
references = [
    "https://docs.github.com/en/enterprise-cloud@latest/admin/identity-and-access-management/using-saml-for-enterprise-iam/configuring-saml-single-sign-on-for-your-enterprise",
]
risk_score = 73
rule_id = "b60d3944-7ef3-4267-9a18-2f1114b066cb"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Defense Evasion",
    "Data Source: Github",
    "Data Source: GitHub Audit Logs",
    "Rule Type: ESQL",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-github.audit-* metadata _id, _index, _version
| where
  event.module == "github" and data_stream.dataset == "github.audit"
    and event.action in ("business.disable_saml", "org.disable_saml")
| keep
    _id,
    _index,
    _version,
    @timestamp,
    event.action,
    user.name,
    github.org,
    github.repo,
    github.actor_ip,
    github.hashed_token,
    github.programmatic_access_type,
    github.user_agent,
    github.business
'''


