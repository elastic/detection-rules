[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/24"

[rule]
author = ["Elastic"]
description = """
Detects GitHub secret scanning creating an alert for a detected secret in a repository. This is GitHub's own finding
that a credential was committed or pushed; treat it as credential exposure, not only as a scanner health event.
"""
false_positives = [
    """
    Documented dummy strings used in labs, test fixtures, or published custom patterns. Tune by repository or pattern
    name for known test orgs.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "GitHub Secret Scanning Alert Created"
note = """## Triage and analysis

### Investigating GitHub Secret Scanning Alert Created

`secret_scanning_alert.create` means GitHub matched a partner or custom pattern. Rotate the secret even if the commit looks accidental.

### Possible investigation steps

- Identify `github.repo`, `user.name` (committer vs `github`), and pattern metadata when present.
- Confirm whether push protection blocked the secret or the commit landed.

### False positive analysis

- Synthetic lab tokens and example keys in documentation repositories.

### Response and remediation

- Revoke and rotate the exposed credential. Remove it from git history if required by policy.
"""
references = ["https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning"]
risk_score = 21
rule_id = "305f8b49-ac0a-4f08-82fe-560cd30d66fd"
severity = "low"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Data Source: GitHub Audit Logs",
    "Service: GitHub Code Scanning",
    "Rule Type: ESQL",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-github.audit-* metadata _id, _index, _version
| where
  event.module == "github" and data_stream.dataset == "github.audit"
    and event.action == "secret_scanning_alert.create"
| keep
    _id,
    _index,
    _version,
    @timestamp,
    event.action,
    user.name,
    github.org,
    github.repo,
    github.actor_ip,
    github.hashed_token,
    github.programmatic_access_type,
    github.user_agent,
    github.secret_type,
    github.secret_type_display_name,
    github.publicly_leaked
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.001"
name = "Credentials In Files"
reference = "https://attack.mitre.org/techniques/T1552/001/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "user.name",
    "github.org",
    "github.repo",
    "github.actor_ip",
    "github.hashed_token",
    "github.programmatic_access_type",
    "github.user_agent",
    "github.secret_type",
    "github.secret_type_display_name",
    "github.publicly_leaked",
]

