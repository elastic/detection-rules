[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/24"

[rule]
author = ["Elastic"]
description = """
Detects creation of a GitHub Actions, Dependabot, or Codespaces secret at organization, repository, or environment
scope. After stealing a PAT, adversaries often plant a CI secret so workflows keep accessing cloud credentials after the
original token is revoked.
"""
false_positives = [
    """
    Onboarding a new deployment environment or rotating CI credentials. Confirm the secret name (`github.key`) and that
    a change ticket exists.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "GitHub Actions or Integration Secret Created"
note = """## Triage and analysis

### Investigating GitHub Actions or Integration Secret Created

`repo.create_actions_secret` / `org.create_actions_secret` / `environment.create_actions_secret` create Actions secrets. `*.create_integration_secret` covers Dependabot and Codespaces secrets. The audit log records the secret name in `github.key`, not the value.

Lab telemetry: `repo.create_actions_secret` for key `TRADEEMU_LAB_DUMMY` on `gh-lab-org/lab-app-1`.

### Possible investigation steps

- Identify `user.name`, `github.repo` / `github.org`, `github.key`, `github.visibility`, and `github.actor_ip`.
- Check whether a workflow that reads that secret was added or modified in the same window.
- Treat secrets created with a PAT or OAuth token from a new IP as higher urgency than documented rotation.

### False positive analysis

- Scheduled credential rotation by platform engineering.
- First-time environment setup for a new service.

### Response and remediation

- Delete unauthorized secrets and rotate any cloud credentials they may have referenced.
- Review workflow files for unexpected `secrets.` usage.
- Revoke the actor's tokens if the create was not approved.
"""
references = [
    "https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack",
    "https://www.elastic.co/blog/shai-hulud-worm-npm-supply-chain-compromise",
    "https://github.com/SigmaHQ/sigma/blob/master/rules/application/github/audit/github_new_secret_created.yml",
    "https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions",
]
risk_score = 21
rule_id = "85567aa3-04ee-4010-8e27-f6b751c0efd1"
severity = "low"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Tactic: Credential Access",
    "Data Source: GitHub Audit Logs",
    "Service: GitHub Actions",
    "Rule Type: ESQL",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-github.audit-* metadata _id, _index, _version
| where
  data_stream.dataset == "github.audit"
    and event.action in (
      "org.create_actions_secret",
      "repo.create_actions_secret",
      "environment.create_actions_secret",
      "org.create_integration_secret",
      "repo.create_integration_secret"
    )
| keep
    _id,
    _index,
    _version,
    @timestamp,
    event.action,
    user.name,
    github.org,
    github.repo,
    github.actor_ip,
    github.hashed_token,
    github.programmatic_access_type,
    github.user_agent,
    github.name
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.001"
name = "Additional Cloud Credentials"
reference = "https://attack.mitre.org/techniques/T1098/001/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "user.name",
    "github.org",
    "github.repo",
    "github.actor_ip",
    "github.hashed_token",
    "github.programmatic_access_type",
    "github.user_agent",
    "github.name",
]

