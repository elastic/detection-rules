[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/22"

[rule]
author = ["Elastic"]
description = """
Detects bypass of GitHub secret scanning push protection, approval of a bypass request, or disabling push protection at
organization or repository scope. This is separate from turning secret scanning off. Bypass means a detected secret was
allowed into the repository — the pattern used after tj-actions and similar CI secret-dump attacks.
"""
false_positives = [
    """
    Documented test of push protection using a dummy token, or a temporary disable while fixing a noisy pattern.
    Re-enable afterward and confirm no live secret was pushed.
    """,
]
from = "now-9m"
index = ["logs-github.audit-*"]
language = "eql"
license = "Elastic License v2"
name = "GitHub Secret Scanning Push Protection Bypassed or Disabled"
note = """## Triage and analysis

### Investigating GitHub Secret Scanning Push Protection Bypassed or Disabled

`secret_scanning_push_protection.bypass` fires when a user pushes a detected secret anyway. `secret_scanning_push_protection_request.approve` is a reviewer allowing that push. `org.secret_scanning_push_protection_disable` and `repository_secret_scanning_push_protection.disable` turn the control off. `GitHub Secret Scanning Disabled` covers `repository_secret_scanning.disable` only.

Lab telemetry on `gh-lab-org/lab-emu-ghas`: `secret_scanning_push_protection.bypass` from `bry4nsec` at 11:08:46Z (`github.secret_type` stripe_api_key, reason USED_IN_TESTS), then `repository_secret_scanning_push_protection.disable` and re-enable. The dummy file was deleted after harvest. AWS example keys and random `ghp_` strings were not blocked; a synthetic Stripe live key pattern was.

### Possible investigation steps

- Identify `user.name`, `github.repo`, `event.action`, `github.secret_type`, and `github.push_protection_bypass_reason`.
- For bypass: inspect the commit that landed, rotate the secret type reported, and check workflow logs for printed credentials.
- For disable: re-enable push protection and review commits during the window.

### False positive analysis

- Security team testing push protection with a known dummy.
- A noisy custom pattern that maintainers temporarily disable.

### Response and remediation

- Re-enable push protection. Rotate any secret that was bypassed.
- Restrict who can bypass or disable the control.
- Review Actions secrets and PATs created in the same window.
"""
references = [
    "https://github.com/SigmaHQ/sigma/blob/master/rules/application/github/audit/github_push_protection_bypass_detected.yml",
    "https://docs.github.com/en/code-security/secret-scanning/working-with-secret-scanning-and-push-protection/working-with-push-protection-from-the-command-line",
]
risk_score = 47
rule_id = "0b026848-9d06-44ba-8a56-6af27790452d"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Tactic: Credential Access",
    "Data Source: GitHub Audit Logs",
    "Service: GitHub Code Scanning",
    "Rule Type: Event Correlation (EQL)",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
configuration where data_stream.dataset == "github.audit"
  and event.action in (
    "secret_scanning_push_protection.bypass",
    "secret_scanning_push_protection_request.approve",
    "org.secret_scanning_push_protection_disable",
    "org.secret_scanning_push_protection_new_repos_disable",
    "repository_secret_scanning_push_protection.disable"
  )
'''


[[rule.threat]]
