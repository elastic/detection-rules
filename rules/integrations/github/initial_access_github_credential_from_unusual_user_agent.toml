[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/22"

[rule]
author = ["Elastic"]
description = """
Identifies the creation of a GitHub personal access token or the addition of a user SSH public key from a user agent that
has not been seen for that user in the previous 14 days. Minting a new token or adding an SSH key is a common way for an
adversary to establish durable access after an account takeover, and performing it from unfamiliar client software is a
strong signal that the credential is being added by someone other than the legitimate user. The rule tracks new
combinations of `user.name` and `github.user_agent`, so it surfaces first-seen clients without relying on a scraper
denylist. Named credential scanners such as TruffleHog or Nord Stream are covered by a dedicated rule; this rule catches
the broader set of first-seen clients, including generic libraries like python-requests.
"""
false_positives = [
    """
    A developer creating a PAT or adding an SSH key from a new git client, browser, or OS version. Confirm the user
    agent matches an approved client.
    """,
]
from = "now-9m"
index = ["logs-github.audit-*"]
language = "kuery"
license = "Elastic License v2"
name = "GitHub PAT or SSH Key Added from Unusual User Agent"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating GitHub PAT or SSH Key Added from Unusual User Agent

This rule fires when a `personal_access_token.access_granted` or `public_key.create` audit event is observed with a `github.user_agent` that has not been seen for that `user.name` in the previous 14 days. Adding a personal access token or SSH key is how a user, or an adversary who has taken over the account, establishes programmatic or Git access, so a new credential created from an unfamiliar client is a common post-compromise persistence step. Review the user and client (`user.name`, `github.user_agent`), the source address (`github.actor_ip`), and the credential type and privilege (`event.action`, `github.programmatic_access_type`, `github.token_scopes`), and correlate with other activity from the same client to determine whether the legitimate user performed the action. Named credential scanners are handled by a separate rule, so matches here are typically generic clients such as `python-requests`, `curl`, or custom scripts. Note that `public_key.create` may not appear on a non-EMU enterprise audit stream.

### Possible investigation steps

- Confirm with the user whether they created the token or added the SSH key, and whether `github.user_agent` corresponds to a client they use, such as a new git GUI, browser, or OS version.
- Review `event.action` to determine whether a personal access token (`personal_access_token.access_granted`) or an SSH key (`public_key.create`) was added, and inspect `github.programmatic_access_type` and `github.token_scopes` to assess the privilege granted.
- Evaluate the `github.user_agent` string itself; scripting libraries such as `python-requests` or `curl` creating credentials are higher risk than interactive browser or git-client user agents.
- Examine `github.actor_ip` and its ASN to check whether the source is expected for the user and whether it coincides with the new client.
- Correlate the same `user.name` and `github.user_agent` or token with clone, archive download, or `api.request` activity that indicates the new credential is already being used, and review recent authentication activity for signs of account takeover.

### False positive analysis

- A developer legitimately creating a token or adding an SSH key from a replacement laptop, a new git client or GUI, or a browser or OS upgrade. Confirm with the user that the client is approved and that the key or token scopes match policy.
- Automation or onboarding workflows that provision credentials from a new tool or library. Validate against deployment records and scope exceptions to the specific user where appropriate.

### Response and remediation

- If the credential was not created by the legitimate user, revoke the unauthorized personal access token or delete the SSH key immediately. Treat scripting user agents such as `python-requests` or `curl` as higher urgency.
- Reset the user's session and credentials and require re-authentication, prioritizing a password reset and MFA re-enrollment if account takeover is suspected.
- Review all tokens and SSH keys on the account and remove any others that are unexpected or were added from the same client.
- Hunt for actions already taken with the new credential, such as clones, archive downloads, repository or visibility changes, and collaborator additions.
- Engage incident response per your organization's playbooks if account takeover is confirmed.
"""
references = [
    "https://github.blog/news-insights/company-news/security-alert-new-phishing-campaign-targets-github-users/",
    "https://securitylabs.datadoghq.com/articles/mapping-out-your-unknown-threat-hunters-guide-to-github/",
    "https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization",
    "https://docs.github.com/en/authentication/connecting-to-github-with-ssh/adding-a-new-ssh-key-to-your-github-account",
]
risk_score = 47
rule_id = "6396c0c9-3dbc-4e00-a9ea-8d48e58ebffd"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Tactic: Initial Access",
    "Data Source: Github",
    "Data Source: GitHub Audit Logs",
    "Rule Type: New Terms",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:"github.audit" and event.category:"configuration" and github.user_agent:* and user.name:* and
event.action:("personal_access_token.access_granted" or "public_key.create")
'''


