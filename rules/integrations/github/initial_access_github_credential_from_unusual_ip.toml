[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/22"

[rule]
author = ["Elastic"]
description = """
Detects creation of a GitHub personal access token or user SSH public key from an IP address not previously seen for
that user. First-seen IPs are the practical equivalent of "suspicious IP" without a threat-intel list. Adversaries mint
PATs or add SSH keys from attacker infrastructure after account takeover.
"""
false_positives = [
    """
    A developer creating a PAT or adding an SSH key from a new home, travel, or hotspot network. Confirm with the user
    and that the key or token scopes match policy.
    """,
]
from = "now-9m"
index = ["logs-github.audit-*"]
language = "kuery"
license = "Elastic License v2"
name = "GitHub PAT or SSH Key Added from Unusual IP"
note = """## Triage and analysis

### Investigating GitHub PAT or SSH Key Added from Unusual IP

`personal_access_token.access_granted` and `public_key.create` from a first-seen `github.actor_ip` for `user.name` (14-day history). This is not Tor or VPN classification.

`public_key.create` may not appear on a non-EMU enterprise audit stream.

### Possible investigation steps

- Identify `user.name`, `event.action`, `github.actor_ip`, and `github.programmatic_access_type`.
- Correlate with clone, ZIP, collaborator, and OAuth grant activity from the same IP.
- For PAT creates, list scopes and expiration. For SSH keys, delete unexpected keys.

### False positive analysis

- First token or key from a replacement laptop or travel network.

### Response and remediation

- Revoke unauthorized PATs and SSH keys. Force session reset if the IP is not the user's.
"""
references = [
    "https://github.blog/news-insights/company-news/security-alert-new-phishing-campaign-targets-github-users/",
    "https://securitylabs.datadoghq.com/articles/mapping-out-your-unknown-threat-hunters-guide-to-github/",
    "https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization",
    "https://docs.github.com/en/authentication/connecting-to-github-with-ssh/adding-a-new-ssh-key-to-your-github-account",
]
risk_score = 47
rule_id = "a3187f05-07ef-42ae-8af7-8162ff2442e5"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Tactic: Initial Access",
    "Data Source: GitHub Audit Logs",
    "Rule Type: New Terms",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:"github.audit" and event.category:"configuration" and github.actor_ip:* and user.name:* and
event.action:("personal_access_token.access_granted" or "public_key.create")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"
[[rule.threat.technique.subtechnique]]
id = "T1078.004"
name = "Cloud Accounts"
reference = "https://attack.mitre.org/techniques/T1078/004/"



[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1098"
name = "Account Manipulation"
reference = "https://attack.mitre.org/techniques/T1098/"
[[rule.threat.technique.subtechnique]]
id = "T1098.001"
name = "Additional Cloud Credentials"
reference = "https://attack.mitre.org/techniques/T1098/001/"

[[rule.threat.technique.subtechnique]]
id = "T1098.004"
name = "SSH Authorized Keys"
reference = "https://attack.mitre.org/techniques/T1098/004/"



[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "user.name",
    "github.org",
    "github.repo",
    "github.actor_ip",
    "github.hashed_token",
    "github.programmatic_access_type",
    "github.user_agent",
    "github.token_scopes",
]

[rule.new_terms]
field = "new_terms_fields"
value = ["user.name", "github.actor_ip"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-14d"


