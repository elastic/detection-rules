[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/22"

[rule]
author = ["Elastic"]
description = """
Identifies the creation of a GitHub personal access token or the addition of a user SSH public key from an IP address
that has not been seen for that user in the previous 14 days. Minting a new token or adding an SSH key is a common way for
an adversary to establish durable access after an account takeover, and performing it from unfamiliar infrastructure is a
strong signal that the credential is being added by someone other than the legitimate user. The rule tracks new
combinations of `user.name` and `github.actor_ip`, so it surfaces first-seen source addresses without relying on a
threat-intelligence or anonymizer list.
"""
false_positives = [
    """
    A developer creating a PAT or adding an SSH key from a new home, travel, or hotspot network. Confirm with the user
    and that the key or token scopes match policy.
    """,
]
from = "now-9m"
index = ["logs-github.audit-*"]
language = "kuery"
license = "Elastic License v2"
name = "GitHub PAT or SSH Key Added from Unusual IP"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating GitHub PAT or SSH Key Added from Unusual IP

This rule fires when a `personal_access_token.access_granted` or `public_key.create` audit event is observed from a `github.actor_ip` that has not been seen for that `user.name` in the previous 14 days. Adding a personal access token or SSH key is how a user, or an adversary who has taken over the account, establishes programmatic or Git access, so a new credential created from an unfamiliar IP is a common post-compromise persistence step. Review the user and source address (`user.name`, `github.actor_ip`), the credential type and privilege (`event.action`, `github.programmatic_access_type`, `github.token_scopes`), and correlate with other activity from the same IP to determine whether the legitimate user performed the action. Note that `public_key.create` may not appear on a non-EMU enterprise audit stream.

### Possible investigation steps

- Confirm with the user whether they created the token or added the SSH key, and whether `github.actor_ip` corresponds to a new home, travel, or VPN network they are using.
- Review `event.action` to determine whether a personal access token (`personal_access_token.access_granted`) or an SSH key (`public_key.create`) was added, and inspect `github.programmatic_access_type` and `github.token_scopes` to assess the privilege granted.
- Geolocate `github.actor_ip` and review its ASN, checking whether it is consistent with the user's other recent GitHub activity or originates from hosting, VPN, or unexpected geographic infrastructure.
- Correlate the same `user.name` and `github.actor_ip` with clone, archive download, collaborator addition, or OAuth grant events that indicate the new credential is already being used.
- Review the user's recent authentication and audit activity for signs of account takeover, such as sign-ins from the same unusual IP, MFA changes, or recovery-code usage.

### False positive analysis

- A developer legitimately creating a token or adding an SSH key from a replacement laptop, a travel network, or a new home or hotspot connection. Confirm with the user and that the key or token scopes match policy before dismissing.
- Automation or onboarding workflows that provision credentials from a new CI or cloud egress IP. Validate against deployment records and scope exceptions to the specific user where appropriate.

### Response and remediation

- If the credential was not created by the legitimate user, revoke the unauthorized personal access token or delete the SSH key immediately.
- Reset the user's session and credentials and require re-authentication, prioritizing a password reset and MFA re-enrollment if account takeover is suspected.
- Review all tokens and SSH keys on the account and remove any others that are unexpected or were added from the same IP.
- Hunt for actions already taken with the new credential, such as clones, archive downloads, repository or visibility changes, and collaborator additions.
- Engage incident response per your organization's playbooks and, if the IP is confirmed malicious, block or monitor it across the environment.
"""
references = [
    "https://github.blog/news-insights/company-news/security-alert-new-phishing-campaign-targets-github-users/",
    "https://securitylabs.datadoghq.com/articles/mapping-out-your-unknown-threat-hunters-guide-to-github/",
    "https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization",
    "https://docs.github.com/en/authentication/connecting-to-github-with-ssh/adding-a-new-ssh-key-to-your-github-account",
]
risk_score = 47
rule_id = "a3187f05-07ef-42ae-8af7-8162ff2442e5"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Tactic: Initial Access",
    "Data Source: Github",
    "Data Source: GitHub Audit Logs",
    "Rule Type: New Terms",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:"github.audit" and event.category:"configuration" and github.actor_ip:* and user.name:* and
event.action:("personal_access_token.access_granted" or "public_key.create")
'''


