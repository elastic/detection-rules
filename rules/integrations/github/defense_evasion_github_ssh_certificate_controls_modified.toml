[metadata]
creation_date = "2026/11/02"
integration = ["github"]
maturity = "production"
updated_date = "2026/11/02"

[rule]
author = ["Elastic"]
description = """
Detects creation or deletion of a GitHub SSH certificate authority, or disabling the requirement that members use SSH
certificates. Destroying a CA or dropping the requirement lets adversaries authenticate with unmanaged keys.
"""
false_positives = [
    """
    Planned CA rotation. Create the replacement CA before deleting the old one, and do not disable the certificate
    requirement except during a documented outage.
    """,
]
from = "now-9m"
language = "esql"
license = "Elastic License v2"
name = "GitHub SSH Certificate Authority or Requirement Modified"
note = """## Triage and analysis

### Investigating GitHub SSH Certificate Authority or Requirement Modified

A GitHub SSH certificate authority (CA) lets an organization or enterprise issue short-lived SSH certificates and optionally require that members use them instead of personal SSH keys. `ssh_certificate_authority.create` adds a CA, `ssh_certificate_authority.destroy` removes one, and `ssh_certificate_requirement.disable` drops the requirement so ordinary (unmanaged) SSH keys are accepted again. Destroying a CA or disabling the requirement weakens Git access control and can let an adversary authenticate with keys the organization does not manage.

### Possible investigation steps

- Review `user.name`, `event.action`, `github.actor_ip`, and `github.user_agent` to confirm whether an authorized owner made the change from an expected source.
- Determine whether the change matches a documented CA rotation or policy decision; a `create` immediately followed by a `destroy` may be a legitimate rotation.
- Confirm whether a replacement CA exists and whether the certificate requirement is still enabled after the change.
- Review `public_key.create` events after the change to spot unmanaged SSH keys added while the requirement was off.
- Pivot on `github.hashed_token` / `github.programmatic_access_type` to determine whether the change was made via the UI or a token.

### False positive analysis

- Controlled CA rotation performed within an approved change window. Confirm against a change ticket and scope exceptions by actor when expected.

### Response and remediation

- If the change is unauthorized, restore the CA and re-enable the certificate requirement.
- Revoke unexpected or unmanaged SSH keys added while the requirement was disabled.
- Confirm the acting owner account is not compromised and review its other recent administrative actions.
"""
references = [
    "https://docs.github.com/en/organizations/managing-git-access-to-your-organizations-repositories/about-ssh-certificate-authorities",
]
risk_score = 73
rule_id = "f35a0ff1-017e-48b0-b782-5e0bdbcc390a"
severity = "high"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Data Source: Github",
    "Data Source: GitHub Audit Logs",
    "Rule Type: ESQL",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-github.audit-* metadata _id, _index, _version
| where
  event.module == "github" and data_stream.dataset == "github.audit"
    and event.action in (
      "ssh_certificate_authority.create",
      "ssh_certificate_authority.destroy",
      "ssh_certificate_requirement.disable"
    )
| keep
    _id,
    _index,
    _version,
    @timestamp,
    event.action,
    user.name,
    github.org,
    github.repo,
    github.actor_ip,
    github.hashed_token,
    github.programmatic_access_type,
    github.user_agent,
    github.business,
    github.name
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"
[[rule.threat.technique.subtechnique]]
id = "T1562.001"
name = "Disable or Modify Tools"
reference = "https://attack.mitre.org/techniques/T1562/001/"



[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "user.name",
    "github.org",
    "github.repo",
    "github.actor_ip",
    "github.hashed_token",
    "github.programmatic_access_type",
    "github.user_agent",
    "github.business",
    "github.name",
]

