[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/22"

[rule]
author = ["Elastic"]
description = """
Detects git clone, git push, or ZIP download authenticated with a GitHub token from an IP address not previously seen
for that hashed token. This covers classic PATs, fine-grained PATs, and OAuth access tokens. First-seen token IPs are
the practical equivalent of "suspicious IP" or "suspicious VPN" without a threat-intel list.
"""
false_positives = [
    """
    CI, laptops, or travel networks using the same PAT or OAuth token from a new egress IP. Confirm the token owner and
    whether the repositories are expected.
    """,
]
from = "now-9m"
index = ["logs-github.audit-*"]
language = "kuery"
license = "Elastic License v2"
name = "GitHub Token Clone Push or ZIP from Unusual IP"
note = """## Triage and analysis

### Investigating GitHub Token Clone Push or ZIP from Unusual IP

New `github.actor_ip` for a `github.hashed_token` on `git.clone`, `git.push`, or `repo.download_zip` (14-day history). Sibling production rule `Github Activity on a Private Repository from an Unusual IP` is first-seen `source.ip` per private repo on clone/push only.

Classic PATs are included here (`Personal access token`). The unique-repo clone threshold rule is fine-grained and OAuth only.

This is not impossible travel (no geo). It is not Tor classification.

### Possible investigation steps

- Identify `user.name`, `github.hashed_token`, `github.programmatic_access_type`, `github.actor_ip`, and `github.repo`.
- Count distinct private repositories cloned or zipped after the IP first appeared.
- Correlate with `personal_access_token.access_granted` and collaborator adds from the same IP.

### False positive analysis

- Shared automation tokens that rotate cloud egress.
- Developers using a PAT from home and office.

### Response and remediation

- Revoke the token if the IP is not the owner's. Review clones and ZIP downloads in the same window.
"""
references = [
    "https://securitylabs.datadoghq.com/articles/mapping-out-your-unknown-threat-hunters-guide-to-github/",
    "https://github.blog/news-insights/company-news/security-alert-stolen-oauth-user-tokens/",
    "https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization",
    "https://docs.github.com/en/rest/repos/contents#download-a-repository-archive-zip",
]
risk_score = 21
rule_id = "f2ecac9a-7145-4587-95bc-70c1ee0fc7ba"
severity = "low"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Collection",
    "Tactic: Exfiltration",
    "Tactic: Initial Access",
    "Data Source: GitHub Audit Logs",
    "Rule Type: New Terms",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
data_stream.dataset:"github.audit" and event.category:"configuration" and github.actor_ip:* and
github.hashed_token:* and
github.programmatic_access_type:("OAuth access token" or "Fine-grained personal access token" or "Personal access token") and
event.action:("git.clone" or "git.push" or "repo.download_zip")
'''


[[rule.threat]]
