[metadata]
creation_date = "2026/09/22"
integration = ["github"]
maturity = "production"
updated_date = "2026/09/22"

[rule]
author = ["Elastic"]
description = """
Detects GitHub audit activity whose user agent matches credential-scanning or GitHub recon tools such as TruffleHog or
Nord Stream. These clients typically enumerate secrets and repository contents via the API.
"""
false_positives = [
    """
    Authorized secret-scanning jobs that identify as TruffleHog in CI. Restrict exceptions to known automation
    identities and repositories.
    """,
]
from = "now-9m"
index = ["logs-github.audit-*"]
language = "eql"
license = "Elastic License v2"
name = "GitHub Activity from Credential Scanner User Agent"
note = """## Triage and analysis

### Investigating GitHub Activity from Credential Scanner User Agent

TruffleHog and Nord Stream advertise themselves in the User-Agent on GitHub API calls. The matching events are usually `api.request` against secret or contents routes.

### Possible investigation steps

- Capture `github.user_agent`, `github.route`, `user.name`, and `github.hashed_token`.
- Check whether the token is a PAT, OAuth grant, or GitHub App installation token.
- Hunt for `secret_scanning_alert.create` and subsequent clone/ZIP from the same actor.

### False positive analysis

- Internal secret-scanning pipelines that use the upstream TruffleHog user agent.

### Response and remediation

- Revoke the token and rotate any secrets the tool may have listed. Block the user agent at a reverse proxy only as a compensating control.
"""
references = ["https://github.com/trufflesecurity/trufflehog"]
risk_score = 47
rule_id = "76402e4d-c462-4852-aeb9-0266e6ee2890"
severity = "medium"
tags = [
    "Domain: Cloud",
    "Domain: SaaS",
    "Platform: GitHub",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Discovery",
    "Data Source: GitHub Audit Logs",
    "Rule Type: Event Correlation (EQL)",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
configuration where event.module == "github" and data_stream.dataset == "github.audit" and
  (
    github.user_agent like~ "*trufflehog*" or
    github.user_agent like~ "*nord-stream*" or
    github.user_agent like~ "*nordstream*"
  )
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1526"
name = "Cloud Service Discovery"
reference = "https://attack.mitre.org/techniques/T1526/"


[rule.threat.tactic]
id = "TA0007"
name = "Discovery"
reference = "https://attack.mitre.org/tactics/TA0007/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.001"
name = "Credentials In Files"
reference = "https://attack.mitre.org/techniques/T1552/001/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "event.action",
    "user.name",
    "github.org",
    "github.repo",
    "github.actor_ip",
    "github.hashed_token",
    "github.programmatic_access_type",
    "github.user_agent",
]

