[metadata]
creation_date = "2026/09/30"
integration = ["vsphere"]
maturity = "production"
updated_date = "2026/10/29"

[rule]
author = ["Elastic"]
description = """
Detects commands that reset an ESXi remote syslog destination or set it to zero. These changes can interrupt log
forwarding and reduce visibility into subsequent activity on the host.
"""
false_positives = [
    """
    An administrator can reset the loghost while moving the host to a new collector. Confirm that a new `--loghost`
    value was set in the same change and that logs are arriving at the collector.
    """,
]
from = "now-9m"
index = ["logs-vsphere.log-*"]
language = "kuery"
license = "Elastic License v2"
name = "ESXi Syslog Remote Host Reset"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating ESXi Syslog Remote Host Reset

Resetting loghost or setting --loghost=0 can interrupt forwarding to a remote collector. The command is an attempted configuration change; confirm the resulting configuration and whether forwarding stopped.

#### Possible investigation steps

- Review message for the syslog configuration command and identify the account and originating SSH session.
- Review esxcli system syslog config get output or the current configuration. Check for an empty destination or udp://0 and compare it with the approved collector.
- Verify whether syslog was reloaded and whether the remote collector continued receiving events.
- Correlate the session with firewall changes, SSH configuration changes, VM shutdowns, and snapshot removal.

### False positive analysis

Administrators may reset or temporarily change loghost during collector migration or troubleshooting. Confirm the approved change, a valid replacement destination, and resumed forwarding.

### Response and remediation

- Restore the approved collector destination and reload syslog using the organization's change process.
- Preserve local shell.log, hostd.log, and auth.log before rotation, and compare them with collector records to establish any logging gap.
- If the change was unauthorized, investigate the account and session and restrict access according to the incident response plan.
"""
references = [
    "https://lolesxi-project.github.io/LOLESXi/#",
    "https://blogs.vmware.com/security/2022/10/esxi-targeting-ransomware-tactics-and-techniques-part-2.html",
    "https://detect.fyi/vmware-esxi-logging-detection-opportunities-4fb56411ec21",
]
risk_score = 73
rule_id = "9bd3bba8-e4c3-5670-9553-4d91e19ec328"
setup = """## Setup

This rule requires ESXi host logs collected by the Elastic vSphere integration: https://www.elastic.co/docs/reference/integrations/vsphere
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "Data Source: VMware vSphere",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Resources: Investigation Guide",
    "Rule Type: Custom Query (KQL)",
    "Platform: VMware ESXi",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset:"vsphere.log" and message:("syslog config set" and ("--reset loghost" or "--reset=loghost" or "reset=loghost" or "--loghost=0"))
'''


