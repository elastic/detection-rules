[metadata]
creation_date = "2026/09/30"
integration = ["vsphere"]
maturity = "production"
updated_date = "2026/10/29"

[rule]
author = ["Elastic"]
description = """
Detects enumeration of running ESXi virtual machines through esxcli vm process list or its native API operation. The
results include VM world IDs that can be used by subsequent commands to terminate virtual machines.
"""
false_positives = [
    """
    Administrators list virtual machines during maintenance and troubleshooting. Review whether the same session then
    kills those processes or searches the datastore.
    """,
]
from = "now-9m"
index = ["logs-vsphere.log-*"]
language = "kuery"
license = "Elastic License v2"
name = "ESXi Virtual Machine Process List"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating ESXi Virtual Machine Process List

The esxcli vm process list command enumerates running VMs and their world IDs. Native envoy-access records can expose the corresponding VimEsxCLIvmprocesslist operation when a long SSH command is truncated in the shell log.

#### Possible investigation steps

- Review the command or API-operation record and correlate it with the originating SSH or administrative session.
- Check the same session for vm process kill, pkill, power.off, snapshot removal, or datastore searches.
- Confirm with the virtualization owner whether the enumeration was part of authorized maintenance or inventory.

### False positive analysis

Routine management tools and administrators enumerate VMs. This low-severity discovery signal needs surrounding context; the API-operation alternative can also match legitimate management activity.

### Response and remediation

- If enumeration is followed by unauthorized VM shutdowns or snapshot deletion, preserve the session evidence and follow the virtualization incident response plan.
- For an approved inventory workflow, record the source and purpose. Apply only narrowly scoped exceptions supported by that context.
"""
references = [
    "https://lolesxi-project.github.io/LOLESXi/#",
    "https://blogs.vmware.com/security/2022/10/esxi-targeting-ransomware-tactics-and-techniques-part-2.html",
    "https://detect.fyi/vmware-esxi-logging-detection-opportunities-4fb56411ec21",
]
risk_score = 21
rule_id = "a7f969e5-6cfd-5b5f-8df4-3c4317a3cf7e"
setup = """## Setup

This rule requires ESXi host logs collected by the Elastic vSphere integration: https://www.elastic.co/docs/reference/integrations/vsphere
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "Data Source: VMware vSphere",
    "Use Case: Threat Detection",
    "Tactic: Discovery",
    "Resources: Investigation Guide",
    "Rule Type: Custom Query (KQL)",
    "Platform: VMware ESXi",
    "Threat: Ransomware",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
data_stream.dataset:"vsphere.log" and event.module:"vsphere" and (message:("esxcli" and "vm process list") or (process.name:"envoy-access" and message:"VimEsxCLIvmprocesslist"))
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1057"
name = "Process Discovery"
reference = "https://attack.mitre.org/techniques/T1057/"


[rule.threat.tactic]
id = "TA0007"
name = "Discovery"
reference = "https://attack.mitre.org/tactics/TA0007/"

[rule.investigation_fields]
field_names = ["@timestamp", "message", "event.original", "host.hostname", "log.file.path"]
