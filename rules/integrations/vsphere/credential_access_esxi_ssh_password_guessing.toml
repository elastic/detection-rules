[metadata]
creation_date = "2026/10/29"
integration = ["vsphere"]
maturity = "production"
updated_date = "2026/10/29"

[rule]
author = ["Elastic"]
description = """
Detects SSH authentication failures from at least three distinct sshd processes for the same ESXi host, account, and
source address within the rule's 10-minute lookback. Repeated failures may indicate password guessing and can cause
account lockout.
"""
false_positives = [
    """
    Mistyped administrator passwords and automation with stale credentials can produce repeated SSH failures. Confirm
    the source, targeted account, and approved workflow before responding.
    """,
]
from = "now-10m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "ESXi Repeated SSH Authentication Failures"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating ESXi Repeated SSH Authentication Failures

The query counts distinct SSH daemon processes emitting the canonical pam_unix authentication-failure message. Mirrored hostd and vobd notices are excluded. This is a count of failed SSH processes, not every password prompt or lockout-counter increment.

#### Possible investigation steps

- Review host.name, user.name, source.ip, Esql.failure_count, Esql.first_seen, and Esql.last_seen.
- Locate the matching sshd or sshd-session messages in the alert interval and confirm that the host identity belongs to ESXi rather than the syslog collector.
- Compare the source with approved jump hosts and management automation. Check for account-lockout events and subsequent successful SSH authentication.
- Correlate successful access with VM shutdowns, snapshot deletion, logging changes, or unexpected VIB installation.

### False positive analysis

An administrator mistyping a password or a scheduled job using stale credentials can reach the threshold. Confirm the workflow with its owner and correct the credentials. Keep any exception scoped to the verified host, account, source, and purpose.

### Response and remediation

- If the activity is unauthorized, restrict the source's management access and investigate the targeted account.
- Preserve authentication logs and assess whether successful access followed the failures before rotating credentials or unlocking the account.
- Coordinate access changes with the virtualization owner to preserve an approved recovery path.
"""
references = [
    "https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1110.001/T1110.001.yaml",
]
risk_score = 47
rule_id = "054b45db-7e0d-5710-a16c-30656d46e3bc"
setup = """## Setup

Collect ESXi host syslog with the Elastic vSphere integration: https://www.elastic.co/docs/reference/integrations/vsphere

The query requires process.pid, process.name, the native authentication message, and host.name identifying the originating ESXi host. Configure unique ESXi hostnames and verify that host.name is parsed from the source syslog. Do not substitute the collector's host.id or host.ip. Keep the 10-minute lookback bounded; multiple failed attempts within one sshd process count once.
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "Data Source: VMware vSphere",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Platform: VMware ESXi",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-vsphere.log-*
| WHERE data_stream.dataset == "vsphere.log" AND event.module == "vsphere"
  AND process.name IN ("sshd", "sshd-session")
  AND STARTS_WITH(message, "pam_unix(sshd:auth): authentication failure;")
| GROK message "%{GREEDYDATA}rhost=%{IP:source_ip}%{SPACE}user=%{NOTSPACE:target_user}"
| WHERE source_ip IS NOT NULL AND target_user IS NOT NULL AND host.name IS NOT NULL
| EVAL user.name = target_user, source.ip = TO_IP(source_ip)
| STATS Esql.failure_count = COUNT_DISTINCT(process.pid), Esql.first_seen = MIN(@timestamp), Esql.last_seen = MAX(@timestamp) BY host.name, user.name, source.ip
| WHERE Esql.failure_count >= 3
| KEEP host.name, user.name, source.ip, Esql.failure_count, Esql.first_seen, Esql.last_seen
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1110"
name = "Brute Force"
reference = "https://attack.mitre.org/techniques/T1110/"
[[rule.threat.technique.subtechnique]]
id = "T1110.001"
name = "Password Guessing"
reference = "https://attack.mitre.org/techniques/T1110/001/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.investigation_fields]
field_names = ["host.name", "user.name", "source.ip", "Esql.failure_count", "Esql.first_seen", "Esql.last_seen"]
