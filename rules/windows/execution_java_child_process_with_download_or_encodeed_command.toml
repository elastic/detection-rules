[metadata]
creation_date = "2026/11/24"
integration = ["endpoint", "windows", "system", "m365_defender", "sentinel_one_cloud_funnel", "crowdstrike"]
maturity = "production"
updated_date = "2026/11/24"

[rule]
author = ["Elastic", "Saiprashanth Pulisetti"]
description = """
Identifies a Java process directly launching a Windows shell or a living-off-the-land utility whose command line
contains payload-retrieval, encoded-execution or discovery characteristics. Exploitation of Java applications and
services (for example deserialization, expression-injection or JVM vulnerabilities such as CVE-2026-114938) commonly
results in the JVM spawning a shell to download and run a second-stage payload.
"""
from = "now-9m"
index = [
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-endpoint.events.process-*",
    "logs-m365_defender.event-*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-system.security*",
    "logs-windows.forwarded*",
    "logs-windows.sysmon_operational-*",
    "winlogbeat-*",
]
language = "eql"
license = "Elastic License v2"
name = "Java Child Process with Download or Encoded Command"
note = """## Triage and analysis

### Investigating Java Child Process with Download or Encoded Command

Many Java applications legitimately launch operating-system commands, so a Java process starting `cmd.exe` or
PowerShell is not suspicious by itself. This rule requires a second signal: the child's command line must contain a
URL, download cradle, encoded or dynamically evaluated PowerShell, a LOLBin download switch, or user discovery. That
combination is typical of remote code execution against a Java service followed by payload staging.

### Possible investigation steps

- Identify the Java application from `process.parent.executable` and `process.parent.command_line` (look for `-jar`
  arguments, application directories and JVM properties) and determine its owner and whether it is internet-facing.
- Record the exact Java runtime version and patch level of the parent.
- Review the full child `process.command_line`. Decode any Base64 or encoded PowerShell and extract URLs, IPs and
  file paths.
- Correlate with network events from the Java process around the alert time, especially inbound connections from
  public IP addresses followed by outbound connections to new destinations.
- Search the host for follow-on activity: files written to user-writable or temporary paths, new executables run,
  persistence (services, scheduled tasks, Run keys) and credential access.
- Check whether the same parent/child/command-line combination occurs on other hosts, which may indicate expected
  application behavior or a broader campaign.

### False positive analysis

- Java-based monitoring agents, schedulers, build servers and application launchers may run PowerShell or `cmd.exe`
  with URLs (for example health checks or update checks). Exclude them by the exact combination of
  `process.parent.executable` and a specific `process.command_line` pattern, never by excluding all shells.
- Developer workstations running build tools (Gradle, Maven) or IDEs may download dependencies through child
  processes. Consider scoping exceptions to those hosts and tools.

### Response and remediation

- Isolate the host if the command line retrieves or executes a payload that is not part of the application's documented
  behavior.
- Terminate the child process tree and preserve the Java application's logs, which may contain the exploitation request.
- Block the identified URLs, domains and IPs, and remove any downloaded or created files.
- Patch the Java runtime and the vulnerable application, then review the service account for misuse and rotate its
  credentials.
"""
risk_score = 73
rule_id = "2c0e1279-d27e-4d8f-940a-e8002b1f1534"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which
provides native endpoint detection and response along with event enrichments designed to work with our detection rules.

Additionally, it can be used with process start events from the following data sources:
- Sysmon (Event ID 1) collected through the Windows integration
- Windows Security Event Logs with process command-line auditing (Event ID 4688)
- Microsoft Defender XDR, SentinelOne Cloud Funnel and CrowdStrike FDR
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Execution",
    "Tactic: Initial Access",
    "Tactic: Command and Control",
    "Data Source: Elastic Endgame",
    "Data Source: Elastic Defend",
    "Data Source: Windows Security Event Logs",
    "Data Source: Microsoft Defender XDR",
    "Data Source: Sysmon",
    "Data Source: SentinelOne",
    "Data Source: Crowdstrike",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Windows",
]
timestamp_override = "event.ingested"
type = "eql"
query = '''
process where host.os.type == "windows" and event.type == "start" and
  process.parent.name : ("java.exe", "javaw.exe") and
  process.name : (
    "cmd.exe", "powershell.exe", "pwsh.exe", "certutil.exe", "bitsadmin.exe", "curl.exe",
    "mshta.exe", "rundll32.exe", "regsvr32.exe", "wscript.exe", "cscript.exe"
  ) and
  process.command_line : (
    "*http://*", "*https://*", "* -enc*", "* -ec *", "*EncodedCommand*", "*FromBase64String*",
    "*Invoke-Expression*", "*IEX(*", "*IEX (*", "*Invoke-WebRequest*", "*iwr *", "*DownloadString*",
    "*DownloadFile*", "*Net.WebClient*", "*-urlcache*", "*/transfer*", "*whoami*"
  )
'''

