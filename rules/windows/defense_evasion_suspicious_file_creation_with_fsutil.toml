[metadata]
creation_date = "2026/10/03"
integration = ["endpoint", "windows", "system", "m365_defender", "sentinel_one_cloud_funnel", "crowdstrike"]
maturity = "production"
updated_date = "2026/10/03"

[rule]
author = ["DevCop95", "Elastic"]
description = """
Identifies use of the fsutil.exe utility to create a new file on disk. Attackers may abuse this utility to pre-allocate
large files to exhaust available disk space. This technique causes file system starvation, which can impair endpoint
security software by preventing antivirus signature updates, blocking logging mechanisms, or causing system instability.
"""
from = "now-9m"
index = [
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-endpoint.events.process-*",
    "logs-m365_defender.event-*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-system.security*",
    "logs-windows.forwarded*",
    "logs-windows.sysmon_operational-*",
    "winlogbeat-*",
]
language = "eql"
license = "Elastic License v2"
name = "Suspicious File Creation with Fsutil"
note = """## Triage and analysis

### Investigating Suspicious File Creation with Fsutil

The `fsutil.exe` utility is a legitimate Windows built-in administrative command used to manage volume and file system properties. The `file createnew` subcommand allows users to quickly allocate a file of a specified byte length.

Adversaries may weaponize this command (as documented in LOLBAS) to rapidly fill storage volumes until `ERROR_DISK_FULL` is triggered. This can disrupt endpoint protection platforms (EPP/EDR) by blocking antivirus definition downloads, stalling software updates, or crashing monitoring agents that require local spooling space.

#### Possible investigation steps

- Investigate the process execution chain (parent process tree) to identify how `fsutil.exe` was invoked (e.g., cmd.exe, powershell.exe, batch script, or unknown dropper binary).
- Inspect the destination file path and the requested file size (argument in bytes) passed to `createnew`.
- Check if the target partition or volume has experienced sudden free disk space exhaustion.
- Identify the user account that performed the action and whether it should perform this kind of action.
- Review recent security product logs (e.g., Windows Defender Event ID 2000, 2001, 1151 or Elastic Defend status) for update failures or resource exhaustion warnings.
- Investigate other alerts associated with the host within the past 48 hours for signs of defense evasion or ransomware pre-execution staging.

### False positive analysis

- Legitimate storage testing, disk benchmark tools, or administrative scripts creating dummy files for capacity verification. Such exceptions can be filtered out by command-line path or user account.

### Response and remediation

- Initiate the incident response process based on the outcome of the triage.
- Isolate the involved host immediately if suspicious activity or concurrent defense evasion behavior is confirmed.
- Terminate the parent process chain responsible for launching repeated disk exhaustion commands.
- Locate and remove the inflated dummy files to restore normal system operations and permit EDR/antivirus definitions to update.
- Conduct a full system scan and inspect persistence mechanisms or secondary payloads dropped alongside this activity.
"""
references = [
    "https://attack.mitre.org/techniques/T1562/001/",
    "https://lolbas-project.github.io/lolbas/Binaries/Fsutil/",
]
risk_score = 47
rule_id = "4e6e7708-91c4-4638-832a-143ba11c780d"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend

### Additional data sources

This rule also supports the following third-party data sources. For setup instructions, refer to the links below:

- [CrowdStrike](https://ela.st/crowdstrike-integration)
- [Microsoft Defender XDR](https://ela.st/m365-defender)
- [SentinelOne Cloud Funnel](https://ela.st/sentinel-one-cloud-funnel)
- [Sysmon Event ID 1 - Process Creation](https://ela.st/sysmon-event-1-setup)
- [Windows Process Creation Logs](https://ela.st/audit-process-creation)
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Data Source: Elastic Endgame",
    "Resources: Investigation Guide",
    "Data Source: Elastic Defend",
    "Data Source: Windows Security Event Logs",
    "Data Source: Microsoft Defender XDR",
    "Data Source: Sysmon",
    "Data Source: SentinelOne",
    "Data Source: Crowdstrike",
    "Noise: Low",
    "Performance: Normal",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Windows",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "windows" and event.type == "start" and
  (process.name : "fsutil.exe" or ?process.pe.original_file_name == "fsutil.exe") and
  process.args : "file" and process.args : "createnew"
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"
[[rule.threat.technique.subtechnique]]
id = "T1562.001"
name = "Disable or Modify Tools"
reference = "https://attack.mitre.org/techniques/T1562/001/"



[rule.threat.tactic]
