[metadata]
creation_date = "2023/08/29"
integration = ["endpoint", "m365_defender", "sentinel_one_cloud_funnel", "windows", "crowdstrike"]
maturity = "production"
updated_date = "2026/10/08"

[rule]
author = ["Elastic"]
description = """
Identifies registration of a Windows Error Reporting ReflectDebugger or a Hangs Debugger target. Attackers may abuse
these error-handling settings to arrange execution of a payload. A registry change alone does not establish that the
configured target was executed.
"""
from = "now-9m"
index = [
    "logs-endpoint.events.registry-*",
    "endgame-*",
    "logs-m365_defender.event-*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-windows.sysmon_operational-*",
    "logs-crowdstrike.fdr*",
]
language = "eql"
license = "Elastic License v2"
name = "Windows Error Reporting Debugger Registration"
note = """## Triage and analysis

### Investigating Windows Error Reporting Debugger Registration

This rule detects a ReflectDebugger registry value or the specific Windows Error Reporting Hangs\\Debugger value. The two registrations have different triggers; do not treat a Debugger write as evidence of a ReflectDebugger invocation.

### Possible investigation steps

- Confirm the exact value path, data and initiating process. ReflectDebugger is matched by value name to preserve existing data-source support; the common Debugger name is constrained to the Hangs path.
- Identify whether the target is an approved debugging tool. Review its signature, file location, prevalence and process ancestry.
- For ReflectDebugger, investigate relevant WerFault invocations, including the -pr parameter. For Hangs\\Debugger, investigate application-hang handling and execution of the configured target.
- Correlate the registration with subsequent process activity on the same host. Registration alone does not prove successful execution or persistence.
- Review change authorization and surrounding alerts before deciding whether the event is malicious.

### False positive analysis

Approved developer debugging, application support and crash or hang diagnostics can configure these values. Validate the target and change authorization before adding a narrow exception. Do not exclude every signed writer or all administrator activity.

### Response and remediation

Preserve registry and process evidence. If the change is unauthorized, remove the configured target through the incident response process and investigate its origin and any resulting execution. Apply containment when corroborating evidence warrants it.
"""
references = [
    "https://cocomelonc.github.io/malware/2022/11/02/malware-pers-18.html",
    "https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1546/T1546.yaml",
]
risk_score = 21
rule_id = "205b52c4-9c28-4af4-8979-935f3278d61a"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend

### Additional data sources

This rule also supports the following third-party data sources. For setup instructions, refer to the links below:

- [CrowdStrike](https://ela.st/crowdstrike-integration)
- [Microsoft Defender XDR](https://ela.st/m365-defender)
- [SentinelOne Cloud Funnel](https://ela.st/sentinel-one-cloud-funnel)
- [Sysmon Registry Events](https://ela.st/sysmon-event-reg-setup)
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Data Source: Elastic Endgame",
    "Data Source: Elastic Defend",
    "Data Source: Microsoft Defender XDR",
    "Data Source: SentinelOne",
    "Data Source: Sysmon",
    "Data Source: Crowdstrike",
    "Resources: Investigation Guide",
    "Noise: Medium",
    "Performance: Normal",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Windows",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
registry where host.os.type == "windows" and event.type == "change" and
  (registry.value : "ReflectDebugger" or
   registry.path : ("HKLM\\Software\\Microsoft\\Windows\\Windows Error Reporting\\Hangs\\Debugger",
                    "\\REGISTRY\\MACHINE\\Software\\Microsoft\\Windows\\Windows Error Reporting\\Hangs\\Debugger",
                    "MACHINE\\Software\\Microsoft\\Windows\\Windows Error Reporting\\Hangs\\Debugger"))

  /*
    Full registry key path omitted due to data source variations:
    HKLM\\Software\\Microsoft\\Windows\\Windows Error Reporting\\Hangs\\ReflectDebugger
  */
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1546"
name = "Event Triggered Execution"
reference = "https://attack.mitre.org/techniques/T1546/"


[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"


[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
