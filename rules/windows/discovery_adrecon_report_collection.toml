[metadata]
creation_date = "2026/10/09"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/10/09"

[rule]
author = ["Elastic"]
description = """
Identifies a PowerShell process creating a user, computer SPN, or summary CSV report under the default ADRecon output
directory. This indicates directory reconnaissance and does not establish malicious intent; authorized inventory and
security audits can generate this behavior.
"""
false_positives = ["Authorized Active Directory inventory, security assessments, and audits using ADRecon."]
from = "now-9m"
index = ["logs-endpoint.events.file-*"]
interval = "5m"
language = "eql"
license = "Elastic License v2"
name = "ADRecon Directory Report Collection"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating ADRecon Directory Report Collection

- Review the PowerShell process, its parent, command line, user and executable provenance. Correlate any related reports by process.entity_id and report directory when available; a single matching file is sufficient for this detection.
- Check available PowerShell script-block logs and related network activity for ADRecon execution and directory queries. A matching report path alone does not establish the report contents or successful collection of every directory object.
- Confirm whether the user and host were authorized to perform directory inventory or a security assessment. Review subsequent activity for unexpected access to the collected reports or additional discovery.

### False positive analysis

Authorized ADRecon inventory, audits and penetration tests create the same reports. One run can produce multiple matching file events. Confirm the approved scope and timing before taking response actions. Use narrowly scoped exceptions for a verified workflow if needed; do not exclude PowerShell or an entire user-writable directory.

### Response and remediation

If the activity is unauthorized, preserve the script, process tree and generated reports and investigate the account's access and related host activity. Follow the organization's incident response process before isolating a host or restricting an account.
"""
references = ["https://github.com/adrecon/ADRecon"]
risk_score = 21
rule_id = "391a01ba-8a8e-4619-a574-29d7ff707684"
setup = "Requires Elastic Defend file-creation events with process.name and file.path. A single matching report event is sufficient; no file order or process.entity_id join is required."
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Discovery",
    "Data Source: Elastic Defend",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Windows",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
file where host.os.type == "windows" and event.type == "creation" and
  process.name : ("powershell.exe", "pwsh.exe") and
  file.path : ("*\\ADRecon-Report-*\\CSV-Files\\Users.csv",
               "*\\ADRecon-Report-*\\CSV-Files\\ComputerSPNs.csv",
               "*\\ADRecon-Report-*\\CSV-Files\\AboutADRecon.csv")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1087"
name = "Account Discovery"
reference = "https://attack.mitre.org/techniques/T1087/"
[[rule.threat.technique.subtechnique]]
id = "T1087.002"
name = "Domain Account"
reference = "https://attack.mitre.org/techniques/T1087/002/"



[rule.threat.tactic]
id = "TA0007"
name = "Discovery"
reference = "https://attack.mitre.org/tactics/TA0007/"
