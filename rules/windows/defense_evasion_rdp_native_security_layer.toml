[metadata]
creation_date = "2026/10/07"
integration = ["endpoint"]
maturity = "development"
updated_date = "2026/10/21"

[rule]
author = ["Elastic"]
description = """
Identifies registry changes that configure an RDP listener to use native RDP security.
"""
false_positives = [
    """
    Approved administration or configuration management; review the initiating process and the exact changed object.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.registry-*"]
interval = "5m"
language = "eql"
license = "Elastic License v2"
name = "RDP Listener Configured to Use Native RDP Security"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating RDP Listener Configured to Use Native RDP Security

Identify the RDP listener, initiating process, and account responsible for setting SecurityLayer to zero, which selects native RDP security. Verify the effective listener configuration and review authentication and session evidence to determine whether it was used. Check UserAuthentication separately when assessing Network Level Authentication (NLA).

### False positive analysis

Approved compatibility changes and troubleshooting can select native RDP security. Confirm the listener and process ancestry against change records. Scope exceptions to the specific management process and expected listener configuration.

### Response and remediation

Preserve the registry events and related session evidence. Restore unauthorized listener settings to the approved baseline and verify the effective configuration. Investigate unexpected remote sessions or account activity through the incident response process.
"""
references = [
    "https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1112/T1112.yaml",
]
risk_score = 47
rule_id = "938f2e84-8a2f-5227-8502-e30317add277"
setup = """## Setup

Collect the event category and fields used by this rule with Elastic Defend. Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Tactic: Defense Evasion",
    "Data Source: Elastic Defend",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Platform: Windows",
    "Rule Type: Event Correlation (EQL)",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
registry where host.os.type == "windows" and event.type == "change" and
  registry.path : "HKLM\\SYSTEM\\ControlSet*\\Control\\Terminal Server\\WinStations\\*\\SecurityLayer" and
  registry.data.strings : ("0", "0x00000000")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"


[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
