[metadata]
creation_date = "2026/07/31"
integration = ["system", "windows"]
maturity = "production"
updated_date = "2026/07/31"

[rule]
author = ["Elastic"]
description = """
Identifies Active Directory Certificate Services (AD CS) certificate issuance (Event 4887) that includes enrollment
chase attributes (`cdc` / `rmd`), followed within a short window by a successful Kerberos TGT request (Event 4768)
using certificate / PKINIT pre-authentication. That sequence is aimed at AD CS abuse follow-on (including Certighost
when issuance succeeds): a chase-influenced cert is issued and quickly used for authentication. Routine Domain
Controller template issuances and non-TGT / failed Kerberos events are excluded to reduce noise and sequence cost.
"""
false_positives = [
  """
  Rare legitimate chase-based issuance immediately followed by certificate logon can still match. Exception by known CA
  hosts, enrollment service accounts, and expected PKINIT principals after baselining. Escalate when SAN/DNS disagrees
  with the requester, when `cdc` is an IP or non-DC host, or when the authenticated principal is tier-0.
  """,
]
from = "now-9m"
index = ["logs-system.security*", "logs-windows.forwarded*", "winlogbeat-*"]
language = "eql"
license = "Elastic License v2"
name = "AD CS Certificate Issued Followed by Kerberos PKINIT Authentication"
references = [
  "https://gist.github.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26",
  "https://github.com/aniqfakhrul/CVE-2026-54121",
  "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121",
  "https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768",
  "https://learn.microsoft.com/en-us/archive/blogs/nextnextfinish/was-a-smart-card-used-for-logon",
]
risk_score = 73
rule_id = "6edd1757-3238-4adf-b101-bac17fdef759"
setup = """## Setup

Enable AD CS request/issuance auditing on Enterprise CA hosts:

```
certutil -setreg CA\\AuditFilter 127
Restart-Service CertSvc -Force
```

Also enable the Certification Services audit subcategory and Kerberos Authentication Service success auditing on domain
controllers so Events 4887 and 4768 are collected. Ship both CA and DC Security logs with the Elastic System/Windows
integrations (or Winlogbeat).

Note: Event 4887 is logged on the CA; Event 4768 is logged on the KDC. This sequence does not require both roles on the
same host.
"""
severity = "high"
tags = [
  "Domain: Endpoint",
  "OS: Windows",
  "Use Case: Threat Detection",
  "Tactic: Credential Access",
  "Tactic: Privilege Escalation",
  "Use Case: Active Directory Monitoring",
  "Data Source: Active Directory",
  "Use Case: Vulnerability",
  "Data Source: Windows Security Event Logs",
  "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence with maxspan=3m
  /* Chase-influenced issuance only — avoids pairing every smart-card enroll with later PKINIT */
  [any where host.os.type == "windows" and event.code == "4887" and
    winlog.event_data.Attributes : ("*cdc:*", "*rmd:*") and
    not winlog.event_data.CertificateTemplate : (
      "DomainController",
      "DomainControllerAuthentication",
      "KerberosAuthentication"
    ) and
    not winlog.event_data.Attributes : (
      "*CertificateTemplate:DomainController*",
      "*CertificateTemplate:DomainControllerAuthentication*",
      "*CertificateTemplate:KerberosAuthentication*"
    )]
  /* Successful certificate/smart-card TGT (MS PreAuthType 15/16) */
  [any where host.os.type == "windows" and event.code == "4768" and
    winlog.event_data.PreAuthType in ("15", "16") and
    winlog.event_data.ServiceName : "krbtgt*" and
    winlog.event_data.Status : ("0x0", "0x00") and
    winlog.event_data.TargetUserName != null and
    not winlog.event_data.TargetUserName : (
      "-",
      "ANONYMOUS LOGON",
      "HealthMailbox*",
      "SM_*",
      "MSOL_*"
    )]
'''

note = """## Triage and analysis

### Investigating AD CS Certificate Issued Followed by Kerberos PKINIT Authentication

Event 4887 with chase attributes means the CA issued a certificate on a chase-influenced enrollment path. A following
4768 with PreAuthType 15 or 16 means certificate-style pre-authentication obtained a TGT within three minutes. That is
the abuse → use handoff for Certighost (when issuance succeeds) and related AD CS chains.

#### Possible investigation steps

- What was issued, and to whom?
  - Focus: 4887 `winlog.event_data.Requester`, `winlog.event_data.CertificateTemplate`,
    `winlog.event_data.SubjectAlternativeName`, and `winlog.event_data.Attributes` (`cdc:`, `rmd:`, `SAN:dns=`).
  - Implication: escalate when SAN/DNS disagrees with the requester, when `cdc` is an IP/non-DC host, or when a
    low-priv principal enrolled a Machine/privileged identity.

- Which principal authenticated with the cert?
  - Focus: 4768 `winlog.event_data.TargetUserName`, `winlog.event_data.IpAddress`, and certificate fields when present
    (`CertIssuerName`, `CertSerialNumber`, `CertThumbprint`).
  - Implication: domain-compromise urgency for domain controller / privileged account TGTs from unexpected client IPs.

- Correlate with companion chase / network alerts
  - Focus: the chase-attribute rule, `certsrv.exe` first-seen directory egress, and the ES|QL SAN→`HOST$` hunt.
  - Implication: high confidence when issuance chase target and Kerberos client identity/IP align.

### False positive analysis

- Remaining FPs are uncommon chase+immediate-cert-logon workflows. Exception by CA host, template, and requester after
  change control — do not broadly except PreAuthType 15/16.

### Response and remediation

- If suspicious: revoke the issued certificate, disable/reset impacted accounts, hunt DCSync / lateral movement after
  the TGT, and ensure July 2026 Certighost patches on Enterprise CAs.
"""

