[metadata]
creation_date = "2026/10/07"
integration = ["endpoint"]
maturity = "development"
updated_date = "2026/10/08"

[rule]
author = ["Elastic"]
description = """
Identifies registry writes mapping HTTP or HTTPS protocol defaults to security zone zero. Detects the configuration
write; actual URL zone resolution must be checked separately.
"""
false_positives = [
    """
    Approved administration or configuration management; review the initiating process and the exact changed object.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.registry-*"]
interval = "5m"
language = "eql"
license = "Elastic License v2"
name = "HTTP or HTTPS Default Zone Set to Local Machine"
note = """## Triage and analysis

### Investigating HTTP or HTTPS Default Zone Set to Local Machine

ProtocolDefaults chooses a default security zone; zero denotes My Computer. Constrain the proposal to these two protocol values instead of any Internet Settings change.

The captured user hive was .DEFAULT under SYSTEM. No interactive-user browser or MapUrlToZone result was tested. Machine policy, other zone mappings and local-machine lockdown affect effective behavior. This is not a claim that browser protections were bypassed.

Validate change authorization, process ancestry and related activity before escalating.

### False positive analysis

Approved administration, software installation, troubleshooting and configuration management can produce this activity. Verify the exact target, initiating identity, process ancestry and change authorization. Assess representative operational volume before enabling the rule; do not use the lab baseline as a production noise estimate.

### Response and remediation

Preserve the relevant events and confirm whether the setting or identity was used. Restore unauthorized changes through the established response process. Escalate based on the surrounding evidence and observed impact; the matching configuration or script content alone does not establish compromise.
"""
references = [
    "https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1112/T1112.yaml",
]
risk_score = 47
rule_id = "21ac594d-fb0d-5677-9526-8a7866277451"
setup = """## Setup

Collect the event category and fields used by this rule with Elastic Defend. Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Tactic: Defense Evasion",
    "Data Source: Elastic Defend",
    "Use Case: Threat Detection",
    "Resources: Investigation Guide",
    "Noise: Medium",
    "Performance: Normal",
    "Platform: Windows",
    "Rule Type: Event Correlation (EQL)",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
registry where host.os.type == "windows" and event.type == "change" and
  registry.path : ("HKEY_USERS\\*\\Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\ProtocolDefaults\\http",
                   "HKEY_USERS\\*\\Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\ProtocolDefaults\\https",
                   "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\ProtocolDefaults\\http",
                   "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\ProtocolDefaults\\https") and
  registry.data.strings : ("0", "0x00000000")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"


[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
