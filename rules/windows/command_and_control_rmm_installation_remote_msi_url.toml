[rule]
author = ["Elastic"]
description = """
Identifies a Windows Installer install from a remote MSI URL, followed by execution of known remote monitoring and
management (RMM) tools. Attackers may use this mechanism to install RMM tools and establish or persist remote access.
"""
false_positives = [
    """
    The correlation here is temporal, not causal. An unrelated restart of an existing RMM process within the same host
    and time window may also satisfy the sequence.
    """,
]
from = "now-10m"
index = ["logs-endpoint.events.process-*"]
interval = "5m"
language = "eql"
license = "Elastic License v2"
name = "Potential RMM Installation from a Remote MSI URL"
references = [
    "https://www.huntress.com/blog/velociraptor-misuse-part-two-eye-of-the-storm",
    "https://www.huntress.com/blog/series-of-unfortunate-rmm-events",
    "https://gist.github.com/MHaggis/8e9afce52acf08663465e83459874cdc",
]
risk_score = 21
rule_id = "8efdba98-7f62-46aa-94fc-dbed1e43e705"
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Platform: Windows",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Threat: Installer Abuse",
    "Threat: Remote Management Tool Abuse",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence by host.id with maxspan=5m
  [process where host.os.type == "windows" and
    event.type == "start" and process.name : "msiexec.exe" and
    process.args : ("/i", "-i", "/package", "-package") and
    process.args : ("http://*", "https://*")]
