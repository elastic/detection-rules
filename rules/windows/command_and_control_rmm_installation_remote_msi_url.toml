setup = """
## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""

note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Potential RMM Installation from a Remote MSI URL

#### Possible investigation steps

- What relationship do the two source process events actually establish?
  - Why: sequence alerts can expose only shared fields at the alert level, while the installer and RMM stages describe different processes.
  - Focus: use the **Investigate in timeline** button and inspect both process-start events on the same `host.id`; capture each `@timestamp` and `process.entity_id`, the installer `process.command_line` and `process.args`, and the later `process.code_signature.subject_name`.
  - Implication: the sequence supports concern when the HTTP/S value is the MSI package operand; by itself it does not distinguish a newly installed runtime from a restart of an existing RMM instance, and concern weakens when the HTTP/S argument is not the package operand or the runtime predates the installer.

- Does the remote package source and installer launch context fit a legitimate deployment path?
  - Focus: the installer member's URL in `process.args`, `process.parent.executable`, `process.parent.command_line`, `user.id`, and affected `host.id` cohort.
  - Implication: public file hosting, look-alike vendor infrastructure, an interactive shell, or a launcher unrelated to software deployment increases concern; a vendor or internal distribution URL under a recognized management parent is more explainable but still requires organizational confirmation.

- Does the later process have a coherent RMM identity and expected launch path?
  - Focus: the RMM member's `process.executable`, `process.pe.original_file_name`, `process.code_signature.subject_name`, `process.code_signature.trusted`, and `process.hash.sha256`.
  - Implication: mismatched names, a user-writable path, missing trust, or an unfamiliar hash supports escalation; a matching reported signer subject identifies the claimed publisher but does not establish signature trust, installer causality, or authorization.

- Did the RMM process exhibit remote-control or follow-on execution behavior?
  - Focus: child starts where `process.parent.entity_id` matches the recovered RMM `process.entity_id`; for network activity, match network-event `process.entity_id` to that recovered RMM identity, then inspect `dns.question.name`, `destination.ip`, and `destination.port`; inspect child `process.command_line` for operator activity.
  - Implication: interactive shells, scripts, file-transfer tooling, credential access, or unexpected public destinations indicate likely abuse; an idle or expected vendor connection lowers urgency only when the deployment is otherwise confirmed. Missing network telemetry is unresolved, not benign.

- If local evidence remains suspicious or unresolved, is the installer source or RMM artifact present on other hosts?
  - Focus: search the recovered URL pattern from `process.command_line`, RMM `process.hash.sha256`, and `process.code_signature.subject_name` across distinct `host.id` values.
  - Hint: for sibling processes this rule misses, compare `process.name`, `process.pe.original_file_name`, and `process.code_signature.exists`.
  - Implication: repeated delivery or the same artifact beyond the recurring `host.id` cohort associated with the same package source and `process.parent.executable` broadens incident scope; concentration in a deployment cohort confirmed by change or support records supports a narrower response but does not clear contradictory local behavior.

- Escalate when package source, launch context, RMM identity, or follow-on behavior lacks a bounded legitimate explanation; close only when the URL, installer lineage, RMM identity, host cohort, and change or support record align; preserve artifacts and escalate when evidence or visibility is mixed or incomplete.

### False positive analysis

- Legitimate IT and managed service provider workflows may install RMM agents directly from vendor or organization-controlled MSI URLs. Confirm the exact package source in `process.args`, managed `process.parent.executable`, expected `user.id` and `host.id` cohort, RMM `process.code_signature.subject_name`, `process.code_signature.trusted`, and `process.hash.sha256`, and the corresponding change or support record before closing the alert.
- An established RMM service can restart by coincidence after an unrelated remote MSI request. Confirm that the same service, `process.executable`, and `process.hash.sha256` existed before the installer event and that the remote package in `process.args` belongs to a different recognized workflow.
- Scope exceptions to the installer event's `process.name`, exact URL or domain pattern in `process.args`, `process.parent.executable`, and the managed `host.id` or `user.id` cohort. Do not suppress on the RMM filename, signer subject, domain, user, or host alone.

### Response and remediation

- If confirmed benign, reverse temporary containment and document the package URL from `process.args`, installer `process.parent.executable`, RMM `process.executable`, `process.code_signature.subject_name`, `process.hash.sha256`, affected `host.id` cohort, and validating change or support record. Apply only the narrow exception described above when recurrence is expected.
- If suspicious but unconfirmed, export the alert and Timeline sequence to the case and preserve any cached MSI, installed RMM binary and configuration, active remote sessions, and volatile process state before termination. Apply reversible containment to confirmed delivery or control infrastructure, and escalate to host isolation when active remote access remains plausible and the asset can tolerate it.
- If confirmed malicious, use endpoint response to isolate the host, terminate unauthorized RMM sessions, and block the confirmed package URL from `process.args`, RMM `process.hash.sha256`, and control infrastructure from `dns.question.name` or `destination.ip`. If direct endpoint response is unavailable, escalate with the preserved package, binary, configuration, session, and scope evidence to the team that can act.
- Before uninstalling software or deleting artifacts, scope the same package source from `process.args`, RMM `process.hash.sha256`, `process.code_signature.subject_name`, configuration, and control infrastructure across other hosts and users. Then remove unauthorized services and persistence, rotate credentials exposed during the remote session, revoke active sessions, and address the delivery or software-control gap that permitted the installation.
"""

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "host.id",
    "host.name",
]

