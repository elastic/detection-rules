[metadata]
creation_date = "2026/10/22"
integration = ["system", "windows"]
maturity = "production"
updated_date = "2026/10/22"

[transform]
[[transform.investigate]]
description = "Finds all AD CS request, issuance, denial, and pending events (4886-4889) on the CA host for the same request ID."
label = "AD CS events for this request ID"
providers = [
  [
    { excluded = false, field = "winlog.adcs.request.id", queryType = "phrase", value = "{{winlog.adcs.request.id}}", valueType = "string" },
    { excluded = false, field = "winlog.computer_name", queryType = "phrase", value = "{{winlog.computer_name}}", valueType = "string" }
  ]
]
relativeFrom = "now-24h"
relativeTo = "now"

[[transform.investigate]]
description = "Finds alerts and authentication/coercion events associated with the source IP of the relayed NTLM logon."
label = "Activity from the relay source IP"
providers = [
  [
    { excluded = false, field = "source.ip", queryType = "phrase", value = "{{source.ip}}", valueType = "string" }
  ]
]
relativeFrom = "now-24h"
relativeTo = "now"


[rule]
author = ["Elastic"]
description = """
Identifies a remote NTLM network logon by a computer account ($) to an Active Directory Certificate Services (AD CS) Web
Enrollment or Certification Authority host, immediately followed by a certificate request (4886) or issuance (4887) for
that same computer account where the Web Enrollment host is recorded as the DCOM client machine (ccm) and a
CertificateTemplate attribute is explicitly supplied. Legitimate domain computer certificate enrollment uses Kerberos
and embeds the template OID in the CSR rather than passing CertificateTemplate via HTTP form attributes. This sequence
indicates an ESC8 NTLM relay attack against AD CS Web Enrollment (/certsrv/certfnsh.asp).
"""
from = "now-9m"
index = ["logs-system.security-*", "logs-windows.forwarded*", "winlogbeat-*"]
language = "eql"
license = "Elastic License v2"
name = "Potential AD CS ESC8 NTLM Relay to Web Enrollment"
note = """## Triage and analysis

### Investigating Potential AD CS ESC8 NTLM Relay to Web Enrollment

#### Possible investigation steps

- Do the sequence member events confirm an NTLM relay to AD CS Web Enrollment?
  - Focus: Stage 1 `source.ip`, `source.domain`, `user.name`, `user.domain`, `winlog.computer_name`; Stage 2 `event.code`, `winlog.adcs.request.id`, `winlog.adcs.request.requester.name`, `winlog.adcs.request.attributes.certificate_template`, `winlog.adcs.request.attributes.ccm`
  - Hint: Open Timeline from the sequence alert to inspect both events. Stage 1 `source.ip` is the IP address of the host that delivered the NTLM authentication to the Web Enrollment server (`winlog.computer_name`), while `user.name` (and `source.domain`, which maps `WorkstationName` from the NTLM Type 3 message) identifies the coerced victim computer account.
  - Implication: When a computer account (particularly a Domain Controller `DC$`) authenticates over NTLM from a different host's `source.ip` and immediately requests a certificate via `w3wp.exe` (`winlog.adcs.request.attributes.ccm` matching the Web Enrollment server and `winlog.adcs.request.attributes.certificate_template` populated), it confirms an ESC8 relay attack.
- Did the certificate request result in an issued certificate (Event 4887) or a denied/pending request (Event 4886 / 4888 / 4889)?
  - Focus: `event.code`, `event.outcome`, `winlog.adcs.request.id`, `winlog.adcs.request.disposition.code`, `winlog.adcs.request.disposition.name`, `winlog.event_data.CertificateTemplate`, `winlog.event_data.SerialNumber`, `winlog.event_data.SubjectKeyIdentifier`
  - Hint: Pivot on `winlog.adcs.request.id` on the CA host to view all lifecycle events (`4886`, `4887`, `4888`, `4889`). Note that `winlog.adcs.request.attributes.certificate_template` reflects the requested template claim from `CertAttrib`, whereas `winlog.event_data.CertificateTemplate` on Event `4887` version 1 reports the template used by the CA for issuance. $investigate_0
  - Implication: Event `4887` (`CR_DISP_ISSUED`) confirms the attacker obtained a valid certificate for the relayed computer account. Event `4888` (such as `CERTSRV_E_ENROLL_DENIED` or `CERTSRV_E_UNSUPPORTED_CERT_TYPE`) indicates the relay attempt was blocked by template permissions, but still confirms active relay exploitation from `source.ip`.
- What coercion preceded the relay, and was the issued certificate used for PKINIT authentication or DCSync?
  - Focus: Named-pipe access (`event.code: "5145"` on `lsarpc`, `efsrpc`, `Spoolss`, `netdfs`, `FssagentRpc`) originating from Stage 1 `source.ip` on the coerced computer; Kerberos TGT requests (`event.code: "4768"` with `winlog.event_data.PreAuthType` in `("15", "16")`, `winlog.event_data.CertIssuerName`, `winlog.event_data.CertSerialNumber`, `winlog.event_data.CertThumbprint`) and directory replication (`event.code: "4662"`) on Domain Controllers.
  - Hint: Search for activity from Stage 1 `source.ip` across all hosts, and check Domain Controller Security logs for Event `4768` where `user.name` matches `winlog.adcs.request.requester.name`. $investigate_1
  - Implication: A matching Event `4768` with certificate fields populated confirms the attacker used the ESC8 certificate to request a Kerberos TGT (enabling UnPAC-the-Hash and DCSync if a Domain Controller was relayed).

### False positive analysis

- Legitimate Windows computer certificate auto-enrollment and native tools (`certreq.exe`, `mmc.exe`) use Kerberos over DCOM/RPC directly from the enrolling host and do not authenticate via NTLM from a third-party `source.ip` to `/certsrv/certfnsh.asp`.
- Non-Windows appliances or custom scripts that legitimately authenticate with an Active Directory computer account (`*$`) over NTLM to `/certsrv/certfnsh.asp` from a separate proxy or NAT IP could match. Verify whether Stage 1 `source.ip` belongs to the asset owning that computer account and whether the workflow is authorized.

### Response and remediation

- Preserve the Stage 1 (`4624`) and Stage 2 (`4886`/`4887`) events, the CA database row for `winlog.adcs.request.id`, IIS access logs (`POST /certsrv/certfnsh.asp`), and any subsequent `4768`/`4662` Domain Controller events.
- Isolate or block the attacker relay host identified by Stage 1 `source.ip`.
- If Event `4887` confirmed issuance, immediately revoke the issued certificate on the CA (`certutil -revoke <SerialNumber> 1`) and publish an updated CRL (`certutil -crl`).
- Rotate the relayed computer account's password (if a Domain Controller computer account was issued a certificate, assume domain-wide compromise via DCSync/UnPAC-the-Hash and execute `krbtgt` rotation procedures).
- Harden AD CS against ESC8 per Microsoft KB5005413: remove the legacy CA Web Enrollment role service (`/certsrv`) if not operationally required, or require HTTPS with Extended Protection for Authentication (EPA / Channel Binding) set to Required and disable NTLM authentication on IIS enrollment endpoints.
"""
references = [
    "https://posts.specterops.io/certified-pre-owned-d95910965cd2",
    "https://support.microsoft.com/en-us/topic/kb5005413-mitigating-ntlm-relay-attacks-on-active-directory-certificate-services-ad-cs-3612b773-4043-4aa9-b23d-b87910cd3429",
    "https://learn.microsoft.com/en-us/windows-server/identity/ad-cs/certificate-authority-web-enrollment",
]
risk_score = 73
rule_id = "8e2a4b6c-9d1f-4e3a-b5c7-2f4d6e8a0b1c"
setup = """## Setup

The following Windows audit policies must be enabled on Certification Authority and Web Enrollment servers to generate
the events used by this rule:
- [Audit Logon](https://ela.st/audit-logon)
- [Audit Certification Services](https://ela.st/audit-certification-services)

This rule requires the normalized `winlog.adcs.request.*` fields introduced in System integration `v3.1.0` and Windows
integration `v3.11.0`.
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "Domain: Identity",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Privilege Escalation",
    "Use Case: Active Directory Monitoring",
    "Data Source: Active Directory",
    "Data Source: Windows Security Event Logs",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Windows",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence by winlog.computer_name with maxspan=15s

  /* Stage 1: Remote NTLM network logon by a machine account ($) on the CA server */
  [authentication where host.os.type == "windows" and event.code == "4624" and
   winlog.logon.type == "Network" and
   winlog.event_data.AuthenticationPackageName == "NTLM" and
   endswith~(user.name, "$") and user.name != "$" and
   source.ip != null and
   not cidrmatch(source.ip, "127.0.0.0/8", "::1", "fe80::/10", "169.254.0.0/16") and
   not endswith(string(source.ip), string(host.ip)) and
   indexOf(string(host.ip), string(source.ip)) == null and
   /* Exclude multi-homed self-authentication where the CA machine account logs into itself */
   not (startswith~(winlog.computer_name, substring(user.name, 0, -1)) and
        source.domain != null and
        startswith~(winlog.computer_name, source.domain))
  ] by user.name, user.domain

  /* Stage 2: AD CS Web Enrollment request (4886) or issuance (4887) for the same machine account */
  [iam where host.os.type == "windows" and event.code in ("4886", "4887") and
   endswith~(winlog.adcs.request.requester.name, "$") and
   winlog.adcs.request.attributes.certificate_template != null and
   winlog.adcs.request.attributes.ccm != null and
   /* Exclude native Windows certcli.dll / certreq.exe requests that fell back to NTLM */
   winlog.adcs.request.attributes.rmd == null and
   winlog.adcs.request.attributes.cdc == null and
   winlog.adcs.request.attributes.request_client_info == null
  ] by winlog.adcs.request.requester.name, winlog.adcs.request.requester.domain
'''


