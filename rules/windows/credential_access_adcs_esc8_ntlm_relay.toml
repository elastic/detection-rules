[metadata]
creation_date = "2026/10/22"
integration = ["system", "windows"]
maturity = "production"
updated_date = "2026/10/23"

[transform]
[[transform.investigate]]
description = "Finds all AD CS request, issuance, denial, and pending events (4886-4889) on the CA host for the same request ID."
label = "AD CS events for this request ID"
providers = [
  [
    { excluded = false, field = "winlog.adcs.request.id", queryType = "phrase", value = "{{winlog.adcs.request.id}}", valueType = "string" },
    { excluded = false, field = "winlog.computer_name", queryType = "phrase", value = "{{winlog.computer_name}}", valueType = "string" }
  ]
]
relativeFrom = "now-24h"
relativeTo = "now"

[[transform.investigate]]
description = "Finds alerts and authentication/coercion events associated with the source IP of the NTLM logon."
label = "Activity from the NTLM logon source IP"
providers = [
  [
    { excluded = false, field = "source.ip", queryType = "phrase", value = "{{source.ip}}", valueType = "string" }
  ]
]
relativeFrom = "now-24h"
relativeTo = "now"


[rule]
author = ["Elastic"]
description = """
Identifies a remote NTLM network logon (Event ID 4624) by a dollar-suffixed account ($) on an Active Directory
Certificate Services (AD CS) Certification Authority host, immediately followed by a successful certificate issuance
(Event ID 4887) for that same account on the same host. Standard domain certificate enrollment uses Kerberos over
DCOM/RPC. An NTLM network logon followed by certificate issuance on the CA host may indicate an ESC8 NTLM relay attack
to co-located AD CS Web Enrollment, an ESC11 NTLM relay to the CA RPC/DCOM interface, or direct NTLM-authenticated
certificate enrollment by a computer or managed service account.
"""
from = "now-9m"
index = ["logs-system.security-*", "logs-windows.forwarded-*"]
language = "eql"
license = "Elastic License v2"
name = "Potential AD CS NTLM Relay or Dollar-Account Certificate Issuance"
note = """## Triage and analysis

### Investigating Potential AD CS NTLM Relay or Dollar-Account Certificate Issuance

This rule correlates a remote NTLM network logon (`4624`) and a successful certificate issuance (`4887`) on the same
Certification Authority (`winlog.computer_name`) for the same dollar-suffixed principal (`*$`). Because Event `4887`
records CA-level issuance rather than the upstream transport protocol, and Stage 1 `source.ip != host.ip` only excludes
the CA host's own IP, analysts must compare the NTLM logon source with the requesting identity to distinguish a relayed
authentication (such as co-located ESC8 Web Enrollment relay or ESC11 RPC/DCOM relay) from direct NTLM fallback by the
client host itself.

Note: Deployments where AD CS Web Enrollment (`/certsrv`) runs on a separate IIS server configured with Kerberos
Constrained Delegation to the CA generate the NTLM `4624` logon on the Web Enrollment server and a Kerberos `4624` logon
on the CA, and are not covered by this same-host sequence.

#### Possible investigation steps

- Does the NTLM logon `source.ip` match the host associated with the requesting `$` account, or does it point to a third-party relay host?
  - Focus: Stage 1 `source.ip`, `source.domain` (populated from `winlog.event_data.WorkstationName`), `user.name`, `user.domain`, `winlog.computer_name`; Stage 2 `winlog.adcs.request.requester.name`, `winlog.adcs.request.requester.domain`
  - Hint: Open Timeline from the sequence alert to inspect both member events. Determine what type of Active Directory object `user.name` / `winlog.adcs.request.requester.name` represents (a domain computer account, a Group or Standalone Managed Service Account `gMSA$`/`sMSA$`, a trust account, or a user account ending in `$`) and resolve the expected IP address of that host or service tier.
  - Implication: When `source.ip` belongs to a different system than the computer account in `user.name` (especially when `user.name` is a Domain Controller `DC$` and `source.ip` is a workstation or non-DC host), treat the sequence as high-confidence NTLM relay to AD CS. When `source.ip` and `source.domain` match the host that legitimately owns `user.name` (or a host authorized to run that `gMSA$`), the event reflects direct NTLM authentication from that host (either on-host enrollment tooling or NTLM fallback, such as connecting to the CA by IP address rather than SPN/FQDN).
- What enrollment path, certificate template, and identity were issued in Event 4887?
  - Focus: `winlog.adcs.request.id`, `winlog.event_data.CertificateTemplate`, `winlog.adcs.request.attributes.certificate_template`, `winlog.adcs.request.attributes.ccm`, `winlog.adcs.request.attributes.rmd`, `winlog.adcs.request.attributes.cdc`, `winlog.event_data.Subject`, `winlog.event_data.SubjectAlternativeName`, `winlog.event_data.DCOMorRPC`, `winlog.event_data.SerialNumber`, `winlog.event_data.SubjectKeyIdentifier`
  - Hint: Pivot on `winlog.adcs.request.id` on the CA host to inspect the paired `4886` receipt event and any `4873`/`4874` changes. Remember that values under `winlog.adcs.request.attributes.*` and `winlog.adcs.request.subject_alt_name.*` are parsed from `winlog.event_data.Attributes` and represent client-supplied request claims, not proof of the enrollment protocol or confirmed certificate contents. Prefer native `winlog.event_data.CertificateTemplate` (when present on v1 events) and the CA database record for `winlog.adcs.request.id` to verify the actual template and Extended Key Usages (EKUs). If IIS logs are collected on the CA, check for a concurrent `POST /certsrv/certfnsh.asp` from `source.ip`. $investigate_0
  - Implication: Issuance of a certificate with Client Authentication, Smart Card Logon, PKINIT, Any Purpose, or SubCA capability to a relayed computer account (such as `DomainController`, `DomainControllerAuthentication`, `KerberosAuthentication`, or `Machine`) enables Kerberos PKINIT or SChannel authentication as that principal.
- Did coercion precede the NTLM logon, or did PKINIT / DCSync activity follow the issuance?
  - Focus: Named-pipe access (`event.code: "5145"` on `lsarpc`, `efsrpc`, `Spoolss`, `netdfs`, `FssagentRpc`) originating from Stage 1 `source.ip` against the target computer; Kerberos TGT requests (`event.code: "4768"` with `winlog.event_data.PreAuthType` in `("15", "16")`, `winlog.event_data.CertIssuerName`, `winlog.event_data.CertSerialNumber`, `winlog.event_data.CertThumbprint`) and directory replication (`event.code: "4662"`) on Domain Controllers.
  - Hint: Review activity associated with Stage 1 `source.ip` and search Domain Controller Security logs for Event `4768` where `user.name` (or `winlog.event_data.CertSerialNumber`) matches the issued certificate. $investigate_1
  - Implication: Preceding RPC pipe coercion from `source.ip` followed by a PKINIT TGT request (`4768`) confirms an end-to-end coercion-to-AD-CS relay chain.

### False positive analysis

- Direct NTLM fallback during legitimate certificate enrollment: If a computer account, `gMSA$`, or administrative script running as `SYSTEM` submits a certificate request to the CA using an IP address or alias that lacks a Kerberos SPN (or in an environment where Kerberos fails and NTLM is permitted), the CA logs an NTLM `4624` from the client host's own IP followed by `4887`. Confirm by verifying that `source.ip` and `source.domain` belong to the host owning the `$` account and that the issued template and workflow are expected.
- Load balancers, reverse proxies, or NAT boundaries fronting the CA can cause legitimate client connections to appear from a proxy `source.ip`. Confirm by correlating `source.domain` (`WorkstationName`), proxy logs, and `winlog.adcs.request.attributes.ccm` / `rmd`.
- Authorized security testing or lab simulations of ESC8/ESC11 will trigger this rule. Scope exceptions narrowly to the confirmed CA `winlog.computer_name`, requester account, and `source.ip` only after validating the workflow.

### Response and remediation

- If confirmed benign (such as authorized NTLM fallback from the requester's own host or a known proxy), document the workflow and reconfigure the enrolling client or script to use the CA's Kerberos FQDN/SPN where possible before adding a narrowly scoped exception.
- If suspicious but unconfirmed, preserve the Stage 1 (`4624`) and Stage 2 (`4887`) events, the CA database record for `winlog.adcs.request.id`, IIS access logs (if Web Enrollment is installed), and surrounding Domain Controller authentication logs before taking disruptive action.
- If malicious relay or unauthorized issuance is confirmed:
  - Revoke the issued certificate on the CA (`certutil -revoke <SerialNumber> 1`) and publish an updated CRL (`certutil -crl`).
  - Contain or isolate the confirmed relay or compromised host identified during investigation (avoid isolating `source.ip` blindly if it is a shared NAT, proxy, or production server until host role is verified).
  - Rotate the affected account's credentials after preserving evidence (if a Domain Controller computer account certificate was obtained and used for PKINIT/DCSync, coordinate domain-wide recovery and `krbtgt` rotation with identity owners).
  - Harden AD CS against NTLM relay per Microsoft KB5005413: disable legacy CA Web Enrollment (`/certsrv`) if unneeded, enforce HTTPS with Extended Protection for Authentication (EPA) set to Required on IIS enrollment endpoints, ensure `IF_ENFORCEENCRYPTICERTREQUEST` is enabled on the CA RPC interface, and restrict incoming NTLM traffic on CA servers.
"""
references = [
    "https://posts.specterops.io/certified-pre-owned-d95910965cd2",
    "https://support.microsoft.com/en-us/topic/kb5005413-mitigating-ntlm-relay-attacks-on-active-directory-certificate-services-ad-cs-3612b773-4043-4aa9-b23d-b87910cd3429",
    "https://learn.microsoft.com/en-us/windows-server/identity/ad-cs/certificate-authority-web-enrollment",
]
risk_score = 47
rule_id = "8e2a4b6c-9d1f-4e3a-b5c7-2f4d6e8a0b1c"
setup = """## Setup

The following Windows audit policies must be enabled on Certification Authority servers to generate the events used by
this rule:
- [Audit Logon](https://ela.st/audit-logon)
- [Audit Certification Services](https://ela.st/audit-certification-services)

This rule requires the normalized `winlog.adcs.request.*` fields introduced in System integration `v3.1.0` and Windows
integration `v3.11.0` (`logs-system.security-*` and `logs-windows.forwarded-*`). Standalone Winlogbeat indices do not
populate `winlog.adcs.request.*` and are not supported by this rule.
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "Domain: Identity",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Privilege Escalation",
    "Use Case: Active Directory Monitoring",
    "Data Source: Active Directory",
    "Data Source: Windows Security Event Logs",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Windows",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence by winlog.computer_name with maxspan=15s

  /* Stage 1: Remote NTLM network logon by a dollar-suffixed account ($), excluding loopback and CA self-logons */
  [authentication where host.os.type == "windows" and event.code == "4624" and
   event.outcome == "success" and
   winlog.logon.type == "Network" and
   winlog.event_data.AuthenticationPackageName == "NTLM" and
   endswith~(user.name, "$") and user.name != "$" and
   source.ip != null and
   not cidrmatch(source.ip, "127.0.0.0/8", "::1", "fe80::/10", "169.254.0.0/16") and
   not endswith(string(source.ip), string(host.ip)) and
   indexOf(string(host.ip), string(source.ip)) == null and
   /* Exclude multi-homed self-authentication where the CA host's own machine account logs into itself */
   not (startswith~(winlog.computer_name, substring(user.name, 0, -1)) and
        source.domain != null and
        startswith~(winlog.computer_name, source.domain))
  ] by user.name, user.domain

  /* Stage 2: Successful AD CS certificate issuance (4887) for the same dollar-suffixed account on the CA host */
  [iam where host.os.type == "windows" and event.code == "4887" and
   event.outcome == "success" and
   endswith~(winlog.adcs.request.requester.name, "$") and
   winlog.adcs.request.requester.name != "$"
  ] by winlog.adcs.request.requester.name, winlog.adcs.request.requester.domain
'''


