[metadata]
creation_date = "2026/08/04"
integration = ["system", "windows"]
maturity = "production"
updated_date = "2026/08/04"

[rule]
author = ["Elastic"]
description = """
Identifies a successful RC4-HMAC Kerberos service ticket request for a requester and service pair that has not been
observed during the previous 7 days. A newly observed requester-to-service relationship involving an RC4-encrypted
ticket may indicate Kerberoasting.
"""
false_positives = [
    """
    First-time or infrequent access to legacy services, cross-platform integrations, and inter-domain trust activity may
    legitimately establish a new requester-to-service relationship using RC4 encryption.
    """,
]
from = "now-9m"
index = ["winlogbeat-*", "logs-system.security*", "logs-windows.forwarded*"]
language = "kuery"
license = "Elastic License v2"
name = "Newly Observed RC4 Kerberos Service Ticket Request"
references = [
    "https://learn.microsoft.com/en-us/windows-server/security/kerberos/detect-remediate-rc4-kerberos",
]
risk_score = 47
rule_id = "57bc9e8d-9054-472c-9752-4aa91dc4cd49"
setup = """## Setup

Audit Kerberos Service Ticket Operations must be enabled to generate the events used by this rule.
Setup instructions: https://ela.st/audit-kerberos-service-ticket-operations
"""
severity = "medium"
tags = [
    "Domain: Identity",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Use Case: Active Directory Monitoring",
    "Data Source: Active Directory",
    "Data Source: Windows Security Event Logs",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
host.os.type:windows and event.category:authentication and event.code:4769 and
  winlog.event_data.Status:0x0 and winlog.event_data.TicketEncryptionType:0x17 and
  winlog.event_data.TargetUserName:* and
  winlog.event_data.ServiceName:(* and not (krbtgt or *$)) and
  not (winlog.event_data.TargetUserName:*$@* and source.ip:(127.0.0.0/8 or "::1"))
'''


[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1558"
name = "Steal or Forge Kerberos Tickets"
reference = "https://attack.mitre.org/techniques/T1558/"
[[rule.threat.technique.subtechnique]]
id = "T1558.003"
name = "Kerberoasting"
reference = "https://attack.mitre.org/techniques/T1558/003/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.new_terms]
field = "new_terms_fields"
value = ["winlog.event_data.TargetUserName", "winlog.event_data.ServiceName"]
[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-7d"
