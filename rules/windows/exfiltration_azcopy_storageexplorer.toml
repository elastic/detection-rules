[metadata]
creation_date = "2026/09/09"
integration = ["endpoint", "windows", "sentinel_one_cloud_funnel", "m365_defender", "system", "crowdstrike"]
maturity = "production"
updated_date = "2026/09/09"

[rule]
author = ["Elastic"]
description = """
Identifies the first time a host runs AzCopy copy or sync to Azure Blob, Data Lake, or File storage, or starts Azure
Storage Explorer, from a path that is not a standard Program Files or per-user Programs install. These Microsoft
utilities are legitimate data-transfer tools; ransomware and cloud-ransomware operators drop portable copies and use
SAS-authenticated jobs to pull data from victim storage and push it to attacker-controlled accounts. Alerts once per
host.id within the history window.
"""
false_positives = [
    "IT or DevOps using a portable AzCopy binary (not installed under Program Files) for authorized migrations.",
    """
    Users launching the Azure Storage Explorer installer or a portable build from Downloads, Desktop, or Temp before it
    is installed under Program Files.
    """,
]
from = "now-9m"
index = [
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-endpoint.events.process-*",
    "logs-m365_defender.event-*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-system.security*",
    "logs-windows.sysmon_operational-*",
    "winlogbeat-*",
]
language = "kuery"
license = "Elastic License v2"
name = "Potential Data Exfiltration via AzCopy or Azure Storage Explorer"
note = """## Triage and analysis

### Investigating Potential Data Exfiltration via AzCopy or Azure Storage Explorer

AzCopy and Azure Storage Explorer are Microsoft utilities for moving data to and from Azure Storage. Threat actors abuse portable copies as living-off-the-land binaries: they run `azcopy copy` with SAS URLs against `*.blob.core.windows.net` (GetBlob from a victim account, PutBlob to an attacker account, or Blob-to-Blob between them) and launch Storage Explorer from a non-install path. CISA's Rhysida advisory is one example of that tradecraft; the rule does not key on actor staging folder names.

This is a new-terms rule: it alerts the first time a `host.id` matches in the history window (5 days). AzCopy `copy`/`sync` whose command line includes an Azure Storage hostname, or Storage Explorer (`*StorageExplorer*.exe`), from a path that is not Program Files or a per-user Programs install, fires once per host. Recurring portable use on the same host will not re-alert until the history window expires.

### Possible investigation steps

- Confirm which utility fired the alert. For AzCopy, inspect `process.command_line` for `copy` vs `sync`, `--from-to` (`BlobLocal`, `LocalBlob`, `BlobBlob`), and the SAS URL host, container, and `sp`/`se` parameters. For Storage Explorer, note the installer vs application name and silent-install flags such as `/VERYSILENT`.
- Identify source and destination. AzCopy command lines often contain a local path and one or two `https://<account>.blob.core.windows.net/...` URLs. Treat Blob-to-Blob copies as direct tenant-to-attacker movement even when no files touch disk.
- Check `process.executable` and `process.parent.executable`. A portable copy outside Program Files, especially spawned by PowerShell or a scripting host, is more suspicious than a packaged install.
- Compare `process.name` with `process.pe.original_file_name` and `process.code_signature.subject_name`. A Microsoft-signed AzCopy from an unusual path is still the Rhysida/Storm-0501 tradecraft; a renamed unsigned copy is additional evasion.
- Pivot to Azure Storage diagnostic logs for the same window: GetBlob, PutBlob, and BlobBlob with user agent `AzCopy*` and SAS authentication. Correlate with the SIEM rule "Azure Storage Blob Retrieval via AzCopy".
- Review network telemetry from the same `process.entity_id` to `*.blob.core.windows.net` or `*.dfs.core.windows.net` and estimate volume.
- Hunt sibling activity on the host: other Azure LOLBINs, rclone, or bulk archive creation preceding the copy.

### False positive analysis

- Portable AzCopy used by IT for one-off migrations will match if it is not installed under Program Files and the command line contains a storage hostname. This rule alerts only the first time a given `host.id` matches within 5 days; allowlist by executable path or approved destination if that first alert is expected.
- Running Storage Explorer from Downloads, Desktop, or Temp (including the installer) will match until the product is installed under Program Files or a per-user Programs directory. Later launches from those install paths should not alert.
- Do not treat a trusted Microsoft signature as benign by itself; CISA's Rhysida advisory describes the official AzCopy and Storage Explorer binaries.

### Response and remediation

- If exfiltration is confirmed, isolate the host, stop AzCopy and Storage Explorer processes, and preserve the command line (SAS URLs are credentials).
- Revoke the SAS tokens and account keys that appear in the command line; rotate storage account keys and any related Entra ID credentials.
- Identify which blobs were read or written (GetBlob/PutBlob/ListBlobs for the same account and time window) and assess data exposure.
- Remove staged binaries under unusual paths and investigate how they were delivered.
- Hunt for additional AzCopy, Storage Explorer, or rclone activity on other hosts in the same window.

### Related rules

- Azure Storage Blob Retrieval via AzCopy: cloud-side GetBlob with AzCopy user agent and SAS authentication.
- Potential Data Exfiltration via Rclone: similar endpoint abuse of a different cloud-sync utility.
"""
references = [
    "https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-319a",
    "https://www.cisa.gov/sites/default/files/2025-04/aa23-319a-stopransomware-rhysida-ransomware_2.pdf",
    "https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10",
    "https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-explorer-blobs",
    "https://www.microsoft.com/en-us/security/blog/2025/08/27/storm-0501s-evolving-techniques-lead-to-cloud-based-ransomware/",
]
risk_score = 47
rule_id = "7265f4fa-4839-4399-924c-a91f1e45d76c"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend

### Additional data sources

This rule also supports the following third-party data sources. For setup instructions, refer to the links below:

- [CrowdStrike](https://ela.st/crowdstrike-integration)
- [Microsoft Defender XDR](https://ela.st/m365-defender)
- [SentinelOne Cloud Funnel](https://ela.st/sentinel-one-cloud-funnel)
- [Sysmon Event ID 1 - Process Creation](https://ela.st/sysmon-event-1-setup)
- [Windows Process Creation Logs](https://ela.st/audit-process-creation)
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Platform: Windows",
    "Use Case: Threat Detection",
    "Tactic: Exfiltration",
    "Tactic: Collection",
    "Tactic: Execution",
    "Rule Type: New Terms",
    "Threat: Ransomware",
    "Resources: Investigation Guide",
    "Data Source: Elastic Defend",
    "Data Source: Sysmon",
    "Data Source: SentinelOne",
    "Data Source: Microsoft Defender XDR",
    "Data Source: Crowdstrike",
    "Data Source: Elastic Endgame",
    "Data Source: Windows Security Event Logs",
]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
host.os.type:windows and event.category:process and event.type:start and
(
  (
    (process.name:"azcopy.exe" or process.pe.original_file_name:"azcopy.exe") and
    process.args:("copy" or "sync") and
    process.command_line:(*blob.core.windows.net* or *dfs.core.windows.net* or *file.core.windows.net* or *blob.storage.azure.net*) and
    not process.executable:(*\\Program*Files* or *\\Device\\HarddiskVolume*\\Program Files* or *\\AppData\\Local\\Programs\\*)
  ) or
  (
    process.name:*StorageExplorer*.exe and
    not process.executable:(*\\Program*Files* or *\\Device\\HarddiskVolume*\\Program Files* or *\\AppData\\Local\\Programs\\*)
  )
)
'''


