[metadata]
creation_date = "2026/09/21"
integration = ["endpoint", "windows", "system", "crowdstrike", "sentinel_one_cloud_funnel", "m365_defender"]
maturity = "development"
updated_date = "2026/09/21"

[rule]
author = ["Saksham Bhattarai"]
description = """
Identifies the Steam Client Service (steamservice.exe) spawning a child process running with SYSTEM integrity from an
executable located outside the Steam installation directory or the Windows system directory. The Steam Client Service
runs as SYSTEM, and a vulnerability in how it handles a caller-controlled installation root can be abused by a standard
user to make the service execute a relocated launcher as NT AUTHORITY\\SYSTEM (publicly demonstrated as "BrokenPipe").
"""
false_positives = [
    """
    Steam installed or updated in a non-default location, or Steam games and redistributables (such as DirectX or Visual
    C++ runtimes) installed from a custom library path. Verify the child process signature, path, and the user that
    triggered the installation.
    """,
]
from = "now-9m"
index = [
    "logs-endpoint.events.process-*",
    "logs-system.security*",
    "logs-windows.forwarded*",
    "winlogbeat-*",
    "logs-crowdstrike.fdr*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-m365_defender.event-*",
    "endgame-*",
    "logs-windows.sysmon_operational-*",
]
language = "eql"
license = "Elastic License v2"
name = "Steam Client Service Spawning SYSTEM Child Process from Unusual Path"
note = """## Triage and analysis

### Investigating Steam Client Service Spawning SYSTEM Child Process from Unusual Path

The Steam Client Service (`steamservice.exe`) runs as SYSTEM and performs privileged operations on behalf of the Steam client, such as installing game prerequisites. If the service can be induced to launch an executable from a location the caller controls, a standard user can obtain a SYSTEM process without a UAC prompt. This rule flags SYSTEM-integrity child processes of `steamservice.exe` whose executable is not in a typical Steam or Windows system location.

### Possible investigation steps

- Review the child process `process.executable`, `process.command_line`, and `process.name`. Legitimate children are typically Steam-shipped redistributable installers; an interactive shell (`cmd.exe`, `powershell.exe`) or an executable in a user-writable path is highly suspicious.
- Check the integrity level via `process.Ext.token.integrity_level_name` or `winlog.event_data.IntegrityLevel` and confirm the child ran as `NT AUTHORITY\\SYSTEM`.
- Validate the code signature and hash of the child (`process.code_signature.*`, `process.hash.sha256`) and compare with known Steam redistributables.
- Investigate the process tree and the user session that was active when the child started. A standard user with Steam idle at the login screen and no game launched is consistent with the public proof of concept.
- Look for the launcher that initiated the chain (a recently created executable in a user-writable path, such as a downloaded or compiled binary) and for file writes under `C:\\Users\\Public\\`.
- Review other alerts for the same host and user in the previous 48 hours, focusing on discovery, credential access, or persistence activity following the SYSTEM process.

### False positive analysis

- Steam installed to a non-default drive or library folder can legitimately launch redistributable installers from that path. Confirm the path, signer, and hash, then add a narrow exception for the verified location.
- Third-party game launchers or anti-cheat installers run through Steam may spawn SYSTEM children from their own directories. Validate the signer before excluding.

### Response and remediation

- Isolate the host if a non-Steam child (such as a shell) was spawned by `steamservice.exe` as SYSTEM.
- Terminate the SYSTEM process tree and collect the child executable and its parent launcher for analysis.
- Treat the host as fully compromised if SYSTEM code execution is confirmed: reset credentials that were cached or accessible on the host, and review for persistence and lateral movement.
- Update Steam to a build that addresses the issue once a vendor fix is available, and consider removing Steam from servers and high-value workstations where it is not needed.
- Escalate to the incident response team for scoping."""
references = ["https://github.com/KillaBoi/BrokenPipe"]
risk_score = 73
rule_id = "895d3358-e983-44bf-a69f-0577449c177c"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend

### Additional data sources

This rule also supports the following third-party data sources. For setup instructions, refer to the links below:

- [CrowdStrike](https://ela.st/crowdstrike-integration)
- [Microsoft Defender XDR](https://ela.st/m365-defender)
- [SentinelOne Cloud Funnel](https://ela.st/sentinel-one-cloud-funnel)
- [Sysmon Event ID 1 - Process Creation](https://ela.st/sysmon-event-1-setup)
- [Windows Process Creation Logs](https://ela.st/audit-process-creation)
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Use Case: Vulnerability",
    "Tactic: Privilege Escalation",
    "Data Source: Elastic Defend",
    "Data Source: Elastic Endgame",
    "Data Source: Windows Security Event Logs",
    "Data Source: Crowdstrike",
    "Data Source: SentinelOne",
    "Data Source: Microsoft Defender XDR",
    "Data Source: Sysmon",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "windows" and event.type == "start" and
  process.parent.name : "steamservice.exe" and
  (?process.Ext.token.integrity_level_name : "System" or ?winlog.event_data.IntegrityLevel : "System") and

  /* exclusions for FP control below */
  not process.executable : (
    "?:\\Program Files (x86)\\Steam\\*",
    "?:\\Program Files\\Steam\\*",
    "?:\\Windows\\System32\\*",
    "?:\\Windows\\SysWOW64\\*",

    /* Crowdstrike specific condition as it uses NT Object paths */
    "\\Device\\HarddiskVolume*\\Program Files (x86)\\Steam\\*",
    "\\Device\\HarddiskVolume*\\Program Files\\Steam\\*",
    "\\Device\\HarddiskVolume*\\Windows\\System32\\*",
    "\\Device\\HarddiskVolume*\\Windows\\SysWOW64\\*"
  )
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1068"
name = "Exploitation for Privilege Escalation"
reference = "https://attack.mitre.org/techniques/T1068/"


[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"

