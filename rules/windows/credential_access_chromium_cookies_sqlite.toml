[metadata]
creation_date = "2026/10/09"
integration = ["endpoint"]
maturity = "development"
updated_date = "2026/10/09"

[rule]
author = ["Elastic"]
description = """
Identifies a successful read of a Chrome or Edge cookie database by the SQLite command-line utility. Adversaries may use
database tools to collect encrypted session-cookie material. This signal identifies database access; it does not prove
cookie decryption, export, or account compromise.
"""
false_positives = [
    """
    Authorized incident response, digital forensics, browser support, and developer scripts may legitimately read live
    browser cookie databases with sqlite3.exe. Validate these activities against representative production telemetry
    before enabling this draft.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.file-*"]
interval = "5m"
language = "eql"
license = "Elastic License v2"
name = "Chromium Cookie Database Read by SQLite"
note = """## Triage and analysis

### Investigating Chromium Cookie Database Read by SQLite

Confirm the SQLite process identity and exact browser database path. Review its parent, command line, executable provenance and process entity. A piped SQL statement may not appear in process arguments. Correlate available script logging, output files and subsequent activity before inferring credential collection or use.

### False-positive analysis

Forensic and browser-support workflows can produce the same file read. Check approval and provenance for the actual workflow. A clean lab background does not establish enterprise precision. No blanket trusted-signature or Program Files exclusion is included, and repeated events should be assessed before adding suppression.

### Response and remediation

When unauthorized access is established, preserve the process tree and related evidence and follow the organization's response procedure. Decide whether session invalidation is warranted from evidence of cookie recovery or use; an encrypted database read alone does not prove an account was accessed.
"""
references = [
    "https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1539/T1539.md",
]
risk_score = 21
rule_id = "8c2541d4-e975-434b-bed1-5f6f874f1a47"
setup = "Requires Elastic Defend sensitive-file access events with process name, complete file path, access type and successful outcome. Generic file-creation telemetry alone is insufficient."
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Data Source: Elastic Defend",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Windows",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
file where host.os.type == "windows" and event.type == "access" and
  event.outcome == "success" and process.name : "sqlite3.exe" and
  file.path : ("?:\\Users\\*\\AppData\\Local\\Google\\Chrome\\User Data\\*\\Cookies",
               "?:\\Users\\*\\AppData\\Local\\Microsoft\\Edge\\User Data\\*\\Cookies")
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1539"
name = "Steal Web Session Cookie"
reference = "https://attack.mitre.org/techniques/T1539/"


[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
