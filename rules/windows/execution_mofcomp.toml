[metadata]
creation_date = "2023/08/23"
integration = ["endpoint", "m365_defender", "system", "crowdstrike"]
maturity = "production"
updated_date = "2026/07/28"

[rule]
author = ["Elastic"]
description = """
Managed Object Format (MOF) files can be compiled locally or remotely through mofcomp.exe. Attackers may leverage MOF
files to build their own namespaces and classes into the Windows Management Instrumentation (WMI) repository, or
establish persistence using WMI Event Subscription.
"""
from = "now-9m"
index = [
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-endpoint.events.process-*",
    "logs-m365_defender.event-*",
    "logs-system.security*",
]
language = "eql"
license = "Elastic License v2"
name = "Mofcomp Activity"
risk_score = 21
rule_id = "210d4430-b371-470e-b879-80b7182aa75e"
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Execution",
    "Data Source: Elastic Defend",
    "Data Source: Microsoft Defender XDR",
    "Data Source: Elastic Endgame",
    "Data Source: Windows Security Event Logs",
    "Data Source: Crowdstrike",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "windows" and event.type == "start" and
  process.name : "mofcomp.exe" and process.args : "*.mof" and
  not user.id : "S-1-5-18" and
  not process.args : (
    "?:\\Program Files\\Microsoft SQL Server\\*\\MSSQL\\Binn\\*.mof",
    "?:\\Program Files (x86)\\Microsoft SQL Server\\*\\MSSQL\\Binn\\*.mof",
    "?:\\Program Files\\Microsoft SQL Server\\???\\Shared\\*.mof",
    "?:\\Program Files (x86)\\Microsoft SQL Server\\???\\Shared\\*.mof",
    "?:\\Program Files\\Microsoft SQL Server\\*\\OLAP\\bin\\*.mof",
    "?:\\Program Files (x86)\\Microsoft SQL Server\\*\\OLAP\\bin\\*.mof",
    "?:\\Program Files\\Microsoft SQL Server Reporting Services\\*\\WMI\\reportingservices.mof",
    "?:\\Program Files (x86)\\Microsoft SQL Server Reporting Services\\*\\WMI\\reportingservices.mof",
    "?:\\Program Files\\Microsoft Power BI Report Server\\*\\WMI\\reportingservices.mof",
    "?:\\Program Files (x86)\\Microsoft Power BI Report Server\\*\\WMI\\reportingservices.mof",
    "?:\\Program Files\\Microsoft Policy Platform\\*.mof",
    "?:\\Windows\\System32\\wbem\\Framework\\root\\*_SN_*_Version_*.mof",
    "?:\\Windows\\SysWOW64\\wbem\\Framework\\root\\*_SN_*_Version_*.mof",
    "?:\\Windows\\System32\\wbem\\Veeam.Backup.*.mof",
    "?:\\Windows\\System32\\wbem\\com.hp.provider.*.mof",
    "?:\\Windows\\System32\\wbem\\CxAudioSvc_*.mof",
    "?:\\Windows\\System32\\wbem\\ZTITatoo.mof"
  )
'''

setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend

### Additional data sources

This rule also supports the following third-party data sources. For setup instructions, refer to the links below:

- [CrowdStrike](https://ela.st/crowdstrike-integration)
- [Microsoft Defender XDR](https://ela.st/m365-defender)
- [Windows Process Creation Logs](https://ela.st/audit-process-creation)
"""

note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Mofcomp Activity
Mofcomp.exe is a tool used to compile Managed Object Format (MOF) files, which define classes and namespaces in the Windows Management Instrumentation (WMI) repository. Adversaries exploit this by creating malicious WMI scripts for persistence or execution. The detection rule identifies suspicious mofcomp.exe activity by excluding the system account and MOF files that reside in ACL-protected product directories, so that compilation of MOF files from user-writable locations stands out.

### Possible investigation steps

- Review the process execution details to confirm the presence of mofcomp.exe and verify the command-line arguments used, focusing on any unusual or unexpected MOF file paths.
- Investigate the user account associated with the process execution, especially if it is not the system account (S-1-5-18), to determine if the account has been compromised or is being misused.
- Examine the parent process of mofcomp.exe and assess whether it is a legitimate product installer or a script host, remote shell, or other interactive launcher that would not normally register a WMI provider.
- Verify the directory holding the MOF file. Compilation from ACL-protected product directories is routine installer behavior, while a MOF staged in a user-writable path such as a temp folder, user profile, or ProgramData warrants investigation.
- Check for any recent changes or additions to the WMI repository, including new namespaces or classes, which could indicate malicious activity or persistence mechanisms.
- Correlate the alert with other security events or logs from data sources like Microsoft Defender XDR or Crowdstrike to identify any related suspicious activities or patterns.

### False positive analysis

- Product installers routinely register WMI providers by compiling a MOF, and the launching process varies widely, including installers, setup bootstrappers, cmd.exe, and remote PowerShell sessions. The rule therefore excludes the MOF file path rather than the parent process. When extending the path list, pair a canonical ACL-protected product directory with an exact MOF basename or a stable vendor-generated filename structure confirmed across recurring alerts, and avoid non-canonical directory prefixes that a user-writable lookalike path could satisfy. A directory-wide wildcard should be a deliberate exception, justified only where the directory is a canonical vendor-owned protected path holding a large and frequently versioned file set, as with the Microsoft Policy Platform entry.
- System maintenance tasks executed by trusted system accounts can cause false positives. Exclude activities initiated by the system account with user ID S-1-5-18 to reduce noise. Note that this exclusion depends on user.id, which is not populated by all supported data sources, so SYSTEM activity can still surface on sources that omit it.
- Rebuilding a corrupted WMI repository recompiles the built-in MOF files shipped in the WMI directory, often invoked with a bare file name and no path. Correlate with the surrounding administrative session before dismissing.
- Operating system deployment tooling such as MDT and SCCM compiles MOF files during imaging. Exclude the specific deployment MOF path once verified.

### Response and remediation

- Isolate the affected system from the network to prevent further malicious activity and lateral movement.
- Terminate the mofcomp.exe process if it is confirmed to be executing malicious MOF files.
- Conduct a thorough review of the WMI repository to identify and remove any unauthorized namespaces or classes that may have been created by the attacker.
- Remove any malicious MOF files from the system to prevent re-execution.
- Restore the system from a known good backup if unauthorized changes to the WMI repository or system files are detected.
- Monitor for any recurrence of similar activity by setting up alerts for unusual mofcomp.exe executions and unauthorized WMI modifications.
- Escalate the incident to the security operations center (SOC) or incident response team for further investigation and to determine if additional systems are affected."""


