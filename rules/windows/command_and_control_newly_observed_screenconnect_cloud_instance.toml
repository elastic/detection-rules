[metadata]
creation_date = "2026/09/22"
integration = ["endpoint"]
maturity = "production"
min_stack_comments = "LIMIT <N> BY was introduced in 9.4.0 as Tech Preview."
min_stack_version = "9.4.0"
updated_date = "2026/09/22"

[rule]
author = ["Elastic"]
description = """
Identifies a ScreenConnect unattended-access client running as Guest for an official cloud instance with no such
activity in the previous 5 days. Attackers use new or disposable instances to gain remote access through vendor-owned
infrastructure. The event shows the instance configured on the client, not a completed remote session.
"""
false_positives = [
    """
    Authorized ScreenConnect trials, new cloud tenants, managed service provider deployments, or planned instance
    changes can trigger this rule.
    """,
]
from = "now-5d"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Newly Observed ScreenConnect Cloud Instance"
references = [
    "https://www.microsoft.com/en-us/security/blog/2024/05/15/threat-actors-misusing-quick-assist-in-social-engineering-attacks-leading-to-ransomware/",
    "https://redcanary.com/blog/security-operations/rmm-detection/",
    "https://www.huntress.com/blog/w2-malvertising-to-kernel-mode-edr-kill",
    "https://www.huntress.com/blog/phishing-bitb-rmm-attacks",
    "https://www.esentire.com/blog/phantomcontrol-returns-with-ande-loader-and-swaetrat",
    "https://thedfirreport.com/2023/09/25/from-screenconnect-to-hive-ransomware-in-61-hours/",
]
risk_score = 47
rule_id = "715b30d8-36a2-4fe1-bdc0-fd86a2d6efc2"
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Platform: Windows",
    "Rule Type: ES|QL",
    "Use Case: Threat Detection",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Threat: Remote Management Tool Abuse",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-endpoint.events.process-* METADATA _id, _index, _version
| WHERE
    host.os.type == "windows" AND
    event.category == "process" AND
    event.type == "start" AND
    (
      process.name.caseless == "ScreenConnect.ClientService.exe" or
      process.code_signature.subject_name IN ("ConnectWise, LLC", "Connectwise, LLC", "ConnectWise, Inc.")
    ) AND
    TO_LOWER(process.command_line) like "*e=access*" AND
    TO_LOWER(process.command_line) like "*y=guest*"
| GROK process.command_line """h=(?<Esql.screenconnect_instance>[^&]+)"""

// Tag the event as current or historical based on ingest time, falling back to @timestamp.
| EVAL
    Esql.screenconnect_instance = TO_LOWER(Esql.screenconnect_instance),
    Esql.observed_at = COALESCE(event.ingested, @timestamp),
    Esql.is_current = Esql.observed_at >= NOW() - 5 minutes AND Esql.observed_at < NOW(),
    Esql.is_historical = Esql.observed_at < NOW() - 5 minutes
| WHERE
    Esql.screenconnect_instance LIKE "*.screenconnect.com" AND
    Esql.screenconnect_instance != "screenconnect.com"
| INLINE STATS
    Esql.current_event_count = COUNT(*) WHERE Esql.is_current,
    Esql.historical_event_count = COUNT(*) WHERE Esql.is_historical,
    Esql.current_host_count = COUNT_DISTINCT(host.id) WHERE Esql.is_current,
    Esql.current_host_id_values = VALUES(host.id) WHERE Esql.is_current,
    Esql.current_host_name_values = VALUES(host.name) WHERE Esql.is_current,
    Esql.current_user_name_values = VALUES(user.name) WHERE Esql.is_current
  BY Esql.screenconnect_instance

// Only alert if the instance has no earlier event in the 5-day window.
| WHERE
    Esql.is_current AND
    Esql.current_event_count > 0 AND
    Esql.historical_event_count == 0

// Keep the earliest current source event for the instance.
| SORT Esql.observed_at ASC, _index ASC, _id ASC
| LIMIT 1 BY Esql.screenconnect_instance

| KEEP
    @timestamp, _id, _index, _version, event.action, event.type, event.ingested, data_stream.dataset,
    data_stream.namespace, host.id, host.name, user.id, user.name, user.domain, process.entity_id, process.name,
    process.executable, process.command_line, process.hash.sha256, process.pe.original_file_name,
    process.code_signature.subject_name, process.code_signature.trusted, process.parent.entity_id, process.parent.name,
    process.parent.executable, process.parent.command_line, process.Ext.session_info.logon_type,
    Esql.screenconnect_instance, Esql.current_event_count, Esql.current_host_count, Esql.current_host_id_values,
    Esql.current_host_name_values, Esql.current_user_name_values
'''

setup = """
## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""

note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Newly Observed ScreenConnect Cloud Instance

#### Possible investigation steps

- Which source process events produced this grouped alert?
  - Why: this ES|QL alert retains one concrete process event and alert-local summaries for all current events that
    referenced the same complete, lowercased instance hostname. ES|QL alerts do not provide the **Investigate in
    timeline** button, and the process event proves client configuration rather than authentication, session success,
    or operator activity.
  - Focus: recover the matching process start using `host.id` and `process.entity_id` from
    `logs-endpoint.events.process-*`. Then search the 5-day alert window for the complete hostname in
    `process.command_line` and recover `@timestamp`, `host.name`, `user.name`, and the complete command line for every
    matching source event. If `process.entity_id` is missing, fall back to `host.id`, the complete instance hostname,
    and a tight time range; keep the process attribution unresolved if more than one event remains.
  - Hint: if Elastic Defend ingestion metadata is present, compare `event.ingested` with `@timestamp` to identify
    delayed arrival. Use the retained source-process pivot first, then repeat the manual search for every summarized
    host.
  - $investigate_0
  - Implication: exact command lines confirm whether the observations belong to one rollout or support workflow and
    whether the client ran as Guest, Host, Access, or Support. Missing member events or an unexpected user or host
    leaves the alert unresolved.

- What does the alert establish about the newly observed instance and its initial spread?
  - Focus: if the alert-local Elastic Defend summaries are present, read `Esql.screenconnect_instance`,
    `Esql.current_event_count`, `Esql.current_host_count`, `Esql.current_host_name_values`,
    `Esql.current_host_id_values`, and `Esql.current_user_name_values`. The standard `host.*`, `user.*`, and
    `process.*` fields describe the earliest retained current source event; the `Esql.*` arrays summarize all current
    events for the instance.
  - Implication: an unplanned instance appearing on multiple hosts or in both Guest and Host roles increases concern;
    a single Guest or Support-mode event is narrower but is not automatically benign. A trial-style hostname is not
    malicious by itself, and absent summary values are a telemetry gap rather than benign evidence.

- Is the ScreenConnect client authentic, and does its execution context match an approved deployment?
  - Focus: separate identity from disposition. Confirm `process.executable`, `process.hash.sha256`,
    `process.pe.original_file_name`, `process.code_signature.subject_name`, and `process.code_signature.trusted`, then
    assess `process.parent.executable`, `process.parent.command_line`, and
    `process.Ext.session_info.logon_type` for the retained event and each additional source event.
  - Implication: the trusted ConnectWise signature supports binary identity but does not establish authorization.
    User-writable paths, unexpected interactive launchers, mismatched hashes, or execution on hosts outside the
    managed population increase concern; a consistent service deployment lowers concern only when the instance is
    also authorized.

- Did the client resolve and contact infrastructure consistent with the parsed cloud instance?
  - Focus: if Elastic Defend network telemetry is present, query network events for the retained `host.id` and
    `process.entity_id` and recover DNS `lookup_result` events with `dns.question.name` and `dns.resolved_ip`. Then
    recover connection events for the same process and host with `destination.ip` and `destination.port`.
    Recover `destination.as.organization.name` from those connection events when present. Repeat the pivot for each process entity recovered from the source-event
    search.
  - $investigate_1
  - Implication: matching DNS and connection events corroborate network use but still do not prove a successful remote
    session. Connections without matching DNS may reflect caching, direct addressing, or collection gaps. Missing
    network telemetry is unresolved, not benign.

- Do Windows service events or other endpoint telemetry show installation, persistence, or operator follow-on?
  - Focus: review Windows service-installation events such as event code 7045 on the retained host, checking the
    service name and image path for the same instance. Repeat on every summarized host and review nearby Elastic
    Defend or Sysmon process, file, registry, and network events for child processes, persistence, downloads, or
    credential access tied to the recovered ScreenConnect process entities.
  - $investigate_2
  - Implication: a new service and consistent installation chain can explain deployment timing; unexpected services,
    suspicious descendants, or adjacent persistence and credential activity increase concern. Absence of service or
    Sysmon events is not clearance because those sources may be unavailable and some support clients are not
    installed as services.

- Is the instance and surrounding activity authorized, and is there evidence of broader compromise?
  - Focus: verify the exact full instance hostname with the asset owner, support team, managed service provider, and
    change records. Confirm the expected operators, client roles, target hosts, and support window. Review related
    alerts on the retained host, then repeat for every summarized host and look for delivery, persistence,
    credential-access, remote-access, or defense-evasion activity around `event.ingested` on the retained event.
  - $investigate_3
  - Implication: close as benign only when the exact instance ownership, hosts, users, roles, deployment chain, and
    timing align with an approved workflow. Escalate when the instance is unknown or denied, appears outside the
    approved population, or is accompanied by suspicious execution or follow-on. Keep mixed or incomplete evidence
    unresolved and preserve it for escalation.

### False positive analysis

- Legitimate new cloud tenants, temporary support sessions, trials, and managed service provider deployments are the
  main expected false positives. Confirm authorization for the exact full instance hostname; authorization of the
  shared `screenconnect.com` domain is not sufficient.
- Prefer a narrow rule exception on the exact instance value within `process.command_line`, combined with stable
  client identity or an approved host group when possible. Do not exclude all `*.screenconnect.com` traffic, all
  ConnectWise-signed processes, or a single host without confirming the instance, because those exceptions would
  suppress the abuse pattern this rule is intended to surface.

### Response and remediation

- If the instance is confirmed benign, document its exact hostname, owner, approved host population, expected roles,
  and deployment method before creating a narrow exception. Revalidate temporary trial or support exceptions after
  the approved window ends.
- If suspicious or unresolved, preserve the full process command lines, entity IDs, hashes, signer details, service
  configuration, DNS results, destination IPs, and related alerts. Consider temporarily blocking the exact instance
  hostname while ownership is verified. Isolate affected hosts only when the observed risk and asset role justify the
  operational impact.
- If confirmed malicious, isolate affected hosts where appropriate, revoke the attacker's ScreenConnect access,
  block the exact instance and confirmed relay IPs, remove unauthorized clients and persistence, and rotate credentials
  exposed during the remote-access window. Review all hosts in `Esql.current_host_id_values` and hunt for the same
  instance, installer, hashes, services, and follow-on activity across the environment.
"""

[rule.investigation_fields]
field_names = [
    "Esql.screenconnect_instance",
    "Esql.current_event_count",
    "Esql.current_host_count",
    "Esql.current_host_id_values",
    "Esql.current_host_name_values",
    "Esql.current_user_name_values",
    "host.id",
    "host.name",
    "user.name",
    "process.entity_id",
    "process.executable",
    "process.command_line",
]

[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1219"
name = "Remote Access Tools"
reference = "https://attack.mitre.org/techniques/T1219/"
[[rule.threat.technique.subtechnique]]
id = "T1219.002"
name = "Remote Desktop Software"
reference = "https://attack.mitre.org/techniques/T1219/002/"



[rule.threat.tactic]
id = "TA0011"
name = "Command and Control"
reference = "https://attack.mitre.org/tactics/TA0011/"

[[transform.investigate]]
label = "Process events for the retained ScreenConnect client"
description = ""
providers = [
  [
    { excluded = false, field = "process.entity_id", queryType = "phrase", value = "{{process.entity_id}}", valueType = "string" },
    { excluded = false, field = "host.id", queryType = "phrase", value = "{{host.id}}", valueType = "string" },
    { excluded = false, field = "event.category", queryType = "phrase", value = "process", valueType = "string" }
  ]
]
relativeFrom = "now-1h"
relativeTo = "now"

[[transform.investigate]]
label = "Network events for the retained ScreenConnect client"
description = ""
providers = [
  [
    { excluded = false, field = "process.entity_id", queryType = "phrase", value = "{{process.entity_id}}", valueType = "string" },
    { excluded = false, field = "host.id", queryType = "phrase", value = "{{host.id}}", valueType = "string" },
    { excluded = false, field = "event.category", queryType = "phrase", value = "network", valueType = "string" }
  ]
]
relativeFrom = "now-1h"
relativeTo = "now"

[[transform.investigate]]
label = "Windows service installation events for the host"
description = ""
providers = [
  [
    { excluded = false, field = "host.id", queryType = "phrase", value = "{{host.id}}", valueType = "string" },
    { excluded = false, field = "event.code", queryType = "phrase", value = "7045", valueType = "string" }
  ]
]
relativeFrom = "now-1h"
relativeTo = "now"

[[transform.investigate]]
label = "Alerts associated with the host"
description = ""
providers = [
  [
    { excluded = false, field = "event.kind", queryType = "phrase", value = "signal", valueType = "string" },
    { excluded = false, field = "host.id", queryType = "phrase", value = "{{host.id}}", valueType = "string" }
  ]
]
relativeFrom = "now-48h/h"
relativeTo = "now"
