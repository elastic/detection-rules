[metadata]
creation_date = "2026/11/23"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/23"

[rule]
author = ["Elastic"]
description = """
Identifies grep, ripgrep, findstr, or similar search utilities invoked with a pattern set spanning multiple credential
families (cloud keys, source-control tokens, LLM API keys, private keys, chat webhooks) against either GenAI client
session stores (Claude Code, Codex, Cursor chat history) or well-known credential locations such as ~/.ssh, ~/.aws,
~/.kube, and user profile roots. Session stores persist everything a user or agent has processed, including credentials
pasted into prompts or printed in tool output, making them a high-yield target for infostealers, malicious packages,
and hijacked or prompt-injected agents. Quiet-mode scans that return only an exit code, as used by pre-commit hooks
and prompt guards, are excluded.
"""
false_positives = [
    """
    Security audits of local agent transcripts and pre-publication leak checks that print matches (no quiet flag)
    use the same utilities and credential patterns. Scope exceptions to a known parent, user, or command line.
    """,
]
from = "now-9m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Multi-Family Secret Sweep via grep/ripgrep of Credential Stores"
note = """## Triage and analysis

### Investigating Multi-Family Secret Sweep via grep/ripgrep of Credential Stores

A search utility (`rg`, `grep`, `egrep`, `fgrep`, `ggrep`, `ag`, `ack`, or `findstr`) started with a command line that
names several distinct credential families and points at either a GenAI client session store or a known credential
location. Session stores (Claude Code projects, Codex sessions, Cursor chats, VS Code `state.vscdb`) retain prompts and
tool output, including secrets a user or agent pasted or printed. The credential-location branch covers conventional
hunting of SSH, cloud, Kubernetes, and user-profile roots and requires more families before it alerts.

`Esql.credential_family_count` is how many of these families appear: AWS, GitHub, GitLab, Slack, LLM provider keys,
Google, Stripe, SendGrid, JWT, private-key banners, database URLs, and Elastic API keys. Generic words such as
`password` do not count. `Esql.ai_session_store` is true when the target is an agent session path. Two families are
enough there. `Esql.sensitive_target` is true for credential directories and profile roots, which require four families.
`Esql.severity_hint` is `high` for session-store hits and for sweeps that print matching values, and `medium` for
filename-only sweeps of credential paths.

### Possible investigation steps

- Review `process.command_line` for the patterns, the target path, and whether the scan is recursive (`Esql.recursive`) or prints values (`Esql.extracts_values`) rather than filenames (`Esql.lists_files`).
- Review `process.parent.command_line`, `process.parent.name`, and `process.Ext.effective_parent.name`. `Esql.ai_client_parent` marks a GenAI client parent. `Esql.agent_shell_parent` marks a `sh -c` / `sh -lc` parent used by scripted agents.
- On the same host and user, look for archive creation, outbound transfers, or cloud CLI use in the minutes after the scan.
- When `Esql.ai_session_store` is true, open the targeted transcript or `mcp.json` and identify which credentials were stored there.

### False positive analysis

- A developer or security tool can grep agent transcripts or a home directory for secrets before publishing code. Confirm the parent process and whether the user expected the scan.
- Quiet scans (`-q`, `--quiet`, `--silent`, including bundled flags such as `-q`) are excluded. A hook that omits the quiet flag and still names several credential families against a session store or credential path will alert.
- `store.db` is matched as an agent state database. A multi-family pattern aimed at an unrelated `store.db` qualifies for the session-store branch. Scope an exception to that path, parent, or user.

### Response and remediation

- If the scan is unapproved, stop the search process and its parent, and isolate the host from networks that hold the targeted accounts.
- Rotate credentials for every family present on the command line, including cloud keys, source-control tokens, LLM API keys, and private keys that the session store or credential path may contain.
- Hunt the same command line and parent on other hosts. Remove a malicious package, extension, or prompt-injected agent that launched the sweep.
"""
references = [
    "https://attack.mitre.org/techniques/T1552/001/",
    "https://attack.mitre.org/techniques/T1083/",
    "https://atlas.mitre.org/techniques/AML.T0055/",
]
risk_score = 73
rule_id = "10993fa7-2527-41f1-aa94-c01928eebe7b"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "Domain: GenAI",
    "OS: Linux",
    "OS: Windows",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Tactic: Discovery",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
    "Platform: Windows",
    "Platform: Linux",
    "Platform: macOS",
    "Mitre Atlas: AML.T0055",
]
timestamp_override = "event.ingested"
type = "esql"
query = '''
FROM logs-endpoint.events.process-* METADATA _id, _version, _index
| WHERE KQL("""event.category:process and event.type:start and process.name:(rg or rg.exe or grep or egrep or fgrep or ggrep or ag or ack or findstr.exe)""")

// Trailing space lets every flag and path regex terminate on a space.
| EVAL oc = CONCAT(COALESCE(process.command_line, ""), " ")
| EVAL c = TO_LOWER(oc)
// Drop --exclude / --exclude-dir so an excluded path is not treated as a target.
| EVAL c_t = REPLACE(c, "--exclude(-dir)?=[^ ]+ ", " ")

// Credential families. Generic words such as "password" are intentionally omitted.
| EVAL f_aws = CASE(c RLIKE """.*(akia|asia\[|aws_secret_access_key|aws_access_key_id).*""", 1, 0)
| EVAL f_github = CASE(c RLIKE """.*(github_pat_|ghp_|gho_|\(ghp\||gh\[pousr\]).*""", 1, 0)
| EVAL f_gitlab = CASE(c RLIKE """.*glpat-.*""", 1, 0)
| EVAL f_slack = CASE(c RLIKE """.*(xox|xapp-|hooks\.slack\.com).*""", 1, 0)
| EVAL f_llm = CASE(c RLIKE """.*(sk-ant|sk-proj|sk-\(|sk-\[).*""", 1, 0)
| EVAL f_google = CASE(c RLIKE """.*(aiza|ya29).*""", 1, 0)
| EVAL f_stripe = CASE(c RLIKE """.*(sk_live|rk_live|rk\)_live).*""", 1, 0)
| EVAL f_sendgrid = CASE(c RLIKE """.*sg(\\)?\.\[.*""", 1, 0)
| EVAL f_jwt = CASE(c RLIKE """.*eyj.*""", 1, 0)
| EVAL f_pem = CASE(c RLIKE """.*private key.*""", 1, 0)
| EVAL f_db = CASE(c RLIKE """.*(postgres|mysql|mongodb|redis|amqp).*://.*""", 1, 0)
| EVAL f_elastic = CASE(c RLIKE """.*(essa_|essu_|ess\[au\]).*""", 1, 0)
| EVAL Esql.credential_family_count = f_aws + f_github + f_gitlab + f_slack + f_llm + f_google + f_stripe + f_sendgrid + f_jwt + f_pem + f_db + f_elastic

// Output mode. Original case: -o extracts values, -O does not. -l/-L/-c override -o.
| EVAL quiet = oc RLIKE """.*[ ](-[a-zA-Z]*q[a-zA-Z]*|--quiet|--silent)[ ].*"""
| EVAL extracts = oc RLIKE """.*[ ](-[a-zA-Z]*o[a-zA-Z]*|--only-matching)[ ].*"""
| EVAL Esql.recursive = oc RLIKE """.*[ ](-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)[ ].*"""
| EVAL Esql.lists_files = oc RLIKE """.*[ ](-[a-zA-Z]*[lLc][a-zA-Z]*|--files-with-matches|--files-without-match|--count)[ ].*"""
| EVAL Esql.extracts_values = extracts AND NOT Esql.lists_files

| EVAL Esql.ai_session_store = c_t RLIKE """.*(\.cursor(/|\\)chats|\.cursor(/|\\)mcp\.json|\.claude(/|\\)projects|\.codex(/|\\)sessions|\.pi(/|\\)agent|state\.vscdb|store\.db).*"""
| EVAL Esql.sensitive_target = c_t RLIKE """.*(\.ssh|\.aws|\.kube|\.gnupg|\.netrc|\.npmrc|\.docker(/|\\)config|\.git-credentials|(--include=|[ /\\])\.env[ ./\\]|library(/|\\)application support|library(/|\\)keychains|appdata(/|\\)(roaming|local)|[ ]\~/?[ ]|[ ]/users/[^/ ]+/?[ ]|[ ]/home/[^/ ]+/?[ ]|[ ]c:(/|\\)users(/|\\)?[ ]).*"""

// Enrichment only. These fields do not gate the alert.
| EVAL Esql.ai_client_parent = TO_LOWER(COALESCE(process.Ext.effective_parent.name, "")) RLIKE """.*(cursor|claude|codex|chatgpt|antigravity|windsurf|copilot|gemini).*"""
| EVAL Esql.agent_shell_parent = COALESCE(process.parent.command_line, "") RLIKE """.*sh -l?c .*"""

// Session stores alert on two families. Other credential locations require four.
| WHERE NOT quiet AND ((Esql.ai_session_store AND Esql.credential_family_count >= 2) OR (Esql.sensitive_target AND Esql.credential_family_count >= 4))
| EVAL Esql.severity_hint = CASE(
    Esql.ai_session_store, "high",
    Esql.sensitive_target AND Esql.extracts_values, "high",
    "medium")
| KEEP @timestamp, host.name, host.id, host.os.type, user.name,
  Esql.severity_hint, Esql.credential_family_count,
  Esql.extracts_values, Esql.lists_files, Esql.recursive,
  Esql.ai_session_store, Esql.sensitive_target, Esql.ai_client_parent, Esql.agent_shell_parent,
  process.executable, process.command_line,
  process.parent.name, process.parent.command_line, process.parent.entity_id,
  process.Ext.effective_parent.name, process.Ext.effective_parent.executable,
  process.Ext.ancestry, _id, _index, _version
'''

[rule.investigation_fields]
field_names = [
    "host.name",
    "host.os.type",
    "user.name",
    "process.executable",
    "process.command_line",
    "process.parent.name",
    "process.parent.command_line",
    "process.Ext.effective_parent.name",
    "Esql.credential_family_count",
    "Esql.severity_hint",
    "Esql.ai_session_store",
    "Esql.sensitive_target",
    "Esql.extracts_values",
    "Esql.recursive",
]

