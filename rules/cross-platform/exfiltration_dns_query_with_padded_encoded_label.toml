[metadata]
creation_date = "2026/11/18"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/11/18"

[rule]
author = ["Elastic"]
description = """
Identifies a DNS lookup on a Linux or macOS host or a DNS query tool such as dig or nslookup, for a name that
contains a label ending in Base64 or Base32 padding. The equals sign is not valid in a hostname, so a padded label
indicates that a program placed encoded data in the query name. Adversaries encode data into DNS labels to
exfiltrate it or to communicate with a command and control server through the resolver.
"""
from = "now-9m"
index = ["logs-endpoint.events.network-*", "logs-endpoint.events.process-*"]
language = "eql"
license = "Elastic License v2"
name = "DNS Query with Padded Encoded Label"
note = """## Triage and analysis

### Investigating DNS Query with Padded Encoded Label

Base64 and Base32 output is padded with one or more `=` characters when the input length is not a multiple of the encoding block size. Hostnames cannot legitimately contain `=`, so a query such as `dGhpcyBpcyBhIHNlY3JldAo=.example.com` shows that a process built the name from encoded data. This is the simplest form of DNS exfiltration: the data leaves the host in the query name and reaches the authoritative server of the attacker-controlled domain even when the lookup fails. The rule matches any process, so it also covers programs that resolve the name themselves instead of calling `dig`, `nslookup` or `host`.

### Possible investigation steps

- Decode the padded label in `dns.question.name` to see what data was placed in the query, and note the parent domain that received it.
- Review `process.executable`, `process.command_line` and the parent process to identify what issued the lookup. A system resolver such as `mDNSResponder` or `systemd-resolved` may appear when it forwards the query for another program.
- Search process events on the host around the alert time for `dig`, `nslookup`, `host`, `curl` or a shell that pipes data through `base64`, `base32` or `xxd` into a hostname.
- Check the reputation and registration date of the parent domain and whether other hosts queried it.
- Look for further lookups from the same process with different encoded labels, which indicates that a larger payload was sent in chunks.

### False positive analysis

- No legitimate hostname contains `=`. Matches normally come from security testing, from scripts that build a URL from encoded data, or from a user who pastes an encoded string into a tool that resolves it.
- If an internal tool is confirmed to generate such names, add an exception for its `process.executable` together with the parent domain.

### Response and remediation

- If the activity is not authorized, isolate the host and identify the data that was encoded into the query names.
- Block the destination domain at the resolver and search DNS logs for other hosts that queried it.
- Terminate the process that issued the lookups and remove the script or binary that started it.
- Rotate any credentials or secrets found in the decoded labels and review the host for the access that preceded the exfiltration.
"""
references = [
    "https://attack.mitre.org/techniques/T1048/003/",
]
risk_score = 47
rule_id = "e44a185d-b6ed-4347-94f2-8756acfaa38f"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Exfiltration",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Linux",
    "Platform: macOS",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
any where host.os.type in ("linux", "macos") and 
(
 (
  event.action in ("lookup_requested", "lookup_result") and
  dns.question.name regex """.*[A-Za-z0-9+/]{2,}={1,6}\.[A-Za-z0-9\-]+.*"""
 ) or
 (
  event.category == "process" and event.type == "start" and event.action == "exec" and
  process.name in ("dig", "nslookup") and
  process.args regex """.*[A-Za-z0-9+/]{2,}={1,6}\.[A-Za-z0-9\-]+.*"""
 )
)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1048"
name = "Exfiltration Over Alternative Protocol"
reference = "https://attack.mitre.org/techniques/T1048/"
[[rule.threat.technique.subtechnique]]
id = "T1048.003"
name = "Exfiltration Over Unencrypted Non-C2 Protocol"
reference = "https://attack.mitre.org/techniques/T1048/003/"



[rule.threat.tactic]
id = "TA0010"
name = "Exfiltration"
reference = "https://attack.mitre.org/tactics/TA0010/"
[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1071"
name = "Application Layer Protocol"
reference = "https://attack.mitre.org/techniques/T1071/"
[[rule.threat.technique.subtechnique]]
id = "T1071.004"
name = "DNS"
reference = "https://attack.mitre.org/techniques/T1071/004/"


[[rule.threat.technique]]
id = "T1132"
name = "Data Encoding"
reference = "https://attack.mitre.org/techniques/T1132/"
[[rule.threat.technique.subtechnique]]
id = "T1132.001"
name = "Standard Encoding"
reference = "https://attack.mitre.org/techniques/T1132/001/"



[rule.threat.tactic]
id = "TA0011"
name = "Command and Control"
reference = "https://attack.mitre.org/tactics/TA0011/"

[rule.alert_suppression]
group_by = ["host.id", "dns.question.name"]
missing_fields_strategy = "doNotSuppress"

[rule.alert_suppression]
group_by = ["host.id", "process.executable"]
missing_fields_strategy = "doNotSuppress"

[rule.alert_suppression.duration]
unit = "h"
value = 1

