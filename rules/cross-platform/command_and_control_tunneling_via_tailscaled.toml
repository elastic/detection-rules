[metadata]
creation_date = "2026/07/29"
integration = ["endpoint", "windows", "sentinel_one_cloud_funnel", "m365_defender", "system", "crowdstrike"]
maturity = "production"
updated_date = "2026/07/29"

[rule]
author = ["Elastic"]
description = """
Identifies the use of Tailscaled to potentially tunnel network traffic. This can be used by attackers to enable
routing of network packets that would otherwise not reach their intended destination, or to bypass network restrictions
and/or hide traffic from network monitoring.
"""
from = "now-9m"
index = [
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-endpoint.events.process-*",
    "logs-m365_defender.event-*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-system.security*",
    "logs-windows.sysmon_operational-*",
    "winlogbeat-*",
    "auditbeat-*"
]
language = "eql"
license = "Elastic License v2"
name = "Potential Tunneling via Tailscaled"
references = [
    "https://huggingface.co/blog/agent-intrusion-technical-timeline",
]
risk_score = 47
rule_id = "482a5584-4ce4-4838-b806-0839a39b004f"
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "OS: Linux",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Command and Control",
    "Data Source: Elastic Endgame",
    "Data Source: Elastic Defend",
    "Data Source: Sysmon",
    "Data Source: SentinelOne",
    "Data Source: Microsoft Defender XDR",
    "Data Source: Windows Security Event Logs",
    "Data Source: Crowdstrike",
]
timestamp_override = "event.ingested"
type = "eql"
query = '''
process where event.type == "start" and
process.name like~ ("tailscaled", "tailscaled.exe") and
process.args like~ ("*--socks5-server*", "*--outbound-http-proxy-listen*")
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1090"
name = "Proxy"
reference = "https://attack.mitre.org/techniques/T1090/"

[[rule.threat.technique]]
id = "T1219"
name = "Remote Access Tools"
reference = "https://attack.mitre.org/techniques/T1219/"

[[rule.threat.technique]]
id = "T1572"
name = "Protocol Tunneling"
reference = "https://attack.mitre.org/techniques/T1572/"

[rule.threat.tactic]
id = "TA0011"
name = "Command and Control"
reference = "https://attack.mitre.org/tactics/TA0011/"
