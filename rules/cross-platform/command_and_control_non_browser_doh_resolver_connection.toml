[metadata]
creation_date = "2026/08/05"
integration = ["endpoint"]
maturity = "development"
updated_date = "2026/08/06"

[rule]
author = ["clivoa"]
description = """
This rule detects a non-browser process establishing a direct TLS connection to a well-known DNS-over-HTTPS (DoH)
resolver IP (Cloudflare, Google, Quad9). C2 frameworks and tunneling tools that support DoH (e.g. Sliver, dnscat2)
can use it to bypass classic DNS-based monitoring and tunneling detection, since the query traffic is wrapped in
ordinary-looking HTTPS. Confirmed as a genuine gap before building: Elastic's only DoH-related rule
(`defense_evasion_dns_over_https_enabled`) detects a *browser* being configured to enable DoH (a Windows registry
change), not a non-browser process *using* DoH as a channel; the DNS-tunneling ML job
(`command_and_control_ml_dns_tunneling`) analyzes classic port-53 DNS query volume and would not see DoH traffic at
all, since it never appears as DNS protocol traffic on the wire.
"""
false_positives = [
    """
    Increasingly, non-browser system components and CLI tools (`curl`, package managers, some VPN clients) support
    DoH natively or resolve via a system-wide DoH-enabled resolver. This rule only tests direct connections to a
    small set of public DoH IPs, which is far narrower than "any DNS resolution happened via DoH" — but a
    legitimate CLI tool explicitly configured to query a public DoH resolver directly would still match. Investigate
    the specific process and its configuration before escalating.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.network*"]
language = "eql"
license = "Elastic License v2"
name = "Non-Browser Process Connecting to a DNS-over-HTTPS Resolver"
note = """## Triage and analysis

### Investigating Non-Browser Process Connecting to a DNS-over-HTTPS Resolver

This rule detects a non-browser process establishing a direct TLS connection (port 443) to one of a small set of
well-known public DoH resolver IPs (Cloudflare `1.1.1.1`/`1.0.0.1`, Google `8.8.8.8`/`8.8.4.4`, Quad9
`9.9.9.9`/`149.112.112.112`). DoH wraps DNS queries inside ordinary HTTPS, so a process using it as a C2 or
tunneling channel is invisible to classic port-53 DNS monitoring and to DNS-tunneling volume/entropy analysis.

### Possible investigation steps

- Identify the process (`process.name`, `process.executable`, `process.command_line`) and confirm it is not a
  browser, VPN client, or package manager known to use DoH legitimately in this environment.
- Check `process.parent.name` and the wider process ancestry for signs of an unexpected parent (e.g. a script
  interpreter, office application, or web-server worker rather than a normal user-invoked binary).
- Review other network activity from the same process/host around the same time for a broader beaconing or
  tunneling pattern (regular interval, consistent destination, growing/repeating payload sizes).
- If the host has endpoint visibility into TLS metadata (JA3/JA4), compare the client fingerprint against known
  legitimate tools versus known C2/tunneling toolkits.
- Check whether the destination IP is reachable directly (not via the host's configured system resolver), which is
  the specific behavior this rule targets.

### False positive analysis

- Some CLI tools and system daemons (e.g. `curl` invoked with an explicit DoH flag, certain VPN clients, some
  package managers) support DoH natively and may query these same public resolver IPs directly and legitimately.
- Environments that intentionally standardize on a public DoH resolver for all endpoints will see routine,
  benign matches — this needs environment-specific tuning (e.g. excluding an approved DoH client) rather than
  broad suppression.
- Investigate the specific process and its configuration/known purpose before escalating, per the tension noted
  above.

### Response and remediation

- If the connection is confirmed unauthorized, isolate the host and investigate the initiating process for signs
  of a C2 implant or tunneling tool.
- Block direct egress to the listed DoH resolver IPs at the network layer if business processes do not require
  system-wide DoH except through an approved, monitored path.
- Review the process's full execution history and any files it wrote or read around the connection time.
"""
references = [
    "https://attack.mitre.org/techniques/T1071/004/",
]
risk_score = 21
rule_id = "238232f5-d181-4380-8239-bf76dcbf64d1"
setup = """## Setup

This rule requires data coming in from Elastic Defend.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a Linux System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, either "Traditional Endpoints" or "Cloud Workloads".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/8.10/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "OS: macOS",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
]
type = "eql"

query = '''
network where event.action == "connected-to" and destination.port == 443 and
  cidrMatch(destination.ip, "1.1.1.1/32", "1.0.0.1/32", "8.8.8.8/32", "8.8.4.4/32", "9.9.9.9/32", "149.112.112.112/32") and
  not process.name in ("firefox", "chrome", "chromium", "msedge", "brave", "opera", "safari")
'''

