[metadata]
creation_date = "2026/10/16"
integration = ["endpoint"]
maturity = "production"
min_stack_comments = "Changing min stack to 9.3.0, the latest minimum supported version for 9.X releases."
min_stack_version = "9.3.0"
updated_date = "2026/10/16"

[rule]
author = ["1r0dm480", "Elastic"]
description = """
Identifies a high volume of file creation or modification events on a USB storage device by the same user and host. This
activity may indicate bulk copying of files to removable media, which is a common technique for data exfiltration over
physical medium. The rule uses a threshold of 500 file events with at least 200 distinct file paths within the lookback
window, grouped by user and host.
"""
from = "now-6m"
index = ["logs-endpoint.events.file-*"]
language = "kuery"
license = "Elastic License v2"
name = "Potential Data Exfiltration via USB Storage Device \u2014 High Volume"
note = """## Triage and analysis

### Investigating Potential Data Exfiltration via USB Storage Device — High Volume

USB storage devices are commonly used for data transfers but can be abused by adversaries or malicious insiders to exfiltrate sensitive data in bulk. This rule fires when a single user on a single host generates a high number of file creation or modification events targeting a USB device, across many distinct file paths, within a short time window.

#### Possible investigation steps

- Identify the user and endpoint from the `user.name` and `host.name` fields. Determine if the user has a legitimate need to transfer large volumes of data to USB media.
- Examine the `file.path` values to understand what types of files were written — documents, databases, source code, or other sensitive material.
- Check for a preceding USB device mount event (`event.action: mount` with `volume.removable: true`) on the same host to identify the specific device and its serial number.
- Correlate with DLP or device control logs to determine if the USB device is approved or known.
- Review other recent activity by the same user — process execution, network connections, file share access — for signs of data staging or collection.
- Check whether the activity occurred during normal working hours or at an unusual time.

#### False positive analysis

- Legitimate bulk file transfers to approved USB devices (e.g., copying project files for offline work) can trigger this rule. Exclude specific users or hosts that routinely perform these activities.
- Backup or data migration jobs that write to USB storage as part of an approved IT workflow may cause alerts. Whitelist known backup processes or host-device combinations.
- IT maintenance, forensic imaging, or asset provisioning involving large-scale file writes to removable media should be documented. Create exceptions based on user, host, or device identifiers.
- Software distribution via USB in air-gapped environments may generate high-volume file events. Establish baselines and exclude known distribution hosts.

#### Response and remediation

- Contact the user to verify whether the file transfer was authorized.
- If the transfer is unauthorized or suspicious, instruct the user to disconnect the USB device and preserve it for forensic analysis.
- Isolate the affected endpoint if there are signs of broader compromise.
- If sensitive data was confirmed copied, initiate the data breach response procedures.
- Block the USB device by serial number using Elastic Defend Device Control policies.
- Review and tighten USB device control policies to restrict removable media usage to approved devices only.
"""
references = [
    "https://attack.mitre.org/techniques/T1052/",
    "https://attack.mitre.org/techniques/T1052/001/",
    "https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/cross-platform/initial_access_exfiltration_new_usb_device_mounted",
    "https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/ded/exfiltration_ml_high_bytes_written_to_external_device",
]
risk_score = 73
rule_id = "3fa20c7c-cf34-4414-bfa7-85e0ceb48a7c"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend

### Additional notes

- This rule relies on the `file.Ext.device.bus_type` field, which is populated by Elastic Defend for file events on Windows endpoints. Ensure file event collection is enabled in the integration policy.
- The threshold values (500 events, 200 distinct file paths) and lookback window (6 minutes) may need tuning based on normal file activity in your environment.
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Exfiltration",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Noise: Medium",
    "Performance: Normal",
    "Rule Type: Threshold",
    "Platform: Windows",
]
timestamp_override = "event.ingested"
type = "threshold"

query = '''
data_stream.dataset : "endpoint.events.file" and event.category : "file" and event.type : ("creation" or "change") and file.Ext.device.bus_type : "Usb"
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1052"
name = "Exfiltration Over Physical Medium"
reference = "https://attack.mitre.org/techniques/T1052/"
[[rule.threat.technique.subtechnique]]
id = "T1052.001"
name = "Exfiltration over USB"
reference = "https://attack.mitre.org/techniques/T1052/001/"



[rule.threat.tactic]
id = "TA0010"
name = "Exfiltration"
reference = "https://attack.mitre.org/tactics/TA0010/"

[rule.threshold]
field = ["user.name", "host.name"]
value = 500
[[rule.threshold.cardinality]]
field = "file.path"
value = 200


