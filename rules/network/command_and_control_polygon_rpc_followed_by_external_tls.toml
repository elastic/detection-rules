field_names = [
    "Esql.client_ip",
    "Esql.first_rpc",
    "Esql.rpc_name_values",
    "Esql.follow_on_names",
    "Esql.follow_on_name_count",
    "Esql.follow_on_ip_values",
    "Esql.follow_on_event_count",
    "Esql.earliest_follow_on",
    "Esql.latest_follow_on",
    "Esql.seconds_from_rpc_to_follow_on",
    "Esql.dataset_values",
    "Esql.observer_name_values",
    "Esql.community_id_values",
]
