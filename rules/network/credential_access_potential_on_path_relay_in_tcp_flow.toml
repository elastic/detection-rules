[metadata]
creation_date = "2026/11/26"
integration = ["network_traffic"]
maturity = "production"
min_stack_comments = "Uses ES|QL FIRST with MAC address and timestamp fields and MV_INTERSECTION to identify the relay."
min_stack_version = "9.5.0"
updated_date = "2026/11/26"

[rule]
author = ["Elastic"]
description = """
Identifies an IPv4 TCP connection initially observed between two Ethernet addresses and then observed on two legs
through a third MAC address. This path change can follow ARP cache poisoning of a host and its gateway. The alert
identifies the potential relay so an analyst can verify how traffic was redirected.
"""
false_positives = [
    """
    Insertion of an authorized inline appliance or a route change during an active connection can produce the same path.
    """,
]
from = "now-9m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Potential On-Path Relay in a TCP Flow"
note = """## Triage and analysis

### Investigating Potential On-Path Relay in a TCP Flow

- Look up `Esql.relay_mac` in the switch forwarding table for the capture segment. Identify the asset and switch port.
  Compare this device with the original Ethernet peers and the expected next hop for each IP.
- Pivot on `network.community_id` and `agent.id` around `Esql.relay_start`. Compare the MAC pairs in the flow
  records. The original path must be at least five seconds old, and the two new legs must begin within two seconds of
  each other while that path is active or within thirty seconds of its last packet.
- Check for a routing change, authorized inline appliance, or capture spanning multiple segments. If the path change
  is unexplained, examine ARP captures or switch inspection logs for a new IP-to-MAC binding involving the relay.
- If interception is confirmed, preserve the flow and ARP evidence, contain the relay at its switch port, restore the
  correct bindings, and review credentials or sessions exposed on the affected path.
"""
references = [
    "https://csirt.divd.nl/downloads/DIVD-2026-00014/DIVD-2026-00014-forensics-report.pdf",
    "https://www.elastic.co/docs/reference/integrations/network_traffic",
    "https://www.elastic.co/docs/reference/beats/packetbeat/configuration-flows",
]
risk_score = 47
rule_id = "afd05c1d-8e53-4dc5-94c3-fd8ba0b3bf21"
setup = """## Setup

- In Elastic Network Packet Capture, enable **Flows** and set **Interface** to the Ethernet NIC receiving the traffic.
  Use a TAP or switch mirror carrying both directions of the monitored segment. Enable promiscuous mode on the
  receiving NIC for mirrored unicast traffic. Linux cooked captures (commonly from `any`) and loopback captures
  can omit the Ethernet addresses. Packetbeat populates both MAC fields from the Ethernet header automatically.
- The default **Period** (`10s`) and **Flow timeout** (`30s`) are suitable. Periodic reports let the rule evaluate
  active connections. Keep **Map root Packetbeat fields to ECS** enabled so tagged flows carry
  `network_traffic.flow.vlan`. On a tagged trunk, preserve the tags and enable **Configure BPF to account for VLAN
  tags** when using Packetbeat's generated capture filter. Use one capture segment per agent for untagged traffic.
- Within the nine-minute lookback, the same agent must report the original MAC pair and both new pairs for the same
  Community ID and VLAN. The relay timing uses packet-derived `event.start` and `event.end`, so the reporting
  period can exceed two seconds.

Use this KQL filter in Discover to verify that the capture produces eligible flow records.

```kql
data_stream.dataset:"network_traffic.flow" and network.type:ipv4 and network.transport:tcp and
source.mac:* and destination.mac:* and network.community_id:* and event.start:* and event.end:*
```
"""
severity = "medium"
tags = [
    "Domain: Network",
    "Tactic: Credential Access",
    "Use Case: Threat Detection",
    "Use Case: Network Security Monitoring",
    "Data Source: Network Packet Capture",
    "Resources: Investigation Guide",
    "Rule Type: ES|QL",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
FROM logs-network_traffic.flow-*
| WHERE network.type == "ipv4" AND network.transport == "tcp"
    AND agent.id IS NOT NULL AND network.community_id IS NOT NULL AND event.start IS NOT NULL AND event.end IS NOT NULL
    AND source.ip != destination.ip AND source.mac != destination.mac
// Orient each Ethernet leg by IP so reverse-direction reports describe the same path.
| EVAL Esql.peer_a = LEAST(source.ip, destination.ip), Esql.peer_b = GREATEST(source.ip, destination.ip),
       Esql.vlan = MV_CONCAT(TO_STRING(network_traffic.flow.vlan), "/")
| EVAL mac_a = CASE(source.ip == Esql.peer_a, source.mac, destination.mac),
       mac_b = CASE(source.ip == Esql.peer_a, destination.mac, source.mac)
// Collapse periodic reports for each leg before comparing the direct path A-B with the later legs A-M and M-B.
| STATS leg_start = MIN(event.start), leg_end = MAX(event.end)
  BY agent.id, Esql.vlan, network.community_id, Esql.peer_a, Esql.peer_b, mac_a, mac_b
| STATS legs = COUNT(*), macs_a = VALUES(mac_a), macs_b = VALUES(mac_b),
        Esql.original_mac_a = FIRST(mac_a, leg_start), Esql.original_mac_b = FIRST(mac_b, leg_start),
        Esql.direct_start = MIN(leg_start), Esql.direct_end = FIRST(leg_end, leg_start), later_starts = TOP(leg_start, 2, "desc")
  BY agent.id, Esql.vlan, network.community_id, Esql.peer_a, Esql.peer_b
| WHERE legs == 3 AND MV_COUNT(macs_a) == 2 AND MV_COUNT(macs_b) == 2
| EVAL Esql.relay_mac = MV_INTERSECTION(macs_a, macs_b),
       Esql.relay_start = MV_MIN(later_starts), last_leg_start = MV_MAX(later_starts)
| WHERE MV_COUNT(Esql.relay_mac) == 1
    AND Esql.relay_mac != Esql.original_mac_a AND Esql.relay_mac != Esql.original_mac_b
    AND Esql.relay_start >= Esql.direct_start + 5 seconds
    AND Esql.relay_start <= Esql.direct_end + 30 seconds AND last_leg_start <= Esql.relay_start + 2 seconds
| KEEP agent.id, Esql.vlan, network.community_id, Esql.peer_a, Esql.peer_b, Esql.original_mac_a,
       Esql.original_mac_b, Esql.relay_mac, Esql.direct_start, Esql.direct_end, Esql.relay_start
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1557"
name = "Adversary-in-the-Middle"
reference = "https://attack.mitre.org/techniques/T1557/"
[[rule.threat.technique.subtechnique]]
id = "T1557.002"
name = "ARP Cache Poisoning"
reference = "https://attack.mitre.org/techniques/T1557/002/"



