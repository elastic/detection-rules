[metadata]
creation_date = "2026/07/28"
integration = ["sonicwall_firewall"]
maturity = "production"
updated_date = "2026/07/28"

[rule]
author = ["Elastic"]
description = """
Identifies a single source IP successfully authenticating to multiple user accounts on the same SonicWall appliance in a
short period. This behavior may indicate automated credential validation or credential stuffing with working
credentials, even when authentication failures are absent.
"""
false_positives = [
    """
    Shared egress addresses, managed service providers, help desks, administrator jump hosts, synthetic monitoring, or
    other systems that legitimately authenticate multiple users may trigger this rule. Add exceptions only for confirmed
    shared-service sources and scope them to the relevant appliance where possible.
    """,
]
from = "now-15m"
interval = "5m"
language = "esql"
license = "Elastic License v2"
name = "Multiple Successful SonicWall Logins from a Single Source"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Multiple Successful SonicWall Logins from a Single Source

This rule detects one source IP successfully authenticating as at least three users, or producing at least five
successful logins across at least two users, on the same SonicWall appliance during the rule lookback. This pattern can
indicate automated testing of breached credentials. Because the rule evaluates successful logins, it can detect
credential stuffing that produces few or no authentication failures.

SonicWall event codes `235` and `236` represent successful VPN- or WAN-zone administrator logins, `237` and `238`
represent successful VPN- or WAN-zone remote-user logins, and `1080` represents a successful SSL VPN user login.

### Possible investigation steps

- Review `source.ip`, its ASN, geolocation, reputation, and prior activity. Determine whether it belongs to an expected
  corporate proxy, VPN egress address, managed service provider, jump host, or monitoring service.
- Review `Esql.user_names`, `Esql.successful_logins`, and `Esql.user_count`. Confirm whether each user was expected to
  access the appliance from the source and whether corresponding MFA challenges were completed.
- Use `Esql.event_codes` to distinguish administrator access (`235` or `236`) from remote-user and SSL VPN access
  (`237`, `238`, or `1080`). Prioritize administrator accounts and other privileged users.
- Search the same source and appliance for preceding login failures, unknown-user attempts, LDAP or RADIUS failures,
  and lockout events. Relevant SonicWall event codes include `30`, `32`, `33`, `200`, `243`, `329`, `745`, `749`, and
  `1655`.
- Compare each user and source pair with historical SonicWall activity. Look for a first-seen source IP, ASN, country,
  unusual login time, or access to several appliances.
- For SSL VPN sessions, identify the assigned tunnel IP and correlate it with internal DNS, network flow, Windows
  authentication, remote access, and endpoint telemetry.
- If an administrator login occurred, review subsequent SonicWall configuration auditing events for changes to users,
  administrators, MFA, VPN settings, trusted hosts, policies, logging, backups, or external services.

### False positive analysis

- A shared public address can represent several legitimate users, particularly at branch offices or behind carrier NAT.
- Help desks, managed service providers, administrator jump hosts, and automated tests may authenticate multiple
  accounts from one source.
- Validate the source and workflow before adding an exception. Prefer an exception scoped by both source and appliance
  rather than excluding a user or source globally.

### Response and remediation

- If the activity is unauthorized, disable affected accounts, terminate active sessions, reset credentials, revoke
  tokens or keys, and enforce MFA.
- Block or restrict the source at the SonicWall appliance while investigating, accounting for the possibility that
  attacker infrastructure may rotate.
- Review configuration changes and downstream activity from affected VPN sessions. Isolate impacted systems and begin
  incident response if post-authentication activity is identified.
- Preserve SonicWall authentication, VPN session, and configuration audit logs before making broad changes.
"""
references = [
    "https://www.huntress.com/blog/sonicwall-credential-stuffing-campaign",
    "https://www.elastic.co/docs/reference/integrations/sonicwall_firewall",
    "https://www.sonicwall.com/support/knowledge-base/monitoring-sslvpn-user-logins/kA1VN0000000JQz0AM",
]
risk_score = 73
rule_id = "7d4a81ea-b9f9-4bf7-8708-5ef7f67e6f3a"
setup = """## Setup

This rule requires the Elastic **SonicWall Firewall** integration and SonicWall Enhanced Syslog authentication events.

Configure the appliance to forward **Users > Authentication Access** events and confirm that successful administrator,
remote-user, and SSL VPN login event codes `235`, `236`, `237`, `238`, and `1080` are collected. Verify that the
integration populates `data_stream.dataset`, `event.action`, `event.code`, `source.ip`, `user.name`, and either
`observer.serial_number` or a unique `observer.name`.

If several customers share one Kibana space, ensure the appliance identity is unique per tenant so activity from
different customers is not aggregated together.
"""
severity = "high"
tags = [
    "Domain: Network",
    "Domain: Identity",
    "Use Case: Threat Detection",
    "Use Case: Identity and Access Audit",
    "Tactic: Credential Access",
    "Tactic: Initial Access",
    "Data Source: SonicWall",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from logs-sonicwall_firewall.log-*
| where
    data_stream.dataset == "sonicwall_firewall.log" and
    event.action == "login-success" and
    event.code in ("235", "236", "237", "238", "1080") and
    source.ip is not null and
    user.name is not null and
    (observer.serial_number is not null or observer.name is not null)
| eval Esql.appliance_id = coalesce(observer.serial_number, observer.name)
| stats
    Esql.successful_logins = count(*),
    Esql.user_count = count_distinct(user.name),
    Esql.user_names = values(user.name),
    Esql.event_codes = values(event.code),
    Esql.observer_names = values(observer.name),
    Esql.observer_serial_numbers = values(observer.serial_number),
    Esql.first_seen = min(@timestamp),
    Esql.last_seen = max(@timestamp)
  by Esql.appliance_id, source.ip
| where
    Esql.user_count >= 3 or
    (Esql.successful_logins >= 5 and Esql.user_count >= 2)
| keep source.ip, Esql.*
'''


