[metadata]
creation_date = "2026/09/23"
maturity = "production"
updated_date = "2026/09/23"

[rule]
author = ["Elastic"]
description = """
Identifies successful authentication to a Model Context Protocol (MCP) service with an Amazon Bedrock AgentCore service
account from a source that is not part of the account's approved harness egress set. This may indicate replay of a
service-account token stolen from an AgentCore harness or another credential-bearing workload.
"""
false_positives = [
    """
    Planned NAT gateway changes, multi-region deployments, disaster-recovery exercises, migration traffic, and approved
    administrative testing can introduce a new source. Confirm that the source belongs to the expected harness
    deployment before adding a narrowly scoped exception.
    """,
]
from = "now-9m"
index = ["logs-mcp.access-*"]
language = "kuery"
license = "Elastic License v2"
name = "AgentCore MCP Service Account Used from an Unapproved Source"
note = """## Triage and analysis

### Investigating AgentCore MCP Service Account Used from an Unapproved Source

This rule detects a successful MCP authentication after the MCP ingress has tagged the principal as an AgentCore
service account and the request source as outside the account's approved harness egress set. It does not inspect TLS
payloads or retain bearer tokens.

### Possible investigation steps

- Identify the service account in `user.id` or `user.name`, the MCP service in `service.name`, and the source in
  `source.ip`, `source.as.organization.name`, and `source.geo.country_iso_code`.
- Confirm that the `agentcore-source-unapproved` tag was calculated from the current NAT, VPC, PrivateLink, proxy, or
  mTLS inventory and was not made stale by a planned network change.
- If the MCP ingress retains a keyed token fingerprint in a protected custom field, determine whether the same
  fingerprint was recently used from an approved harness source. Never copy or log the raw bearer token.
- Review the requested MCP methods and tools, especially `tools/list`, sensitive reads, writes, and access to personal
  or credential data.
- Correlate the event with AgentCore shell-tool traces, unusual DNS or VPC egress, and direct runtime command API use.

### False positive analysis

- Validate planned egress migrations, failover, multi-region harnesses, red-team tests, and approved operator clients.
- Correct the source inventory rather than globally excluding the service account when an approved network changes.

### Response and remediation

- Revoke the affected token and refresh material, terminate downstream sessions, and rotate every credential available
  to the affected harness.
- Restrict the service account by source network, audience, scope, tool authorization, lifetime, and sender-constrained
  authentication such as mTLS or DPoP where supported.
- Preserve only keyed token fingerprints and redacted authentication metadata for investigation.
"""
references = [
    "https://unit42.paloaltonetworks.com/securing-aws-agentcore-harness-credentials/",
    "https://attack.mitre.org/techniques/T1078/",
]
risk_score = 99
rule_id = "114663f8-ac78-4521-862f-e173e466c7f0"
setup = """## Setup

This rule requires normalized authentication logs from the reverse proxy, API gateway, or application that terminates
connections to the downstream MCP service. Route those events to `logs-mcp.access-*` and populate:

- `service.type` with `mcp`;
- `event.category` with `authentication` and `event.outcome` with `success`;
- `user.id` or `user.name` with the validated service-account identity;
- `source.ip`;
- the `agentcore-service-account` tag only for service accounts assigned to AgentCore;
- the `agentcore-source-unapproved` tag when the source is outside the current expected harness egress inventory.

Optionally retain a keyed, one-way token fingerprint in a protected custom field generated after successful
authentication. Do not ingest raw bearer tokens, Authorization headers, or unredacted request bodies.
"""
severity = "critical"
tags = [
    "Domain: Network",
    "Domain: Identity",
    "Domain: GenAI",
    "Use Case: Threat Detection",
    "Use Case: Identity and Access Audit",
    "Tactic: Initial Access",
    "Resources: Investigation Guide",
    "Noise: Low",
    "Performance: Fast",
    "Profile: Recommended",
    "Rule Type: Query",
]
timestamp_override = "event.ingested"
type = "query"

query = '''
service.type:"mcp" and
event.category:"authentication" and event.outcome:"success" and
tags:"agentcore-service-account" and tags:"agentcore-source-unapproved" and
source.ip:* and (user.id:* or user.name:*)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1078"
name = "Valid Accounts"
reference = "https://attack.mitre.org/techniques/T1078/"


[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "service.name",
    "service.type",
    "user.id",
    "user.name",
    "source.ip",
    "source.as.number",
    "source.as.organization.name",
    "source.geo.country_iso_code",
    "event.outcome",
    "tags",
]

