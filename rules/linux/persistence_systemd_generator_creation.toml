[metadata]
creation_date = "2024/06/19"
integration = ["endpoint", "sentinel_one_cloud_funnel"]
maturity = "production"
updated_date = "2026/10/23"

[rule]
author = ["Elastic"]
description = """
Detects non-deletion file activity involving systemd unit and environment generators. Systemd executes these files
during manager startup and configuration reloads. Unit generators dynamically create unit files, symlinks, or drop-ins,
while environment generators produce variables for the service manager and processes it starts. Adversaries may abuse
either mechanism to execute code or influence subsequently started processes.
"""
from = "now-9m"
index = [
    "endgame-*",
    "logs-endpoint.events.file*",
    "logs-sentinel_one_cloud_funnel.*",
]
language = "eql"
license = "Elastic License v2"
name = "Systemd Generator File Activity"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Systemd Generator File Activity

Systemd runs unit and environment generators early during manager startup and again during configuration reloads. Unit
generators translate other configuration sources into transient units, symlinks, or drop-ins. Environment generators
emit variable assignments that the manager passes to services and other processes started afterward. Because both
generator types are executables, an unauthorized file in one of these directories can run whenever the corresponding
system or user manager starts or reloads.

### Possible investigation steps

- Review the affected path, operation, responsible process, parent process, user, timestamp, and process command line.
- Retrieve the generator, verify its ownership and executable permissions, and inspect its interpreter, commands,
  referenced files, and output.
- Determine whether it is a unit generator, system environment generator, or user environment generator and identify
  which manager instances can execute it.
- Establish provenance through package manifests, configuration-management records, host build records, and comparison
  with peer systems.
- Correlate the change with system or user manager startup, `daemon-reload`, transient unit generation, changed manager
  environment, unexpected child processes, and network connections.
- Inspect other files written by the same process or account and analyze scripts or executables referenced by the
  generator.

### False positive analysis

- Packages, desktop environments, compatibility layers, and system-management software can install legitimate
  generators. Validate package ownership and expected deployment context before adding a narrowly scoped exception.
- Administrators may deploy custom generators to integrate non-native configuration or build a session environment.
  Confirm the writer and content against approved configuration.

### Response and remediation

- Preserve the generator and referenced content before remediation.
- Remove unauthorized generators or restore trusted package content, then reload the affected manager using approved
  administration procedures.
- Restart affected services or user sessions where necessary to remove poisoned environment values.
- Terminate malicious child processes and investigate any actions performed while the generator was active.
- Scope matching files, content, writers, generated units, and environment changes across the environment."""
references = [
    "https://www.freedesktop.org/software/systemd/man/latest/systemd.generator.html",
    "https://www.freedesktop.org/software/systemd/man/latest/systemd.environment-generator.html",
    "https://pberba.github.io/security/2022/02/07/linux-threat-hunting-for-persistence-systemd-generators/",
    "https://www.elastic.co/security-labs/primer-on-persistence-mechanisms",
]
risk_score = 47
rule_id = "39c06367-b700-4380-848a-cab06e7afede"
setup = """## Setup

This rule requires Linux file event data from Elastic Defend, SentinelOne, or Elastic Endgame.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a Linux System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, either "Traditional Endpoints" or "Cloud Workloads".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/8.10/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Data Source: Elastic Defend",
    "Data Source: Elastic Endgame",
    "Data Source: SentinelOne",
    "Resources: Investigation Guide",
    "Noise: Medium",
    "Performance: Normal",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Linux",
]
timestamp_override = "event.ingested"
type = "eql"
query = '''
file where host.os.type == "linux" and event.type != "deletion" and file.path : (
  "/run/systemd/system-generators/*",
  "/etc/systemd/system-generators/*",
  "/usr/local/lib/systemd/system-generators/*",
  "/lib/systemd/system-generators/*",
  "/usr/lib/systemd/system-generators/*",
  "/etc/systemd/user-generators/*",
  "/usr/local/lib/systemd/user-generators/*",
  "/usr/lib/systemd/user-generators/*",
  "/lib/systemd/user-generators/*",
  "/run/systemd/system-environment-generators/*",
  "/etc/systemd/system-environment-generators/*",
  "/usr/local/lib/systemd/system-environment-generators/*",
  "/usr/lib/systemd/system-environment-generators/*",
  "/run/systemd/user-environment-generators/*",
  "/etc/systemd/user-environment-generators/*",
  "/usr/local/lib/systemd/user-environment-generators/*",
  "/usr/lib/systemd/user-environment-generators/*"
) and not (
  process.executable in (
    "/bin/dpkg", "/usr/bin/dpkg", "/bin/dockerd", "/usr/bin/dockerd", "/usr/sbin/dockerd", "/bin/microdnf",
    "/usr/bin/microdnf", "/bin/rpm", "/usr/bin/rpm", "/bin/snapd", "/usr/bin/snapd", "/bin/yum", "/usr/bin/yum",
    "/bin/dnf", "/usr/bin/dnf", "/bin/podman", "/usr/bin/podman", "/bin/dnf-automatic", "/usr/bin/dnf-automatic",
    "/bin/pacman", "/usr/bin/pacman", "/usr/bin/dpkg-divert", "/bin/dpkg-divert", "/sbin/apk", "/usr/sbin/apk",
    "/usr/local/sbin/apk", "/usr/bin/apt", "/usr/sbin/pacman", "/bin/podman", "/usr/bin/podman", "/usr/bin/puppet",
    "/bin/puppet", "/opt/puppetlabs/puppet/bin/puppet", "/usr/bin/chef-client", "/bin/chef-client", "/usr/sbin/sshd",
    "/bin/autossl_check", "/usr/bin/autossl_check", "/proc/self/exe", "/dev/fd/*",  "/usr/bin/pamac-daemon",
    "/bin/pamac-daemon", "/usr/lib/snapd/snapd", "/usr/local/bin/dockerd", "/usr/libexec/platform-python",
    "./usr/bin/podman", "/usr/lib/dracut/dracut-install", "/usr/bin/dnf5", "/usr/libexec/packagekitd", "/usr/sbin/dnf",
    "/kaniko/executor", "/dev/fd/3", "/usr/local/bin/defender", "./usr/bin/qemu-aarch64-static", "/usr/sbin/yum"
  ) or
  process.executable like (
    "/snap/docker/*/bin/dockerd", "/var/lib/docker/overlay2/*/dockerd", "/var/lib/containers/storage/overlay/*/dockerd"
  ) or
  process.name like~ ("ssm-agent-worker", "crio", "docker-init", "systemd", "pacman", "python*", "platform-python*") or
  file.extension in ("swp", "swpx", "swx", "dpkg-remove") or
  ?file.Ext.original.extension == "dpkg-new" or
  process.executable == null
)
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1546"
name = "Event Triggered Execution"
reference = "https://attack.mitre.org/techniques/T1546/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
