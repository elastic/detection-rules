[metadata]
creation_date = "2026/09/14"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/09/14"

[rule]
author = ["Elastic"]
description = """
Identifies a process other than the Amazon ECS agent reaching the ECS task metadata or IMDS endpoint, followed by a
network connection to an ECS agent communication endpoint on the same process entity. The ECScape technique abuses the
undocumented ECS Agent Communication Service protocol: a compromised container that can reach the instance metadata
service steals the EC2 instance role credentials, then impersonates the ECS agent over ACS to receive the task role
credentials of every other task scheduled on the same host. No container escape is required, and the credential theft
crosses task boundaries that operators assume are isolated. Only the amazon-ecs-agent binary should be speaking this
protocol.
"""
false_positives = [
    """
    Custom ECS agent implementations or monitoring sidecar containers may legitimately contact both the metadata
    endpoint and ECS agent communication endpoints. Allowlist known sidecar executable paths if alert volume from
    those containers is high.
    """,
]
from = "now-12m"
index = ["logs-endpoint.events.network*"]
language = "eql"
license = "Elastic License v2"
name = "Potential ECS Agent Communication Protocol Impersonation"
references = [
    "https://www.sweet.security/blog/ecscape-understanding-iam-privilege-boundaries-in-amazon-ecs",
    "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-metadata-endpoint-v4.html",
]
risk_score = 73
rule_id = "eec07086-37c7-4285-bfa2-a4ce03c7648c"
setup = """## Setup

This rule requires data coming in from Elastic Defend.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the
Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, either "Cloud Workloads".
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can
  click the "Existing hosts" tab and select an existing policy instead.
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and install Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "high"
tags = [
    "Domain: Endpoint",
    "Domain: Cloud",
    "Platform: AWS",
    "Platform: Linux",
    "OS: Linux",
    "Tactic: Credential Access",
    "Tactic: Privilege Escalation",
    "Data Source: Elastic Defend",
    "Rule Type: Event Correlation (EQL)",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence by process.entity_id with maxspan=5m
  [network where host.os.type == "linux" and event.action == "connection_attempted" and
   destination.address in ("169.254.170.2", "169.254.169.254", "169.254.170.23") and
   not process.executable like (
     "/managed-agents/*",
     "/usr/bin/amazon-ecs-agent",
     "/usr/libexec/amazon-ecs-*",
     "/var/lib/ecs/*",
     "/opt/Elastic/Agent/*",
     "/opt/aws/*",
     "/var/lib/amazon/ssm/*"
   ) and
   not process.name in ("amazon-ecs-agent", "ecs-agent", "amazon-ssm-agent", "aws-vpc-cni")]
  [network where event.action == "lookup_requested" and
   dns.question.name like~ ("ecs-a.*.amazonaws.com", "ecs-t.*.amazonaws.com", "ecs.*.amazonaws.com")
  ]
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"

[[rule.threat.technique.subtechnique]]
id = "T1552.005"
name = "Cloud Instance Metadata API"
reference = "https://attack.mitre.org/techniques/T1552/005/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1134"
name = "Access Token Manipulation"
reference = "https://attack.mitre.org/techniques/T1134/"

[rule.threat.tactic]
id = "TA0004"
name = "Privilege Escalation"
reference = "https://attack.mitre.org/tactics/TA0004/"
