[metadata]
creation_date = "2026/08/13"
integration = ["endpoint"]
maturity = "development"
updated_date = "2026/08/13"

[rule]
author = ["Gideon145"]
description = """
Detects the download of Mirai-family botnet binaries on Linux hosts via wget or tftp.
Mirai loaders serve bot binaries from `/bins/mirai.<arch>` paths and the download commands
carry a self-identifying User-Agent such as `wget/1.0 (Mirai/arm)`. Matching the
characteristic binary path and User-Agent strings avoids broad port-based detection and
keeps the rule specific to Mirai-family activity.
"""
false_positives = [
    """
    #### False Positive Analysis

    This rule matches only commands that reference the characteristic Mirai
    binary download path (`bins/mirai`) or a Mirai-formatted User-Agent string.
    Legitimate software does not use these naming conventions. Potential false
    positives are limited to deliberate security research and malware analysis
    sandboxes replaying Mirai samples.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process*"]
language = "eql"
license = "Elastic License v2"
max_signals = 100
name = "Mirai Botnet Binary Download via Wget or TFTP"
note = """## Triage and analysis

### Investigating Mirai Botnet Binary Download via Wget or TFTP

This rule detects Linux processes downloading Mirai bot binaries using the
characteristic `bins/mirai` path or Mirai-format User-Agent strings.

#### Possible investigation steps

- Inspect the process command line to determine the download source IP and
  the exact binary architecture targeted (`mirai.arm`, `mirai.mips`,
  `mirai.mipsel`, `mirai.x86`, `mirai.sh4`).
- Identify the parent process that launched the download. Mirai infection
  follows a telnet brute-force with vendor default credentials, so review
  authentication events from the same source IP for the same time window.
- Check for subsequent execution of the downloaded binary and persistence
  mechanisms such as cron entries or init script modifications.
- Isolate the affected host and block the download source at the network
  boundary.

### False positive analysis

- Security researchers or sandbox environments replaying Mirai samples may
  trigger this rule.
- Organisations running honeypots that serve Mirai binaries will see
  corresponding download attempts from infected devices.

### Response and remediation

- Isolate the affected host from the network to stop propagation.
- Reset credentials of all IoT devices on the network, focusing on vendor
  default credentials from the Mirai credential list.
- Remove the downloaded binary and any persistence mechanisms (cron jobs,
  init scripts).
- Rebuild the affected device from a trusted image.
"""
references = [
    "https://github.com/Gideon145/mirai-detector",
    "https://www.cisa.gov/sites/default/files/FactSheets/NCCIC%20ICS_FactSheet_Mirai_Vulnerable_IoT_Devices_S508C.pdf",
    "https://www.malwaremustdie.org/2016/08/mmd-0056-2016-linuxmirai-just.html",
]
risk_score = 73
rule_id = "3f577bf8-7d90-4b88-8151-e69f1ce407f0"
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
]
type = "eql"
query = '''
process where host.os.type == "linux" and event.type == "start" and event.action in ("exec", "start") and
  process.name in ("wget", "tftp", "busybox") and
  (process.args like "*bins/mirai*" or process.args like "*Mirai/*")
'''

