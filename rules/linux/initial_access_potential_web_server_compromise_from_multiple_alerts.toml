[rule.alert_suppression]
group_by = ["host.id"]
missing_fields_strategy = "suppress"

[rule.investigation_fields]
field_names = [
    "host.name",
    "host.id",
    "Esql.correlation_score",
    "Esql.alerts_count",
    "Esql.suspicious_process_alert_count",
    "Esql.unusual_process_alert_count",
    "Esql.unusual_file_alert_count",
    "Esql.first_alert_timestamp",
    "Esql.last_alert_timestamp",
    "Esql.kibana_alert_rule_name_values",
    "Esql.process_command_line_values",
    "Esql.file_path_values",
]

[rule.alert_suppression.duration]
unit = "m"
value = 15
