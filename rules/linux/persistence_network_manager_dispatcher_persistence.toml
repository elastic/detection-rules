[metadata]
creation_date = "2025/01/16"
integration = ["endpoint", "sentinel_one_cloud_funnel"]
maturity = "production"
updated_date = "2026/10/23"

[rule]
author = ["Elastic"]
description = """
Detects non-deletion file activity involving Linux network-event hooks used by NetworkManager, DHCP clients, ifupdown,
dhcpcd, and networkd-dispatcher. These scripts can execute automatically when interfaces or addresses change state.
Adversaries may abuse these trusted hooks to establish persistence or event-triggered execution.
"""
false_positives = [
    """
    Legitimate network-management packages, interface administration, DHCP client customization, and
    configuration-management activity.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.file*", "logs-sentinel_one_cloud_funnel.*", "endgame-*"]
language = "eql"
license = "Elastic License v2"
name = "Linux Network Event Hook File Activity"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Linux Network Event Hook File Activity

Linux networking stacks provide several scriptable hooks for reacting to interface state and DHCP lease changes.
NetworkManager executes dispatcher scripts, `dhclient-script` sources enter and exit hooks, `dhcpcd-run-hooks` sources
its hook chain, ifupdown invokes scripts through `run-parts`, and networkd-dispatcher executes scripts for states such as
`routable`. Unauthorized changes can therefore cause commands to run automatically during lease renewal, link
activation, address changes, or startup-state replay.

### Possible investigation steps

- Review the affected path, operation, responsible process, parent process, user, timestamp, and process command line.
- Identify the network manager and DHCP client active on the host. The presence of a hook file does not prove that the
  corresponding loader is active.
- Retrieve the changed file and inspect its ownership, permissions, interpreter, commands, referenced files, interface
  or lease-state guards, detached execution, and network behavior.
- For networkd-dispatcher, review the state directory, symlink target, executable mode, ownership checks, service
  arguments, and whether startup triggers are enabled.
- For ifupdown hooks, confirm the filename satisfies `run-parts` rules and review the interface variables and lifecycle
  stage in which the script executes.
- Correlate the activity with DHCP events such as `BOUND`, `RENEW`, `REBIND`, or `REBOOT`; interface state changes;
  network service restarts; and unexpected shells, interpreters, detached processes, or outbound connections beneath
  the relevant network manager or hook runner.
- Establish provenance through package ownership, configuration-management history, and comparison with trusted peers.

### False positive analysis

- Network packages, administrators, and configuration-management systems may legitimately install or update hooks.
  Validate package ownership, script content, the writer, and an approved operational requirement before adding a
  narrowly scoped exception.

### Response and remediation

- Preserve the changed hook and related telemetry before remediation.
- Remove unauthorized scripts or directives, restore trusted package-owned files, and verify ownership and permissions.
- Terminate malicious child processes and investigate network activity or credentials exposed while the hook was
  active.
- Scope matching filenames, hashes, content, writers, symlink targets, and resulting process ancestry across the
  environment.
"""
references = [
    "https://networkmanager.dev/docs/api/latest/NetworkManager-dispatcher.html",
    "https://manpages.debian.org/bookworm/isc-dhcp-client/dhclient-script.8.en.html",
    "https://man.archlinux.org/man/dhcpcd-run-hooks.8.en",
    "https://manpages.debian.org/bookworm/ifupdown/interfaces.5.en.html",
    "https://gitlab.com/craftyguy/networkd-dispatcher",
]
risk_score = 21
rule_id = "86aa8579-1526-4dff-97cd-3635eb0e0545"
setup = """## Setup

This rule requires data coming in from Elastic Defend.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a Linux System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, either "Traditional Endpoints" or "Cloud Workloads".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/8.10/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Data Source: Elastic Defend",
    "Data Source: SentinelOne",
    "Data Source: Elastic Endgame",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Linux",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
file where host.os.type == "linux" and event.type != "deletion" and
file.path like (
  "/etc/NetworkManager/dispatcher.d/*",
  "/etc/dhcp/dhclient-enter-hooks",
  "/etc/dhcp/dhclient-enter-hooks.d/*",
  "/etc/dhcp/dhclient-exit-hooks",
  "/etc/dhcp/dhclient-exit-hooks.d/*",
  "/etc/dhcpcd.enter-hook",
  "/etc/dhcpcd.exit-hook",
  "/etc/network/if-pre-up.d/*",
  "/etc/network/if-up.d/*",
  "/etc/network/if-down.d/*",
  "/etc/network/if-post-down.d/*",
  "/etc/networkd-dispatcher/*/*",
  "/lib/dhcpcd/dhcpcd-hooks/*",
  "/usr/lib/dhcpcd/dhcpcd-hooks/*",
  "/usr/local/lib/dhcpcd/dhcpcd-hooks/*"
) and
not (
  process.executable in (
    "/bin/dpkg", "/usr/bin/dpkg", "/bin/dockerd", "/usr/bin/dockerd", "/usr/sbin/dockerd", "/bin/microdnf",
    "/usr/bin/microdnf", "/bin/rpm", "/usr/bin/rpm", "/bin/snapd", "/usr/bin/snapd", "/bin/yum", "/usr/bin/yum",
    "/bin/dnf", "/usr/bin/dnf", "/bin/podman", "/usr/bin/podman", "/bin/dnf-automatic", "/usr/bin/dnf-automatic",
    "/bin/pacman", "/usr/bin/pacman", "/usr/bin/dpkg-divert", "/bin/dpkg-divert", "/sbin/apk", "/usr/sbin/apk",
    "/usr/local/sbin/apk", "/usr/bin/apt", "/usr/sbin/pacman", "/bin/podman", "/usr/bin/podman", "/usr/bin/puppet",
    "/bin/puppet", "/opt/puppetlabs/puppet/bin/puppet", "/usr/bin/chef-client", "/bin/chef-client",
    "/bin/autossl_check", "/usr/bin/autossl_check", "/proc/self/exe",  "/usr/bin/pamac-daemon", "./usr/bin/podman",
    "/bin/pamac-daemon", "/usr/lib/snapd/snapd", "/usr/local/bin/dockerd", "/usr/bin/crio", "/usr/sbin/crond",
    "/opt/puppetlabs/puppet/bin/ruby", "/usr/libexec/platform-python", "/kaniko/kaniko-executor",
    "/usr/local/bin/dockerd", "/usr/bin/podman", "/bin/install", "/proc/self/exe", "/usr/lib/systemd/systemd",
    "/usr/sbin/sshd", "/usr/bin/gitlab-runner", "/opt/gitlab/embedded/bin/ruby", "/usr/sbin/gdm", "/usr/bin/install",
    "/usr/local/manageengine/uems_agent/bin/dcregister", "/usr/local/bin/pacman", "./usr/bin/qemu-aarch64-static"
  ) or
  process.executable like~ (
    "/nix/store/*", "/var/lib/dpkg/*", "/tmp/vmis.*", "/snap/*", "/dev/fd/*", "/usr/lib/virtualbox/*"
  ) or
  file.extension in ("swp", "swpx", "swx", "dpkg-remove") or
  (process.name == "sed" and file.name : "sed*") or
  (
    process.executable like ("/kaniko/executor", "/usr/libexec/platform-python*") and
    file.path like "/etc/NetworkManager/dispatcher.d/11-dhclient*"
  )
)
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1546"
name = "Event Triggered Execution"
reference = "https://attack.mitre.org/techniques/T1546/"


[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
