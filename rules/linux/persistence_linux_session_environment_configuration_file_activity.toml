[metadata]
creation_date = "2026/10/23"
integration = ["endpoint", "crowdstrike", "sentinel_one_cloud_funnel"]
maturity = "production"
updated_date = "2026/10/23"

[rule]
author = ["Elastic"]
description = """
Detects non-deletion file activity involving Linux system-wide and per-user session environment configuration. These
files can define variables inherited by future PAM, systemd user-manager, shell, and desktop sessions. Adversaries may
abuse this configuration to alter executable search paths, interpreter behavior, or startup processing for persistence.
"""
false_positives = [
    """
    Legitimate operating-system packages, desktop administration, user environment customization, and
    configuration-management activity.
    """,
]
from = "now-9m"
index = [
    "auditbeat-*",
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-endpoint.events.file*",
    "logs-sentinel_one_cloud_funnel.*",
]
language = "eql"
license = "Elastic License v2"
name = "Linux Session Environment Configuration File Activity"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Linux Session Environment Configuration File Activity

Linux session environments can be assembled from several system-wide and per-user sources. PAM's `pam_env` module can
read `/etc/security/pam_env.conf` and `/etc/environment`, while systemd environment generators process `environment.d`
drop-ins for user-manager sessions. Depending on the active login stack and configuration, values may be inherited by
shells, graphical sessions, and user services. The kernel and every shell do not read these files directly, so the
affected loader and the start of a new session determine whether a change becomes active.

### Possible investigation steps

- Review the affected path, operation, responsible process, parent process, user, timestamp, and process command line.
- Determine which component reads the file on the affected host, such as `pam_env`, a systemd environment generator, a
  display manager, or another session wrapper.
- Retrieve the file and inspect new or changed variable names, values, path precedence, referenced files, interpreter
  options, and executable search locations.
- Review whether the change is system-wide or limited to one user, and identify sessions and user services started
  after the modification.
- Correlate the activity with subsequent non-interactive shells, graphical logins, user-manager starts, unusual child
  processes, execution from writable directories, and outbound network connections.
- Establish provenance through package ownership, configuration-management records, user activity, and comparison with
  equivalent systems.

### False positive analysis

- Operating-system packages, administrators, and users may legitimately define locale, proxy, desktop, development, or
  application variables. Validate the writer, variable purpose, value, and expected change context before creating a
  narrowly scoped exception.

### Response and remediation

- Preserve the changed configuration and related telemetry before remediation.
- Remove unauthorized assignments, restore trusted configuration, and verify ownership and permissions.
- Terminate malicious processes and invalidate affected sessions where necessary. Start a new trusted session to
  confirm the corrected environment is active.
- Scope matching variable names, values, writers, users, referenced paths, and resulting process behavior across the
  environment.
"""
references = [
    "https://www.freedesktop.org/software/systemd/man/latest/environment.d.html",
    "https://man7.org/linux/man-pages/man8/pam_env.8.html",
    "https://man7.org/linux/man-pages/man5/pam_env.conf.5.html",
    "https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html",
]
risk_score = 21
rule_id = "6153c595-b579-4ea8-a155-4ab92d7be5f2"
setup = """## Setup

This rule requires Linux file event data from Elastic Defend, CrowdStrike Falcon FileVantage/FIM through FDR,
SentinelOne Cloud Funnel, or the Auditbeat file_integrity module. Elastic Defend currently reports creation, rename,
and deletion, but not in-place Linux modifications. For CrowdStrike, collect FileIntegrityMonitorRuleMatched events for
the paths covered by this rule. Validate SentinelOne Linux file-event emission in your deployment. When using Auditbeat,
configure file_integrity to watch the paths covered by this rule.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic
Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required.
- To configure Fleet Server refer to the
  [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a Linux System:
- Go to the Kibana home page and click "Add integrations".
- Search for "Elastic Defend" and select the integration.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select "Traditional Endpoints" or "Cloud Workloads".
- Select the "Complete EDR (Endpoint Detection and Response)" configuration preset to collect all events and
  preventions.
- Save the integration and enroll an Elastic Agent in the resulting policy.

For more information, refer to the
[Elastic Defend documentation](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Data Source: Elastic Defend",
    "Data Source: Elastic Endgame",
    "Data Source: Crowdstrike",
    "Data Source: SentinelOne",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Linux",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
file where host.os.type == "linux" and event.type != "deletion" and
  file.path like (
    "/etc/environment",
    "/etc/environment.d/*.conf",
    "/etc/security/pam_env.conf",
    "/run/environment.d/*.conf",
    "/usr/lib/environment.d/*.conf",
    "/usr/local/lib/environment.d/*.conf",
    "/home/*/.config/environment.d/*.conf",
    "/home/*/.pam_environment",
    "/root/.config/environment.d/*.conf",
    "/root/.pam_environment"
  )
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1546"
name = "Event Triggered Execution"
reference = "https://attack.mitre.org/techniques/T1546/"


[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
