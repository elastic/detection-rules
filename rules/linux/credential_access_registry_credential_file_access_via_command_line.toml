[metadata]
creation_date = "2026/10/19"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/10/19"

[rule]
author = ["clivoa"]
description = """
Identifies a process referencing a package registry credential file on its command line. `.npmrc`,
`.pypirc`, `.netrc` and the Cargo and RubyGems credential files hold long-lived registry tokens that
allow publishing malicious package versions under a trusted name. Package managers read these files
implicitly and do not pass their paths as arguments, so a command line naming one is unusual by
itself.
"""
false_positives = [
    """
    An administrator or developer inspecting or editing their own credential file from a shell will
    match. Confirm the user, the parent process and whether an interactive session is expected on the
    host.
    """,
    """
    Configuration management, container build steps and CI jobs that template a credential file into
    place reference the path directly and will match. Add an exception for the specific tooling once
    verified.
    """,
    """
    `curl --netrc-file ~/.netrc` reading the file for HTTP authentication is a legitimate, unrelated use and is
    excluded, unless the same command line also names another credential file or sends `.netrc` itself as data
    (`@`, `-T`, `--upload-file`). An adversary who uses `--netrc-file` only to authenticate against their own
    server with the stolen credentials would not match.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process*"]
language = "eql"
license = "Elastic License v2"
name = "Package Registry Credential File Referenced on a Command Line"
note = """## Triage and analysis

### Investigating Package Registry Credential File Referenced on a Command Line

This alert flags a process command line that references one of a small set of package-registry credential files
(`.npmrc`, `.pypirc`, `.netrc`, the Cargo and RubyGems `credentials` files), from a process that is not a package
manager. The rule only sees the command line: a reference is not proof the file was read or sent (`echo
~/.npmrc` matches too). Confirm access before concluding that credentials were exposed.

### Possible investigation steps

- Identify the process's parent chain and command line to determine intent, and whether the command reads,
  copies, encodes or transmits the file or only mentions its path.
- Confirm access with file events for the same path and process, where available, before treating the
  credentials as exposed.
- Check whether the read was followed by any outbound network connection (possible exfiltration) or a
  package-publish action using the same credentials.
- Correlate with recent webshell or supply-chain detections on the same host.

### False positive analysis

- Administrative/backup tooling reading these files as part of a config-migration or backup script. Verify the
  script and its scheduling before escalating.
"""
references = [
    "https://attack.mitre.org/techniques/T1552/001/",
    "https://docs.npmjs.com/cli/v10/configuring-npm/npmrc",
    "https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack",
]
risk_score = 47
rule_id = "dd6697e5-a23c-4f6e-9ae8-52dd1fe209cb"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Resources: Investigation Guide",
    "Data Source: Elastic Defend",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Linux",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "linux" and event.action == "exec" and
  process.command_line like~ (
    "*.npmrc*", "*.pypirc*", "*.netrc*", "*/.cargo/credentials*", "*/.gem/credentials*"
  ) and
  not process.name in ("npm", "npx", "yarn", "pnpm", "pip", "pip3", "gem", "bundle", "cargo") and
  not (
    process.command_line like~ "*--netrc-file*" and
    not process.command_line like~ (
      "*.npmrc*", "*.pypirc*", "*/.cargo/credentials*", "*/.gem/credentials*",
      "* @*.netrc*", "*=@*.netrc*", "*-T *.netrc*", "*--upload-file *.netrc*"
    )
  )
'''


[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"
[[rule.threat.technique.subtechnique]]
id = "T1552.001"
name = "Credentials In Files"
reference = "https://attack.mitre.org/techniques/T1552/001/"



[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

