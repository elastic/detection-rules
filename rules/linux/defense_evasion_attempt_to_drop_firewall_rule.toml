[metadata]
creation_date = "2026/09/14"
integration = ["endpoint", "sentinel_one_cloud_funnel", "crowdstrike", "auditd_manager"]
maturity = "production"
updated_date = "2026/09/14"

[rule]
author = ["Elastic"]
description = """
Adversaries may attempt to drop a firewall rule in an attempt to affect how a host is allowed to
receive or send network traffic. This activity is often used by adversaries to bypass security
controls and gain unauthorized access to the network.
"""
from = "now-9m"
index = [
    "logs-endpoint.events.process*",
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-auditd_manager.auditd-*",
    "auditbeat-*",
]
language = "eql"
license = "Elastic License v2"
name = "Attempt to Drop Firewall Rule"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Attempt to Drop Firewall Rule

This rule detects Linux firewall-management commands that create DROP or deny rules, activity that can disrupt connectivity, isolate hosts, or bypass monitoring and access controls. An attacker with shell access may insert an outbound DROP rule to prevent a compromised server from reaching security collectors, or block selected inbound traffic while preserving a covert access path.

### Possible investigation steps

- Review the complete command line to identify the affected chains, interfaces, protocols, ports, source or destination ranges, and whether the change blocks security tooling or critical services.
- Trace the initiating user, parent process, login session, and preceding commands to determine whether the action originated from approved administration, automation, a deployment tool, or an unexpected shell.
- Compare the active firewall configuration with the approved baseline and inspect recent configuration changes to establish what changed, whether the rule persists after reboot, and which earlier rules it supersedes.
- Correlate the event with authentication activity, privilege escalation, remote access, new processes, and network connections on the host to identify unauthorized access or broader defense-evasion behavior.
- Validate the change with the system owner or change-management records, and if unauthorized, preserve relevant evidence, isolate the host as appropriate, restore the approved policy, and rotate potentially exposed credentials.

### False positive analysis

- A system administrator may add a DROP or deny rule during approved firewall hardening or incident containment; verify the initiating user, command scope, maintenance window, and associated change record.
- An authorized startup script or configuration automation may enforce the approved firewall baseline by recreating deny rules; confirm the parent process, execution timing, resulting ruleset, and consistency with the host’s documented policy.

### Response and remediation

- Isolate the affected Linux host from untrusted networks while preserving controlled access for evidence collection and recovery.
- Remove unauthorized DROP or deny rules and eradicate persistence from firewall configuration files, startup scripts, systemd units, cron jobs, and configuration-management tasks.
- Restore the complete iptables, nftables, or UFW ruleset from a verified known-good baseline, then confirm connectivity to security collectors and required business services.
- Escalate immediately to incident response if the rule blocked monitoring infrastructure, followed unauthorized privilege escalation, affected multiple hosts, or coincided with suspicious remote access.
- Rotate credentials and revoke active sessions associated with the compromised account, then patch the host and restrict firewall administration to approved privileged users and signed automation.
"""
risk_score = 21
rule_id = "1f736c4f-3c09-4515-985e-92cd0f20bf1b"
setup = """## Setup

This rule requires data coming in from Elastic Defend.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a Linux System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, either "Traditional Endpoints" or "Cloud Workloads".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/8.10/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Platform: Linux",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Data Source: Auditd Manager",
    "Data Source: Elastic Defend",
    "Data Source: Elastic Endgame",
    "Data Source: Crowdstrike",
    "Data Source: SentinelOne",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
]
timestamp_override = "event.ingested"
type = "eql"
query = '''
process where host.os.type == "linux" and event.type == "start" and
event.action in ("exec", "exec_event", "start", "ProcessRollup2", "executed", "process_started") and
(
  (
    process.name in (
      "iptables", "ip6tables", "iptables-nft", "ip6tables-nft", "iptables-legacy",
      "ip6tables-legacy", "xtables-nft-multi", "xtables-legacy-multi", "nft"
    ) and
    process.args like~ "DROP"
  ) or
  (process.name == "ufw" and process.args like~ "deny")
)
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"

[[rule.threat.technique.subtechnique]]
id = "T1562.001"
name = "Disable or Modify Tools"
reference = "https://attack.mitre.org/techniques/T1562/001/"

[[rule.threat.technique.subtechnique]]
id = "T1562.004"
name = "Disable or Modify System Firewall"
reference = "https://attack.mitre.org/techniques/T1562/004/"

[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
