[metadata]
creation_date = "2026/08/05"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/10/31"

[rule]
author = ["clivoa"]
description = """
This rule detects a child process spawned by Composer (the PHP package manager) during an `install`, `require`,
`update`, or `run-script` operation. Composer executes lifecycle hook scripts (e.g. `post-install-cmd`) and plugin code
at install time, which can run arbitrary shell commands. Adversaries may abuse a malicious or compromised Composer
package (from Packagist or a private/typosquatted registry) to execute code during dependency installation, mirroring
the same install-time-hook abuse pattern seen in npm supply-chain attacks (e.g. Shai-Hulud). An ordinary `composer
install`/`update` with no lifecycle scripts defined only spawns the environment probes Composer runs on every
invocation, which the rule excludes, so any other child process during a Composer operation is a meaningful
discriminator.
"""
false_positives = [
    """
    Composer probes the environment on every run and spawns shell wrappers for `git`, `svn`, `hg`,
    `fossil`, `stty` and `sudo -K` regardless of whether a project defines any script hook. Those are
    excluded by name, and the `sh`/`bash` wrappers around them by their command line. A Composer version that
    shells out to a probe not on that list will match.
    """,
    """
    Projects that legitimately use lifecycle scripts, such as a framework clearing its cache in
    `post-install-cmd` or a build step invoked through `composer run-script`, will match. Compare the
    executed command against the project's version-controlled `composer.json`.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process*"]
language = "eql"
license = "Elastic License v2"
name = "Composer Install Script Execution"
note = """## Triage and analysis

### Investigating Composer Install Script Execution

This rule detects a child process spawned by Composer (the PHP package manager) during an `install`, `require`,
`update`, or `run-script` operation, after excluding the environment probes Composer runs on every invocation.
Composer's lifecycle-script feature is also a common, legitimate part of many PHP projects (see `false_positives`).

### Possible investigation steps

- Identify the spawned child process's full command line and compare it against the project's known,
  version-controlled `composer.json` `scripts` section (`post-install-cmd`, `post-update-cmd`, etc.).
- Check whether the command came from the root project's `scripts` or from a plugin (`type: composer-plugin`)
  running code in `PluginInterface::activate()`. Composer only runs `scripts` defined in the root package, so a
  dependency that executes code at install time is doing it as a plugin, which deserves closer review.
- Review the package's origin (Packagist vs. a private/typosquatted registry) and recent version history for signs
  of a supply-chain compromise.
- Correlate with any subsequent network connections or file writes from the spawned child process.

### False positive analysis

- Common, legitimate pattern: Laravel and similar frameworks routinely run `php artisan` cache/config-clearing
  commands via `post-install-cmd`. Expect this to fire on completely benign `composer install`/`update` runs in
  any Laravel-based (or similarly script-using) project. Investigate the specific command executed and whether it
  matches the project's own known `composer.json` before treating as suspicious.
- A `composer run-script` invocation of an intentional build step is equally expected to trigger this rule.

### Response and remediation

- If the executed command is unexpected or not present in the project's own `composer.json`, treat as a likely
  supply-chain compromise: isolate the host, identify the malicious package/version, and audit `composer.lock` for
  how it was introduced.
- Rotate any credentials the spawned process could have accessed.
- Pin dependencies and review `composer.lock` changes in code review to catch unexpected new lifecycle scripts.
"""
references = [
    "https://getcomposer.org/doc/articles/scripts.md",
    "https://www.sonarsource.com/blog/php-supply-chain-attack-on-composer/",
    "https://www.stepsecurity.io/blog/laravel-lang-supply-chain-attack",
    "https://attack.mitre.org/techniques/T1195/002/",
]
risk_score = 47
rule_id = "b5a7d9a9-0c19-4117-9f6f-13ace20fded9"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Tactic: Execution",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence by host.id with maxspan=30s
  [process where host.os.type == "linux" and event.type == "start" and
     process.name like~ ("php", "php?", "php?.?", "php-cli", "composer") and
     process.args like~ "*/composer" and
     process.args in ("install", "require", "update", "run-script")] by process.entity_id
  [process where host.os.type == "linux" and event.type == "start" and
     not process.name in ("git", "svn", "hg", "fossil", "stty", "tput", "sudo", "grep", "sed", "awk", "uname") and
     not (
       process.name in ("sh", "bash") and
       process.command_line like~ (
         "*exec 'git'*", "*git branch*", "*git log *", "*git describe *", "*git --version*",
         "*svn info*", "*hg branch*", "*fossil branch*", "*fossil tag*",
         "*command -v -- *", "*lsmod*", "*stty*"
       )
     )] by process.parent.entity_id
'''


