[metadata]
creation_date = "2026/10/19"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/10/19"

[rule]
author = ["clivoa"]
description = """
This rule detects a process started directly by Composer (the PHP package manager, run as `composer` or
`composer.phar`) during an `install`, `require`, `update`, or `run-script` operation, other than the environment probes
and archive handling Composer performs on every run. Composer executes root lifecycle scripts (e.g. `post-install-cmd`)
and plugin code at install time, so a malicious or compromised package can use a plugin to run arbitrary commands
during dependency installation, the same install-time abuse pattern seen in npm supply-chain attacks.
"""
false_positives = [
    """
    Composer probes the environment on every run (`git`, `svn`, `hg`, `fossil`, `stty`, `lsmod`, `sudo -K`,
    `command -v`) and extracts packages with `unzip` and `rm` when the PHP zip extension is missing. These
    are excluded by their complete command lines, as issued by Composer 2.7 and 2.11. A Composer version
    that issues a differently shaped probe, or an extraction into a path that contains a space or a quote,
    will match.
    """,
    """
    Projects that legitimately use lifecycle scripts, such as a framework clearing its cache in
    `post-install-cmd` or a build step invoked through `composer run-script`, will match. Compare the
    executed command against the project's version-controlled `composer.json`.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process*"]
language = "eql"
license = "Elastic License v2"
name = "Composer Install Script Execution"
note = """## Triage and analysis

### Investigating Composer Install Script Execution

This rule detects a process started directly by Composer (the PHP package manager) during an `install`, `require`,
`update`, or `run-script` operation, after excluding the environment probes and archive handling Composer performs on
every run. Only direct children are matched: commands that a matching process starts in turn are not.
Composer's lifecycle-script feature is also a common, legitimate part of many PHP projects (see `false_positives`).

### Possible investigation steps

- Identify the spawned child process's full command line and compare it against the project's known,
  version-controlled `composer.json` `scripts` section (`post-install-cmd`, `post-update-cmd`, etc.).
- Check whether the command came from the root project's `scripts` or from a plugin (`type: composer-plugin`)
  running code in `PluginInterface::activate()`. Composer only runs `scripts` defined in the root package, so a
  dependency that executes code at install time is doing it as a plugin, which deserves closer review.
- Review the package's origin (Packagist vs. a private/typosquatted registry) and recent version history for signs
  of a supply-chain compromise.
- Correlate with any subsequent network connections or file writes from the spawned child process.

### False positive analysis

- Common, legitimate pattern: Laravel and similar frameworks routinely run `php artisan` cache/config-clearing
  commands via `post-install-cmd`. Expect this to fire on completely benign `composer install`/`update` runs in
  any Laravel-based (or similarly script-using) project. Investigate the specific command executed and whether it
  matches the project's own known `composer.json` before treating as suspicious.
- A `composer run-script` invocation of an intentional build step is equally expected to trigger this rule.

### Response and remediation

- If the executed command is unexpected or not present in the project's own `composer.json`, treat as a likely
  supply-chain compromise: isolate the host, identify the malicious package/version, and audit `composer.lock` for
  how it was introduced.
- Rotate any credentials the spawned process could have accessed.
- Pin dependencies and review `composer.lock` changes in code review to catch unexpected new lifecycle scripts.
"""
references = [
    "https://getcomposer.org/doc/articles/scripts.md",
    "https://www.sonarsource.com/blog/php-supply-chain-attack-on-composer/",
    "https://www.stepsecurity.io/blog/laravel-lang-supply-chain-attack",
    "https://attack.mitre.org/techniques/T1195/002/",
]
risk_score = 47
rule_id = "b5a7d9a9-0c19-4117-9f6f-13ace20fded9"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Tactic: Execution",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Linux",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "linux" and event.type == "start" and event.action == "exec" and
  process.parent.name like~ ("php", "php?", "php?.?", "php-cli", "composer") and
  process.parent.args like~ ("*/composer", "composer", "*/composer.phar", "composer.phar") and
  process.parent.args in ("install", "require", "update", "run-script") and
  not process.command_line in (
    "stty -a", "sh -c stty -a | grep columns", "sh -c -- sudo -K > /dev/null 2>&1",
    "lsmod", "sh -c lsmod | grep vboxguest", "sh -c exec 'lsmod'",
    "git --version", "git branch -a --no-color --no-abbrev -v", "git describe --exact-match --tags",
    "git rev-list --no-commit-header --format=%H -n1 HEAD --no-show-signature",
    "sh -c git --version", "sh -c git describe --exact-match --tags",
    "sh -c git log --pretty=\"%H\" -n1 HEAD --no-show-signature",
    "sh -c hg branch", "sh -c fossil branch list", "sh -c fossil tag list", "sh -c svn info --xml",
    "sh -c exec 'git' '--version'", "sh -c exec 'git' 'branch' '-a' '--no-color' '--no-abbrev' '-v'",
    "sh -c exec 'git' 'describe' '--exact-match' '--tags'",
    "sh -c exec 'git' 'rev-list' '--no-commit-header' '--format=%H' '-n1' 'HEAD' '--no-show-signature'",
    "sh -c exec 'hg' 'branch'", "sh -c exec 'fossil' 'branch' 'list'", "sh -c exec 'fossil' 'tag' 'list'",
    "sh -c exec 'svn' 'info' '--xml'"
  ) and
  not process.command_line regex (
    """sh -c -- command -v -- '[a-zA-Z0-9]+'""",
    """(sh -c (exec 'git' 'rev-list' '|git rev-list )|git rev-list )[a-zA-Z0-9._/\-]+\.\.[a-zA-Z0-9._/\-]+'?""",
    """sh -c '/usr/bin/unzip' -qq '[^' ]+/vendor/composer/tmp-[0-9a-f]{32}\.zip' -d '[^' ]+/vendor/composer/[0-9a-f]{8}'""",
    """sh -c exec '/usr/bin/unzip' '-qq' '[^' ]+/vendor/composer/tmp-[0-9a-f]{32}\.zip' '-d' '[^' ]+/vendor/composer/[0-9a-f]{8}'""",
    """/usr/bin/unzip -qq [^' ]+/vendor/composer/tmp-[0-9a-f]{32}\.zip -d [^' ]+/vendor/composer/[0-9a-f]{8}""",
    """(sh -c rm -rf '|sh -c exec 'rm' '-rf' '|rm -rf )[^' ]+/vendor/composer/[0-9a-f]{8}'?"""
  )
'''


