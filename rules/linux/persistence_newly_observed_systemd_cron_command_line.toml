[rule.alert_suppression]
group_by = ["agent.id", "process.command_line"]
missing_fields_strategy = "suppress"

[rule.investigation_fields]
field_names = [
    "host.name",
    "host.id",
    "agent.id",
    "user.name",
    "process.command_line",
    "process.executable",
    "process.parent.name",
    "process.parent.executable",
    "Esql.process_working_directory_values",
    "Esql.process_parent_command_line_values",
    "Esql.first_time_seen",
    "Esql.last_time_seen",
]

[rule.alert_suppression.duration]
unit = "h"
value = 1
