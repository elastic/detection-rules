[metadata]
creation_date = "2026/10/19"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/10/19"

[rule]
author = ["clivoa"]
description = """
Identifies a Node.js or Bun process creating one of the staging artifact files the Shai-Hulud npm worm family writes
to collect harvested secrets before exfiltration (`cloud.json`, `truffleSecrets.json`, `actionsSecrets.json`). These
filenames are specific to the worm's tooling. The worm installs and uses the Bun runtime alongside Node.js, so both
runtimes are in scope.
"""
false_positives = [
    """
    A JavaScript project or tool that legitimately writes `cloud.json`, `truffleSecrets.json` or
    `actionsSecrets.json` through Node.js or Bun will match, for example an application that stores its
    own cloud configuration as `cloud.json`. Verify the writing project and, once the workflow is
    confirmed benign, add an exception scoped to that file path and process executable.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.file*"]
language = "eql"
license = "Elastic License v2"
name = "Shai-Hulud Exfiltration Artifact File Creation"
note = """## Triage and analysis

### Investigating Shai-Hulud Exfiltration Artifact File Creation

This rule detects a `node` or `bun` process creating one of the specific staging filenames the Shai-Hulud npm worm
family uses to collect harvested secrets before exfiltration. It complements Elastic's existing
`execution_nodejs_pre_or_post_install_script_execution` rule, which covers the *execution* side of the same attack
chain, by covering the *artifact* side.

### Possible investigation steps

- Identify the exact file path and the parent package/process chain that led to `node`/`bun` writing it -- correlate
  with any recent `npm install`/`bun install` activity on the host around the same time.
- Check whether `execution_nodejs_pre_or_post_install_script_execution` also fired for the same host/session --
  a joint hit is a much stronger signal than either alone.
- Inspect the file's contents (if not yet exfiltrated/deleted) for actual harvested secrets, and treat any
  identified secrets as compromised.
- Review outbound network connections from the same process/host shortly after the file write for the exfiltration
  step.
- Identify the specific npm/bun package that triggered this, and check whether it's a known-malicious or
  recently-published/low-reputation package.

### False positive analysis

- A Node.js or Bun application that writes a file named `cloud.json`, `truffleSecrets.json` or
  `actionsSecrets.json` as part of its normal operation will match. `cloud.json` is the most generic of the three.
  Confirm the file path belongs to a known project and that its contents are not harvested credentials, then add an
  exception scoped to that path and process executable.
- These filenames are specific to known Shai-Hulud versions. A later variant that uses different filenames will not
  match this rule.

### Response and remediation

- Treat any matched host as having potentially exfiltrated secrets: rotate all credentials that were accessible
  from that host/environment.
- Remove the malicious package and audit `package-lock.json`/`bun.lock` for how it was introduced.
- Hunt for the corresponding install-script execution and any outbound connections around the same time to
  determine whether exfiltration actually completed.
"""
references = [
    "https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack",
    "https://www.elastic.co/blog/shai-hulud-worm-2-0-updated-response",
    "https://attack.mitre.org/techniques/T1195/001/",
]
risk_score = 47
rule_id = "cf1edc6a-5a3e-45a5-b3dd-be54f2cd4358"
setup = """## Setup

This rule is designed for data generated by [Elastic Defend](https://www.elastic.co/security/endpoint-security), which provides native endpoint detection and response, along with event enrichments designed to work with our detection rules.

Setup instructions: https://ela.st/install-elastic-defend
"""
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Collection",
    "Tactic: Initial Access",
    "Data Source: Elastic Defend",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
    "Platform: Linux",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
file where host.os.type == "linux" and event.type in ("creation", "change") and
  file.name in ("cloud.json", "truffleSecrets.json", "actionsSecrets.json") and
  process.name in ("node", "bun")
'''


