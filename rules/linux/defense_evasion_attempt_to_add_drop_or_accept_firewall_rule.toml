[metadata]
creation_date = "2026/09/14"
integration = ["endpoint", "sentinel_one_cloud_funnel", "crowdstrike", "auditd_manager"]
maturity = "production"
updated_date = "2026/09/14"

[rule]
author = ["Elastic"]
description = """
Adversaries may attempt to create DROP or ACCEPT firewall rules in an attempt to affect how a
host is allowed to receive or send network traffic. This activity is often used by adversaries
to bypass security controls and gain unauthorized access to the network.
"""
from = "now-9m"
index = [
    "logs-endpoint.events.process*",
    "endgame-*",
    "logs-crowdstrike.fdr*",
    "logs-sentinel_one_cloud_funnel.*",
    "logs-auditd_manager.auditd-*",
    "auditbeat-*",
]
language = "eql"
license = "Elastic License v2"
name = "DROP/ACCEPT Firewall Rule Creation"
note = """## Triage and analysis

> **Disclaimer**:
> This investigation guide was created using generative AI technology and has been reviewed to improve its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit your specific environment and operational needs.

### Investigating Attempt to Drop Firewall Rule

This rule detects Linux firewall commands that create DROP or deny rules, which can disrupt network visibility, block administrative access, or impair security controls. After gaining privileged access, an attacker may add an outbound deny rule targeting a monitoring or log-collection server to prevent the compromised host from reporting subsequent activity.

### Possible investigation steps

- Review the full command line, execution user, privilege level, parent process, session origin, and related process tree to determine who initiated the change and how access was obtained.
- Compare the active firewall configuration with the approved baseline and identify the rule’s interface, direction, protocol, ports, addresses, position, persistence mechanism, and creation time.
- Determine whether the rule blocks administrative access, endpoint telemetry, log forwarding, security tooling, or other critical communications by correlating network and agent-health events around the execution time.
- Examine nearby authentication, process, file, and shell-history activity for suspicious privilege escalation, remote access, defense impairment, configuration changes, or persistence.
- Validate the change against maintenance records and administrator activity, then preserve evidence, isolate the host if malicious, remove the unauthorized rule safely, and restore affected monitoring or connectivity.

### False positive analysis

- A system administrator may intentionally add a DROP or deny rule during approved firewall hardening or incident containment; verify the command, executing account, target traffic, and timing against the authorized change record.
- An automated startup or configuration script may apply a standard firewall baseline containing DROP or deny rules; confirm the parent process and resulting rules match the host’s approved configuration and expected execution schedule.

### Response and remediation

- Isolate the affected Linux host while preserving approved management access, and block attacker-controlled addresses or sessions at upstream network controls.
- Preserve the executed firewall command, active ruleset, shell history, authentication records, process tree, and relevant configuration files before removing unauthorized DROP or deny rules.
- Remove persistence from nftables, iptables, UFW, systemd units, startup scripts, cron jobs, and configuration-management tasks, and revoke compromised accounts, keys, tokens, and sessions.
- Restore the firewall from a known-good approved baseline, validate administrative and security-tool connectivity, and reimage the host if system integrity cannot be established.
- Escalate immediately to incident response if the rule impaired logging or endpoint protection, blocked administrative access, originated from privileged compromise, or appears on additional hosts.
- Harden the environment by restricting firewall administration, enforcing least privilege and change control, protecting ruleset files, and alerting on unauthorized firewall changes or security-agent communication failures.
"""
risk_score = 21
rule_id = "c7395bb9-9b71-49e6-aeb4-dc70b8229b97"
setup = """## Setup

This rule requires data coming in from Elastic Defend.

### Elastic Defend Integration Setup
Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.

#### Prerequisite Requirements:
- Fleet is required for Elastic Defend.
- To configure Fleet Server refer to the [documentation](https://www.elastic.co/guide/en/fleet/current/fleet-server.html).

#### The following steps should be executed in order to add the Elastic Defend integration on a Linux System:
- Go to the Kibana home page and click "Add integrations".
- In the query bar, search for "Elastic Defend" and select the integration to see more details about it.
- Click "Add Elastic Defend".
- Configure the integration name and optionally add a description.
- Select the type of environment you want to protect, either "Traditional Endpoints" or "Cloud Workloads".
- Select a configuration preset. Each preset comes with different default settings for Elastic Agent, you can further customize these later by configuring the Elastic Defend integration policy. [Helper guide](https://www.elastic.co/guide/en/security/current/configure-endpoint-integration-policy.html).
- We suggest selecting "Complete EDR (Endpoint Detection and Response)" as a configuration setting, that provides "All events; all preventions"
- Enter a name for the agent policy in "New agent policy name". If other agent policies already exist, you can click the "Existing hosts" tab and select an existing policy instead.
For more details on Elastic Agent configuration settings, refer to the [helper guide](https://www.elastic.co/guide/en/fleet/8.10/agent-policy.html).
- Click "Save and Continue".
- To complete the integration, select "Add Elastic Agent to your hosts" and continue to the next section to install the Elastic Agent on your hosts.
For more details on Elastic Defend refer to the [helper guide](https://www.elastic.co/guide/en/security/current/install-endpoint.html).
"""
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Linux",
    "Platform: Linux",
    "Use Case: Threat Detection",
    "Tactic: Defense Evasion",
    "Data Source: Auditd Manager",
    "Data Source: Elastic Defend",
    "Data Source: Elastic Endgame",
    "Data Source: Crowdstrike",
    "Data Source: SentinelOne",
    "Resources: Investigation Guide",
    "Rule Type: Event Correlation (EQL)",
]
timestamp_override = "event.ingested"
type = "eql"
query = '''
process where host.os.type == "linux" and event.type == "start" and
event.action in ("exec", "exec_event", "start", "ProcessRollup2", "executed", "process_started") and
(
  (
    process.name in (
      "iptables", "ip6tables", "iptables-nft", "ip6tables-nft", "iptables-legacy",
      "ip6tables-legacy", "xtables-nft-multi", "xtables-legacy-multi", "nft"
    ) and
    process.args like~ ("DROP", "ACCEPT")
  ) or
  (process.name == "ufw" and process.args like~ ("deny", "allow"))
)
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1562"
name = "Impair Defenses"
reference = "https://attack.mitre.org/techniques/T1562/"

[[rule.threat.technique.subtechnique]]
id = "T1562.001"
name = "Disable or Modify Tools"
reference = "https://attack.mitre.org/techniques/T1562/001/"

[[rule.threat.technique.subtechnique]]
id = "T1562.004"
name = "Disable or Modify System Firewall"
reference = "https://attack.mitre.org/techniques/T1562/004/"

[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
