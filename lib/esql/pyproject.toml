[project]
name = "esql-detection-rules-py"
version = "0.1.0"
description = "Offline ES|QL parser and AST for Elastic Security detection-rules (vendored staging copy)"
license = {text = "Elastic License 2.0"}
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
]

[project.urls]
Homepage = "https://github.com/elastic/esql-detection-rules-py"
Source = "https://github.com/elastic/detection-rules/tree/main/lib/esql"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["esql*"]

[tool.setuptools.package-data]
esql = [
  "py.typed",
  "_antlr/**/provenance.json",
  "_antlr/**/*.py",
  "_generated/*.zip",
]
